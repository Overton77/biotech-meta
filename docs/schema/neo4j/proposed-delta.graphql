# Proposed GraphQL delta against docs/schema/current_biotech_schema.graphql
#
# Status: PROPOSAL (catalog 0.2.0 candidate). This file does not replace the live schema.
# It is additive: new types, enums and `extend type` blocks that give the accepted ontology-lab rounds a
# parsable projection on the live Neo4j GraphQL surface. Field-level `@relationship(properties:)` changes on
# existing fields and `@node(labels:)` additions are described in the round files and proposal-index.md
# because `extend type` cannot change an existing field's directive.
#
# Static check (2026-10-03): the delta parses with graphql-js, every lane's definitions were de-duplicated
# (Lane 5's per-bound `ValidTimeBasis` and `TimePrecision` enums win over Lane 1's single-basis versions), and
# the live schema extended with this delta (directives stripped) builds without name or field collisions.
# Whether the deployed @neo4j/graphql version accepts `extend type` on `@node` and `@relationshipProperties`
# types is unverified (OPEN-QUESTIONS, live-stack items). Nothing here was deployed.
#
# Sections follow lane order; each section names its rounds.

# ---------------------------------------------------------------------------
# Lane 1 (round 0009): query shapes and access
# ---------------------------------------------------------------------------

"""
Bitemporal attachment of a state (for example a snapshot) to its entity; replaces node-level time as the authority.
"""
type StateAttachmentMetadata @relationshipProperties {
  validFrom: DateTime
  validTo: DateTime
  recordedFrom: DateTime!
  recordedTo: DateTime
  validTimeBasis: ValidTimeBasis
  validTimePrecision: TimePrecision
  assertionUid: String
  mongoResearchRunId: String
}

extend type Product {
  uid: String
}

extend type Organization {
  uid: String
}

extend type Person {
  uid: String
}

extend type Document {
  uid: String
}

extend type DocumentTextVersion {
  uid: String
}

extend type Chunk {
  uid: String
}

extend type Claim {
  uid: String
}

extend type ClaimOccurrence {
  uid: String
}

type AnswerRecord implements Entity @node {
  id: ID! @id
  name: String!
