"""
Media subject range (contract B6): identities AND concepts a media asset, panel, annotation or graph view may
depict, explain, be assessed for or include. Preserves the concept coverage of live MediaSubject (Mechanism,
Pathway, Biomarker, Metric, Condition, Protocol ...), renamed to final names (D-002, D-007, D-008). Removed members
(migration-map.yaml): snapshot states, retired legacy names, CohortParticipant and AnonymousActor (privacy and
no identity to depict), retrieval units (DocumentTextVersion, Segmentation, Chunk), propositions (moved to
MediaVisualizableRelationshipTarget) and media types themselves. Membership follows the ownership registry; Fable
prunes members absent from the merged schema.
"""
union MediaSubjectTarget =
  | Organization | ConsumerBrand | Facility | Person | PseudonymousActor | Product | ProductVariant | PackageConfiguration | Trademark | CertificationProgram | MerchantListing | ChemicalSubstance | ChemicalForm | IngredientMaterial | BotanicalTaxon | MicrobialTaxon | MicrobialStrain | Mechanism | Pathway | MolecularEntity | Species | AnatomicalContext | Outcome | Condition | RiskFactor | Biomarker | Metric | LabTest | PanelDefinition | MeasurementMethod | Specimen | TechnologyPlatform | ToolOrInstrument | Device | Sensor | Modality | Exposure | Lifestyle | Treatment | Procedure | ManufacturingProcess | ManufacturingStep | RegulatoryPathway | RegulatoryStep | RegulatoryStatus | Study | StudyArm | StudyPopulation | OutcomeDefinition | StudyResult | Dataset | Publication | Protocol | ProtocolEdition | ProtocolStep | Constraint | MeasurementPlan | Target | FunctionalGoal | Observation | ProtocolAdjustmentRule | ProtocolResult | AdverseEffect | SafetySignal | Community | Conference | Event | NarrativeArc | Platform | Channel | Series | Episode | EpisodeSegment | Claim | Document

"""
Propositions and results a chart or figure can visualize, and (derived only) evidence: generic Assertion,
ClaimOccurrence, RelationshipAssertion, the Claim proposition, a W09 StudyResult, and the live W03 Association
(kept only if W03 keeps it; Fable prunes). Successor of live MediaVisualizableRelationship.
"""
union MediaVisualizableRelationshipTarget = Assertion | Claim | StudyResult

