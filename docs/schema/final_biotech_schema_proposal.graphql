"""
Immutable BellLabs evaluation of one or more Assertions (KCR-0007-2). `adjudicationKind` CAPTURE_FIDELITY
judges whether the record accurately captures what the asserter said in the cited span and is the only kind
that feeds Assertion.status; SUPPORT judges whether evidence supports the proposition (`verdict`) and never
changes status (KCR-4.6). A financial interest alone never sets a verdict (INV-405). A re-review is a new
Adjudication linked SUPERSEDES {RE_REVIEW | SOURCE_REVISION}; historical adjudications keep pointing at the
snapshots they examined (V-511). `reviewedAt` (review drafted) and `recordedAt` (committed) are both kept.
Archetype: EvidenceAssessment. Module: provenance. CQs: CQ-EV-02, CQ-EV-05, CQ-TM-01, CQ-TM-06, CQ-AX-07.
