never writes a LISTING_FOR, a recall status or a gray-market flag by itself. A listing whose identity is not established
keeps NO LISTING_FOR and an UNRESOLVED CommerceMatch; a recalled-lot or unauthorized-channel signal stays a PROPOSED
candidate until reviewed. Serves CQ-CM-02, CQ-AX-14 (commerce), CQ-CM-C03. Canonical module products_and_commerce.
Archetype EvidenceAssessment.
"""
type CommerceMatch implements Entity & EvidenceAssessmentArchetype
  @node(labels: ["CommerceMatch", "EvidenceAssessment"])
