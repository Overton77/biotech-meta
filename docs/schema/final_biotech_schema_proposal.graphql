"""
Enduring identity of a public protocol or workflow definition (a published longevity protocol page, a clinical
monitoring guideline, a protocols.io lineage). It is NOT a version (ProtocolEdition), NOT a study protocol document
(ProtocolVersion, W09), and NOT any person's adoption or execution (private store, W23). Schedule, steps, goals and
authorship belong to editions; the live mutable fields (versionLabel, lastUpdatedAt, scheduleText, cadence…) moved to
ProtocolEdition. Identity is the uid; publicUrl and name are never identity. CQ-PR-01, CQ-PR-02, CQ-PR-05 (as the
shared uid a private adoption references), CQ-AX-22. Module: protocols. Archetype: Entity.
"""
type Protocol implements Entity & EntityArchetype & SearchIndexable
  @node(labels: ["Protocol", "Entity"])
  @fulltext(indexes: [{indexName: "ProtocolSearch", fields: ["name", "description", "searchText"], queryName: "searchProtocols"}]) {
  id: ID! @id
  uid: String!
  name: String
  description: String
  mongoResearchRunId: String
  createdAt: DateTime! @timestamp(operations: [CREATE])
  updatedAt: DateTime! @timestamp(operations: [CREATE, UPDATE])
  privacyClass: PrivacyClass
  maturity: NodeMaturity
  schemaVersion: String
  entityType: String!
  searchText: String
  searchFields: [String!]
  embeddingModel: String
  embeddingDimensions: Int
  "Derived search vector over name/description (retrieval justification in 07-operations.md); @vector is added only by Fable at merge, without provider (D-014)."
  searchEmbedding: [Float!]
  protocolType: ProtocolType
  "Canonical public URL as displayed; a locator aid, never identity (the Source owns canonicalUri)."
  publicUrl: String
  """class: asserted; cardinality: one_or_more over time, EXCLUSIVE per subject in valid x recorded time (predicateExclusivity HAS_PROTOCOL_EDITION); catalog: HAS_PROTOCOL_EDITION"""
  editions: [ProtocolEdition!]! @relationship(type: "HAS_PROTOCOL_EDITION", direction: OUT, properties: "AssertedEdgeProperties")
  """class: derived (read-only, D-004); cardinality: many; rule protocol-current-steps-v1 = steps of the edition whose HAS_PROTOCOL_EDITION episode has recordedTo null and contains now (OPEN_END_* reported); regenerated on every edition attachment; never the only history; catalog: none (projection of HAS_PROTOCOL_STEP)"""
  currentSteps: [ProtocolStep!]! @relationship(type: "HAS_CURRENT_PROTOCOL_STEP", direction: OUT, properties: "DerivedEdgeProperties") @settable(onCreate: false, onUpdate: false)
  """class: asserted; cardinality: many; catalog: FOR_PROTOCOL (ProtocolResult -> Protocol)"""
  results: [ProtocolResult!]! @relationship(type: "FOR_PROTOCOL", direction: IN, properties: "AssertedEdgeProperties")
}

"""
Immutable structured content of one observed or published state of a Protocol: its steps, constraints, measurement
plans, adjustment rules, targets, goals and included subprotocols. A new edition exists exactly when the canonicalized
protocol payloadHash changes (not when raw page bytes change: 37 distinct Wayback digests of the Blueprint page are not
37 editions). changeProvenance says whether the source labelled the version (SOURCE_VERSIONED: protocols.io V.2, NICE
"Last updated") or BellLabs detected it by snapshot diff (SNAPSHOT_DIFF). A third-party report of a change is an
Assertion, never an edition. Attached to its Protocol by HAS_PROTOCOL_EDITION (asserted_edge, EXCLUSIVE). NOT the study
ProtocolVersion (InformationArtifact, W09) even when a study protocol describes the same regimen. CQ-PR-01..04, CQ-AX-22.
Module: protocols. Archetype: VersionedState.
"""
type ProtocolEdition implements Entity & VersionedStateArchetype
  @node(labels: ["ProtocolEdition", "VersionedState"]) {
  id: ID! @id
  uid: String!
  name: String
  description: String
  mongoResearchRunId: String
  createdAt: DateTime! @timestamp(operations: [CREATE])
  updatedAt: DateTime! @timestamp(operations: [CREATE, UPDATE])
  privacyClass: PrivacyClass
  maturity: NodeMaturity
  schemaVersion: String
  stateType: String!
  "sha256:<hex> over the canonicalized edition payload (steps by stepKey+payloadHash, constraints, plans, rules, targets, goals, inclusions); excludes order-free display text, createdAt and capture metadata."
  payloadHash: String!
  "Source-stated start of applicability, if any (rare); query validity comes from the HAS_PROTOCOL_EDITION episode."
  effectiveFrom: DateTime
  effectiveTo: DateTime
  "The source's own version label (\"V.2\"); null when the source shows none. Never invented by BellLabs."
  editionLabel: String
  "Source-printed version/update date without time (NICE \"Last updated: 02 September 2025\"); a byline date that does not change with content is recorded but is not a version label."
  sourceVersionDate: Date
  sourceVersionDateText: String
  "SOURCE_VERSIONED or SNAPSHOT_DIFF only (V-530p)."
  changeProvenance: ProtocolChangeProvenance!
  "Version of the payload canonicalization (for example W16-CANON-1); payloadHash values compare only within one version."
  payloadCanonicalizationVersion: String
  "Method version of the stepKey alignment Activity that keyed this edition's steps against the previous edition (OPEN-QUESTIONS P2 item 4)."
  stepKeyAlignmentVersion: String
  "Edition-level schedule as printed (live Protocol.scheduleText/cadence). Preserved whenever normalization is incomplete."
  scheduleText: String
  schedulePattern: SchedulePattern
  cadenceUnit: CadenceUnit
  "Bounded cadence range: every 3-6 months = 3..6 MONTH, never a midpoint."
  cadenceIntervalMin: Int
  cadenceIntervalMax: Int
  occurrencesPerPeriodMin: Int
  occurrencesPerPeriodMax: Int
  occurrencePeriodUnit: CadenceUnit
  "Overall course length in days (live durationDaysMin/Max)."
  durationDaysMin: Int
  durationDaysMax: Int
  "Cycle structure: total cycle length, active (on) part, number of cycles; each a bounded range."
  cycleLengthDaysMin: Int
  cycleLengthDaysMax: Int
  cycleActiveDaysMin: Int
  cycleActiveDaysMax: Int
  cycleCountMin: Int
  cycleCountMax: Int
  timeOfDay: TimeOfDay
  daysOfWeek: [DayOfWeek!]
  isContinuous: Boolean
  isAsNeeded: Boolean
  requiresFasting: Boolean
  requiresMonitoring: Boolean
  """class: asserted; cardinality: exactly_one (inverse of HAS_PROTOCOL_EDITION); catalog: HAS_PROTOCOL_EDITION"""
  protocol: [Protocol!]! @relationship(type: "HAS_PROTOCOL_EDITION", direction: IN, properties: "AssertedEdgeProperties")
  """class: structural; cardinality: many; catalog: HAS_PROTOCOL_STEP (D-004; replaces live Protocol HAS_STEP)"""
  steps: [ProtocolStep!]! @relationship(type: "HAS_PROTOCOL_STEP", direction: OUT, properties: "StepOrderProperties")
  """class: structural; cardinality: many; catalog: HAS_CONSTRAINT (edition-level applicability/contraindication)"""
  constraints: [Constraint!]! @relationship(type: "HAS_CONSTRAINT", direction: OUT, properties: "ConstraintRoleProperties")
  """class: structural; cardinality: many; catalog: HAS_MEASUREMENT_PLAN"""
  measurementPlans: [MeasurementPlan!]! @relationship(type: "HAS_MEASUREMENT_PLAN", direction: OUT, properties: "StructuralEdgeProperties")
  """class: structural; cardinality: many; catalog: HAS_ADJUSTMENT_RULE"""
  adjustmentRules: [ProtocolAdjustmentRule!]! @relationship(type: "HAS_ADJUSTMENT_RULE", direction: OUT, properties: "StructuralEdgeProperties")
  """class: asserted; cardinality: many; catalog: HAS_FUNCTIONAL_GOAL (source-stated goal; a goal is not an outcome claim)"""
  functionalGoals: [FunctionalGoal!]! @relationship(type: "HAS_FUNCTIONAL_GOAL", direction: OUT, properties: "AssertedEdgeProperties")
  """class: structural; cardinality: many; registry: HAS_TARGET (source-stated numeric targets of this edition)"""
  targets: [Target!]! @relationship(type: "HAS_TARGET", direction: OUT, properties: "StructuralEdgeProperties")
  """class: structural; cardinality: many; registry: TARGETS (stated purpose; never efficacy)"""
  therapeuticTargets: [TherapeuticTargetTarget!]! @relationship(type: "TARGETS", direction: OUT, properties: "StructuralEdgeProperties")
  """class: structural; cardinality: many; registry: INCLUDES_PROTOCOL. PINNED binding: the source names a specific subprotocol version, so the included edition is fixed."""
  includedEditions: [ProtocolEdition!]! @relationship(type: "INCLUDES_PROTOCOL", direction: OUT, properties: "StructuralEdgeProperties")
  """class: structural; cardinality: many; registry: HAS_SUBPROTOCOL. FLOATING binding: the source names the subprotocol without a version; the edition in force is resolved as-of (QS-2b on the subprotocol's HAS_PROTOCOL_EDITION) and is reported as RESOLVED_AS_OF, never stored as if stated."""
  subprotocols: [Protocol!]! @relationship(type: "HAS_SUBPROTOCOL", direction: OUT, properties: "StructuralEdgeProperties")
  """class: asserted; cardinality: many; catalog: FOR_PROTOCOL (ProtocolResult -> ProtocolEdition)"""
  results: [ProtocolResult!]! @relationship(type: "FOR_PROTOCOL", direction: IN, properties: "AssertedEdgeProperties")
}

"""
One step of a public protocol edition: what to do (stepKind), with what (USES, EMPLOYS), when and how often
(schedule ranges, cycles, repetition), under which conditions (HAS_CONSTRAINT), after/with/instead of which other
steps (DEPENDS_ON), and how necessary the source says it is (requirementLevel/requirementBasis). stepKey is the lineage
key stable across editions of one protocol (dose or timing changes keep it; substituting a different material or
action gives a new key); payloadHash identifies the immutable payload, so an unchanged step node may be shared by
consecutive editions. speechAct separates the author's reported practice ("My sauna protocol: daily") from advice to
readers ("Aim for 3 to 5 sessions per week"). It is NOT a person's execution, adherence or deviation (private store).
CQ-PR-01, CQ-PR-02, CQ-PR-03, CQ-PR-06. Module: protocols. Archetype: Entity (catalog), immutable once attached.
"""
type ProtocolStep implements Entity & EntityArchetype
  @node(labels: ["ProtocolStep", "Entity"]) {
  id: ID! @id
  uid: String!
  name: String
  description: String
  mongoResearchRunId: String
  createdAt: DateTime! @timestamp(operations: [CREATE])
  updatedAt: DateTime! @timestamp(operations: [CREATE, UPDATE])
  privacyClass: PrivacyClass
  maturity: NodeMaturity
  schemaVersion: String
  entityType: String!
  "Per-protocol lineage slug (\"creatine-pre-workout\", \"plasma-lithium-year1\"); unique within an edition (V-525p); never the display text or the step number."
  stepKey: String!
  "sha256:<hex> over the step payload incl. outgoing USES/EMPLOYS/HAS_CONSTRAINT/DEPENDS_ON (targets by stepKey); excludes orderIndex."
  payloadHash: String!
  stepKind: ProtocolStepType
  stepKindRaw: String
  stepDescription: String
  "STATES, REPORTS_PRACTICE, RECOMMENDS, CAUTIONS ... (W00 kernel enum). A practice report is not a recommendation."
  speechAct: SpeechAct
  requirementLevel: RequirementLevel!
  requirementBasis: RequirementBasis!
  "Step fields the source explicitly leaves unstated (\"Dr. X takes spermidine at an unspecified dosage\" -> ['dose']); distinct from null = not extracted."
  notReportedFields: [String!]
  "Verbatim schedule texts; kept whenever normalization is incomplete."
  scheduleText: String
  frequencyText: String
  timingText: String
  durationText: String
  schedulePattern: SchedulePattern
  cadenceUnit: CadenceUnit
  "Bounded interval between occurrences (every 3 to 6 months = 3..6 MONTH). Live cadenceInterval maps to min = max."
  cadenceIntervalMin: Int
  cadenceIntervalMax: Int
  "Occurrences per period (3 to 5 sauna sessions per WEEK; twice per DAY)."
  occurrencesPerPeriodMin: Int
  occurrencesPerPeriodMax: Int
  occurrencePeriodUnit: CadenceUnit
  "Total repetitions of the step (HBOT: 60 sessions)."
  totalOccurrencesMin: Int
  totalOccurrencesMax: Int
  timeOfDay: TimeOfDay
  daysOfWeek: [DayOfWeek!]
  "Length of one occurrence in minutes (live durationMinutesMin/Max)."
  durationMinutesMin: Int
  durationMinutesMax: Int
  "Length of the whole step course in days (\"reduce over at least 4 weeks\" = 28..null)."
  durationDaysMin: Int
  durationDaysMax: Int
  "Cycle structure (\"6 week cycles on and off\" = length 84, active 42; FMD \"5 days per month for 3 months\" = length 28..31, active 5, count 3)."
  cycleLengthDaysMin: Int
  cycleLengthDaysMax: Int
  cycleActiveDaysMin: Int
  cycleActiveDaysMax: Int
  cycleCountMin: Int
  cycleCountMax: Int
  "Verbatim termination of a repetition (\"weekly until the levels are stable\"); structured REPEAT_UNTIL role requested (W16-SR-08)."
  repeatUntilText: String
  isAsNeeded: Boolean
  """class: structural; cardinality: one_or_more (inverse of HAS_PROTOCOL_STEP); catalog: HAS_PROTOCOL_STEP"""
  editions: [ProtocolEdition!]! @relationship(type: "HAS_PROTOCOL_STEP", direction: IN, properties: "StepOrderProperties")
  """class: structural; cardinality: many; catalog: DEPENDS_ON {dependencyKind}; endpoints in the same edition (V-527p); ordering kinds acyclic (V-528p)"""
  dependsOn: [ProtocolStep!]! @relationship(type: "DEPENDS_ON", direction: OUT, properties: "StepDependencyProperties")
  """class: structural; cardinality: many; catalog: HAS_CONSTRAINT {constraintRole}; CONDITIONAL steps need an APPLIES_WHEN edge (V-525p)"""
  constraints: [Constraint!]! @relationship(type: "HAS_CONSTRAINT", direction: OUT, properties: "ConstraintRoleProperties")
  """class: structural; cardinality: many; registry: USES {StepDoseProperties} — declared dose, never intake"""
  uses: [StepSubstanceTarget!]! @relationship(type: "USES", direction: OUT, properties: "StepDoseProperties")
  """class: structural; cardinality: many; registry: EMPLOYS (device, lab test, assay version, instrument, exposure)"""
  employs: [StepInstrumentTarget!]! @relationship(type: "EMPLOYS", direction: OUT, properties: "StructuralEdgeProperties")
  """class: structural; cardinality: many; registry: TARGETS (stated purpose only)"""
  targets: [TherapeuticTargetTarget!]! @relationship(type: "TARGETS", direction: OUT, properties: "StructuralEdgeProperties")
}

