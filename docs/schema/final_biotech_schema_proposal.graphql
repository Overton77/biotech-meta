}

"Kind of process an Activity was (PROV-O prov:Activity)."
enum ActivityKind {
  CAPTURE
  TRANSCRIPTION
  TEXT_EXTRACTION
  SEGMENTATION
  EXTRACTION
  RESOLUTION
  REANCHORING
  ADJUDICATION
  ANSWER_COMPOSITION
  "W00-R-09 (W02-SR-04): a calculation producing CALCULATED assertions (e.g. salt-to-moiety conversion)."
  CALCULATION
  "W00-R-09 (W19-SR-03): a source discovery attempt (SourceDiscoveryRecord specialization)."
  DISCOVERY
  "W00-R-09 (W22-SR-04): a model or renderer produced new media bytes."
  MEDIA_GENERATION
  "W00-R-09 (W22-SR-04): crop, resize, overlay or transcode of existing media bytes."
  MEDIA_TRANSFORMATION
  "W00-R-09 (W22-SR-04): a media suitability assessment run."
  MEDIA_ASSESSMENT
  "W00-R-09 (W18-SR-04): curation of a narrative arc or event-impact record (W18 fixtures use it)."
  CURATION
}

"Kind of agent (aligned to Biolink AgentTypeEnum)."
enum AgentKind {
  MANUAL_AGENT
  AUTOMATED_AGENT
  TEXT_MINING_AGENT
  DATA_ANALYSIS_PIPELINE
  COMPUTATIONAL_MODEL
  MANUAL_VALIDATION_OF_AUTOMATED_AGENT
}

"Downstream use a PolicyVersion may allow (AUTHORIZED_BY)."
enum UseKind {
  QUOTE_IN_ANSWER
  SUMMARIZE_IN_ANSWER
  USE_AS_RECOMMENDATION_EVIDENCE
  SHARE_EXTERNALLY
  "W00-R-10 (W22-SR-02, W23-SR-15): show a rendition of a media asset in an answer, page or export. QUOTE_IN_ANSWER never covers images."
  DISPLAY_MEDIA
}

"How two identities relate. Only SAME_IDENTITY_MERGED publishes a merge redirect (W00-R-11); every other value compares two distinct identities and never merges them."
enum EquivalenceKind {
  SAME_WORK_DIFFERENT_NAME
  OVERLAPPING_SCOPE
  RELATED_NOT_EQUIVALENT
  NOT_EQUIVALENT
  "W00-R-11 (W00-SR-05, W23-SR-06): two records of ONE identity; the retired record is kept (maturity DEPRECATED) and resolves to survivingUid as of this assessment's recordedAt."
  SAME_IDENTITY_MERGED
}

"Kind of caveat a qualifying occurrence attaches (QUALIFIED_BY; relationship owned by W21)."
enum QualificationKind {
  INDIVIDUAL_VARIATION
  POPULATION_SCOPE
  SPECIES_OR_MODEL
  QUANTITY_BASIS
  UNCERTAINTY_INTERVAL
  NEEDS_CONFIRMATION
  HEDGE
  TIME_SCOPE
  CONDITIONAL_USE
  CONSULT_PROFESSIONAL
}

"How a retelling reproduces its original (RETELLS; relationship owned by W21)."
enum RetellingMode {
  VERBATIM_QUOTE
  PARAPHRASE
  SUMMARY
  TRANSLATION
}

"Why BellLabs links a retelling to an original."
enum RetellingLinkBasis {
  EXPLICIT_CITATION
  BELLLABS_MATCH
}

"Relevance of a financial interest to an occurrence (ConflictRelevanceAssessment)."
enum RelevanceLevel {
  DIRECT
  INDIRECT
  NOT_RELEVANT
  UNKNOWN
}

"Path by which an interest is relevant."
enum RelevanceBasis {
  SAME_PRODUCT
  SAME_ORGANIZATION
  COMPETING_PRODUCT
  SAME_SUBSTANCE
  SAME_SUBSTANCE_CLASS_VIA_GROUP
  SPONSOR_OF_CONTAINER
  NO_PATH_FOUND
  "W00-R-10 (W21-SR-14): the statement concerns the category of service the tied organization sells, not the organization itself."
  SAME_SERVICE_CATEGORY
}

"Disclosure state; NOT_FOUND_IN_PARTIAL_CAPTURE is never NOT_DISCLOSED."
enum DisclosureFinding {
  DISCLOSED_IN_CONTAINER
  DISCLOSED_ELSEWHERE
  NOT_FOUND_IN_PARTIAL_CAPTURE
  NOT_DISCLOSED
  UNKNOWN
}

"Whether a role interval overlaps an utterance."
enum TemporalOverlap {
  OVERLAPS
  DISJOINT
  UNKNOWN
}

"Quote-anchor match quality of a re-anchoring."
enum AnchorMatch {
  EXACT
  FUZZY
}

"Per-day / per-dose / per-serving / per-kg / single-dose basis of an amount (catalog quantityBasis)."
enum QuantityBasis {
  PER_DAY
  PER_DOSE
  PER_SERVING
  PER_KG_BODY_WEIGHT_PER_DAY
  SINGLE_DOSE
}

"Mass basis of an amount (salt form vs active moiety vs as-is); UNSPECIFIED is a stated unknown."
enum MassBasis {
  SALT_FORM
  ACTIVE_MOIETY
  MATERIAL_AS_IS
  UNSPECIFIED
}

"What an amount refers to (catalog amountReferent)."
enum AmountReferent {
  NUTRIENT_AS_NUTRIENT
  LISTED_INGREDIENT_AS_LISTED
  PROPRIETARY_BLEND_TOTAL
  EXTRACT_TOTAL
  MARKER_CONSTITUENT
  NOT_STATED
}

"CANDIDATE (W19-SR-02): share of a work's content a rendition Source carries. A COMPLETE capture of a PARTIAL rendition (a PubMed abstract record) never supports NOT_DISCLOSED or 'not reported' for the work."
enum RenditionCoverage {
  FULL
  PARTIAL
  UNKNOWN
}

"Whether a source reported a value; NOT_REPORTED is never zero or absent."
enum ReportedStatus {
  REPORTED
  NOT_REPORTED
  NOT_APPLICABLE
}

# -----------------------------------------------------------------------------------------------------
# 4. Provenance nodes
# -----------------------------------------------------------------------------------------------------

"""
Stable identity of ONE retrieval endpoint (one normalized `canonicalUri`): a publisher page, registry or
database record, document, PDF file, DOI landing endpoint, or media rendition. It is NOT the work: a
scholarly article's work identity is `Publication` (W09) and an audio/video work is `Episode` (W21); every
rendition endpoint of a work is its own Source linked RENDITION_OF (CL-003 ruling). It is NOT a capture:
captures are SourceSnapshots. A live `Document` is a Source specialization (labels Document, Source, Entity;
D-005) that adds document metadata and never adds identity; read through this type, a Document node must
also store `id` (see seam W00-SR-03). Source carries no reliability or truth score; authority-scope research
(W19) attaches assessments by uid (CL-012). Archetype: Entity. Module: provenance.
CQs: CQ-EV-01, CQ-PV-02, CQ-TM-06, CQ-ID-04.
"""
type Source implements Entity & EntityArchetype
  @node(labels: ["Source", "Entity"])
  @mutation(operations: [CREATE, UPDATE]) {
  id: ID! @id
  uid: String! @settable(onCreate: true, onUpdate: false)
  "Title as displayed by the endpoint, stored as `title` (W00-R-14 on W20-SR-08: the same stored property Document.name reads, so a :Document:Source node shows one title through both types). Presentation only; never identity."
  name: String @alias(property: "title")
  description: String
  mongoResearchRunId: String
  createdAt: DateTime! @timestamp(operations: [CREATE]) @settable(onCreate: false, onUpdate: false)
  updatedAt: DateTime! @timestamp(operations: [CREATE, UPDATE])
  privacyClass: PrivacyClass
  maturity: NodeMaturity
  schemaVersion: String
  "Always 'Source' (or 'Document' on the specialization)."
  entityType: String!
  "Normalized post-redirect retrieval endpoint, never an identifier resolver (W00-R-15, W19-SR-10); unique (constraint source_canonical_uri); identity key with uid. A Document writes it together with url (W20-V05)."
  canonicalUri: String!
  "Kind of endpoint (classification only)."
  sourceKind: SourceKind
  "Required when sourceKind is OTHER (W00-R-08, V-W00-17): what the endpoint is."
  sourceKindNote: String
  "CANDIDATE (W19-SR-02, ruled by W00): how much of its work this rendition carries (FULL, PARTIAL, UNKNOWN); null when the Source is not RENDITION_OF a work. Distinct from SourceSnapshot.captureCompleteness (how much of the endpoint was captured)."
  renditionCoverage: RenditionCoverage
  "uid of the publishing Organization when known (reference by uid; no asserted edge in 0.2.0)."
  publisherUid: String
  """class: structural; cardinality: many; catalog: HAS_SNAPSHOT (Source → SourceSnapshot). One per capture. HAS_SNAPSHOT has this meaning only; entity state caches (Organization/Product/Listing → *Snapshot) use HAS_STATE (W00-R-16)."""
  snapshots: [SourceSnapshot!]! @relationship(type: "HAS_SNAPSHOT", direction: OUT)
  """class: structural; cardinality: many; catalog: HAS_TEXT_VERSION (Source → DocumentTextVersion, W20)."""
  textVersions: [DocumentTextVersion!]! @relationship(type: "HAS_TEXT_VERSION", direction: OUT)
  """class: structural; cardinality: zero_or_one work; catalog: RENDITION_OF (Source → Episode)."""
  renditionOfEpisode: [Episode!]! @relationship(type: "RENDITION_OF", direction: OUT)
  """class: structural; cardinality: zero_or_one work; catalog: RENDITION_OF (Source → Publication)."""
  renditionOfPublication: [Publication!]! @relationship(type: "RENDITION_OF", direction: OUT)
  """class: structural (inverse); cardinality: many; catalog: REVISES_SOURCE (SourceRevisionEvent → Source)."""
  revisionEvents: [SourceRevisionEvent!]! @relationship(type: "REVISES_SOURCE", direction: IN)
  """class: asserted; cardinality: many; catalog: HAS_IDENTIFIER. Endpoint-level identifiers only (a DOI belongs to the Publication)."""
  identifiers: [Identifier!]! @relationship(type: "HAS_IDENTIFIER", direction: OUT, properties: "IdentifierLinkProperties")
}

"""
Immutable capture of a Source at a known retrieval time, with a hash whose input is named
(`contentHashBasis`) and a declared completeness. A changed page, record or newly linked notice is a NEW
snapshot plus, when the publisher revised it, a SourceRevisionEvent; a snapshot is never edited
(INV-504). Clocks: `retrievedAt` = when BellLabs fetched the bytes (lower bound for any assertion's
recordedAt, V-504); `observedAt` = when the content is known to have been displayed (archive capture time
for a late source; equals retrievedAt for a live crawl); `publishedAt` = issuer time (CQ-TM-03). It is NOT
a text rendition (DocumentTextVersion, W20) and NOT a locator. Archetype: InformationArtifact.
Module: provenance. CQs: CQ-EV-01, CQ-TM-02, CQ-TM-03, CQ-PV-02, CQ-AX-07.
"""
type SourceSnapshot implements Entity & InformationArtifactArchetype
  @node(labels: ["SourceSnapshot", "InformationArtifact"])
  @mutation(operations: [CREATE]) {
  id: ID! @id
  uid: String! @settable(onCreate: true, onUpdate: false)
  name: String
  description: String
  mongoResearchRunId: String
  createdAt: DateTime! @timestamp(operations: [CREATE]) @settable(onCreate: false, onUpdate: false)
  updatedAt: DateTime! @timestamp(operations: [CREATE, UPDATE])
  privacyClass: PrivacyClass
  maturity: NodeMaturity
  schemaVersion: String
  "Always 'SourceSnapshot' (or a specialization name such as 'LabelSnapshot')."
  artifactType: String!
  "Issuer's date for this version (with publishedAtPrecision)."
  publishedAt: DateTime
  "Precision of publishedAt."
  publishedAtPrecision: TimePrecision
  "When the content is known to have been displayed (archive capture time for a late source)."
  observedAt: DateTime
  "When BellLabs fetched the bytes; required."
  retrievedAt: DateTime!
  "sha256:<hex>; required when cited by an ACCEPTED assertion (V-111)."
  contentHash: String
  "Input of contentHash; required for new captures (service-enforced, V-111b)."
  contentHashBasis: ContentHashBasis
  "COMPLETE / PARTIAL_EXCERPT / UNKNOWN; required for new captures."
  captureCompleteness: CaptureCompleteness
  "Copy of the Source canonicalUri at capture time (the URI actually fetched may differ after redirects)."
  canonicalUri: String
  "Where BellLabs stored the captured content (internal)."
  storageUri: String
  "External archive copy (e.g. a web archive capture URI)."
  archiveUri: String
  "Verbatim provisional/revision notice printed by the publisher in this capture."
  publisherRevisionNotice: String
  "MIME type of the captured content."
  mimeType: String
  "Language tag of the captured content (BCP 47)."
  language: String
  """class: structural (inverse); cardinality: exactly_one; catalog: HAS_SNAPSHOT."""
  source: [Source!]! @relationship(type: "HAS_SNAPSHOT", direction: IN)
  """class: structural; cardinality: many; catalog: HAS_LOCATOR (each locator hangs from exactly one snapshot, V-402)."""
  locators: [SourceLocator!]! @relationship(type: "HAS_LOCATOR", direction: OUT)
  """class: structural (inverse); cardinality: many; catalog: TEXT_OF_SNAPSHOT (DocumentTextVersion → SourceSnapshot, exactly one per text version)."""
  textVersions: [DocumentTextVersion!]! @relationship(type: "TEXT_OF_SNAPSHOT", direction: IN)
  """class: structural; cardinality: zero_or_one; catalog: WAS_GENERATED_BY (capture Activity)."""
  generatedBy: [Activity!]! @relationship(type: "WAS_GENERATED_BY", direction: OUT)
  """class: structural (inverse); cardinality: many; catalog: USED."""
  usedBy: [Activity!]! @relationship(type: "USED", direction: IN)
  """class: structural (inverse); catalog: PRIOR_SNAPSHOT."""
  revisedFromInEvents: [SourceRevisionEvent!]! @relationship(type: "PRIOR_SNAPSHOT", direction: IN)
  """class: structural (inverse); catalog: RESULTING_SNAPSHOT."""
  resultOfRevisionEvents: [SourceRevisionEvent!]! @relationship(type: "RESULTING_SNAPSHOT", direction: IN)
  """class: structural (inverse); catalog: ANNOUNCED_IN (this snapshot is the notice capture)."""
  announcesRevisionEvents: [SourceRevisionEvent!]! @relationship(type: "ANNOUNCED_IN", direction: IN)
}

"""
Stable, reproducible locator for the exact span, time range, page, region or section supporting an
assertion, bound to exactly one SourceSnapshot (KCR-4.1). Required fields by `selectorKind`:
TEXT_QUOTE exact+quoteHash+normalizationVersion; TEXT_POSITION those plus startOffset/endOffset and
LOCATOR_IN_TEXT_VERSION; MEDIA_TIME those plus mediaStartSeconds/mediaEndSeconds on the rendition's own
timeline (offsets are not portable across renditions: dynamic ad insertion); PDF_PAGE page+exact+quoteHash+
normalizationVersion; IMAGE_REGION mediaAnnotationUid+normalizationVersion AND one LOCATES_REGION edge to
that MediaAnnotation (CL-011 / D-010; the annotation never replaces locator or snapshot); SECTION section;
WHOLE_SNAPSHOT nothing (coarse). A null `selectorKind` marks a migrated 0.1.0 untyped selector that is not
reproducible until re-anchored (V-401 rejects it). A Chunk is NEVER a locator (INV-404); RESOLVES_TO_CHUNK is
derived. Immutable; a newer snapshot gets a new locator and REANCHORS. Archetype: InformationArtifact.
Module: provenance. CQs: CQ-EV-01, CQ-PV-02, CQ-AX-07.
"""
type SourceLocator implements Entity & InformationArtifactArchetype
  @node(labels: ["SourceLocator", "InformationArtifact"])
  @mutation(operations: [CREATE]) {
  id: ID! @id
  uid: String! @settable(onCreate: true, onUpdate: false)
  name: String
  description: String
  mongoResearchRunId: String
  createdAt: DateTime! @timestamp(operations: [CREATE]) @settable(onCreate: false, onUpdate: false)
  updatedAt: DateTime! @timestamp(operations: [CREATE, UPDATE])
  privacyClass: PrivacyClass
  maturity: NodeMaturity
  schemaVersion: String
  "Always 'SourceLocator'."
  artifactType: String!
  "Not used on locators (time lives on the snapshot); present for the archetype contract."
  publishedAt: DateTime
  "Not used on locators; present for the archetype contract."
  observedAt: DateTime
  "Optional sha256 of the located content; quoteHash is the span hash."
  contentHash: String
  "URI of the located resource (normally the snapshot canonicalUri)."
  uri: String
  "Selector contract; null only for migrated untyped 0.1.0 selectors (not reproducible)."
  selectorKind: SelectorKind
  "Verbatim cited text before normalization (Web Annotation TextQuoteSelector.exact)."
  exact: String
  "Context before exact."
  prefix: String
  "Context after exact."
  suffix: String
  "sha256:<hex> of exact after normalizationVersion."
  quoteHash: String
  "Catalog normalizationVersions id (e.g. NFC-WS1); for IMAGE_REGION it names the region coordinate convention."
  normalizationVersion: String
  "Start offset (inclusive, code points) in the linked DocumentTextVersion."
  startOffset: Int
  "End offset (exclusive) in the linked DocumentTextVersion."
  endOffset: Int
  "Start on the captured rendition's own timeline, seconds."
  mediaStartSeconds: Float
  "End on the captured rendition's own timeline, seconds."
  mediaEndSeconds: Float
  "How media times were obtained (RENDITION_TRANSCRIPT_CUE, PUBLISHER_CHAPTER, MANUAL; controlled string)."
  mediaTimeBasis: String
  "1-based PDF page."
  page: Int
  "Named section or panel (SECTION selector)."
  section: String
  "uid of the MediaAnnotation that implements an IMAGE_REGION (paired with LOCATES_REGION)."
  mediaAnnotationUid: String
  "Speaker label printed in the source next to the span (what the source printed; not BellLabs attribution)."
  speakerLabelInSource: String
  "DEPRECATED 0.1.0 untyped selector, read-only; kept so migrated locators stay readable until re-anchored."
  selector: String @settable(onCreate: false, onUpdate: false)
  """class: structural (inverse); cardinality: exactly_one; catalog: HAS_LOCATOR."""
  snapshot: [SourceSnapshot!]! @relationship(type: "HAS_LOCATOR", direction: IN)
  """class: structural; cardinality: zero_or_one (required for TEXT_POSITION); catalog: LOCATOR_IN_TEXT_VERSION (→ DocumentTextVersion, W20)."""
  textVersion: [DocumentTextVersion!]! @relationship(type: "LOCATOR_IN_TEXT_VERSION", direction: OUT)
  """class: structural; cardinality: zero_or_one (exactly_one when IMAGE_REGION); relationship LOCATES_REGION (W22 type MediaAnnotation; CL-011)."""
  regionAnnotation: [MediaAnnotation!]! @relationship(type: "LOCATES_REGION", direction: OUT)
  """class: structural; cardinality: many; catalog: REANCHORS (newer → older locator of the same Source)."""
  reanchors: [SourceLocator!]! @relationship(type: "REANCHORS", direction: OUT, properties: "ReanchorProperties")
  """class: structural (inverse); catalog: REANCHORS."""
  reanchoredBy: [SourceLocator!]! @relationship(type: "REANCHORS", direction: IN, properties: "ReanchorProperties")
  """class: structural; cardinality: many; catalog: MENTIONS (SourceLocator → Mention only; entity-level retrieval links are MENTIONS_ENTITY, W00-R-19)."""
  mentions: [Mention!]! @relationship(type: "MENTIONS", direction: OUT)
  """class: derived; cardinality: many; catalog: RESOLVES_TO_CHUNK (relationship and ChunkResolutionProperties owned by W20)."""
  resolvesToChunks: [Chunk!]! @relationship(type: "RESOLVES_TO_CHUNK", direction: OUT, properties: "ChunkResolutionProperties")
  """class: structural (inverse); cardinality: many; catalog: SUPPORTED_BY (Assertion|Adjudication|EvidenceAssessment → SourceLocator)."""
  supports: [SupportedRecordTarget!]! @relationship(type: "SUPPORTED_BY", direction: IN)
  """class: structural (inverse); cardinality: many; catalog: CONTRADICTED_BY (Assertion|Adjudication → SourceLocator)."""
  contradicts: [SupportedRecordTarget!]! @relationship(type: "CONTRADICTED_BY", direction: IN)
  """class: structural; cardinality: zero_or_one; catalog: WAS_GENERATED_BY."""
  generatedBy: [Activity!]! @relationship(type: "WAS_GENERATED_BY", direction: OUT)
  """class: structural (inverse); catalog: USED."""
  usedBy: [Activity!]! @relationship(type: "USED", direction: IN)
}

"""
A correction, retraction, expression of concern, new version, silent change, withdrawal or reinstatement of
a Source as issued by its publisher (`occurredAt`, issuer time) and as learned by BellLabs (`recordedAt`,
service-assigned) (KCR-0007-3). It links exactly one revised Source, the prior and resulting snapshots
(0..1 each) and the notice snapshot (ANNOUNCED_IN, 0..1). It never edits assertions or adjudications:
consequences are new adjudications (SUPERSEDES {SOURCE_REVISION}) or new assertions (SUPERSEDES
{SOURCE_CORRECTION}). A correction notice is never a fact ending ([CORRECTS_SOURCE, FACT_CEASED]).
Archetype: Occurrence. Module: provenance. CQs: CQ-EV-05, CQ-TM-06, CQ-TM-07.
"""
type SourceRevisionEvent implements Entity & OccurrenceArchetype
  @node(labels: ["SourceRevisionEvent", "Occurrence"])
  @mutation(operations: [CREATE]) {
  id: ID! @id
  uid: String! @settable(onCreate: true, onUpdate: false)
  name: String
  description: String
  mongoResearchRunId: String
  createdAt: DateTime! @timestamp(operations: [CREATE]) @settable(onCreate: false, onUpdate: false)
  updatedAt: DateTime! @timestamp(operations: [CREATE, UPDATE])
  privacyClass: PrivacyClass
  maturity: NodeMaturity
  schemaVersion: String
  "Always 'SourceRevisionEvent'."
  occurrenceType: String!
  "Normally null; occurredAt carries the issuer time."
  startedAt: DateTime
  "Normally null."
  endedAt: DateTime
  "Kind of publisher revision."
  revisionKind: SourceRevisionKind!
  "When the publisher made the revision (issuer time; null = unknown)."
  occurredAt: DateTime
  "Precision of occurredAt."
  occurredAtPrecision: TimePrecision
  "When BellLabs learned of it (service-assigned at commit)."
  recordedAt: DateTime! @timestamp(operations: [CREATE]) @settable(onCreate: false, onUpdate: false)
  """class: structural; cardinality: exactly_one; catalog: REVISES_SOURCE."""
  revisesSource: [Source!]! @relationship(type: "REVISES_SOURCE", direction: OUT)
  """class: structural; cardinality: zero_or_one; catalog: PRIOR_SNAPSHOT."""
  priorSnapshot: [SourceSnapshot!]! @relationship(type: "PRIOR_SNAPSHOT", direction: OUT)
  """class: structural; cardinality: zero_or_one; catalog: RESULTING_SNAPSHOT (retrieved after the prior one, V-512)."""
  resultingSnapshot: [SourceSnapshot!]! @relationship(type: "RESULTING_SNAPSHOT", direction: OUT)
  """class: structural; cardinality: zero_or_one; catalog: ANNOUNCED_IN (the notice's snapshot)."""
  announcedIn: [SourceSnapshot!]! @relationship(type: "ANNOUNCED_IN", direction: OUT)
}

"""
Generic Assertion written by ingestion (D-006): a structured or literal proposition attributable to a
source or agent, with all AssertionArchetype fields. Labels ["Assertion"] only, so this type also READS
ClaimOccurrence and RelationshipAssertion nodes (W21 specializations carry the Assertion label) through
the kernel fields; do not list it together with those types in a union (D-W00-05). Shape: exactly one
HAS_SUBJECT; exactly one HAS_OBJECT or one typed literal; at most one ASSERTED_BY (a ClaimOccurrence has
exactly one asserter and one OCCURS_IN container, V-410); corroboration is several Assertions INSTANCE_OF
one Claim, never one Assertion with two asserters (KCR-4.3). Status is capture fidelity, never truth.
Content and valid time are immutable after commit (TM-R1); a change of belief is a new Assertion linked
SUPERSEDES. Assertions are never deleted (`@mutation` omits DELETE). `massBasis` and `amountReferent`
realize contract A11 on literal amounts (see KCR W00-SR-01). Archetype: Assertion. Module: kernel /
provenance. CQs: CQ-EV-01, CQ-EV-02, CQ-EV-05, CQ-TM-01, CQ-TM-02, CQ-TM-07, CQ-PV-01, CQ-PV-04, CQ-AX-07,
CQ-AX-15.
"""
type Assertion implements Entity & AssertionArchetype
  @node(labels: ["Assertion"])
  @mutation(operations: [CREATE, UPDATE]) {
  id: ID! @id
  uid: String! @settable(onCreate: true, onUpdate: false)
  "Optional display label; never identity."
  name: String
  description: String
