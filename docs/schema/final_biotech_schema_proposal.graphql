# ================================================================================================
# MANUFACTURING, SPECIFICATIONS AND SUPPLY READINESS (W11)
# Specifications and versions, processes and steps, capability states. Promotional language does not establish operating capacity.
# Competency questions: CQ-MF-01/04..06, CQ-PF-01
# Canonical module(s): products_and_formulations, manufacturing_readiness
# ================================================================================================

# ---- fragment W11 ----
"""
Stage of a ManufacturingCapability state (catalog conventions.capabilityStage, frozen). "Promoted" is NOT a stage: it is
the kind of source that made the claim (Source.sourceKind). OPERATING requires an authorizing assertion from a
non-marketing source or a SUPPORT adjudication with verdict SUPPORTED (INV-305, V-324/V-324r). PLANNED never implies
OPERATING (forbidden implication PLANNED_CAPABILITY -> OPERATING_CAPABILITY): a planned state and a later operating state
are two states attached by two HAS_CAPABILITY_STATE episodes. SUSPENDED is a temporary halt the source says may end
(NAI Carlsbad "temporarily closed in October 2023 ... reopened in May 2024"); DISCONTINUED is a stated end.
"""
enum CapabilityStage {
  OPERATING
  PILOTING
  PLANNED
  SUSPENDED
  DISCONTINUED
}

"""
What a stated capacity measures (catalog conventions.capacityBasis, frozen). NAMEPLATE = installed or design capacity as
stated (Cyanotech FY2002 10-K: 68 large ponds plus auxiliary ponds "totaling approximately 200,000 square meters, all of
which are currently available for production"). UTILIZED = the used share or used amount as stated (a utilization rate
uses unitCode '%'; an absolute used amount uses the nameplate unit). NOT_REPORTED = the source states no capacity value
(NAI FY2026 10-K "persistent excess capacity" is NOT_REPORTED with capacityVerbatim). Capacity is never inferred from
revenue, headcount or floor area of a building.
"""
enum CapacityBasis {
  NAMEPLATE
  UTILIZED
  NOT_REPORTED
}

"""
Kind of manufacturing process (catalog ManufacturingProcess.processKind; refines live free-text processClass). The value
set is a W11 proposal (catalog 0.2.0 names the property without values; ledger request W11-SR-01). Each value is backed
by a captured case: CHEMICAL_SYNTHESIS (NR chloride two-step synthesis, GRN 000635 dossier figures 2-3), CULTIVATION
(Cyanotech open-pond microalgae), EXTRACTION (Cyanotech supercritical CO2 astaxanthin extraction), BLENDING and
PACKAGING (NAI Carlsbad "high-volume powder blending and packaging"), DOSAGE_FORM_MANUFACTURING (encapsulation,
tableting, softgel), FERMENTATION and BIOCATALYSIS (microbial or enzymatic production; no case captured in this run,
kept because the live processClass strings use them), PURIFICATION (crystallization, chromatography, washing as a
separately described process). A process with several kinds is described as steps; processKind is the dominant kind
the source names. OTHER requires description; UNKNOWN = source names no kind.
"""
enum ProcessKind {
  CHEMICAL_SYNTHESIS
  FERMENTATION
  BIOCATALYSIS
  CULTIVATION
  EXTRACTION
  PURIFICATION
  BLENDING
  DOSAGE_FORM_MANUFACTURING
  PACKAGING
  OTHER
  UNKNOWN
}

# ---------------------------------------------------------------------------------------------------------------------
# Relationship-property type (sole writer W11)
# ---------------------------------------------------------------------------------------------------------------------

"""
Qualifiers of one asserted process input or output (INPUTS, OUTPUTS). Successor of live DoseMetadata on INPUTS, OUTPUTS,
PRODUCES, HAS_INPUT, HAS_OUTPUT (dose/doseUnit/role/standardizedTo/quantity/componentName meant intake dose fields and
are not carried). Contains every field of the frozen AssertedEdgeProperties (relationshipUid, assertionUid, valid and
recorded bounds, precisions, bases, mongoResearchRunId) because an input list is what a source (a GRAS dossier, a
filing, a batch record summary) asserts about a process, not a structural fact of a record. One edge per recorded-time
episode (asserted_edge profile).
ioRole is a controlled string (candidate enum ProcessIoRole): STARTING_MATERIAL | REAGENT | SOLVENT | PROCESSING_AID |
INTERMEDIATE | PRODUCT | BY_PRODUCT | EXCIPIENT | CULTURE_MEDIUM | PACKAGING_MATERIAL | UNKNOWN. Role is per use: the same
IngredientMaterial (nicotinamide) is a STARTING_MATERIAL in NR chloride synthesis and a dietary ingredient elsewhere,
under one uid. quantity/unitCode (UCUM) with ioQuantityBasis (controlled string PER_BATCH | PER_UNIT_OUTPUT_MASS |
PER_UNIT_TIME | NOT_STATED) record a stated amount; null quantity = not stated, never zero. gradeText is the verbatim
grade or concentration ("28% aqueous", "ACS grade"); asReportedName is the verbatim input name ("ammonia hydroxide").
A process input is never a composition claim about the product: INPUTS never implies CONTAINS or QUANTITATIVELY_CONTAINS
(forbidden implication proposed, W11-SR-02); residual-solvent limits are W12 SpecificationCriterion rows, not edges here.
"""
type ProcessIoProperties @relationshipProperties {
  relationshipUid: String!
  assertionUid: String!
  validFrom: DateTime
  validTo: DateTime
  validFromPrecision: TimePrecision
  validToPrecision: TimePrecision
  validFromBasis: ValidTimeBasis!
  validToBasis: ValidTimeBasis!
  recordedFrom: DateTime!
  recordedTo: DateTime
  mongoResearchRunId: String
  ioRole: String
  quantity: Float
  unitCode: String
  ioQuantityBasis: String
  gradeText: String
  asReportedName: String
  orderIndex: Int
}

# ---------------------------------------------------------------------------------------------------------------------
# Specification identity and its versions (module products_and_formulations)
# ---------------------------------------------------------------------------------------------------------------------

"""
The enduring identity of one named specification owned by one party: a supplier's ingredient specification (ChromaDex
"Niagen" ingredient specification), a finished-product specification, a customer purchase specification, or a public
compendial monograph (USP "Nicotinamide Riboside Chloride" dietary supplement monograph). Its content lives only on its
SpecificationVersions. It is NOT a material (two materials governed by one monograph are not thereby one material:
forbidden implication SHARES_SPECIFICATION -> SAME_MATERIAL_IDENTITY, W11-SR-02), NOT a test result, NOT a certificate
and NOT a regulatory status. The owner is an asserted OWNS_SPECIFICATION predicate (organizations, predicate-only); a
specification owner is not thereby the manufacturer (forbidden OWNS_SPECIFICATION -> PERFORMS_PROCESS proposed: the
Niagen specification owner relies on W.R. Grace as single NRC supplier, FY2025 10-K).
specificationKind is a controlled string (candidate enum SpecificationKind): INGREDIENT_SUPPLIER_SPECIFICATION |
FINISHED_PRODUCT_SPECIFICATION | CUSTOMER_PURCHASE_SPECIFICATION | COMPENDIAL_MONOGRAPH | IN_PROCESS_SPECIFICATION.
documentIdentifier is the owner's document number when public (null = not public; most supplier spec numbers are not).
CQ-MF-C02, CQ-MF-C03, CQ-PF-03 (scope), CQ-EV material identity level SAME_BRANDED_MATERIAL_SAME_SPEC. Module
products_and_formulations. Archetype Entity.
"""
type ManufacturingSpecification implements Entity & EntityArchetype
  @node(labels: ["ManufacturingSpecification", "Entity"]) {
  id: ID! @id
  uid: String!
  name: String
  description: String
  mongoResearchRunId: String
  createdAt: DateTime! @timestamp(operations: [CREATE])
  updatedAt: DateTime! @timestamp(operations: [CREATE, UPDATE])
  privacyClass: PrivacyClass
  maturity: NodeMaturity
  schemaVersion: String
  entityType: String!
  "Controlled string; see type description. Required for new writes (V-W11-08)."
  specificationKind: String
  "Owner's document number if publicly stated; null = not public or not captured."
  documentIdentifier: String
  """class: structural; cardinality: one_or_more (inverse view of VERSION_OF_SPECIFICATION); catalog: VERSION_OF_SPECIFICATION"""
  versions: [SpecificationVersion!]! @relationship(type: "VERSION_OF_SPECIFICATION", direction: IN, properties: "StructuralEdgeProperties")
}

"""
The ONE specification payload type (D-009): one immutable version of a ManufacturingSpecification. Payload = version
label, effective bounds, the owner's revision identifier when stated, and the set of acceptance criteria. Criteria are
W12 SpecificationCriterion nodes that point at their version (relationship name requested from W12, W11-SR-03); the
version records how many criteria were captured (criteriaCount), how completely (criteriaCaptureCompleteness: the USP
monograph text is licensed and not captured = UNKNOWN; a dossier table = PARTIAL_EXCERPT or COMPLETE), and
criteriaDigest = 'sha256:<hex>' over the sorted criterion payloadHashes. payloadHash (D-016) is sha256 over the
canonical JSON of {specificationUid, versionName, revisionIdentifier, effectiveFrom, effectiveTo, criteriaDigest}.
Any change in a criterion (analyte, comparator, threshold, unit, method, limit stage) is a NEW SpecificationVersion of
the same ManufacturingSpecification; it is never an in-place edit and never by itself a new IngredientMaterial (case:
Niagen residual-solvent limits acetone <=3000 ppm and methanol <=740 ppm in the GRN 000635 dossier, 2015, versus
acetone <=5,000 mg/kg and methanol <=1,000 mg/kg in the specification the applicant proposed to EFSA, EFSA Journal
2019;17(8):5775 -- same material uid, two versions). Whether a change ALSO changes material identity is decided by the
substances owner's identity rules (chemical form, grade, taxon, strain), never by a version count.
effectiveFrom/effectiveTo are source-stated payload (for example a monograph's official date); which version governs a
material at a time comes from GOVERNED_BY_SPECIFICATION episodes. versionName is the source-stated label; null when the
source states none (both Niagen dossiers state none: version identity then rests on payloadHash and the citing source).
It is NOT a lot, NOT a certificate of analysis, NOT a measured result and NOT a label. CQ-MF-C02, CQ-MF-C03, CQ-PF-03.
Module products_and_formulations. Archetype VersionedState.
"""
type SpecificationVersion implements Entity & VersionedStateArchetype
  @node(labels: ["SpecificationVersion", "VersionedState"]) {
  id: ID! @id
  uid: String!
  name: String
  description: String
  mongoResearchRunId: String
  createdAt: DateTime! @timestamp(operations: [CREATE])
  updatedAt: DateTime! @timestamp(operations: [CREATE, UPDATE])
  privacyClass: PrivacyClass
  maturity: NodeMaturity
  schemaVersion: String
  stateType: String!
  "sha256:<hex> over the canonical payload (see type description); identical payload = identical version."
  payloadHash: String!
  "Source-stated first instant the version applies (payload, not query validity)."
  effectiveFrom: DateTime
  effectiveFromPrecision: TimePrecision
  "Source-stated end; null = unknown, never 'still in force'."
  effectiveTo: DateTime
  effectiveToPrecision: TimePrecision
  "Source-stated version label (catalog versionName); null = the source states none."
  versionName: String
  "Owner's revision or document-revision identifier when stated (for example 'Rev. 3'); null = not stated."
  revisionIdentifier: String
  "Number of SpecificationCriterion nodes captured for this version; null = not counted."
  criteriaCount: Int
  "How completely the criteria were captured: COMPLETE | PARTIAL_EXCERPT | UNKNOWN. UNKNOWN never reads as 'no criteria'."
  criteriaCaptureCompleteness: CaptureCompleteness
  "sha256:<hex> over the sorted payloadHash values of the version's criteria; null when criteria were not captured."
  criteriaDigest: String
  """class: structural; cardinality: exactly_one; catalog: VERSION_OF_SPECIFICATION"""
  specification: [ManufacturingSpecification!]! @relationship(type: "VERSION_OF_SPECIFICATION", direction: OUT, properties: "StructuralEdgeProperties")
  """class: asserted (asserted_edge, EXCLUSIVE per material and specification, W11-SR-04); cardinality: many; catalog: GOVERNED_BY_SPECIFICATION (inverse view; IngredientMaterial -> SpecificationVersion)"""
  governedMaterials: [IngredientMaterial!]! @relationship(type: "GOVERNED_BY_SPECIFICATION", direction: IN, properties: "AssertedEdgeProperties")
  # ---- fields injected at merge (seam closure; see reports/04-seam-closure-ledger.md) ----
  """class: structural (inverse view); cardinality: many; catalog: CRITERION_OF_SPECIFICATION (registry: W12); request: W12-SR-10, W11-SR-03; injected at merge (reports/04-seam-closure-ledger.md). Inverse view of SpecificationCriterion.criterionOf (D-009)."""
  criteria: [SpecificationCriterion!]! @relationship(type: "CRITERION_OF_SPECIFICATION", direction: IN, properties: "StructuralEdgeProperties")
}

