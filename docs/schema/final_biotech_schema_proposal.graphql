"Privacy class of a shared-graph element. There is no private-personal value: private records never enter the shared graph (D-012, INV-506). Stored values are these SCREAMING_SNAKE spellings."
enum PrivacyClass {
  PUBLIC
  INTERNAL
}

"Schema maturity of a node type or record (catalog conventions.nodeMaturity)."
enum NodeMaturity {
  CANDIDATE
  PROVISIONAL
  ACCEPTED
  DEPRECATED
}

"Capture-fidelity workflow status of an Assertion (catalog assertionStatus). ACCEPTED = accepted as an accurate record of what the asserter said in this source; never truth."
enum AssertionStatus {
  EXTRACTED
  PROPOSED
  ACCEPTED
  REJECTED
  DISPUTED
  SUPERSEDED
  UNRESOLVED
}

"Workflow state of an EvidenceAssessment record (contract B5). Not a verdict."
enum AssessmentStatus {
  PROPOSED
  ACCEPTED
  SUPERSEDED
  WITHDRAWN
}

"CAPTURE_FIDELITY judges the record (feeds Assertion.status); SUPPORT judges the proposition (never changes status)."
enum AdjudicationKind {
  CAPTURE_FIDELITY
  SUPPORT
}

"Adjudication verdict; meaning depends on AdjudicationKind (catalog verdictSemantics)."
enum AdjudicationVerdict {
  SUPPORTED
  PARTIALLY_SUPPORTED
  CONTRADICTED
  INSUFFICIENT
  NOT_APPLICABLE
}

"Who reviewed: a person, an agent, an automated policy, or the 0.2.0 migration."
enum ReviewerType {
  HUMAN
  AGENT
  POLICY
  MIGRATION
}

"Epistemic basis of a proposition (rounds 0003 and 0005)."
enum BasisKind {
  DIRECT_MEASUREMENT
  INFERRED_FROM_MEASUREMENT
  CITED_FROM_PRIOR_WORK
  HYPOTHESIS
  CALCULATED
}

"CANDIDATE (contract B5, owner W00): coarse predicate class; MECHANISM requires basisKind (INV-210)."
enum PredicateClass {
  MECHANISM
  ROLE
  COMMERCIAL
  REGULATORY
  QUANTITY
  IDENTITY
  CLAIM
  OTHER
}

"On what basis the asserter presents the proposition (round 0006); distinct from basisKind and ClaimType."
enum AssertionBasis {
  PERSONAL_EXPERIENCE
  THIRD_PARTY_ANECDOTE
  MANUFACTURER_CLAIM
  STUDY_RESULT
  MECHANISM_REASONING
  EXPERT_OPINION
  UNSTATED
}

"What an utterance does; a practice report is not a recommendation."
enum SpeechAct {
  STATES
  REPORTS_PRACTICE
  RECOMMENDS
  CAUTIONS
  SPECULATES
  QUESTIONS
  DENIES
}

"Polarity of the proposition; NEGATIVE needs its own assertion and is never inferred from absence."
enum Polarity {
  POSITIVE
  NEGATIVE
  MIXED
  UNKNOWN
}

"Precision of a time bound; a bound is stored as the first UTC instant of its precision period."
enum TimePrecision {
  INSTANT
  DAY
  MONTH
  QUARTER
  YEAR
  DECADE
}

"Why a valid-time bound has its value (per bound)."
enum ValidTimeBasis {
  STATED_BY_SOURCE
  PUBLICATION_PROXY
  OBSERVATION_ONLY
  INFERRED
  UNKNOWN
}

"Why a newer record superseded an older one."
enum SupersessionKind {
  SOURCE_CORRECTION
  VALIDITY_BOUNDED
  EXTRACTION_FIX
  RESOLUTION_FIX
  DUPLICATE_MERGE
  RE_REVIEW
  SOURCE_REVISION
}

"Publisher revision kind (NLM publication types plus web silent change)."
enum SourceRevisionKind {
  ERRATUM
  RETRACTION
  EXPRESSION_OF_CONCERN
  CORRECTED_AND_REPUBLISHED
  NEW_VERSION
  SILENT_CONTENT_CHANGE
  WITHDRAWAL
  REINSTATEMENT
}

"Typed selector contract of a SourceLocator; SECTION and WHOLE_SNAPSHOT are coarse (V-401b)."
enum SelectorKind {
  TEXT_QUOTE
  TEXT_POSITION
  MEDIA_TIME
  PDF_PAGE
  IMAGE_REGION
  SECTION
  WHOLE_SNAPSHOT
}

"What a SourceSnapshot.contentHash was computed over; SYNTHETIC_FIXTURE is fixture-only."
enum ContentHashBasis {
  RAW_BYTES
  NORMALIZED_TEXT
  STORED_EXCERPT_TEXT
  SYNTHETIC_FIXTURE
}

"Whether a capture holds the whole rendition or excerpts; partial captures never support NOT_DISCLOSED."
enum CaptureCompleteness {
  COMPLETE
  PARTIAL_EXCERPT
  UNKNOWN
}

"Catalog sourceKind: kind of retrieval endpoint; classification only, never authority or truth."
enum SourceKind {
  PEER_REVIEWED_PUBLICATION
  PREPRINT
  CORRECTION_NOTICE
  RETRACTION_NOTICE
  EXPRESSION_OF_CONCERN
  REGULATORY_RECORD
  REGULATORY_GUIDANCE
  SECURITIES_FILING
  PRESS_RELEASE
  MARKETING_PAGE
  MANUFACTURER_LABEL_PAGE
  ORGANIZATION_WEBPAGE
  SELF_DISCLOSURE_PAGE
  THIRD_PARTY_PROFILE_PAGE
  THIRD_PARTY_DIRECTORY
  CERTIFICATION_LISTING
  AUDIT_REPORT
  MARKETPLACE_LISTING
  TERMINOLOGY_RECORD
  STANDARDS_DOCUMENT
  PODCAST_TRANSCRIPT_PAGE
  VIDEO_RENDITION
  AUDIO_FEED_ITEM
  PODCAST_DIRECTORY_RECORD
  NEWSLETTER
  MODEL_SERVICE
  LEGAL_RECORD
  "W00-R-08 (W09-SR-14, W19-SR-01): a trial registry record (ClinicalTrials.gov, EUCTR, ISRCTN); registry status is never an agency action."
  TRIAL_REGISTRY_RECORD
  "W00-R-08 (W19-SR-01; W09-SR-14 name BIBLIOGRAPHIC_DATABASE_RECORD folded in): a bibliographic database record (PubMed, Crossref, OpenAlex); not a publication rendition."
  BIBLIOGRAPHIC_RECORD
  "W00-R-08 (W19-SR-01, W21-SR-13, W06-SR-12): a news or trade-press article."
  NEWS_ARTICLE
  "W00-R-08 (W19-SR-01): statute, regulation or official journal text."
  LEGISLATION_OR_REGULATION
  "W00-R-08 (W19-SR-01, W21-SR-13): a slide deck; its own container, never a rendition of a talk."
  PRESENTATION_SLIDES
  "W00-R-08 (W19-SR-01): a personal website or blog of an individual."
  PERSONAL_WEBPAGE
  "W00-R-08 (W19-SR-01): technical or product documentation (manuals, API docs, IFUs)."
  TECHNICAL_DOCUMENTATION
  "W00-R-08 (W12-SR-03): a laboratory report or certificate of analysis document."
  LABORATORY_REPORT
  "W00-R-08 (W20-SR-10): a reinstatement notice (pairs with SourceRevisionKind REINSTATEMENT)."
  REINSTATEMENT_NOTICE
  "W00-R-08 (W21-SR-13): a podcast RSS/Atom feed document (not one feed item)."
  PODCAST_FEED
  "W00-R-08 (W21-SR-13): a transcript of an event or talk that is not a podcast episode page."
  EVENT_TRANSCRIPT
  "W00-R-08 (W22-SR-06): a retrievable media file endpoint (CDN or repository file URL)."
  MEDIA_FILE
  "W00-R-08 (W22-SR-06): a media repository description record (e.g. a Wikimedia Commons file page or API record)."
  MEDIA_REPOSITORY_RECORD
  "W00-R-08 (W22-SR-06): a research data repository record (BioStudies, BioImage Archive, Reactome ContentService)."
  DATA_REPOSITORY_RECORD
  "W00-R-08 CANDIDATE (W15-SR-15): a third-party blog or review page (often with affiliate links)."
  BLOG_OR_REVIEW_PAGE
  "W00-R-08 CANDIDATE (W15-SR-15): a storefront's machine-readable product endpoint (e.g. Shopify products/*.js)."
  STOREFRONT_STRUCTURED_DATA
  "W00-R-08 (W19-SR-01): none of the above; Source.sourceKindNote is required (V-W00-17)."
