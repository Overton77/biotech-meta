"""
Properties of QUANTITATIVELY_CONTAINS (asserted_edge profile). Contains every field of the frozen AssertedEdgeProperties
(W00) and adds the content qualifiers. One edge per recorded-time episode; valid bounds equal the authorizing assertion's.
Quantity shape: comparator EQ, APPROX, GE, GT, LE or LT uses quantity; BETWEEN uses quantityLow and quantityHigh with
quantity null (proposed V-006r, W02-SR-02; the frozen V-006 requires quantity). The authorizing assertion should carry the
same number (requested kernel change W02-SR-01). Specification acceptance limits are W12 SpecificationCriterion and lot
measurements are W12 MeasuredResult; they never become this edge.
"""
type QuantitativeContentProperties @relationshipProperties {
  relationshipUid: String!
  assertionUid: String!
  validFrom: DateTime
  validTo: DateTime
  validFromPrecision: TimePrecision
  validToPrecision: TimePrecision
  validFromBasis: ValidTimeBasis!
  validToBasis: ValidTimeBasis!
  recordedFrom: DateTime!
  recordedTo: DateTime
  mongoResearchRunId: String
  "Point value for EQ, APPROX, GE, GT, LE, LT; null for BETWEEN."
  quantity: Float
  "Lower bound for BETWEEN."
  quantityLow: Float
  "Upper bound for BETWEEN."
  quantityHigh: Float
  comparator: QuantityComparator!
  "UCUM unit ('%', 'mg/g', '{CFU}/g')."
  unitCode: String!
  basis: ContentBasis!
  "Mass basis of the quantity when it is a mass (SALT_FORM, ACTIVE_MOIETY, MATERIAL_AS_IS, UNSPECIFIED; W00 enum)."
  massBasis: MassBasis
  "How the measurand is expressed as stated (for example 'calculated as flavone glycosides')."
  expressedAs: String
  contentStatementKind: ContentStatementKind!
  "Verbatim statement text."
  verbatimText: String
  # ---- fields injected at merge (seam closure; see reports/04-seam-closure-ledger.md) ----
  """property; request: W05-SR-04; injected at merge (reports/04-seam-closure-ledger.md). Food composition portion basis; controlled values EDIBLE_PORTION | AS_PURCHASED | DRY_WEIGHT | AS_PREPARED | NOT_STATED (String until an enum is registered)."""
  portionBasis: String
  """property; request: W05-SR-04; injected at merge (reports/04-seam-closure-ledger.md). How the source derived the value; controlled values ANALYTICAL | CALCULATED | IMPUTED | ASSUMED_ZERO | BELOW_LOQ | NOT_STATED (String until an enum is registered)."""
  valueDerivation: String
  """property; request: W05-SR-04; injected at merge (reports/04-seam-closure-ledger.md). Verbatim source derivation code (e.g. FDC 'A', 'Z')."""
  sourceDerivationCode: String
  """property; request: W05-SR-04; injected at merge (reports/04-seam-closure-ledger.md). Number of analytical data points reported by the source (0 is a value, null is not reported)."""
  dataPoints: Int
  """property; request: W05-SR-04; injected at merge (reports/04-seam-closure-ledger.md). Minimum of the sample spread as reported (unit = unitCode); distinct from quantityLow of a stated range."""
  minValue: Float
  """property; request: W05-SR-04; injected at merge (reports/04-seam-closure-ledger.md). Maximum of the sample spread as reported (unit = unitCode); distinct from quantityHigh of a stated range."""
  maxValue: Float
}

