"""
A verdict that a lot or execution conforms or not to one SpecificationCriterion: either copied from a source with the
Assertion that captured it (SOURCE_STATED: a COA "☑ Pass", a lot page "Conforms to internal specs") or evaluated by a
named method version from exactly one MeasuredResult under a stated decision rule (EVALUATED_FROM_RESULT; uncertainty
and guard bands are applied here, OPEN-QUESTIONS P2 quality 2). It is an EvidenceAssessment: immutable, superseded by
a new interpretation. It is NOT a measured value and never creates one (V-W12-05); NOT a certification; NOT a
truth verdict about the product's label. CQ-QA-C02, CQ-QA-C03, CQ-PF-03, minimal pair 18.
Catalog module quality. Archetype EvidenceAssessment.
"""
type PassFailInterpretation implements Entity & EvidenceAssessmentArchetype
  @node(labels: ["PassFailInterpretation", "EvidenceAssessment"]) {
