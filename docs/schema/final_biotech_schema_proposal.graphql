"""
A curated media work-object (image, video, audio, figure, chart, diagram, 3D model) that BellLabs references or
holds, independent of any one byte rendition. Byte facts (format, size, dimensions, hashes, storage) live on its
MediaVariant renditions; exactly one ORIGINAL variant exists when bytes are held, and `contentHash` repeats that
variant's raw-byte hash (V-611). It is NOT a Source or SourceSnapshot (the evidence capture of a retrieval
endpoint; the two share bytes only through equal raw-byte hashes and DERIVED_FROM_SOURCE), NOT a claim that what
it shows is true, and NOT permission to display it (rights are MediaRightsRecord states; permission is a
PolicyVersion decision through AUTHORIZED_BY). Depiction and explanation links are assertions, never causal proof;
EVIDENCES is a derived shortcut that exists only when an Assertion is SUPPORTED_BY an IMAGE_REGION locator on an
original captured rendition. CQs: CQ-MD-C01, CQ-MD-C02, CQ-MD-C03, CQ-MD-C04, CQ-MD-C05, CQ-MD-C06, CQ-PV-01,
CQ-PV-06. Module: media. Archetype: InformationArtifact.
"""
type MediaAsset implements Entity & InformationArtifactArchetype & SearchIndexable
  @node(labels: ["MediaAsset", "InformationArtifact"])
  @fulltext(indexes: [{indexName: "MediaAssetSearch", fields: ["name", "description", "title", "altText", "caption", "transcriptText", "ocrText", "searchText"], queryName: "searchMediaAssets"}]) {
  id: ID! @id
  "hu:media-asset:<opaque>; token proposed in W22-SR-01"
  uid: String!
  name: String
  description: String
  mongoResearchRunId: String
  createdAt: DateTime! @timestamp(operations: [CREATE])
  updatedAt: DateTime! @timestamp(operations: [CREATE, UPDATE])
  privacyClass: PrivacyClass
  maturity: NodeMaturity
  schemaVersion: String
  "Always 'MEDIA_ASSET'."
  artifactType: String!
  "Publication instant stated by the publishing source (live sourcePublishedAt). Null = not stated."
  publishedAt: DateTime
  publishedAtPrecision: TimePrecision
  "Instant the asset is known to have been displayed at its source (archive capture date for late sources)."
  observedAt: DateTime
  "sha256:<hex> over the raw bytes of the ORIGINAL variant (live checksumSha256). Never a publisher-stated checksum."
  contentHash: String
  contentHashBasis: ContentHashBasis
  searchText: String
  searchFields: [String!]
  embeddingModel: String
  embeddingDimensions: Int
  "Embedding of caption/alt/OCR text; computed outside the API. Vector index only if Fable accepts 07-operations.md R-3."
  searchEmbedding: [Float!]
  assetType: MediaAssetType!
  "Purpose declared by the creator or curator. Never implies a link role; EVIDENCE here never implies EVIDENCES."
  mediaPurpose: MediaPurpose
  "How the ORIGINAL bytes came to exist (captured by a camera or instrument, generated by a model, rendered...)."
  generationMode: MediaGenerationMode
  "Creator- or publisher-disclosed synthetic content. Null = not disclosed (unknown), never false."
  isSynthetic: Boolean
  "The ORIGINAL bytes are an edited or composited version of an earlier capture, as disclosed or detected. Null = unknown."
  isEdited: Boolean
  "Verbatim disclosure of modifications (required by e.g. CC BY 4.0 'indicate if changes were made'); null = none found."
  editDisclosureText: String
  "Creation or capture instant stated by the creator or embedded metadata (e.g. Commons DateTimeOriginal), not our retrieval."
  capturedAt: DateTime
  capturedAtPrecision: TimePrecision
  "Presentation URL of the asset's landing page; never identity."
  canonicalUrl: String
  title: String
  "Alt text as published by the source; presentation and search only (depiction is asserted through DEPICTS)."
  altText: String
  "Caption as published; a caption used as support is cited through a SourceLocator, not through this field."
  caption: String
  "Derived search text (transcription); never a locator."
  transcriptText: String
  "Derived search text (OCR); never a locator."
  ocrText: String
  """class: structural; cardinality: one_or_more when bytes are held (exactly one ORIGINAL); catalog: HAS_MEDIA_VARIANT (CL-014 rename of media HAS_VARIANT)"""
  variants: [MediaVariant!]! @relationship(type: "HAS_MEDIA_VARIANT", direction: OUT)
  """class: structural; cardinality: many; catalog: DERIVED_FROM_SOURCE (retargeted from retired MediaSource to the W00 SourceLocator: WHOLE_SNAPSHOT for a standalone file, PDF_PAGE for a figure, IMAGE_REGION for a crop of a page capture, MEDIA_TIME for a frame)"""
  sourceLocators: [SourceLocator!]! @relationship(type: "DERIVED_FROM_SOURCE", direction: OUT, properties: "MediaSourceProperties")
