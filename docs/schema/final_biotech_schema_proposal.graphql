# ================================================================================================
# BIOLOGY AND MECHANISMS (W03)
# Reference biology (mechanisms, pathways, molecular entities, species, anatomical contexts, conditions, outcomes, risk factors) and MechanismEvidenceContext. Inference is not measurement; compartment and species transfer is qualified.
# Competency questions: CQ-MX-01..06, CQ-ST-03, CQ-AX-20
# Canonical module(s): mechanisms
# ================================================================================================

# ---- fragment W03 ----
"""Experimental setting of a MechanismEvidenceContext (catalog conventions.mechanismSetting). IN_VITRO_CELL_FREE and
IN_SILICO are the only settings that may lack a species (INV-210, V-231)."""
enum MechanismSetting {
  IN_VITRO_CELL_FREE
  IN_VITRO_CELL
  EX_VIVO
  IN_VIVO_NONMAMMAL
  IN_VIVO_MAMMAL
  HUMAN_INTERVENTIONAL
  HUMAN_OBSERVATIONAL
  IN_SILICO
}

"""Basis of MechanismEvidenceContext.exposureAmount (catalog conventions.exposureBasis). A ratio between two exposures
exists only when the bases match (INV-203)."""
enum ExposureBasis {
  PER_KG_BODY_WEIGHT_PER_DAY
  ABSOLUTE_PER_DAY
  SINGLE_DOSE
  MEDIUM_CONCENTRATION
  DIET_CONCENTRATION
}

"""What kind of anatomical or biological compartment an AnatomicalContext is. ORGAN is carried by nodes that also have
the Organ label (Organ is a specialization of AnatomicalContext, so one organ never has two identities)."""
enum AnatomicalContextKind {
  TISSUE
  CELL_TYPE
  CELL_LINE
  SPECIMEN_MATRIX
  ORGAN
  SUBCELLULAR
}

"""Sign of a curated reference link (refinement of live MechanismLinkMetadata.regulatorySign free text). It describes
reference topology (for example a Reactome reaction role), never a measured effect."""
enum RegulatorySign {
  ACTIVATES
  INHIBITS
  NEUTRAL
  UNKNOWN
}

# ---------------------------------------------------------------------------------------------------------------------
# Relationship-property types
# ---------------------------------------------------------------------------------------------------------------------

"""
Curated reference structure (class: structural). Successor of live MechanismLinkMetadata. Contains every field of the
frozen StructuralEdgeProperties (orderIndex, notes, mongoResearchRunId) plus reference qualifiers. Used on
INVOLVES_PATHWAY, HAS_MECHANISM, PARTICIPATES_IN, CONTRIBUTES_TO, ENCODES, REFLECTS_MECHANISM and Condition AFFECTS_ORGAN.
A curated link records what a reference resource (Reactome, HGNC, MONDO ...) states at a captured revision; it is never
experimental evidence and never a premise for a measured mechanism step (FI HYPOTHESIZED_STEP -> MEASURED_STEP,
PROXY_MARKER_CHANGED -> PROCESS_FLUX_CHANGED). referenceSnapshotUid names the SourceSnapshot of the authority record;
referenceRecordId is the unversioned authority id (for example R-HSA-196807) and referenceRevision the revision read
(for example "8" from stIdVersion R-HSA-196807.8); referenceRelease the authority release (for example Reactome "97").
"""
type MechanismLinkProperties @relationshipProperties {
  orderIndex: Int
  notes: String
  mongoResearchRunId: String
  regulatorySign: RegulatorySign
  enzymeRole: String
  stoichiometryNote: String
  upstreamDownstream: String
  referenceSnapshotUid: String
  referenceRecordId: String
  referenceRevision: String
  referenceRelease: String
}

"""
Derived association projection (class: derived). Successor of live AssociationMetadata on the derived mechanism and
risk edges (AFFECTS_MECHANISM, MODULATES, APPLIES_TO_SPECIES, INFLUENCES_OUTCOME, ACTS_IN, INCREASES_RISK_FOR,
MEDIATES_RISK_THROUGH, ASSOCIATED_WITH_CONDITION, ASSOCIATED_WITH_OUTCOME). Contains every field of the frozen
DerivedEdgeProperties (projectionOfAssertionUid, derivationRule, derivedFromAssertionUids, derivedFromAssessmentUids,
derivedAt, mongoResearchRunId) plus regenerable display qualifiers.
Citation rule (INV-004, D-011): rule-mode edges (AFFECTS_MECHANISM, MODULATES, APPLIES_TO_SPECIES, INFLUENCES_OUTCOME,
ACTS_IN) carry derivationRule 'mx-proj/v1' and a non-empty derivedFromAssertionUids, because their input predicates
(INCREASES_ACTIVITY_OF, INDUCES_PROCESS, IMPROVES ...) differ from the edge type; one-to-one edges (INCREASES_RISK_FOR,
MEDIATES_RISK_THROUGH, ASSOCIATED_WITH_*) carry projectionOfAssertionUid of an assertion whose predicate equals the edge
type. Never assertionUid. Every cited assertion is ACCEPTED, basisKind DIRECT_MEASUREMENT, polarity POSITIVE, current
(recordedTo null) and has exactly one MechanismEvidenceContext (INV-211).
projectedPredicate is the shared predicate of the cited assertions (one edge per subject, object and predicate, so IMPROVES
and IMPAIRS never merge). projectedPolarity is always POSITIVE in mx-proj/v1 (a null or mixed measurement never produces a shortcut edge; it stays
an assertion answerable by CQ-MX-03). speciesUids / settings / anatomicalContextUids are the union over the cited
assertions' contexts so that a consumer of the shortcut sees where the effect was measured. associationShape,
specificity and effectSummary are live display strings, never truth-bearing.
"""
type AssociationProjectionProperties @relationshipProperties {
  projectionOfAssertionUid: String
  derivationRule: String
  derivedFromAssertionUids: [String!]
  derivedFromAssessmentUids: [String!]
  derivedAt: DateTime
  mongoResearchRunId: String
  projectedPolarity: Polarity
  projectedPredicate: String
  speciesUids: [String!]
  settings: [MechanismSetting!]
  anatomicalContextUids: [String!]
  associationShape: String
  specificity: String
  effectSummary: String
}

# ---------------------------------------------------------------------------------------------------------------------
# Occurrence: the reported exposure-and-measurement event
# ---------------------------------------------------------------------------------------------------------------------

"""
One reported exposure group measured in one compartment (round 0003 M3). It is the Occurrence that a DIRECT_MEASUREMENT
mechanism Assertion points at through OBSERVED_IN_CONTEXT: setting, species and model, compartment, tested material at
the most specific level the source supports, and exposure (amount, UCUM unit, basis, route, ISO 8601 duration), or the
StudyArm when the context is a human study already modeled (then exposure is read from the arm and the exposure fields
stay null, V-238). It is NOT a Study (preclinical cohorts are not studies, round 0003 C3-03), NOT a VersionedState (no
enduring identity, C3-02), NOT a private measurement, and NOT a product dose. hedValue/hedMethod are derived (INV-213):
a human-equivalent dose is never an asserted context property, even when the source itself states a body-surface-area
conversion. Several step assertions from one exposure group share the node; a group measured in two compartments is two
nodes. CQ-MX-01, CQ-MX-02, CQ-MX-03, CQ-MX-04, CQ-MX-06. Module mechanisms. Archetype Occurrence.
"""
type MechanismEvidenceContext implements Entity & OccurrenceArchetype
  @node(labels: ["MechanismEvidenceContext", "Occurrence"]) {
  id: ID! @id
  uid: String!
  name: String
  description: String
  mongoResearchRunId: String
  createdAt: DateTime! @timestamp(operations: [CREATE])
  updatedAt: DateTime! @timestamp(operations: [CREATE, UPDATE])
  privacyClass: PrivacyClass
  maturity: NodeMaturity
  schemaVersion: String
  occurrenceType: String!
  startedAt: DateTime
  endedAt: DateTime
  "Experimental setting; required (V-231)."
  setting: MechanismSetting!
  "Verbatim model system as reported (strain, genotype, disease model, cell line, population words); null = not reported."
  modelDescriptor: String
  "Controlled string MALE | FEMALE | BOTH | UNKNOWN (candidate enum SexScope); null = not reported, UNKNOWN = reported as unknown or not extracted."
  sexScope: String
  ageDescriptor: String
  "Number of animals, participants or replicate units in this exposure group; null = not reported."
  sampleSize: Int
  "Exposure amount as reported; null with exposureStatus when unknown, or null when IN_STUDY_ARM is present. Never 0 for unknown (V-232)."
  exposureAmount: Float
  "UCUM unit of exposureAmount (mg/d, mg/kg/d, mg/kg, umol/L); required with exposureAmount."
  exposureUnit: String
  exposureBasis: ExposureBasis
  "Controlled string ORAL | GAVAGE | DIET | IP | IV | IN_MEDIUM | TOPICAL (candidate enum ExposureRoute)."
  route: String
  "ISO 8601 duration of exposure, for example P21D; PT6H for a single dose measured six hours later."
  exposureDurationIso: String
  "Controlled string NOT_EXTRACTED | NOT_REPORTED | NOT_APPLICABLE (candidate enum ExposureStatus): why exposure fields are null."
  exposureStatus: String
  "Derived human-equivalent dose (INV-213); regenerable; requires hedMethod (V-236)."
  hedValue: Float
  hedUnitCode: String
  "Method id of the HED derivation, for example 'BSA-Km/FDA-2005' or 'BSA-factor-as-stated-in-source'."
  hedMethod: String
  """class: structural; cardinality: zero_or_one (required unless setting is IN_VITRO_CELL_FREE or IN_SILICO); catalog: IN_SPECIES"""
  species: [Species!]! @relationship(type: "IN_SPECIES", direction: OUT)
  """class: structural; cardinality: zero_or_one; catalog: MEASURED_IN (compartment where the measurand was sampled; must equal the measurand's MEASURED_IN_MATRIX for level-change steps, V-239)"""
  measuredIn: [AnatomicalContext!]! @relationship(type: "MEASURED_IN", direction: OUT)
  """class: structural; cardinality: zero_or_one across the three EXPOSED_TO fields; catalog: EXPOSED_TO (tested material at the most specific level supported)"""
  exposedToMaterials: [IngredientMaterial!]! @relationship(type: "EXPOSED_TO", direction: OUT)
  """class: structural; cardinality: zero_or_one across the three EXPOSED_TO fields; catalog: EXPOSED_TO"""
  exposedToForms: [ChemicalForm!]! @relationship(type: "EXPOSED_TO", direction: OUT)
  """class: structural; cardinality: zero_or_one across the three EXPOSED_TO fields; catalog: EXPOSED_TO"""
  exposedToSubstances: [ChemicalSubstance!]! @relationship(type: "EXPOSED_TO", direction: OUT)
  """class: structural; cardinality: zero_or_one; catalog: IN_STUDY_ARM (human study arm; exposure fields then null)"""
  studyArm: [StudyArm!]! @relationship(type: "IN_STUDY_ARM", direction: OUT)
  """class: structural (inverse view); cardinality: many; catalog: OBSERVED_IN_CONTEXT (Assertion -> context, zero_or_one per assertion)"""
  observedAssertions: [Assertion!]! @relationship(type: "OBSERVED_IN_CONTEXT", direction: IN)
}

# ---------------------------------------------------------------------------------------------------------------------
# Entities: biological reference concepts and referents
# ---------------------------------------------------------------------------------------------------------------------

"""
A biological mechanism or process concept (mitophagy, NAD+ turnover flux, mitochondrial oxidative function, sirtuin
deacylation). Species-neutral reference identity: whether the process was shown, where and in which species lives on
mechanism Assertions with basisKind and MechanismEvidenceContext, never on this node (round 0003 C3-04). It is NOT a
measured result, NOT a pathway record (Pathway), NOT a biomarker (a proxy marker of a process is a Biomarker linked by
curated REFLECTS_MECHANISM). Shortcut edges APPLIES_TO_SPECIES, INFLUENCES_OUTCOME, ACTS_IN and incoming
AFFECTS_MECHANISM are derived projections (mx-proj/v1) and read-only. CQ-MX-01, CQ-MX-03, CQ-MX-05. Module mechanisms.
Archetype Entity.
"""
type Mechanism implements Entity & EntityArchetype & SearchIndexable
  @node(labels: ["Mechanism", "Entity"])
  @fulltext(indexes: [{indexName: "MechanismSearch", fields: ["name", "description", "searchText"], queryName: "searchMechanisms"}]) {
  id: ID! @id
  uid: String!
  name: String
  description: String
  mongoResearchRunId: String
  createdAt: DateTime! @timestamp(operations: [CREATE])
  updatedAt: DateTime! @timestamp(operations: [CREATE, UPDATE])
  privacyClass: PrivacyClass
  maturity: NodeMaturity
  schemaVersion: String
  entityType: String!
  searchText: String
  searchFields: [String!]
  embeddingModel: String
  embeddingDimensions: Int
  searchEmbedding: [Float!]
  "Live name kept (catalog property mechanismKind maps here; no alias introduced). Classification label, display; not truth."
  mechanismClass: String
  regulatoryMode: String
  biologicalLayer: String
  "Display only; not queryable truth."
  keyEntitiesSummary: String
  """class: structural (curated reference); cardinality: many; catalog: INVOLVES_PATHWAY"""
