# COMMUNITIES, EVENTS AND NARRATIVE ARCS (W18)
# Communities, conferences, dated events and curated narrative arcs. Timeline or interpretation is never causal evidence.
# Competency questions: CQ-EC-01, CQ-ST-09, CQ-TM-03, CQ-EN-C01.. (candidates)
# Canonical module(s): events_and_narrative (future)
