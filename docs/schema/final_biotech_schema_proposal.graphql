  """class: derived (rule MEDIA-EV-1, regenerable, never the only history); cardinality: many; catalog: EVIDENCES. Written only by the derivation job from Assertion-SUPPORTED_BY->SourceLocator{IMAGE_REGION}-LOCATES_REGION->MediaAnnotation<-HAS_ANNOTATION-ORIGINAL MediaVariant"""
  evidences: [MediaVisualizableRelationshipTarget!]! @relationship(type: "EVIDENCES", direction: OUT, properties: "DerivedEdgeProperties") @settable(onCreate: false, onUpdate: false)
