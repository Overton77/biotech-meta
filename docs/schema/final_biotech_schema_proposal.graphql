# ================================================================================================
# EVIDENCE ASSESSMENT, APPLICABILITY AND SYNTHESIS (W10)
# EvidenceApplicability and its dimensions, use-context profiles, endpoint classification, result interpretation, synthesis and strength assessments. Evidence reaches commercial products only through applicability; confidence and truth differ.
# Competency questions: CQ-EV-02..06, CQ-ST-03/05/09/10, CQ-AX-05/20/24, CQ-RC-03; QS-3
# Canonical module(s): studies_and_evidence
# ================================================================================================

# ---- fragment W10 ----
"""
Per-dimension applicability verdict (catalog conventions.applicabilityVerdict; round 0002 R4). UNKNOWN = assessed and the
deciding facts are missing (missingFacts non-empty, V-209); NOT_ASSESSED = nobody assessed it (explicit node, INV-202);
NOT_APPLICABLE = the dimension does not apply to this evidence/use pair; NOT_SCORED = explanation-only dimension that never
enters a composite (INV-204). These are never merged with each other or with null.
"""
enum ApplicabilityVerdict {
  MATCH
  PARTIAL
  MISMATCH
  UNKNOWN
  NOT_ASSESSED
  NOT_APPLICABLE
  NOT_SCORED
}

"""
Applicability dimensions (catalog conventions.applicabilityDimension). Required set for a StudyIntervention evidence
target: MATERIAL_IDENTITY, ACTIVE_COMPOSITION, DOSE, DOSAGE_FORM, ROUTE, SCHEDULE, DURATION, POPULATION, COMPARATOR,
OUTCOME_RELEVANCE, STUDY_DESIGN_AND_QUALITY (V-204). For a mechanism Assertion target: MATERIAL_IDENTITY, EXPOSURE, ROUTE,
DURATION, POPULATION, OUTCOME_RELEVANCE, STUDY_DESIGN_AND_QUALITY (V-204, INV-212). BACKGROUND_CONTEXT and
RECENCY_AND_CORRECTIONS are explanation-only and optional.
"""
enum ApplicabilityDimensionKind {
  MATERIAL_IDENTITY
  ACTIVE_COMPOSITION
  DOSE
  DOSAGE_FORM
  ROUTE
  SCHEDULE
  DURATION
  POPULATION
  COMPARATOR
  OUTCOME_RELEVANCE
  STUDY_DESIGN_AND_QUALITY
  EXPOSURE
  BACKGROUND_CONTEXT
  RECENCY_AND_CORRECTIONS
}

"""
Class of a dimension, fixed per dimension by the method (OPEN-QUESTIONS P1 evidence applicability 1, CLOSED): CATEGORICAL
(MATERIAL_IDENTITY ordered, ACTIVE_COMPOSITION, DOSAGE_FORM, ROUTE, POPULATION, COMPARATOR, OUTCOME_RELEVANCE,
STUDY_DESIGN_AND_QUALITY); CONTINUOUS with a basis-matched ratio (DOSE, SCHEDULE, DURATION, EXPOSURE); EXPLANATION_ONLY
(BACKGROUND_CONTEXT, RECENCY_AND_CORRECTIONS). W10-V02 checks the mapping.
"""
enum DimensionClass {
  CATEGORICAL
  CONTINUOUS
  EXPLANATION_ONLY
}

"""
Ordered identity path between the evidence material and the use target (catalog conventions.materialIdentityLevel),
strongest first. Mapping to verdict (method applicability-v0.1, V-208b): SAME_LOT, SAME_FORMULATION_VERSION -> MATCH;
SAME_VARIANT_FORMULATION_UNRESOLVED, SAME_BRANDED_MATERIAL_SAME_SPEC, SAME_BRANDED_MATERIAL_SPEC_UNRESOLVED,
SAME_SUBSTANCE_SAME_FORM_DIFFERENT_MATERIAL -> PARTIAL; SAME_SUBSTANCE_MATERIAL_UNRESOLVED -> UNKNOWN;
SAME_SUBSTANCE_DIFFERENT_FORM, RELATED_SUBSTANCE, DIFFERENT -> MISMATCH (PARTIAL only with linked bridging PK evidence).
A shared name never establishes a level (INV-008, V-208).
"""
enum MaterialIdentityLevel {
  SAME_LOT
  SAME_FORMULATION_VERSION
  SAME_VARIANT_FORMULATION_UNRESOLVED
  SAME_BRANDED_MATERIAL_SAME_SPEC
  SAME_BRANDED_MATERIAL_SPEC_UNRESOLVED
  SAME_SUBSTANCE_SAME_FORM_DIFFERENT_MATERIAL
  SAME_SUBSTANCE_MATERIAL_UNRESOLVED
  SAME_SUBSTANCE_DIFFERENT_FORM
  RELATED_SUBSTANCE
  DIFFERENT
}

"""
Role of an outcome in an inference (catalog conventions.endpointClass; FDA-NIH BEST glossary terms). It is an assessment
in a context of use, never a property of the measured Biomarker (INV-205). "Patient-important" is derived: CLINICAL_OUTCOME,
or INTERMEDIATE_CLINICAL_ENDPOINT measuring how a person feels, functions or survives.
"""
enum EndpointClass {
  BIOMARKER_NOT_SURROGATE
  SURROGATE_ENDPOINT
  INTERMEDIATE_CLINICAL_ENDPOINT
  CLINICAL_OUTCOME
}

"""
BEST glossary biomarker categories (catalog conventions.biomarkerCategory). Confirmed against FDA "About Biomarkers and
Qualification" (2026-10-04): "susceptibility/risk, diagnostic, monitoring, prognostic, predictive,
pharmacodynamic/response, and safety". The category is assigned per use in a study, not per analyte (LDL-C is SAFETY in
the NRPT trial and the measured surrogate in FDA's lipid-lowering context).
"""
enum BiomarkerCategory {
  SUSCEPTIBILITY_RISK
  DIAGNOSTIC
  MONITORING
  PROGNOSTIC
  PREDICTIVE
  PHARMACODYNAMIC_RESPONSE
  SAFETY
}

"""
Surrogate validation level within the classification's context of use (catalog conventions.surrogateValidationLevel).
VALIDATED, REASONABLY_LIKELY and CANDIDATE are the three BEST glossary categories (NCBI Bookshelf BEST "Reasonably Likely
Surrogate Endpoint" entry, search extract 2026-10-04); FD&C Act 507(e)(9) ties "known to predict" to traditional and
"reasonably likely" to accelerated approval (FDA surrogate endpoint table page, 2026-04-29 revision). NOT_ESTABLISHED is
a BellLabs value: no context of use in the evidence packet establishes the endpoint as a surrogate at any level.
"""
enum SurrogateValidationLevel {
  VALIDATED
  REASONABLY_LIKELY
  CANDIDATE
  NOT_ESTABLISHED
}

"""
CANDIDATE (property-card vocabulary EndpointClassification.contextMatch; registry request W10-SR-03). How the classified
outcome's context (disease or use, population, intervention mechanism) matches the nearest context of use it is
COMPARED_WITH_CONTEXT. Only FULL permits copying a surrogate validation level (W10-V08; forbidden implication
[SURROGATE_IN_CONTEXT, SURROGATE_IN_OTHER_CONTEXT]).
"""
enum ContextOfUseMatch {
  FULL
  PARTIAL
  NONE
}

"""
BellLabs reading of one result (catalog conventions.resultInterpretation). NOT_SIGNIFICANT is never read as no effect:
it is INCONCLUSIVE unless a stated margin (equivalence or non-inferiority bound, or an MCID with its source) supports
EVIDENCE_OF_NO_MEANINGFUL_EFFECT (W10-V09).
"""
enum ResultInterpretationKind {
  EFFECT_DETECTED
  INCONCLUSIVE
  EVIDENCE_OF_NO_MEANINGFUL_EFFECT
}

"""
CANDIDATE (property card ResultInterpretation.meaningfulnessVerdict; values MEANINGFUL, NOT_MEANINGFUL, UNDETERMINED).
BellLabs' verdict against a stated threshold with a source (USES_THRESHOLD_SOURCE). No threshold -> UNDETERMINED. An
author's "clinically meaningful" is an Assertion (RESULT_CLINICALLY_MEANINGFUL), never this value (CQ-ST-10).
"""
enum MeaningfulnessVerdict {
  MEANINGFUL
  NOT_MEANINGFUL
  UNDETERMINED
}

"""
Role of a result or assertion inside one synthesis version (catalog conventions.synthesisInputRole). INV-206: after a
NOT_SIGNIFICANT primary prespecified result, the same study's secondary, subgroup, within-arm or post hoc results enter
only as SUPPORTIVE or HYPOTHESIS_GENERATING (V-215, W10-V11); within-arm changes are never CONFIRMATORY or
INDEPENDENT_REPLICATION (V-216); two INDEPENDENT_REPLICATION inputs never share a study or dataset (V-218).
"""
enum SynthesisInputRole {
  CONFIRMATORY
  SUPPORTIVE
  HYPOTHESIS_GENERATING
  CONTRADICTING
  SAFETY
  INDEPENDENT_REPLICATION
}

"""
What one triggering finding did to a synthesis verdict (catalog conventions.evidenceChangeEffect). WEAKENED may leave the
verdict label unchanged (round 0002 F, CQ-ST-09); REVERSED means the verdict moved to the opposite side.
"""
enum EvidenceChangeEffect {
  STRENGTHENED
  WEAKENED
  REVERSED
  NO_CHANGE
}

"""
LEGACY HINT enum (live `enum EvidenceStrength`, live lines on Claim, SafetySignal, AssociationMetadata, SafetyMetadata,
TreatmentTargetMetadata). A value without scheme, criteria and method is not interpretable (INV-209): it is kept only as an
extraction-time hint on other owners' fields (W06 legacyEvidenceStrengthHint, W21 ClaimEvidenceAssessment) and migrated
into EvidenceStrengthAssessment {scheme: LEGACY_UNSPECIFIED, methodVersion: legacy-unspecified, status: PROPOSED}.
New writes never use it as an assessment.
"""
enum EvidenceStrength {
  LOW
  MODERATE
  HIGH
}

# ---------------------------------------------------------------------------------------------------------------------
# 2. Unions (W10 sole writer; contract B6 <Role>Target naming; parent-only rule: no member's labels are a superset of
#    another member's labels, so BrandedIngredientMaterial is covered by IngredientMaterial and ClaimOccurrence /
#    RelationshipAssertion by Assertion).
# ---------------------------------------------------------------------------------------------------------------------

"""
Range of ASSESSES_APPLICABILITY_TO (catalog 0.2.0, round 0008 range change). Exactly one per EvidenceApplicability.
UserContext is NOT a member and never will be: a shared assessment never points at a private record (INV-506, V-524);
person-specific applicability is a PersonalApplicabilityAssessment in the private store referencing this assessment's uid.
"""
union ApplicabilityUseTarget = Product | ProductVariant | FormulationVersion | ProductLot | IngredientMaterial | UseContextProfile | ProtocolStep | ProtocolEdition

"""
Range of HAS_EVIDENCE_TARGET (catalog: StudyIntervention|Assertion). Exactly one per EvidenceApplicability. An Assertion
target must be a mechanism-class Assertion (predicateClass MECHANISM), which makes the EXPOSURE dimension required (INV-212).
"""
union EvidenceTargetTarget = StudyIntervention | Assertion

"""
Range of INCLUDES_RESULT (catalog: StudyResult|Assertion). StudyResult covers AdverseEventResult (parent-only rule).
An Assertion input is used for findings that are not a StudyResult (a pooled estimate stated in a review, a mechanism
measurement).
"""
union SynthesisInputTarget = StudyResult | Assertion

# ---------------------------------------------------------------------------------------------------------------------
# 3. Relationship-property types (W10 sole writer)
# ---------------------------------------------------------------------------------------------------------------------

"""
INCLUDES_RESULT qualifier (catalog qualifiers [inputRole]; property card INCLUDES_RESULT.inputRole). Immutable per
synthesis version: a different role is a new synthesis version, never an edit. Replaces proposed-delta
SynthesisInputMetadata (inputRole was a String there).
"""
type SynthesisInputProperties @relationshipProperties {
  "Role of the input in this synthesis version (V-215, V-216, V-218, W10-V11)."
  inputRole: SynthesisInputRole!
}

"""
TRIGGERED_BY qualifiers (catalog requiredQualifiers [criterionCode, effectOnVerdict]; property card TRIGGERED_BY.*).
`criterionCode` is a code from the synthesis method's criteria list (synthesis-v0.1 list in 04-model-cards.md, e.g.
NEW_RANDOMIZED_PRIMARY_RESULT, HUMAN_DIRECT_MEASUREMENT_NULL, CORRECTION_OR_RETRACTION, REGISTRY_RESULTS_POSTED,
OUTCOME_PRIORITY_DISCREPANCY, SYSTEMATIC_REVIEW_UPDATE). `evidencePublishedAt` is the trigger's publication date (domain
clock, null = unknown); the synthesis version's recordedAt is when BellLabs learned it (system clock). CQ-ST-09 filters on
either and the two answers differ when evidence arrives late. Replaces proposed-delta EvidenceChangeMetadata.
"""
type EvidenceChangeProperties @relationshipProperties {
  "Criterion code from the method's criteria list (V-219b)."
  criterionCode: String!
  "Effect of this trigger on the verdict (V-219b)."
  effectOnVerdict: EvidenceChangeEffect!
  "Publication date of the triggering evidence; null = unknown (never the recorded date)."
  evidencePublishedAt: Date
}

# ---------------------------------------------------------------------------------------------------------------------
# 4. Node types (W10 sole writer)
# ---------------------------------------------------------------------------------------------------------------------

"""
BellLabs' method-versioned judgement of whether ONE evidence target (a StudyIntervention, or a mechanism Assertion)
transfers to ONE use target (Product, ProductVariant, FormulationVersion, ProductLot, IngredientMaterial or a non-personal
UseContextProfile), decomposed into one ApplicabilityDimension node per required dimension with NOT_ASSESSED explicit
(INV-202, V-203..V-205). It is the ONLY path from study evidence to a commercial identity (INV-201, V-201): no Study,
StudyArm, StudyIntervention, StudyResult or Publication links to a product. It is NOT a truth verdict on the study, NOT
formulation continuity, NOT evidence strength, and never targets a private UserContext (V-524). The flat per-dimension
fields are a derived read-only projection of the dimension nodes for filtering; a composite `overallScore` is allowed only
with a calibrated composite method and every required dimension present and assessed (INV-204, V-207b, W10-V05); while
calibration is DEFERRED it stays null. Immutable; a re-assessment is a new node SUPERSEDES {RE_REVIEW} the old one.
CQs: CQ-EV-04, CQ-EV-06, CQ-RC-03, CQ-AX-20, CQ-MX-04. Module studies_and_evidence. Archetype EvidenceAssessment.
uid token `applicability`.
"""
type EvidenceApplicability implements Entity & EvidenceAssessmentArchetype
  @node(labels: ["EvidenceApplicability", "EvidenceAssessment"])
  @mutation(operations: [CREATE, UPDATE]) {
  id: ID! @id
  uid: String! @settable(onCreate: true, onUpdate: false)
  name: String
  description: String
  mongoResearchRunId: String
  createdAt: DateTime! @timestamp(operations: [CREATE]) @settable(onCreate: false, onUpdate: false)
  updatedAt: DateTime! @timestamp(operations: [CREATE, UPDATE])
  privacyClass: PrivacyClass
  maturity: NodeMaturity
  schemaVersion: String
  "Always 'EvidenceApplicability'."
  assessmentType: String! @settable(onCreate: true, onUpdate: false)
  "Applicability method version (applicability-v0.1 inherited; applicability-v0.2-candidate adds W02-SR-09 identity inputs and use-profile normalization). Required (V-207b)."
  methodVersion: String! @settable(onCreate: true, onUpdate: false)
  "Workflow state of this record; never the verdict."
  status: AssessmentStatus!
  "Service-assigned commit time (KCR-2a); never backdated, never earlier than the cited snapshots' retrievedAt (INV-502)."
  recordedAt: DateTime! @timestamp(operations: [CREATE]) @settable(onCreate: false, onUpdate: false)
  "Written once from null when superseded; equals the superseding node's recordedAt."
  recordedTo: DateTime @settable(onCreate: false, onUpdate: true)
  "Human-readable summary naming the weakest dimension; never a verdict field."
  summary: String @settable(onCreate: true, onUpdate: false)
  "Composite score. Null while composite calibration is DEFERRED; when present requires a calibrated method and all required dimensions assessed (INV-204, V-207b, W10-V05)."
  overallScore: Float @settable(onCreate: true, onUpdate: false)
  "DEPRECATED generic confidence (INV-407); never written."
  confidence: Float @settable(onCreate: false, onUpdate: false)
  "DERIVED read-only projection of the MATERIAL_IDENTITY dimension verdict (catalog derivedProperties)."
  identityMatch: ApplicabilityVerdict @settable(onCreate: false, onUpdate: false)
  "DERIVED read-only projection of the DOSE dimension verdict."
  doseMatch: ApplicabilityVerdict @settable(onCreate: false, onUpdate: false)
  "DERIVED read-only projection of the ROUTE dimension verdict."
  routeMatch: ApplicabilityVerdict @settable(onCreate: false, onUpdate: false)
  "DERIVED read-only projection of the SCHEDULE dimension verdict."
  scheduleMatch: ApplicabilityVerdict @settable(onCreate: false, onUpdate: false)
  "DERIVED read-only projection of the DURATION dimension verdict."
  durationMatch: ApplicabilityVerdict @settable(onCreate: false, onUpdate: false)
  "DERIVED read-only projection of the POPULATION dimension verdict."
  populationMatch: ApplicabilityVerdict @settable(onCreate: false, onUpdate: false)
  "DERIVED read-only projection of the OUTCOME_RELEVANCE dimension verdict."
  outcomeMatch: ApplicabilityVerdict @settable(onCreate: false, onUpdate: false)

  """class: structural; cardinality: exactly_one; catalog: HAS_EVIDENCE_TARGET (V-203)"""
  evidenceTarget: [EvidenceTargetTarget!]! @relationship(type: "HAS_EVIDENCE_TARGET", direction: OUT) @settable(onCreate: true, onUpdate: false)
  """class: structural; cardinality: exactly_one; catalog: ASSESSES_APPLICABILITY_TO (V-203; never UserContext, V-524)"""
  useTarget: [ApplicabilityUseTarget!]! @relationship(type: "ASSESSES_APPLICABILITY_TO", direction: OUT) @settable(onCreate: true, onUpdate: false)
  """class: structural; cardinality: zero_or_one; catalog: FOR_USE_CONTEXT (the non-personal use profile assumed, separate from the use target)"""
  forUseContext: [UseContextProfile!]! @relationship(type: "FOR_USE_CONTEXT", direction: OUT) @settable(onCreate: true, onUpdate: false)
  """class: structural; cardinality: many; catalog: BASED_ON_EVIDENCE (Study range)"""
  basedOnStudies: [Study!]! @relationship(type: "BASED_ON_EVIDENCE", direction: OUT) @settable(onCreate: true, onUpdate: false)
  """class: structural; cardinality: many; catalog: BASED_ON_EVIDENCE (StudyResult range; human exposure results for INV-212 / V-237)"""
  basedOnResults: [StudyResult!]! @relationship(type: "BASED_ON_EVIDENCE", direction: OUT) @settable(onCreate: true, onUpdate: false)
