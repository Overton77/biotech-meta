  agencyCode: String
  "Home jurisdiction code (W13-SR-01 convention), e.g. US, EU, GB. Records it issues carry their own jurisdiction."
  jurisdiction: String
  """class: structural; cardinality: many; catalog: OVERSEES (live RegulatoryAgency.overseesPathways; RoleMetadata
  replaced by StructuralEdgeProperties because the live role fields carry no meaning on this edge)"""
  overseesPathways: [RegulatoryPathway!]! @relationship(type: "OVERSEES", direction: OUT, properties: "StructuralEdgeProperties")
}

"""
A regulatory program of one jurisdiction (FDA NDI notification, FDA GRAS notification, FDA 510(k), EU novel food
authorisation once W13-SR-03 is ruled). Stable identity across legal-basis changes; the legal basis in force over time
is carried by RegulatoryPathwayVersion states attached through HAS_PATHWAY_VERSION episodes (decision W13-D02, closes
OPEN-QUESTIONS Priority 1 diagnostics item 4 / OQ-L3-07). It is NOT an event and NOT a status. `legalBasisCitation`,
`effectiveFrom` and `effectiveTo` on this type are read-only current projections of the version episodes, kept for
the catalog and live field names. CQ-MF-02, CQ-MF-C02, CQ-TM-03. Module regulatory_and_ip. Archetype Entity.
"""
type RegulatoryPathway implements Entity & EntityArchetype
  @node(labels: ["RegulatoryPathway", "Entity"]) {
