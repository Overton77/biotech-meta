  generatedBy: [Activity!]! @relationship(type: "WAS_GENERATED_BY", direction: OUT)
  """class: structural; catalog: ASSESSED_BY (→ Agent)."""
  assessedByAgent: [Agent!]! @relationship(type: "ASSESSED_BY", direction: OUT)
  """class: structural; catalog: ASSESSED_BY (→ Person)."""
