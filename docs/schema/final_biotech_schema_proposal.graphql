string PROPOSED | ACCEPTED | REJECTED | UNRESOLVED; enum requested in W00-SR-04), distinct from `status`, the
workflow state of the assessment record. `score` is the method's own score, never a resolutionConfidence
across methods. Archetype: EvidenceAssessment. Module: provenance / identity_resolution.
