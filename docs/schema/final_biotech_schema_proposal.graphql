"""READ-ONLY LEGACY range of the live union `StudyIntervention` (D-003, CL-006). Reachable only through
Study.evaluates (@settable false). Members are the final-schema successors of the live members: Compound ->
ChemicalSubstance (D-002), CompoundForm -> ChemicalForm and IngredientMaterial (W02-SR-20), FoodItem -> IngredientMaterial
(W05 FoodItem carries the IngredientMaterial label), FoodProduct -> Product (retired by W05), Lifestyle (W05),
Treatment/Procedure (W06), Device (W08), Protocol (W16). Specializations that carry a member's label (MaterialMixture,
FoodItem, MicrobialPreparation -> IngredientMaterial) are NOT listed beside their parent: under @neo4j/graphql 7.6.3 a union
listing both returns the node twice (W05-SR-09; merge check OVERLAP). Never written; INV-201 makes every legacy EVALUATES
edge to a Product a V-201 backlog row."""
union LegacyEvaluatedIntervention = Product | ChemicalSubstance | ChemicalForm | IngredientMaterial | Protocol | Treatment | Device | Procedure | Lifestyle

"""CANDIDATE (CQ-ST-C02). Reusable definition a study intervention instantiates when what was administered is a procedure,
a treatment regimen, a public protocol edition, a named protocol whose edition content is unknown (W05-SR-06: DICA-NUTS
'Brazilian cardioprotective diet prescription'), or a lifestyle practice, rather than (or in addition to) a material or device.
Members owned by W06 (Procedure, Treatment), W16 (ProtocolEdition, Protocol), W05 (Lifestyle). Supported by W06-SR-03."""
union InterventionDefinitionTarget = Procedure | Treatment | ProtocolEdition | Protocol | Lifestyle

