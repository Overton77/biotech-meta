  WEDNESDAY
  THURSDAY
  FRIDAY
  SATURDAY
  SUNDAY
}

"""Action kind of a protocol step (live enum, kept). AVOID is a step ("do not eat after 5 pm"), not the absence of a step."""
enum ProtocolStepType {
  ADMINISTER
  INGEST
  INJECT
  INFUSE
  APPLY
  MEASURE
