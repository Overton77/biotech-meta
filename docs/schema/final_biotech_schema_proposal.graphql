# 2. Shared relationship-property types (contract B4)
# -----------------------------------------------------------------------------------------------------

"""
asserted_edge profile (catalog temporalProfiles.asserted_edge; K-1, D-011). An asserted edge is a
regenerable projection of exactly one Assertion: one relationship per recorded-time episode. `assertionUid`
names that Assertion; its predicate equals the edge type and its subject/object equal the edge endpoints.
Valid bounds, precisions and bases equal the Assertion's (V-505); `recordedFrom >= assertion.recordedAt`
and is service-assigned; `recordedTo` is written once and equals the Assertion's `recordedTo` once closed.
All other properties are immutable. Never carries `projectionOfAssertionUid` (that is DerivedEdgeProperties).
A domain specialization (e.g. RoleEdgeProperties) must contain every field below and say so.
"""
type AssertedEdgeProperties @relationshipProperties {
  "Stable audit id hu:rel:<opaque>; MERGE key for parallel episodes."
  relationshipUid: String!
  "uid of the one Assertion that authorizes this edge."
  assertionUid: String!
  "Copied from the Assertion; null = unknown."
  validFrom: DateTime
  "Copied from the Assertion; null = unknown, never 'ongoing'."
  validTo: DateTime
  "Copied from the Assertion."
  validFromPrecision: TimePrecision
  "Copied from the Assertion."
  validToPrecision: TimePrecision
  "Copied from the Assertion; UNKNOWN when the bound is null and no basis is stated."
  validFromBasis: ValidTimeBasis!
  "Copied from the Assertion; UNKNOWN when the bound is null and no basis is stated."
  validToBasis: ValidTimeBasis!
  "Service-assigned commit time of this episode; never client-supplied."
  recordedFrom: DateTime!
  "Written once from null when the episode is closed."
  recordedTo: DateTime
  "Operational last-writer run id (internal)."
  mongoResearchRunId: String
}

"""
bitemporal_attachment profile (catalog temporalProfiles.bitemporal_attachment, round 0007) for state
attachments: HAS_STATE and domain attachments such as HAS_FORMULATION_VERSION, HAS_REGISTRATION_VERSION,
HAS_PROTOCOL_EDITION, HAS_PACKAGE_CONFIGURATION. One relationship per recorded-time episode; immutable
except one write of `recordedTo`. `assertionUid` is nullable in SDL only because the profile is shared with
the external private store; in the shared graph every attachment is source-derived and V-101 requires it.
EXCLUSIVE types (catalog predicateExclusivity) may not definitely overlap in valid and recorded time.
"""
type StateEpisodeProperties @relationshipProperties {
  "Stable audit id hu:rel:<opaque>."
  relationshipUid: String!
  "Authorizing Assertion uid (required in the shared graph)."
  assertionUid: String
  "Valid start; null = unknown."
  validFrom: DateTime
  "Valid end (exclusive); null = unknown."
  validTo: DateTime
  "Required when validFrom is non-null."
  validFromPrecision: TimePrecision
  "Required when validTo is non-null."
  validToPrecision: TimePrecision
  "Basis of validFrom."
  validFromBasis: ValidTimeBasis!
  "Basis of validTo."
  validToBasis: ValidTimeBasis!
  "Service-assigned commit time; never backdated."
  recordedFrom: DateTime!
  "Written once from null."
  recordedTo: DateTime
  "Operational last-writer run id (internal)."
  mongoResearchRunId: String
}

"""
Derived edge (catalog relationshipClasses.derived; K-2, D-011): a regenerable traversal shortcut that is
never the only history. Exactly one citation form: `projectionOfAssertionUid` (1:1 projection; the cited
predicate equals the edge type), or `derivationRule` plus `derivedFromAssertionUids`, or `derivationRule`
plus `derivedFromAssessmentUids` (an EvidenceAssessment licenses it; a ResolutionHypothesis uid goes here,
which is how INSTANCE_OF records its `hypothesisUid`), or `derivationRule` alone only for catalog
`ruleOnly: true` types. The cited or input predicate is never the premise of a forbidden implication for
the edge type (V-112). Never carries `assertionUid`.
"""
type DerivedEdgeProperties @relationshipProperties {
  "uid of the single Assertion this edge projects (1:1 projection)."
  projectionOfAssertionUid: String
  "Identifier and version of the derivation rule (e.g. contains/v1)."
  derivationRule: String
  "Assertions the rule consumed (non-empty when derivationRule is set, unless ruleOnly or assessment-licensed)."
  derivedFromAssertionUids: [String!]
  "EvidenceAssessments (incl. ResolutionHypothesis) that license the derivation."
  derivedFromAssessmentUids: [String!]
  "When the projection job wrote this edge (operational)."
  derivedAt: DateTime
  "Operational last-writer run id (internal)."
  mongoResearchRunId: String
}

"""
Structural edge with optional ordering: part of the internal shape of one captured record (catalog
relationshipClasses.structural). Needs no Assertion. `orderIndex` orders siblings when the source orders them.
"""
type StructuralEdgeProperties @relationshipProperties {
  "Zero-based order among siblings, when the source orders them."
  orderIndex: Int
  "Operational note; never evidence."
  notes: String
  "Operational last-writer run id (internal)."
  mongoResearchRunId: String
}

"""
SUPERSEDES qualifiers (K-4, round 0007). Newer → older, like label to like label (Assertion, Adjudication,
or one EvidenceAssessment type). `recordedAt` equals the newer record's recordedAt and the older record's
recordedTo. SOURCE_CORRECTION = the source changed content (the corrected state has no current attachment
for the corrected interval); VALIDITY_BOUNDED = same content, an end became known (old state stays
attached for its bounded interval). `sourceRevisionEventUid` names the SourceRevisionEvent when one exists.
"""
type SupersessionProperties @relationshipProperties {
  "Why the newer record replaced the older one."
  supersessionKind: SupersessionKind!
  "Commit time of the supersession (service-assigned)."
  recordedAt: DateTime!
  "uid of the SourceRevisionEvent that triggered it, if any."
  sourceRevisionEventUid: String
}

"""
AUTHORIZED_BY qualifier (provenance state 5): which downstream use a PolicyVersion allowed for one Activity.
PROV-O has no permission vocabulary; the semantics are BellLabs-defined. Internal.
"""
type AuthorizationProperties @relationshipProperties {
  "The use the policy allowed."
  useKind: UseKind!
}

"""
REANCHORS qualifier: newer-snapshot locator → older-snapshot locator of the same Source (V-409). Re-anchoring
never mutates the old locator; failure to re-anchor creates no edge and never means the passage was removed.
"""
type ReanchorProperties @relationshipProperties {
  "EXACT or FUZZY match of the quote anchor."
  anchorMatch: AnchorMatch!
  "uid of the REANCHORING Activity that produced the match."
  activityUid: String
}

"""
HAS_IDENTIFIER episode (asserted; asserted_edge profile plus `isPrimary`). The validity of the ASSIGNMENT of
an identifier to a record lives here; the Identifier node holds only the identifier string's own scheme,
issuer, value and scheme-level validity. A shared (scheme, value) across issuers never establishes identity.
Specializes AssertedEdgeProperties (contains every field of it).
"""
type IdentifierLinkProperties @relationshipProperties {
  "Stable audit id hu:rel:<opaque>."
  relationshipUid: String!
  "Authorizing Assertion (predicate HAS_IDENTIFIER)."
  assertionUid: String!
  "Start of the assignment; null = unknown."
  validFrom: DateTime
  "End of the assignment (exclusive); null = unknown."
  validTo: DateTime
  "Required when validFrom is non-null."
  validFromPrecision: TimePrecision
  "Required when validTo is non-null."
  validToPrecision: TimePrecision
  "Basis of validFrom."
  validFromBasis: ValidTimeBasis!
  "Basis of validTo."
  validToBasis: ValidTimeBasis!
  "Service-assigned commit time."
  recordedFrom: DateTime!
  "Written once from null."
  recordedTo: DateTime
  "Whether the source presents it as the record's primary identifier in its scheme."
  isPrimary: Boolean
  "Operational last-writer run id (internal)."
  mongoResearchRunId: String
}

