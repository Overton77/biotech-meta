  heldByOrganizations: [Organization!]! @relationship(type: "HAS_CAPABILITY_STATE", direction: IN, properties: "AssertedEdgeProperties")
  """class: asserted (asserted_edge); cardinality: zero_or_one holder per state; catalog: HAS_CAPABILITY_STATE (inverse view; Facility -> state)"""
  heldByFacilities: [Facility!]! @relationship(type: "HAS_CAPABILITY_STATE", direction: IN, properties: "AssertedEdgeProperties")
