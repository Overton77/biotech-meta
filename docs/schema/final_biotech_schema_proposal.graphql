  """class: asserted; cardinality: many (one per stated rights offer or terms version; dual licences are two records); catalog: HAS_RIGHTS_RECORD (candidate CQ-MD-C03). Absence of any record means rights NOT CHECKED, never permission"""
  rightsRecords: [MediaRightsRecord!]! @relationship(type: "HAS_RIGHTS_RECORD", direction: OUT, properties: "AssertedEdgeProperties")
  """class: structural; cardinality: many; catalog: ASSESSES_MEDIA (inverse)"""
