# ---- fragment W14 ----
"""
Range of LICENSE_COVERS (catalog: PatentFamily|PatentApplication|GrantedPatent|PatentClaim). A license covers exactly
the members its source names (or the family when the source states family-level coverage); coverage is never inferred
from family membership (V-W14-05) and never implies that a product is licensed, made under the patent or effective.
"""
union PatentLicenseTarget = PatentFamily | PatentApplication | GrantedPatent | PatentClaim

"""
CANDIDATE (W14-SR-02). Range of IP_STATUS_OF: the jurisdictional right or claim whose legal status an IpRightStatus
describes. A patent-level status never implies a claim-level status and vice versa (V-W14-07).
"""
union IpRightStatusSubjectTarget = PatentApplication | GrantedPatent | PatentClaim | Trademark

