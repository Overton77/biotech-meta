  hostsChannels: [Channel!]! @relationship(type: "HOSTS_CHANNEL", direction: OUT, properties: "StructuralEdgeProperties")
  """class: structural; cardinality: many; catalog: ON_PLATFORM (kept only for PseudonymousActor -> Platform: the handle exists on this platform; Episode -> Platform is retired)"""
  pseudonymousAccounts: [PseudonymousActor!]! @relationship(type: "ON_PLATFORM", direction: IN, properties: "StructuralEdgeProperties")
}

"""
A publisher-operated distribution account on exactly one Platform (a YouTube channel, a podcast RSS feed, a
