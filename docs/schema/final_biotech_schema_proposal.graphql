# Capability state (module manufacturing_readiness)
# ---------------------------------------------------------------------------------------------------------------------

"""
One immutable state of a manufacturing capability of an Organization or a Facility (catalog manufacturing_readiness):
stage, stated capacity with UCUM unit and basis, and for PLANNED states the stated target date. Attached to its holder
by HAS_CAPABILITY_STATE asserted episodes (asserted_edge; EXCLUSIVE per holder, process and material, W11-SR-04); a
stage change is a NEW state node plus a new episode, never an update (NAI Carlsbad: PLANNED from the 2021-08-24
acquisition release, OPERATING from April 2023, SUSPENDED October 2023, OPERATING again from May 2024, per the FY2024
and FY2025 10-Ks). A promoted capability that BellLabs does not rely on stays an unattached state that is only the object
of its Assertion (round 0005; V-324). It is NOT a facility, NOT a process, NOT a certification, NOT a regulatory status
and NOT a quality claim. capacityVerbatim keeps the source wording when no number is given ("persistent excess
capacity", capacityBasis NOT_REPORTED). targetOperationalDate is forward-looking payload of a PLANNED state only
(V-W11-03); it has no valid time and never becomes the validFrom of an OPERATING episode.
CQ-MF-04, CQ-MF-05, CQ-MF-C01. Module manufacturing_readiness. Archetype VersionedState.
"""
type ManufacturingCapability implements Entity & VersionedStateArchetype
  @node(labels: ["ManufacturingCapability", "VersionedState"]) {
