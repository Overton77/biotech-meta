  certifiedUnder: [CertificationListing!]! @relationship(type: "CERTIFIED_UNDER", direction: OUT, properties: "DerivedEdgeProperties") @settable(onCreate: false, onUpdate: false)
  # ---- fields injected at merge (seam closure; see reports/04-seam-closure-ledger.md) ----
  """class: asserted (inverse view); cardinality: many; catalog: UNIT_FROM_LOT (registry: W15); request: W15-SR-03; injected at merge (reports/04-seam-closure-ledger.md). A printed code is not lot identity."""
  units: [IndividualUnit!]! @relationship(type: "UNIT_FROM_LOT", direction: IN, properties: "AssertedEdgeProperties")
  """class: structural (inverse view); cardinality: many; catalog: MATCHES_COMMERCE_ITEM (registry: W15); request: W15-SR-03; injected at merge (reports/04-seam-closure-ledger.md). RECALL_SCOPE candidates (V-W15-07); no recall property on ProductLot."""
