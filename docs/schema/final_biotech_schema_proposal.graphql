  matchKind: String! @settable(onCreate: true, onUpdate: false)
  "Outcome (controlled): SAME_ITEM, DIFFERENT_ITEM, IN_SCOPE, OUT_OF_SCOPE, NO_AUTHORIZATION_FOUND, AUTHORIZED, NOT_DETERMINABLE, UNRESOLVED."
