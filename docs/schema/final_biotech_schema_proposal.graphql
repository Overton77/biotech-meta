  activityKind: ActivityKind!
  methodVersion: String
  externalRunSystem: String
  externalRunId: String
  # domain fields
  discoveryOutcome: DiscoveryOutcome!
  "What was sought: CURRENT_RECORD (default), RECORD_HISTORY, FULL_TEXT, ITEM_IN_FEED, RENDITION."
  discoveryTarget: String
  "Endpoint or search URL actually tried (never a guessed URL)."
  attemptedUri: String
  queryText: String
  "HTTP status when known; a 200 can still be BLOCKED (error page)."
  responseStatusCode: Int
  "Verbatim evidence for BLOCKED, PARTIAL or ERROR (proxy message, tool warning, page title)."
  blockEvidence: String
  resultCount: Int
  "uid of the subject searched for (Publication, Episode, TrialRegistration ...); a property, not an edge."
  subjectUid: String
  subjectLabel: String
  """class: structural; cardinality: zero_or_one; catalog: FOR_COVERAGE_REQUIREMENT (candidate)"""
  forRequirement: [SourceCoverageRequirement!]! @relationship(type: "FOR_COVERAGE_REQUIREMENT", direction: OUT)
  """class: structural; cardinality: many; catalog: DISCOVERED_SOURCE (candidate)"""
  discoveredSources: [Source!]! @relationship(type: "DISCOVERED_SOURCE", direction: OUT)
}

