# ================================================================================================
# SAFETY AND USE CONSTRAINTS (W17)
# Safety signals, adverse effects, contraindication and interaction assertions, shared use constraints. No events reported is not no events; unknown safety is not safe.
# Competency questions: CQ-ST-06, CQ-RC-06, CQ-PR-03/04
# Canonical module(s): safety_and_constraints (candidate)
# ================================================================================================

# ---- fragment W17 ----
"""
Assessed severity (intensity) of an adverse effect as characterized by one SafetySignal assessment. Live values kept
for compatibility (live lines 720-727). Severity is NOT seriousness: regulatory seriousness of a reported event is
AdverseEventResult.seriousness (W09 AeSeriousness). SERIOUS is a legacy mixed-axis value: readable, never written by
new assessments (V-W17-10). UNKNOWN = assessed and not determinable; null = not assessed. CQ-ST-06, CQ-AX-24.
"""
enum SafetySeverity {
  MILD
  MODERATE
  SEVERE
  SERIOUS
  LIFE_THREATENING
  UNKNOWN
}

"""
Lifecycle state a SafetySignal assessment assigns to a subject-effect signal. A signal is a hypothesis that warrants
evaluation; only CONFIRMED_ASSOCIATION states an association, and even that is not a causal or personal conclusion.
POTENTIAL = identified, evaluation not started; UNDER_EVALUATION = the assessor (or an imported agency) states it is
being evaluated (FDA AEMS "FDA is evaluating the need for regulatory action"); CONFIRMED_ASSOCIATION = evaluation
concluded an association (for an agency import: a labeling change adding the risk); CLOSED_NO_ACTION = evaluated,
no action taken "at the time based on available information" (never "no risk", FI-W17-04); NOT_SUPPORTED = evaluated
against the inputs, association not supported; INSUFFICIENT_DATA = evaluated, inputs cannot decide; NOT_EVALUATED =
migrated live SafetySignal row with no method (methodVersion live-migration/*). CQ-SF-C01, CQ-AX-24.
"""
enum SignalStatus {
  POTENTIAL
  UNDER_EVALUATION
  CONFIRMED_ASSOCIATION
  CLOSED_NO_ACTION
  NOT_SUPPORTED
  INSUFFICIENT_DATA
  NOT_EVALUATED
}

"""
Directive strength a SOURCE states for a use restriction (ContraindicationAssertion.constraintLevel), mapped from its
own wording; levelVerbatim keeps the words. Ordered from strongest. Whether a level BLOCKS or merely lowers a score is
decided by the private ranking policy (PolicyVersion RECOMMENDATION_RANKING, W23), never by this enum; the shared graph
only keeps the level distinct (FI-W17-02: USE_WITH_CAUTION is not CONTRAINDICATED). Grounding: CONTRAINDICATED and
DO_NOT_EXCEED_DOSE (ZOCOR label sections 4, 2.5); AVOID (ZOCOR 7 grapefruit; AFP 2017 St. John's wort);
NOT_RECOMMENDED (ZOCOR 7 niacin in Chinese patients); USE_WITH_CAUTION (ZOCOR 7 niacin "consider if the benefit
... outweighs"); MONITOR (AFP 2017 kava, ginseng); MAINTAIN_CONSISTENT_INTAKE (NIH ODS vitamin K and warfarin);
CONSULT_CLINICIAN (NIH ODS). CQ-RC-06.
"""
enum ConstraintLevel {
  CONTRAINDICATED
  DO_NOT_EXCEED_DOSE
  AVOID
  NOT_RECOMMENDED
  USE_WITH_CAUTION
  MONITOR
  MAINTAIN_CONSISTENT_INTAKE
  CONSULT_CLINICIAN
}

"""
Role of one scope member of a UseConstraint (CONSTRAINT_SCOPE edge). CONDITION_PRESENT = the constrained use is in
people with this Condition (acute liver failure); POPULATION = a non-personal UseContextProfile (pregnant patients,
patients of Chinese descent); CO_EXPOSURE = concurrent use of this substance, material, product, treatment or
lifestyle (verapamil, niacin at >= 1 g/day, grapefruit juice). CQ-RC-06, CQ-SF-C03.
"""
enum ConstraintScopeRole {
  CONDITION_PRESENT
  POPULATION
  CO_EXPOSURE
}

"""
Role of a subject in one SafetySignal (HAS_SAFETY_SIGNAL edge). PRIMARY = the exposure the signal is about (exactly
one); CO_EXPOSURE = a second exposure for an interaction signal (FDA AEMS rows titled "Drug interaction").
CQ-SF-C01.
"""
enum SafetySubjectRole {
  PRIMARY
  CO_EXPOSURE
}

# ---------------------------------------------------------------------------------------------------------------------
# Unions (W17 sole writer). Parent-only rule (W00 D-W00-05): IngredientMaterial covers FoodItem, BotanicalPreparation,
# MaterialMixture, BrandedIngredientMaterial; Product covers live FoodProduct (W05).
# ---------------------------------------------------------------------------------------------------------------------

"""
Things whose use can carry a safety signal or a use constraint (successor of live SafetySubject, line 694). Live
Compound -> ChemicalSubstance (D-002); Ingredient, FoodItem -> IngredientMaterial (W02/W05); FoodProduct -> Product
(W05-SR-12); ProductVariant added because dose and composition differ by variant (W04-SR-10); Exposure added for
environmental exposures (W05-SR-12). CQ-ST-06, CQ-RC-06.
"""
union SafetySubjectTarget = ChemicalSubstance | IngredientMaterial | Product | ProductVariant | Treatment | Procedure | Lifestyle | Exposure

"""
Inputs a SafetySignal assessment is based on: StudyResult (covers AdverseEventResult by label, parent-only rule) for
reported counts and measured safety labs; Study for a study considered whose AE reporting status is recorded on the
edge (NOT_REPORTED never becomes a zero, INV-207); Assertion for a source statement such as an agency's
potential-signal listing. CQ-ST-06, CQ-SF-C01.
"""
union SafetySignalInputTarget = StudyResult | Study | Assertion

"""
Scope members of a UseConstraint (CONSTRAINT_SCOPE): conditions, non-personal populations, and co-exposures. Never a
person, a private record or a private uid (INV-506). CQ-RC-06.
"""
union UseConstraintScopeTarget = Condition | UseContextProfile | ChemicalSubstance | IngredientMaterial | Product | ProductVariant | Treatment | Procedure | Lifestyle | Exposure

