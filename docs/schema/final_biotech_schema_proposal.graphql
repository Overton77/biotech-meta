"""
Agents an Exposure characterization can involve (range of HAS_EXPOSURE_AGENT). Successor of live union ExposureAgent
(FoodItem | FoodProduct | Ingredient | Compound | Lifestyle): FoodItem and Ingredient -> IngredientMaterial (a FoodItem
node carries the IngredientMaterial label and resolves through that member; read food fields with foodItems(uid)),
FoodProduct -> Product / ProductVariant (W04), Compound -> ChemicalSubstance (D-002). FoodItem is deliberately NOT a
member: tested under @neo4j/graphql 7.6.3 on Neo4j 5.26.31 (2026-10-04), a union that lists both a parent label type and
its specialization returns the same node twice (once per matching member), so a union never lists a specialization
beside its parent (W05-SR-09, rule proposed to W00/Fable). Physical agents with no owner type (ultraviolet radiation,
noise, PM2.5 as a mixture) are out of range until a candidate CQ admits them (CQ-FL-C05).
"""
union ExposureAgentTarget = IngredientMaterial | ChemicalSubstance | Nutrient | Product | ProductVariant | Lifestyle

