  matchesItems: [CommerceItemTarget!]! @relationship(type: "MATCHES_COMMERCE_ITEM", direction: OUT)
  """class: structural; cardinality: one_or_more for RECALL_SCOPE and AUTHORIZED_CHANNEL; catalog: SUPPORTED_BY (W00)."""
