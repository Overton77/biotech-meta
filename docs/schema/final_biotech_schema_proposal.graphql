"""What kind of measure an outcome definition is (catalog conventions.measureKind; FDA/NIH BEST clinical outcome
assessment categories). Observed from protocol or registry. Never an endpoint role: surrogate status is a W10
EndpointClassification. CQ-ST-03."""
enum MeasureKind {
  BIOMARKER
  PERFORMANCE_OUTCOME
  PATIENT_REPORTED_OUTCOME
  CLINICIAN_REPORTED_OUTCOME
  OBSERVER_REPORTED_OUTCOME
  CLINICAL_EVENT
}

"""Priority a source declares for an outcome (catalog conventions.outcomePriority). Carried per source by Assertions with
predicate DECLARES_OUTCOME_PRIORITY; OutcomeDefinition.priority is only the derived registered priority. CQ-ST-04."""
enum OutcomePriority {
  PRIMARY
  SECONDARY
  OTHER_PRESPECIFIED
  POST_HOC
  SAFETY
}

"""Role of an analysis in the study plan (catalog conventions.analysisKind). INV-206, V-215. CQ-ST-05."""
enum AnalysisKind {
  PRIMARY_PRESPECIFIED
  SECONDARY_PRESPECIFIED
  SUBGROUP_PRESPECIFIED
  SUBGROUP_POST_HOC
  EXPLORATORY
  SAFETY
}

"""Shape of the comparison behind an estimate (catalog conventions.comparisonKind). Within-arm change is never a
between-arm effect (forbidden implication WITHIN_ARM_CHANGE_SIGNIFICANT -> BETWEEN_ARM_EFFECT; V-216). CQ-ST-05."""
enum ComparisonKind {
  BETWEEN_ARM
  WITHIN_ARM_CHANGE
  ARM_DESCRIPTIVE
}

"""Reported significance outcome of the stated comparison (catalog conventions.statisticalConclusion). NOT_SIGNIFICANT is
never NO_EFFECT; NOT_TESTED (no test was run) differs from NOT_REPORTED (the source does not say). CQ-ST-05."""
enum StatisticalConclusion {
  SIGNIFICANT_FAVORABLE
  SIGNIFICANT_UNFAVORABLE
  NOT_SIGNIFICANT
  NOT_TESTED
  NOT_REPORTED
}

"""How adverse events were collected (catalog conventions.aeCollectionMethod). SYSTEMATIC = actively elicited by a
structured instrument or at scheduled assessment (ClinicalTrials.gov "Systematic Assessment"); SPONTANEOUS = volunteered
by participant or investigator ("Non-systematic Assessment"); NOT_DESCRIBED = the source records AEs but does not state
how. INV-207, V-217. CQ-ST-06."""
enum AeCollectionMethod {
  SYSTEMATIC
  SPONTANEOUS
  NOT_DESCRIBED
}

"""Role of a publication's analysis of a dataset (catalog conventions.datasetAnalysisRole). Independence is derived from
shared Study/Dataset (V-218). CQ-ST-07, CQ-AX-05."""
enum DatasetAnalysisRole {
  PRIMARY_REPORT
  SECONDARY_ANALYSIS
  POOLED_ANALYSIS
  REANALYSIS
}

"""Kind of publication record (catalog conventions.publicationKind). The journal's own designation wins; a differing
database publication type (PubMed "Published Erratum") is kept as an Assertion. CQ-EV-05."""
