  "Method score in [0,1] of this hypothesis; null = not scored."
  score: Float @settable(onCreate: true, onUpdate: false)
  "Why the match is proposed."
  rationale: String @settable(onCreate: true, onUpdate: false)
  "Outcome: PROPOSED, ACCEPTED, REJECTED or UNRESOLVED (controlled string)."
  resolutionStatus: String
  """class: structural; cardinality: one_or_more; catalog: PROPOSES_MATCH (→ Entity|VersionedState|InformationArtifact)."""
