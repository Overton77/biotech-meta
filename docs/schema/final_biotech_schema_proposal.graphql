  ERRATUM
  RETRACTION_NOTICE
  EXPRESSION_OF_CONCERN
  PREPRINT
  CONFERENCE_ABSTRACT
}

"""Whether a registry date is actual or anticipated (catalog conventions.registryDateType). Null = the registry or tool did
