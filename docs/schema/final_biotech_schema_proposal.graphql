# ---- fragment W05 ----
"""
Route by which an agent reaches the body in a characterized Exposure. ORAL covers diet, drinking water and capsules; the
vehicle or medium is Exposure.mediumText, never a route value (EPA IRIS selenium: "Reference Dose for Chronic Oral
Exposure", diet). INHALATION and DERMAL are the other IRIS route families; PARENTERAL covers injection/infusion;
EXTERNAL_PHYSICAL covers whole-body physical agents of practices (heat, cold, light) that have no uptake route;
MULTIPLE is an aggregate characterization over routes stated by the source; NOT_STATED means the source gives no route
(never inferred from the agent). Not a dosage form (W04/W09) and not a W03 MechanismEvidenceContext vehicle string.
"""
enum ExposureRoute {
  ORAL
  INHALATION
  DERMAL
  OCULAR
  PARENTERAL
  EXTERNAL_PHYSICAL
  MULTIPLE
  NOT_STATED
}

"""
Duration class of a characterized Exposure as the source states it. Source definitions differ (EPA acute/short-term/
subchronic/chronic; IRIS "based on lifetime exposure"); the verbatim wording is Exposure.durationText and a numeric
duration, when stated, is Exposure.durationIso. NOT_STATED = the source gives no duration; it is never read as CHRONIC.
"""
enum ExposureDurationCategory {
  ACUTE
  SHORT_TERM
  SUBCHRONIC
  CHRONIC
  LIFETIME
  NOT_STATED
}

"""
Setting in which the characterized exposure occurs. DIETARY (food and drink, including food grown in a high-selenium
area: IRIS/Yang 1989b), ENVIRONMENTAL (ambient air, water, soil outside the diet), OCCUPATIONAL (workplace),
BEHAVIORAL_PRACTICE (a Lifestyle practice such as sauna bathing), NOT_STATED. A setting is not a population and not a
person's circumstance (no private context in the shared graph).
"""
enum ExposureSetting {
  DIETARY
  ENVIRONMENTAL
  OCCUPATIONAL
  BEHAVIORAL_PRACTICE
  NOT_STATED
}

"""
Axis on which a food variant differs from its base food on a VARIANT_OF edge. Grounded in reference-food records whose
identity includes preparation or processing (USDA FDC 170569 "Nuts, brazilnuts, dried, unblanched"; FoodOn
"brazilnut (shell off, dried)"). It qualifies one edge; it is not a food classification and not a nutrition taxonomy.
"""
enum FoodVariantKind {
  PREPARATION
  PROCESSING
  CULTIVAR_OR_BREED
  PRODUCTION_SYSTEM
  PLANT_OR_ANIMAL_PART
  OTHER
}

