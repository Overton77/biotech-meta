"""
The contract every diagnostic result store meets (catalog diagnostics.DiagnosticResult, interfaceOnly; round 0004;
CL-008). A result is a reported value of one measurand from one specimen or one computation, with its result kind,
value state, collection (observedAt) and report (reportedAt) times, the AssayVersion that measured it or the
AlgorithmVersion that computed it, and the ReferenceIntervalVersion(s) printed with it at report time. It is NOT an
assay, NOT a measurand, NOT a trend and NOT a condition. Implemented in the shared graph only by W16's public,
source-attributed Observation (labels ["Observation", "DiagnosticResult", "InformationArtifact"], W07-SR-02); the
private PersonalMeasurement implements the same contract in the private store and never appears here (INV-506, D-012).
Rules: MEASURED needs producedByAssayVersion; CALCULATED/INFERRED need computedByAlgorithmVersion (INV-303, V-303);
two results share an axis only per INV-301 (V-302, V-304, V-312); the interval is the one printed at report time and
belongs to the same AssayVersion (INV-302, V-306). CQ-DX-02, CQ-DX-03, CQ-DX-05, CQ-DX-06, CQ-DX-08, CQ-AX-21.
Module diagnostics. Archetype InformationArtifact.
"""
interface DiagnosticResult implements Entity & InformationArtifactArchetype {
  id: ID!
  uid: String!
  name: String
  description: String
  mongoResearchRunId: String
  artifactType: String!
  publishedAt: DateTime
  "Specimen collection time (or computation input time for CALCULATED/INFERRED). Null when unknown; ingestion time never substitutes."
  observedAt: DateTime
  contentHash: String
  privacyClass: PrivacyClass
  resultKind: DiagnosticResultKind!
  valueNumber: Float
  valueString: String
  "UCUM unit as reported (never converted in place; conversion is a ComparabilityAssessment rule)."
  unitCode: String
  valueStatus: ResultQualifier
  "When the issuing lab or service reported the value (report date)."
  reportedAt: DateTime
  """class: structural; cardinality: exactly_one when resultKind = MEASURED, else zero_or_one; catalog: PRODUCED_BY_ASSAY_VERSION"""
  producedByAssayVersion: [AssayVersion!]! @declareRelationship
  """class: structural; cardinality: exactly_one when resultKind in (CALCULATED, INFERRED) unless an UNRESOLVED assertion is pending; catalog: COMPUTED_BY_ALGORITHM_VERSION"""
  computedByAlgorithmVersion: [AlgorithmVersion!]! @declareRelationship
  """class: structural; cardinality: many (one per printed interval or limit, each of the producing AssayVersion); catalog: INTERPRETED_WITH_REFERENCE_INTERVAL_VERSION"""
  interpretedWithReferenceIntervalVersion: [ReferenceIntervalVersion!]! @declareRelationship
}

