  uid: String!
  name: String
  description: String
  mongoResearchRunId: String
  createdAt: DateTime! @timestamp(operations: [CREATE])
  updatedAt: DateTime! @timestamp(operations: [CREATE, UPDATE])
  privacyClass: PrivacyClass
  maturity: NodeMaturity
  schemaVersion: String
  stateType: String!
  "sha256:<hex> over canonical JSON {stage, capacityValue, capacityUnitCode, capacityBasis, capacityVerbatim, targetOperationalDate, targetOperationalDatePrecision, forProcessUid, forMaterialUid}."
  payloadHash: String!
  "Source-stated payload bounds (rarely present); attachment validity lives on HAS_CAPABILITY_STATE."
  effectiveFrom: DateTime
  effectiveTo: DateTime
  "Stage as asserted; non-null."
  stage: CapabilityStage!
  "Stated capacity amount; null = not stated (never 0)."
  capacityValue: Float
  "UCUM unit of capacityValue: m2 (cultivation area), L (vessel volume), kg/a or t/a (output rate), '%' (utilization rate)."
  capacityUnitCode: String
  capacityBasis: CapacityBasis
