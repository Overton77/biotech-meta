  schemaVersion: String
  "Always 'Adjudication'."
  assessmentType: String! @settable(onCreate: true, onUpdate: false)
  "Review method or policy version (e.g. label-policy-1)."
  methodVersion: String! @settable(onCreate: true, onUpdate: false)
  status: AssessmentStatus!
  "Service-assigned commit time."
  recordedAt: DateTime! @timestamp(operations: [CREATE]) @settable(onCreate: false, onUpdate: false)
  recordedTo: DateTime @settable(onCreate: false, onUpdate: true)
  summary: String @settable(onCreate: true, onUpdate: false)
  overallScore: Float @settable(onCreate: true, onUpdate: false)
  confidence: Float @settable(onCreate: false, onUpdate: false)
  "CAPTURE_FIDELITY or SUPPORT."
  adjudicationKind: AdjudicationKind! @settable(onCreate: true, onUpdate: false)
  "Verdict; meaning by adjudicationKind."
  verdict: AdjudicationVerdict! @settable(onCreate: true, onUpdate: false)
  "Reviewer rationale (internal text)."
  rationale: String @settable(onCreate: true, onUpdate: false)
  "HUMAN, AGENT, POLICY or MIGRATION."
  reviewerType: ReviewerType! @settable(onCreate: true, onUpdate: false)
  "When the review was made (may precede recordedAt)."
  reviewedAt: DateTime @settable(onCreate: true, onUpdate: false)
  "True when an automated verdict awaits human confirmation."
  humanReviewPending: Boolean
  """class: structural; cardinality: one_or_more; catalog: EVALUATES."""
  evaluates: [Assertion!]! @relationship(type: "EVALUATES", direction: OUT) @settable(onCreate: true, onUpdate: false)
  """class: structural; cardinality: many; catalog: CONSIDERS_ASSESSMENT (→ any EvidenceAssessment, resolved through the archetype interface). Domain extended to every EvidenceAssessment, e.g. ApplicabilityDimension (W00-R-50 on W10-SR-04); NarrativeArc is never a target (W18-SR-10)."""
  considersAssessments: [EvidenceAssessmentArchetype!]! @relationship(type: "CONSIDERS_ASSESSMENT", direction: OUT)
  """class: structural; cardinality: many; catalog: SUPPORTED_BY (locators in snapshots retrieved before recordedAt)."""
  supportedBy: [SourceLocator!]! @relationship(type: "SUPPORTED_BY", direction: OUT)
  """class: structural; cardinality: many; catalog: CONTRADICTED_BY."""
  contradictedBy: [SourceLocator!]! @relationship(type: "CONTRADICTED_BY", direction: OUT)
  """class: structural; catalog: SUPERSEDES (Adjudication → Adjudication)."""
  supersedes: [Adjudication!]! @relationship(type: "SUPERSEDES", direction: OUT, properties: "SupersessionProperties")
  """class: structural (inverse); catalog: SUPERSEDES."""
  supersededBy: [Adjudication!]! @relationship(type: "SUPERSEDES", direction: IN, properties: "SupersessionProperties")
  """class: structural; cardinality: zero_or_one; catalog: WAS_GENERATED_BY (ADJUDICATION Activity)."""
