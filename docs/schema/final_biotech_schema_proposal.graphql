(W02-SR-06). Serves CQ-ID-C03. Module substances_and_materials; archetype Entity; uid token microbial-taxon (proposed).
"""
type MicrobialTaxon implements Entity & EntityArchetype
  @node(labels: ["MicrobialTaxon", "Entity"]) {
  id: ID! @id
  uid: String!
  name: String
  description: String
  mongoResearchRunId: String
