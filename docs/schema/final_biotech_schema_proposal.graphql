  predicateScope: [String!]
  requiredSourceKinds: [SourceKind!]!
  requiredAuthorityScopes: [AuthorityScope!]
  "Maximum age in days of the newest required capture (observedAt) at the viewpoint; null = no freshness bound."
  maxSnapshotAgeDays: Int
