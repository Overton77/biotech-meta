"""
An external identifier STRING with its scheme and issuer (NCT, PMID, DOI, UNII, CAS, LOINC, GTIN, ASIN,
patent and FDA submission numbers). Identity of this node is (scheme, issuer, value) — unique by constraint;
the same (scheme, value) from two issuers is two Identifiers and never establishes identity
([SHARED_IDENTIFIER_SCHEME_VALUE_ACROSS_ISSUERS, SAME_IDENTITY]). `validFrom`/`validTo` are the scheme-level
validity of the identifier itself (e.g. a deprecated code); the validity of its ASSIGNMENT to a record lives
on HAS_IDENTIFIER (IdentifierLinkProperties). The authority release that supplied it is the SourceSnapshot of
the authority record behind the HAS_IDENTIFIER Assertion (CQ-ID-04). Names never establish identity.
Archetype: Entity. Module: identity_resolution. CQs: CQ-ID-04, CQ-AX-14.
"""
type Identifier implements Entity & EntityArchetype
  @node(labels: ["Identifier", "Entity"])
  @mutation(operations: [CREATE, UPDATE]) {
  id: ID! @id
  uid: String! @settable(onCreate: true, onUpdate: false)
  name: String
  description: String
  mongoResearchRunId: String
  createdAt: DateTime! @timestamp(operations: [CREATE]) @settable(onCreate: false, onUpdate: false)
  updatedAt: DateTime! @timestamp(operations: [CREATE, UPDATE])
  privacyClass: PrivacyClass
  maturity: NodeMaturity
  schemaVersion: String
  "Always 'Identifier'."
  entityType: String!
  "Scheme name (e.g. DOI, PMID, NCT, UNII, CAS, LOINC, GTIN, ASIN)."
  scheme: String! @settable(onCreate: true, onUpdate: false)
  "Issuing authority or registry (e.g. Regenstrief Institute, Amazon, NLM)."
  issuer: String! @settable(onCreate: true, onUpdate: false)
  "Value as normalized by normalizationRule."
  value: String! @settable(onCreate: true, onUpdate: false)
  "Jurisdiction or marketplace scope, where the scheme is scoped."
  jurisdiction: String
  "Scheme-level validity start of the identifier itself."
  validFrom: DateTime
  "Scheme-level validity end (e.g. deprecated code)."
  validTo: DateTime
  "Required when validFrom is non-null."
  validFromPrecision: TimePrecision
  "Required when validTo is non-null."
  validToPrecision: TimePrecision
  "Basis of validFrom."
  validFromBasis: ValidTimeBasis
  "Basis of validTo."
