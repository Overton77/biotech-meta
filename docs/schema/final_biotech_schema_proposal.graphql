measurement procedure (W07 MeasurementMethod, which is authoritative for what an AssayVersion does), NOT a metric
and NOT a therapy claim. parameterNames/parameterUnits are display descriptors (units UCUM when present). CQ-DX-01
(device side), CQ-PR-02 (steps that employ a modality through a device). Canonical module: consumer_devices
(future; live line 1475). Archetype: Entity. uid token requested: modality (W08-SR-06). Maturity: PROVISIONAL.
