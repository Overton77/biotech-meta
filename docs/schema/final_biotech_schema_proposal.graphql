# ================================================================================================
# DIAGNOSTICS AND MEASUREMENT (W07)
# Biomarkers, metrics, lab tests, panels, assay/algorithm/reference-interval versions, comparability and the DiagnosticResult contract. Same name or unit does not justify a shared trend axis.
# Competency questions: CQ-DX-01..09, CQ-AX-21
# Canonical module(s): diagnostics
# ================================================================================================

# ---- fragment W07 ----
"""Whether a diagnostic result was measured, calculated from measured values by a fixed rule, or inferred by a model
(catalog conventions.resultKind). Forbidden implication [INFERRED_RESULT, MEASURED_RESULT]. INV-303, V-303."""
enum DiagnosticResultKind {
  MEASURED
  CALCULATED
  INFERRED
}

"""What kind of quantity an AlgorithmVersion returns (catalog conventions.algorithmOutputKind). A PACE is never
differenced against an AGE_ESTIMATE. CQ-DX-04."""
enum AlgorithmOutputKind {
  AGE_ESTIMATE
  PACE
  RISK_SCORE
  FEATURE_MEASURE
  CLASSIFICATION
  CALCULATED_QUANTITY
}

"""Basis on which an AlgorithmVersion is pinned (catalog conventions.algorithmVersionBasis). VENDOR_VERSION_STRING:
the implementer of the software states a version string (also used for an authors' reference package such as
DunedinPACE R package 0.99.0); PUBLICATION_VERSION: pinned only by a publication; SERVICE_ENDPOINT_UNVERSIONED: a
service output pinned only by retrievedAt (never trendable, V-312); UNKNOWN: unresolved. INV-303, V-308."""
enum AlgorithmVersionBasis {
  VENDOR_VERSION_STRING
  PUBLICATION_VERSION
  SERVICE_ENDPOINT_UNVERSIONED
  UNKNOWN
}

"""Meaning of the bounds of a ReferenceIntervalVersion (catalog conventions.referenceIntervalKind). Labs print a
reference interval and guideline decision limits in the same "reference values" field (Mayo HBA1C, Labcorp 001453);
each is a separate ReferenceIntervalVersion. Forbidden implication [OUTSIDE_REFERENCE_INTERVAL, INDICATES_CONDITION]."""
enum ReferenceIntervalKind {
  REFERENCE_INTERVAL
  DECISION_LIMIT
  GUIDELINE_TARGET
}

"""How the laboratory obtained the interval (catalog conventions.referenceIntervalDerivation; CLSI EP28-A3c
establishment (>= 120 reference individuals per partition), transference (method comparison) and verification
(as few as 20 reference individuals)). NOT_REPORTED when the source is silent. A value for guideline-sourced limits
is requested in W07-SR-06 (candidate ADOPTED_FROM_GUIDELINE), not added here."""
enum ReferenceIntervalDerivation {
  ESTABLISHED
  TRANSFERRED
  VERIFIED
  ADOPTED_FROM_MANUFACTURER
  NOT_REPORTED
  ADOPTED_FROM_GUIDELINE
}

"""Verdict of a ComparabilityAssessment (catalog conventions.comparabilityVerdict). Only COMPARABLE and
COMPARABLE_WITH_CONVERSION license a shared axis (INV-301, V-302, V-304)."""
enum ComparabilityVerdict {
  COMPARABLE
  COMPARABLE_WITH_CONVERSION
  NOT_COMPARABLE
  UNKNOWN
}

"""Value state of a diagnostic result (catalog private_context.resultQualifier values, reused for the shared contract
per contract A7 so that belowDetection, unmeasured and invalid specimen stay distinct). Registry addition requested
(W07-SR-03); a NOT_REPORTED value for source-attributed public results is requested there, not added here."""
enum ResultQualifier {
  NUMERIC
  BELOW_DETECTION
  ABOVE_QUANTIFICATION
  NOT_MEASURED
  INVALID_SPECIMEN
  BELOW_REPORTING_LIMIT
  QUALITATIVE_ABSENT
  QUALITATIVE_PRESENT
}

