"""
A dated public occurrence reported by sources: a filing, a data readout (the public disclosure of results), an
approval, a launch, a recall, a financing, a conference session, a share-price move. Archetype Occurrence. Three
clocks are kept apart (CQ-TM-03): startedAt/endedAt = when it happened (valid time; live happenedAt/happenedAtEnd);
announcedAt = when it was first publicly announced by a party to it (publication time of the announcing snapshot);
effectiveFrom = when a legal, regulatory or contractual effect begins (live effectiveAt). The recorded clock lives on
the assertions (recordedAt) and edges (recordedFrom), never on the Event. Every time on this node is a
materialization of an Assertion named in timeAssertionUid / announcementAssertionUid / effectiveAssertionUid; the
assertions are the history (late arrivals and corrections are new assertions; the materialization is recomputed).
An Event is NOT the regulatory or publication record that documents it (DOCUMENTED_BY_RECORD -> W13/W09 records),
NOT a source (it is REPORTED_IN sources), NOT evidence for anything it is about, and temporal order between events
(FOLLOWED_BY) never implies cause (CAUSED_BY needs its own assertion with basisKind). Serves CQ-TM-03, CQ-EV-01,
CQ-EN-C01..C04, CQ-EN-C06. Module events_and_narrative; archetype Occurrence; uid token `event` (requested).
"""
type Event implements Entity & OccurrenceArchetype & SearchIndexable
  @node(labels: ["Event", "Occurrence"])
  @fulltext(indexes: [{indexName: "EventSearch", fields: ["name", "description", "summaryText"], queryName: "searchEvents"}]) {
  id: ID! @id
  uid: String!
  name: String
  description: String
  mongoResearchRunId: String
  createdAt: DateTime! @timestamp(operations: [CREATE])
  updatedAt: DateTime! @timestamp(operations: [CREATE, UPDATE])
  privacyClass: PrivacyClass
  maturity: NodeMaturity
  schemaVersion: String
  "Always 'Event'."
  occurrenceType: String!
  """When it happened (valid-time start; first instant of its precision period). Materialized from the assertion named in timeAssertionUid. Live happenedAt."""
  startedAt: DateTime
  """When it ended, for durative occurrences (valid-time end, half-open). Null = unknown or instantaneous, never 'ongoing'. Live happenedAtEnd."""
  endedAt: DateTime
  startedAtPrecision: TimePrecision
  startedAtBasis: ValidTimeBasis
  endedAtPrecision: TimePrecision
  endedAtBasis: ValidTimeBasis
  """uid of the EVENT_OCCURRED (or, while PLANNED, EVENT_SCHEDULED) Assertion whose validFrom/validTo this node materializes."""
  timeAssertionUid: String
