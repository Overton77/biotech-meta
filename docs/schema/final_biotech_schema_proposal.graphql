# TREATMENTS, PROCEDURES AND INTERVENTION MODALITIES (W06)
# Treatment concepts and procedure definitions; intent is not result, definition is not performance; no care records.
# Competency questions: CQ-ST-01, CQ-EV-04, CQ-MF-02, CQ-AX-23
# Canonical module(s): interventions (candidate)
