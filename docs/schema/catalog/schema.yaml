globalInvariants:
  - id: INV-001
    rule: Every committed node has exactly one globally stable uid and exactly one base archetype label.
  - id: INV-002
    rule: Every ACCEPTED source-derived assertion has at least one reproducible SourceLocator (snapshot with contentHash, contentHashBasis, retrievedAt; selector fields complete for its selectorKind).
  - id: INV-003
    rule: An Assertion has exactly one subject and either one object or one typed literal value, and at most one asserter.
  - id: INV-004
    rule: A derived relationship is regenerable and cites projectionOfAssertionUid, or derivationRule plus derivedFromAssertionUids; the cited predicate is never the premise of a forbidden implication for the edge type.
  - id: INV-005
    rule: Formulation composition is authoritative only through FormulationVersion and IngredientComponent.
  - id: INV-006
    rule: A label declaration is not measured composition.
  - id: INV-007
    rule: Unknown, unmeasured, not reported, below detection, absent, and false are never normalized to one state.
  - id: INV-008
    rule: Evidence applicability cannot be inferred solely from a shared ingredient or marketing name.
  - id: INV-009
    rule: Organization roles never imply other organization roles without an assertion.
  - id: INV-010
    rule: Regulatory notification, designation, certification, patent status, and approval remain distinct.
  # round 0009
  - id: INV-101
    rule: Every asserted edge carries assertionUid and recordedFrom; recordedFrom < recordedTo when both exist.
  - id: INV-102
    rule: A non-null valid-time bound carries its basis and precision; open and unknown bounds are null and never a sentinel date.
  - id: INV-103
    rule: Assertion.status is a cache. Every ACCEPTED, REJECTED or DISPUTED status is backed by a CAPTURE_FIDELITY Adjudication reviewed no earlier than the assertion was recorded, and every SUPERSEDED status by a SUPERSEDES record.
  - id: INV-104
    rule: A derived edge cites projectionOfAssertionUid, or derivationRule plus derivedFromAssertionUids (see INV-004).
  - id: INV-105
    rule: No shared node has a relationship to a private-personal record; private-to-shared references are uid properties; no shared search index covers private data.
  - id: INV-106
    rule: uid has the form hu:<type>:<opaque>, and for nodes that have a live id the uid ends with ':' + id.
  - id: INV-107
    rule: Derived search text and embeddings are regenerable projections carrying their derivation (searchFields, embeddingModel, embeddingDimensions) and are never evidence.
  # rounds 0002 and 0003
  - id: INV-201
    rule: No Study, StudyArm, StudyIntervention, StudyResult, or Publication has a direct relationship to Product, ProductVariant, or FormulationVersion; evidence reaches commercial identities only through EvidenceApplicability.
  - id: INV-202
    rule: Every EvidenceApplicability has exactly one evidence target, exactly one use target, and one ApplicabilityDimension per required dimension for its evidence-target kind; NOT_ASSESSED is explicit.
  - id: INV-203
    rule: A DOSE, SCHEDULE, DURATION, or EXPOSURE ratio exists only when quantity basis and mass basis match on both sides; otherwise the ratio is null and the verdict is at most PARTIAL.
  - id: INV-204
    rule: Explanation-only dimensions have verdict NOT_SCORED and never enter a composite; a composite requires methodVersion and all required dimensions.
  - id: INV-205
    rule: Surrogate-endpoint status is held by an EndpointClassification with a context of use; it is never a Biomarker property and does not transfer across contexts.
  - id: INV-206
    rule: When a study's primary prespecified result is NOT_SIGNIFICANT, its secondary, subgroup, within-arm, or post hoc results enter a synthesis only as SUPPORTIVE or HYPOTHESIS_GENERATING.
  - id: INV-207
    rule: A reported zero adverse-event count carries a collection method; absence of an AE report is notReported, never zero.
  - id: INV-208
    rule: Registry status, enrollment, results-posted, and design facts live on RegistrationVersion with observedAt; Study carries them only as a derived projection naming its RegistrationVersion.
  - id: INV-209
    rule: evidenceLevel, isClinicallyMeaningful, and EvidenceStrength values are assessments with method and criteria; on nodes or edges they are derived projections naming the assessment.
  - id: INV-210
    rule: Every mechanism-class Assertion has basisKind; DIRECT_MEASUREMENT requires exactly one MechanismEvidenceContext with setting and, except cell-free and in-silico, a species.
  - id: INV-211
    rule: Mechanism projections project only ACCEPTED DIRECT_MEASUREMENT assertions; APPLIES_TO_SPECIES targets only species of projected contexts.
  - id: INV-212
    rule: An EvidenceApplicability whose evidence target is a mechanism Assertion has an EXPOSURE dimension; MATCH or PARTIAL requires a linked human exposure result for the target's material and form.
  - id: INV-213
    rule: Human-equivalent dose is a derived value with hedMethod; it is never an asserted context property.
  # rounds 0004 and 0005
  - id: INV-301
    rule: Two diagnostic results share an axis only if they share AssayVersion (measured) or AlgorithmVersion (calculated or inferred), or a ComparabilityAssessment with verdict COMPARABLE or COMPARABLE_WITH_CONVERSION compares the two versions.
  - id: INV-302
    rule: A ReferenceIntervalVersion belongs to exactly one AssayVersion; a result keeps the interval printed at report time.
  - id: INV-303
    rule: Every calculated or inferred result names its AlgorithmVersion; an AlgorithmVersion always has a versionBasis.
  - id: INV-304
    rule: Only RegulatoryStatus with statusKind APPROVAL is approval; establishment registration is a status of a Facility only.
  - id: INV-305
    rule: An OPERATING capability state requires an assertion from a non-marketing source or a SUPPORT Adjudication with verdict SUPPORTED.
  - id: INV-306
    rule: Marketplace hosting, listing, fulfillment, and affiliation never imply seller of record; SELLS_PRODUCT is derived only from SELLER_OF_RECORD_FOR assertions.
  - id: INV-307
    rule: A label quantity refers to its amountReferent; active-moiety and nutrient-equivalent amounts are CALCULATED assertions and never label declarations.
  # round 0006
  - id: INV-401
    rule: A source-derived ACCEPTED assertion has at least one reproducible locator (see INV-002).
  - id: INV-402
    rule: A ClaimOccurrence has exactly one container and one asserter, and every locator supporting it lies in that container or one of its renditions.
  - id: INV-403
    rule: A retelling is a distinct Assertion linked by RETELLS; qualification loss is recorded only on a RetellingFidelityAssessment.
  - id: INV-404
    rule: A Chunk is never a SourceLocator; Chunk links are derived and name the locator they project.
  - id: INV-405
    rule: A financial-interest assertion or its absence never sets an Adjudication verdict; verdicts need locators to evidence about the proposition.
  - id: INV-406
    rule: Assertion.status records capture fidelity; it is never read as truth.
  - id: INV-407
    rule: Every confidence value names the Activity and method version that produced it.
  # rounds 0007 and 0008
  - id: INV-501
    rule: Valid time on an Assertion and on any bitemporal episode is immutable; corrections and endings are new recorded-time episodes.
  - id: INV-502
    rule: Recorded time is assigned by the ingestion service at commit, is never earlier than the supporting snapshot's retrievedAt, and is never backdated.
  - id: INV-503
    rule: Asserted-edge and attachment valid bounds equal those of their authorizing assertion.
  - id: INV-504
    rule: SourceSnapshots and Adjudications are immutable; revisions are SourceRevisionEvents and superseding adjudications.
  - id: INV-505
    rule: EXCLUSIVE attachments never definitely overlap in both valid and recorded time.
  - id: INV-506
    rule: The shared graph contains no private-personal node, property, relationship, or private uid value.
  - id: INV-507
    rule: RecommendationSnapshots, their options, and UserContextVersions are insert-only; new measurements create new context versions.
  - id: INV-508
    rule: A recommendation is a private decision occurrence; no relationship type expresses a timeless product-to-goal recommendation.
  - id: INV-509
    rule: Every DisclosureEvent falls inside a currently recorded PERMIT grant episode covering its data categories; grant revocation is never backdated.

enforcement:
  neo4jConstraints: ../neo4j/constraints.cypher   # uniqueness and node keys everywhere; existence and type constraints need Enterprise
  validationQueries: ../neo4j/validation.cypher   # V-0xx baseline, V-1xx to V-5xx for 0.2.0; zero rows means valid
  serviceEnforced: [INV-003 literal-xor-object, INV-004 derivation rules, INV-101 to INV-105, INV-201 to INV-213, INV-301 to INV-307, INV-401 to INV-407, INV-501 to INV-509, temporal profile immutability, exclusive-overlap rejection, private-store boundary]

migration:
  from: 0.1.0
  to: 0.2.0
  breakingMeaningChanges:
    - Assertion.status is a current projection of CAPTURE_FIDELITY adjudications and SUPERSEDES; it is never truth. Existing ACCEPTED values are reinterpreted as "accepted as an accurate record"; truth verdicts must be re-expressed as SUPPORT Adjudications where they were implied.
    - Assertion.confidence is deprecated; existing values are read as extractionConfidence with unknown method and no Activity. New writes require extractionConfidence plus WAS_GENERATED_BY.
    - A single validTimeBasis is replaced by validFromBasis and validToBasis with per-bound precision. Existing assertions without bases are migrated with basis UNKNOWN and a MIGRATION Adjudication.
    - ASSESSES_APPLICABILITY_TO no longer accepts UserContext; existing targets of that kind move to PersonalApplicabilityAssessment in the private store.
    - RecommendationDecision becomes RecommendationSnapshot and RecommendationCandidate becomes RecommendationOption, both private-personal and insert-only.
    - SourceLocator.selector is split into typed selector fields; untyped selectors are kept with selectorKind UNKNOWN until re-anchored.
    - evidenceStrength, evidenceLevel and isClinicallyMeaningful become assessments; existing attribute values are kept as extraction-time hints marked derived.
  additiveChanges:
    - new modules temporal, identity_resolution (Identifier, Mention, EquivalenceAssessment), mechanisms, diagnostics (candidate), manufacturing_readiness (candidate), claims_and_documents, protocols, private_context, access_and_answers (candidate)
    - new kernel nodes Activity, SourceRevisionEvent; new kernel relationships SUPERSEDES, DERIVED_FROM_ASSERTION, WAS_GENERATED_BY, USED, WAS_ASSOCIATED_WITH, AUTHORIZED_BY
  previouslyCommittedAssertions: remain interpretable; no 0.1.0 assertion is deleted or rewritten; the Elysium fixture (../examples/elysium-basis.cypher) still validates under V-0xx and is the 0.1.0 compatibility fixture
