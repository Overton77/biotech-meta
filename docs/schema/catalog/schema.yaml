        members: [SPONSORS_CONTENT, AFFILIATE_FOR_OFFER, INVESTED_IN, HOLDS_EQUITY_IN, BOARD_MEMBER_OF, ADVISES_ORGANIZATION, EMPLOYED_BY, FOUNDED_ORGANIZATION, HAS_IP_INTEREST_IN, RECEIVES_COMPENSATION_FROM]
