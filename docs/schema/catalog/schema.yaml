      - [ADOPTED_PROTOCOL_EDITION, FOLLOWS_ALL_STEPS]
      - [THIRD_PARTY_REPORTS_PROTOCOL_CHANGE, PROTOCOL_EDITION_EXISTS]
      - [OUTSIDE_REFERENCE_RANGE_TRIGGER, CONDITION_PRESENT]

  safety_and_constraints:
    maturity: candidate
    privacyClass: public
    owns: [SafetySignal, ContraindicationAssertion, InteractionAssertion, UseConstraint]
    note: live SafetySignal and AdverseEffect kept as seams; round 0002 recommends SafetySignal become an EvidenceAssessment over AdverseEventResults when this module opens (OPEN-QUESTIONS)

  recommendation_decisions:
    maturity: provisional
    placement: private_context_store   # round 0008; PolicyVersion and DecisionCriterion are internal and live in the shared graph
    nodes:
      RecommendationRequest: {archetype: Occurrence, privacyClass: private-personal, properties: [requestedAt, goalVersionUids, intendedUse]}
      RecommendationSnapshot: {archetype: Occurrence, privacyClass: private-personal, properties: [decidedAt, recordedAt, requestUid, userContextVersionUid, evidenceRecordedAt, evidenceValidAt, policyVersionUid, algorithmVersion, catalogVersion, intendedUse, decisionOutcome, rationaleSummary, decisionConfidence, decisionConfidenceMethod, missingFactKeys, snapshotHash], note: replaces 0.1.0 RecommendationDecision; keeps personal-context version, evidence versions and viewpoint, options, selection, rationale, uncertainty, intended use, policy and algorithm version; insert-only}
      RecommendationOption: {archetype: InformationArtifact, privacyClass: private-personal, properties: [subjectUid, subjectType, disposition, rank, rejectionReason, blockingConstraintUids, evidenceAssertionUids, adjudicationUids, applicabilityUids, stateUids, offerObservationUids], note: replaces 0.1.0 RecommendationCandidate}
      DecisionCriterionValue: {archetype: InformationArtifact, privacyClass: private-personal, properties: [criterionUid, valueNumber, valueString, methodVersion]}
      UserDecision: {archetype: Occurrence, privacyClass: private-personal, properties: [decisionKind, optionUid, decidedAt], note: the person's own choice, separate from the snapshot's SELECTED option}
      PolicyVersion: {archetype: VersionedState, privacyClass: internal, placement: shared_graph, properties: [name, payloadHash]}
      DecisionCriterion: {archetype: Entity, privacyClass: internal, placement: shared_graph, properties: [name, criterionKind, methodVersion]}
    relationships:
      HAS_OPTION: {from: RecommendationSnapshot, to: RecommendationOption, class: structural, store: private}
      FOR_REQUEST: {from: RecommendationSnapshot, to: RecommendationRequest, class: structural, store: private}
      USED_CONTEXT_VERSION: {from: RecommendationSnapshot, to: UserContextVersion, class: structural, store: private}
      HAS_CRITERION_VALUE: {from: RecommendationOption, to: DecisionCriterionValue, class: structural, store: private}
      RESPONDS_TO: {from: UserDecision, to: RecommendationSnapshot, class: structural, store: private}
    crossStoreReferences: uid_properties_only_with_recorded_time_viewpoint
    enums:
      disposition: [SELECTED, ALTERNATIVE, REJECTED, BLOCKED]
      rejectionReason: [INSUFFICIENT_APPLICABILITY, SAFETY_CONSTRAINT, USER_PREFERENCE, PRICE, AVAILABILITY, DOMINATED_BY_SELECTED]
      intendedUse: [INFORMATIONAL_COMPARISON, PURCHASE_DECISION_SUPPORT, PROTOCOL_ADJUSTMENT_REVIEW, DISCUSS_WITH_CLINICIAN]
      decisionOutcome: [RECOMMENDED_ONE, RECOMMENDED_SEVERAL, RECOMMENDED_NONE, BLOCKED_BY_CONSTRAINT, INSUFFICIENT_EVIDENCE]
      userDecisionKind: [CHOSE, DECLINED, DEFERRED]
    forbiddenImplications:
      - [RECOMMENDS, BELLLABS_RECOMMENDS]
      - [SELECTED_IN_SNAPSHOT, USER_CHOSE]
      - [RECOMMENDED_FOR, ANY]    # Product RECOMMENDED_FOR Goal is forbidden as a relationship type

  private_context:
    maturity: provisional
    privacyClass: private-personal
    placement: private_context_store   # round 0008: transactional store (PostgreSQL recommended) is the system of record; zero private nodes in the shared graph
    dependencies: [kernel, temporal, recommendation_decisions, protocols, diagnostics]
    nodes:
      UserContext: {archetype: Entity, properties: [], note: uid only; no name, email, or account id}
      UserContextVersion: {archetype: VersionedState, properties: [goalVersionUids, measurementUids, declaredConditionUids, declaredIntakeUids, preferenceKeys, payloadHash]}
      UserGoal: {archetype: Entity, properties: []}
      UserGoalVersion: {archetype: VersionedState, properties: [functionalGoalUid, outcomeUid, metricUid, targetValue, targetUnitCode, priority, goalStatement, payloadHash]}
      PersonalMeasurement: {archetype: InformationArtifact, properties: [metricUid, labTestUid, assayVersionUid, algorithmVersionUid, deviceUid, methodUid, valueNumber, unitCode, resultQualifier, effectiveAt, recordedAt, provenanceKind, reportedReferenceRangeText, labReportUid], note: implements the DiagnosticResult contract for a person; references shared Metric, LabTest, AssayVersion, AlgorithmVersion, Device by uid}
      PersonalLabReport: {archetype: InformationArtifact, properties: [reportDate, issuingLabName, fileObjectRef, contentHash, recordedAt]}
      ProtocolInUse: {archetype: Entity, properties: []}
      ProtocolAdoptionVersion: {archetype: VersionedState, properties: [adoptedEditionUid, payloadHash]}
      ProtocolDeviation: {archetype: VersionedState, properties: [stepKey, deviationKind, personalValueNumber, personalUnitCode, substituteSubjectUid]}
      SharingGrant: {archetype: VersionedState, properties: [granteeKind, granteeRef, dataCategories, recordUids, purpose, permittedActions, decision, payloadHash]}
      DisclosureEvent: {archetype: Occurrence, properties: [grantUid, occurredAt, dataCategories]}
      PendingItem: {archetype: Occurrence, properties: [pendingKind, blocksUid, openedAt, expectedBy, resolvedAt, resolvedByUid]}
      PurchaseEvent: {archetype: Occurrence, properties: [eventKind, occurredAt, offerUid, productVariantUid, packageConfigurationUid, lotUid]}
      PersonalApplicabilityAssessment: {archetype: EvidenceAssessment, properties: [sharedApplicabilityUid, userContextVersionUid, populationMatch, doseMatch, durationMatch, methodVersion]}
      ErasureTombstone: {archetype: Occurrence, properties: [subjectKeyHash, erasedAt, scope, propagationStatus]}
    relationships:
      HAS_CONTEXT_VERSION: {from: UserContext, to: UserContextVersion, class: structural, temporalProfile: bitemporal_attachment}
      HAS_GOAL: {from: UserContext, to: UserGoal, class: structural}
      HAS_GOAL_VERSION: {from: UserGoal, to: UserGoalVersion, class: structural, temporalProfile: bitemporal_attachment}
      HAS_PROTOCOL_IN_USE: {from: UserContext, to: ProtocolInUse, class: structural}
      HAS_ADOPTION_VERSION: {from: ProtocolInUse, to: ProtocolAdoptionVersion, class: structural, temporalProfile: bitemporal_attachment}
      HAS_DEVIATION: {from: ProtocolAdoptionVersion, to: ProtocolDeviation, class: structural}
      HAS_SHARING_GRANT: {from: UserContext, to: SharingGrant, class: structural, temporalProfile: bitemporal_attachment}
    enums:
      resultQualifier: [NUMERIC, BELOW_DETECTION, ABOVE_QUANTIFICATION, NOT_MEASURED, INVALID_SPECIMEN]
      provenanceKind: [LAB_REPORT_UPLOAD, DEVICE_IMPORT, MANUAL_ENTRY]
      deviationKind: [OMITTED, MODIFIED_DOSE, MODIFIED_TIMING, ADDED_STEP, SUBSTITUTED_PRODUCT]
      granteeKind: [NAMED_PERSON, CLINICIAN, COACH, BELLLABS_RESEARCH, DEIDENTIFIED_CONTRIBUTION]
      permittedAction: [VIEW, EXPORT, CONTRIBUTE_DEIDENTIFIED]
      grantDecision: [PERMIT, DENY]
      pendingKind: [AWAITING_LAB_RESULT, AWAITING_DELIVERY, AWAITING_PROTOCOL_PERIOD_END, AWAITING_EVIDENCE_UPDATE, AWAITING_CLINICIAN_INPUT, AWAITING_RESTOCK, REVIEW_TRIGGERED, REVIEW_SUGGESTED, EVIDENCE_REVIEW]
      purchaseEventKind: [INTENDED, ORDERED, DELIVERED, STARTED_USE, PAUSED_USE, STOPPED_USE, RETURNED]
    ownership:   # owner of each private data category (round 0008)
      goals_and_context_versions: private_context_store
      measurements_and_lab_reports: private_context_store
      protocol_in_use_and_deviations: private_context_store
      recommendation_snapshots_and_user_decisions: private_context_store
      consent_and_sharing_grants: private_context_store
      purchase_lifecycle: private_context_store
      policy_versions_and_decision_criteria: shared_graph_internal
    syncAndDeletion:
      - private records reference shared uids plus the recorded-time viewpoint used; no relationship crosses the store boundary
      - a shared uid merge publishes a redirect; private records are not rewritten
      - erasure deletes whole private records, leaves a content-free ErasureTombstone, and propagates to derived copies and consented de-identified contributions through their HMAC withdrawal token
      - aggregates contributed to the shared graph are k-anonymous (threshold open: OPEN-QUESTIONS)
    forbiddenImplications:
      - [SHARED_WITH_GRANTEE, PUBLISHED]
      - [PERSONAL_MEASUREMENT_OUTSIDE_REFERENCE_RANGE, CONDITION_PRESENT]
      - [PERSONAL_MEASUREMENT, OBSERVATION]

  access_and_answers:
    maturity: candidate
    privacyClass: internal
    nodes:
      AnswerRecord: {archetype: Occurrence, properties: [recordedAsOf, validAt, intervalStart, intervalEnd, schemaDigest, queryShapeId, queryShapeVersion, accessTier, traceDepth, publishedAt], forbiddenProperties: [userUid, ownerUid, questionText], note: a published (shared) answer with its viewpoint so it can be reproduced; an ad hoc answer to one person is private behaviour data}
    relationships:
      CITES_ASSERTION: {from: AnswerRecord, to: Assertion, class: structural}
      CITES_ASSESSMENT: {from: AnswerRecord, to: EvidenceAssessment, class: structural}

