schema:
  name: human-upgrade-knowledge-graph
  version: 0.2.0
  status: provisional
  targetProjection: neo4j-5
  updatedAt: 2026-10-03
  previousVersion: 0.1.0
  integrationNote: >
    0.2.0 integrates ontology-lab rounds 0002 to 0009 (see ../ontology-lab/proposal-index.md). Meaning changes
    relative to 0.1.0 are listed under migration. The live Neo4j GraphQL schema (../current_biotech_schema.graphql)
    is read-only; its concepts are kept, refined, merged, split, or left as seams as recorded per module in
    `liveSchemaAlignment` and in ../neo4j/proposed-delta.graphql.

conventions:
  identityProperty: uid
  uidFormat: "hu:<type>:<opaque-stable-id>"
  privateUidFormat: "hu:private-<type>:<opaque-stable-id>"   # round 0008: leak checks detect private uids anywhere in the shared graph
  uidTypeTokens:
    # one token per primary label; the <type> segment of a uid. Round 0009 (K-1 seam) and round 0006.
    Organization: org
    LegalEntity: org
    ConsumerBrand: brand
    Facility: facility
    Person: person
    PseudonymousActor: pseudonymous-actor
    AnonymousActor: anonymous-actor
    Agent: agent
    Activity: activity            # round 0006 ruling: captures and manual reviews are activities, not agent runs
    Product: product
    ProductVariant: product-variant
    FormulationVersion: formulation
    IngredientComponent: component
    IngredientMaterial: material
    ChemicalSubstance: substance
    ChemicalForm: form
    Source: source
    SourceSnapshot: snapshot
    SourceLocator: locator
    SourceRevisionEvent: source-revision
    Document: document            # live Document (stored id property documentId)
    DocumentTextVersion: text-version
    Chunk: chunk                  # live Chunk (stored id property chunkId)
    Claim: claim
    ClaimOccurrence: claim-occurrence
    RelationshipAssertion: assertion
    Assertion: assertion
    Adjudication: adjudication
    EvidenceApplicability: applicability
    ApplicabilityDimension: applicability-dimension
    EvidenceAssessment: assessment
    ResolutionHypothesis: resolution
    Identifier: identifier
    Study: study
    StudyArm: arm
    StudyIntervention: intervention
    Publication: publication
    AssayVersion: assay-version
    AlgorithmVersion: algorithm-version
    RegulatoryStatus: regulatory-status
    Protocol: protocol
    ProtocolEdition: protocol-edition
    AnswerRecord: answer-record
    Episode: episode
    EpisodeSegment: episode-segment
    Channel: channel
    Series: series
  liveSeamTypes:
    # Live GraphQL types referenced by relationships here but owned by no module yet (kept unchanged as seams).
    [ToolOrInstrument, ReferenceRange, Device, Sensor, Modality, Conference, Event, Community, NarrativeArc, MediaAsset, MediaVariant, MediaAnnotation, MediaSource, GraphView, FigurePanel, ProductLabelRegion, Procedure, Treatment, FoodItem, Ingredient, FoodProduct, Exposure, Lifestyle, AdverseEffect, SafetySignal, RiskFactor, TechnologyPlatform, Material, CohortParticipant, ExperienceReport, Association]
  liveIdProjection:
    # round 0009 seam: the live GraphQL `id: ID! @id` is the opaque segment of uid; uid is stored as its own property.
    rule: "live id = opaque segment of uid (text after the second colon); uid is stored beside id"
    storedLiveIdProperty: {default: id, Document: documentId, DocumentTextVersion: documentTextVersionId, Segmentation: segmentationId, Chunk: chunkId}
    opaqueIdMustBe: "globally unique and unrelated to any name (UUID or ULID) in production ingestion; the readable ids in ../examples/*.cypher are illustrative only"
  enumStyle: SCREAMING_SNAKE_CASE
  relationshipStyle: SCREAMING_SNAKE_CASE
  nullMeans: unknown_or_not_applicable
  nullBoundMeans: unknown          # round 0007: a null validTo is an unknown end, never "ongoing"
  timeIntervals: half_open
  quantityModel: value_plus_ucum_unit
  nodeMaturity: [CANDIDATE, PROVISIONAL, ACCEPTED, DEPRECATED]
  assertionStatus: [EXTRACTED, PROPOSED, ACCEPTED, REJECTED, DISPUTED, SUPERSEDED, UNRESOLVED]
  assertionStatusMeaning: >
    Workflow status of the record of what a source asserted (capture and attribution fidelity). ACCEPTED means
    "accepted as an accurate record of what this asserter said in this source". It is never a truth verdict:
    truth and support live on Adjudication.verdict (adjudicationKind SUPPORT) and on EvidenceAssessments. The
    stored status is a current projection of CAPTURE_FIDELITY adjudications and SUPERSEDES records; the
    historical status as of a recorded date is derived from those records, not from the stored field
    (rounds 0006 and 0007).
  adjudicationKind: [CAPTURE_FIDELITY, SUPPORT]      # round 0006 and 0007 reconciliation (integration ruling)
  adjudicationVerdict: [SUPPORTED, PARTIALLY_SUPPORTED, CONTRADICTED, INSUFFICIENT, NOT_APPLICABLE]
  reviewerType: [HUMAN, AGENT, POLICY, MIGRATION]      # round 0007
  privacyClass: [public, internal, private-personal]  # round 0008; "synthetic" is fixtureProvenance, not a privacy class
  privacyRule: >
    private-personal elements exist only in the private context store; internal elements live in the shared
    graph but are excluded from public projections; every node type and property declares a class
    (default public).
  basisKind: [DIRECT_MEASUREMENT, INFERRED_FROM_MEASUREMENT, CITED_FROM_PRIOR_WORK, HYPOTHESIS, CALCULATED]
  # basisKind: epistemic basis of the proposition in the source or in BellLabs (rounds 0003 and 0005).
  # CALCULATED marks a BellLabs-derived assertion that carries derivationRule and DERIVED_FROM_ASSERTION inputs.
  assertionBasis: [PERSONAL_EXPERIENCE, THIRD_PARTY_ANECDOTE, MANUFACTURER_CLAIM, STUDY_RESULT, MECHANISM_REASONING, EXPERT_OPINION, UNSTATED]
  # assertionBasis: on what basis the asserter presents the proposition (round 0006). Distinct from basisKind
  # and from live ClaimType (what the proposition is about).
  speechAct: [STATES, REPORTS_PRACTICE, RECOMMENDS, CAUTIONS, SPECULATES, QUESTIONS, DENIES]
  polarity: [POSITIVE, NEGATIVE, MIXED, UNKNOWN]
  timePrecision: [INSTANT, DAY, MONTH, QUARTER, YEAR, DECADE]
  timeBoundRule: a non-null bound is stored as the first UTC instant of its precision period
  validTimeBasis: [STATED_BY_SOURCE, PUBLICATION_PROXY, OBSERVATION_ONLY, INFERRED, UNKNOWN]
  supersessionKind: [SOURCE_CORRECTION, VALIDITY_BOUNDED, EXTRACTION_FIX, RESOLUTION_FIX, DUPLICATE_MERGE, RE_REVIEW, SOURCE_REVISION]
  sourceRevisionKind: [ERRATUM, RETRACTION, EXPRESSION_OF_CONCERN, CORRECTED_AND_REPUBLISHED, NEW_VERSION, SILENT_CONTENT_CHANGE, WITHDRAWAL, REINSTATEMENT]
  temporalCardinality: [EXCLUSIVE, NONEXCLUSIVE]
  temporalProfiles:
    bitemporal_attachment:   # round 0007: one contract for HAS_STATE and every domain attachment type
      required: [relationshipUid, recordedFrom, validFromBasis, validToBasis]
      optional: [validFrom, validTo, validFromPrecision, validToPrecision, recordedTo, assertionUid]
      rules:
        - one relationship per recorded-time episode
        - all properties immutable after commit except one write of recordedTo from null
        - recordedFrom is the commit transaction time assigned by the ingestion service and is never backdated
        - precision is required when its bound is non-null
        - OBSERVATION_ONLY or UNKNOWN basis requires the corresponding bound to be null
    asserted_edge:           # rounds 0007 and 0009: an asserted edge is a projection of exactly one Assertion
      extends: bitemporal_attachment
      required: [assertionUid]
      rules:
        - valid bounds, precisions, and bases equal those of the authorizing assertion
        - recordedFrom >= assertion.recordedAt; recordedTo equals assertion.recordedTo once closed
  relationshipClasses:
    structural: {meaning: defines the internal shape of a captured record}
    asserted: {meaning: authoritative only through an Assertion, profile: asserted_edge}
    derived:
      meaning: regenerable traversal shortcut; never the only history
      oneOf:
        - [projectionOfAssertionUid]                   # 1:1 projection of one asserted edge; cited predicate equals the edge type
        - [derivationRule, derivedFromAssertionUids]   # multi-hop derivation such as CONTAINS (round 0009 K-2)
      rule: the cited predicate is never the premise of a forbidden implication for the edge type
  predicateExclusivity:      # round 0009 K-6 and round 0007 TM-R5 (CQ-TM-05)
    HAS_FORMULATION_VERSION: {mode: EXCLUSIVE, scope: subject, partitionBy: [jurisdiction]}
    HAS_REGISTRATION_VERSION: {mode: EXCLUSIVE, scope: subject}
    HAS_PROTOCOL_EDITION: {mode: EXCLUSIVE, scope: subject}
    HAS_CONTEXT_VERSION: {mode: EXCLUSIVE, scope: subject}
    HAS_ADOPTION_VERSION: {mode: EXCLUSIVE, scope: subject}
    HAS_PACKAGE_CONFIGURATION: {mode: NONEXCLUSIVE}
    HAS_SHARING_GRANT: {mode: NONEXCLUSIVE}
    MARKETS_PRODUCT: {mode: NONEXCLUSIVE}
    MANUFACTURES_PRODUCT: {mode: NONEXCLUSIVE}
    SPONSORS_STUDY: {mode: NONEXCLUSIVE}
    ADVISES_ORGANIZATION: {mode: NONEXCLUSIVE}
    LISTS_OFFER: {mode: NONEXCLUSIVE}
    default: NONEXCLUSIVE
  sourceKind: [PEER_REVIEWED_PUBLICATION, PREPRINT, CORRECTION_NOTICE, RETRACTION_NOTICE, EXPRESSION_OF_CONCERN, REGULATORY_RECORD, REGULATORY_GUIDANCE, SECURITIES_FILING, PRESS_RELEASE, MARKETING_PAGE, MANUFACTURER_LABEL_PAGE, ORGANIZATION_WEBPAGE, SELF_DISCLOSURE_PAGE, THIRD_PARTY_PROFILE_PAGE, THIRD_PARTY_DIRECTORY, CERTIFICATION_LISTING, AUDIT_REPORT, MARKETPLACE_LISTING, TERMINOLOGY_RECORD, STANDARDS_DOCUMENT, PODCAST_TRANSCRIPT_PAGE, VIDEO_RENDITION, AUDIO_FEED_ITEM, PODCAST_DIRECTORY_RECORD, NEWSLETTER, MODEL_SERVICE, LEGAL_RECORD]
  selectorKind: [TEXT_QUOTE, TEXT_POSITION, MEDIA_TIME, PDF_PAGE, IMAGE_REGION]
  contentHashBasis: [RAW_BYTES, NORMALIZED_TEXT, STORED_EXCERPT_TEXT]
  captureCompleteness: [COMPLETE, PARTIAL_EXCERPT, UNKNOWN]
  normalizationVersions:
    NFC-WS1: "Unicode NFC, every run of whitespace replaced by one U+0020, leading and trailing whitespace removed; sha256 over UTF-8; written 'sha256:<hex>'"
  qualificationKind: [INDIVIDUAL_VARIATION, POPULATION_SCOPE, SPECIES_OR_MODEL, QUANTITY_BASIS, UNCERTAINTY_INTERVAL, NEEDS_CONFIRMATION, HEDGE, TIME_SCOPE, CONDITIONAL_USE, CONSULT_PROFESSIONAL]
  retellingMode: [VERBATIM_QUOTE, PARAPHRASE, SUMMARY, TRANSLATION]
  retellingLinkBasis: [EXPLICIT_CITATION, BELLLABS_MATCH]
  relevanceLevel: [DIRECT, INDIRECT, NOT_RELEVANT, UNKNOWN]
  relevanceBasis: [SAME_PRODUCT, SAME_ORGANIZATION, COMPETING_PRODUCT, SAME_SUBSTANCE, SAME_SUBSTANCE_CLASS_VIA_GROUP, SPONSOR_OF_CONTAINER, NO_PATH_FOUND]
  disclosureFinding: [DISCLOSED_IN_CONTAINER, DISCLOSED_ELSEWHERE, NOT_FOUND_IN_PARTIAL_CAPTURE, NOT_DISCLOSED, UNKNOWN]
  temporalOverlap: [OVERLAPS, DISJOINT, UNKNOWN]
  activityKind: [CAPTURE, TRANSCRIPTION, TEXT_EXTRACTION, SEGMENTATION, EXTRACTION, RESOLUTION, REANCHORING, ADJUDICATION, ANSWER_COMPOSITION]
  agentKind: [MANUAL_AGENT, AUTOMATED_AGENT, TEXT_MINING_AGENT, DATA_ANALYSIS_PIPELINE, COMPUTATIONAL_MODEL, MANUAL_VALIDATION_OF_AUTOMATED_AGENT]
  useKind: [QUOTE_IN_ANSWER, SUMMARIZE_IN_ANSWER, USE_AS_RECOMMENDATION_EVIDENCE, SHARE_EXTERNALLY]
  equivalenceKind: [SAME_WORK_DIFFERENT_NAME, OVERLAPPING_SCOPE, RELATED_NOT_EQUIVALENT, NOT_EQUIVALENT]
  applicabilityVerdict: [MATCH, PARTIAL, MISMATCH, UNKNOWN, NOT_ASSESSED, NOT_APPLICABLE, NOT_SCORED]
  applicabilityDimension: [MATERIAL_IDENTITY, ACTIVE_COMPOSITION, DOSE, DOSAGE_FORM, ROUTE, SCHEDULE, DURATION, POPULATION, COMPARATOR, OUTCOME_RELEVANCE, STUDY_DESIGN_AND_QUALITY, EXPOSURE, BACKGROUND_CONTEXT, RECENCY_AND_CORRECTIONS]
  dimensionClass: [CATEGORICAL, CONTINUOUS, EXPLANATION_ONLY]
  materialIdentityLevel: [SAME_LOT, SAME_FORMULATION_VERSION, SAME_VARIANT_FORMULATION_UNRESOLVED, SAME_BRANDED_MATERIAL_SAME_SPEC, SAME_BRANDED_MATERIAL_SPEC_UNRESOLVED, SAME_SUBSTANCE_SAME_FORM_DIFFERENT_MATERIAL, SAME_SUBSTANCE_MATERIAL_UNRESOLVED, SAME_SUBSTANCE_DIFFERENT_FORM, RELATED_SUBSTANCE, DIFFERENT]
  quantityBasis: [PER_DAY, PER_DOSE, PER_SERVING, PER_KG_BODY_WEIGHT_PER_DAY, SINGLE_DOSE]
  massBasis: [SALT_FORM, ACTIVE_MOIETY, MATERIAL_AS_IS, UNSPECIFIED]
  amountReferent: [NUTRIENT_AS_NUTRIENT, LISTED_INGREDIENT_AS_LISTED, PROPRIETARY_BLEND_TOTAL, EXTRACT_TOTAL, MARKER_CONSTITUENT, NOT_STATED]
  measureKind: [BIOMARKER, PERFORMANCE_OUTCOME, PATIENT_REPORTED_OUTCOME, CLINICIAN_REPORTED_OUTCOME, OBSERVER_REPORTED_OUTCOME, CLINICAL_EVENT]
  endpointClass: [BIOMARKER_NOT_SURROGATE, SURROGATE_ENDPOINT, INTERMEDIATE_CLINICAL_ENDPOINT, CLINICAL_OUTCOME]
  biomarkerCategory: [SUSCEPTIBILITY_RISK, DIAGNOSTIC, MONITORING, PROGNOSTIC, PREDICTIVE, PHARMACODYNAMIC_RESPONSE, SAFETY]
  surrogateValidationLevel: [VALIDATED, REASONABLY_LIKELY, CANDIDATE, NOT_ESTABLISHED]
  outcomePriority: [PRIMARY, SECONDARY, OTHER_PRESPECIFIED, POST_HOC, SAFETY]
  analysisKind: [PRIMARY_PRESPECIFIED, SECONDARY_PRESPECIFIED, SUBGROUP_PRESPECIFIED, SUBGROUP_POST_HOC, EXPLORATORY, SAFETY]
  comparisonKind: [BETWEEN_ARM, WITHIN_ARM_CHANGE, ARM_DESCRIPTIVE]
  statisticalConclusion: [SIGNIFICANT_FAVORABLE, SIGNIFICANT_UNFAVORABLE, NOT_SIGNIFICANT, NOT_TESTED, NOT_REPORTED]
  resultInterpretation: [EFFECT_DETECTED, INCONCLUSIVE, EVIDENCE_OF_NO_MEANINGFUL_EFFECT]
  synthesisInputRole: [CONFIRMATORY, SUPPORTIVE, HYPOTHESIS_GENERATING, CONTRADICTING, SAFETY, INDEPENDENT_REPLICATION]
  evidenceChangeEffect: [STRENGTHENED, WEAKENED, REVERSED, NO_CHANGE]
  aeCollectionMethod: [SYSTEMATIC, SPONTANEOUS, NOT_DESCRIBED]
  datasetAnalysisRole: [PRIMARY_REPORT, SECONDARY_ANALYSIS, POOLED_ANALYSIS, REANALYSIS]
  publicationKind: [ARTICLE, AUTHOR_CORRECTION, ERRATUM, RETRACTION_NOTICE, EXPRESSION_OF_CONCERN, PREPRINT, CONFERENCE_ABSTRACT]
  registryDateType: [ACTUAL, ANTICIPATED]
  enrollmentCountType: [ACTUAL, ESTIMATED]
  mechanismSetting: [IN_VITRO_CELL_FREE, IN_VITRO_CELL, EX_VIVO, IN_VIVO_NONMAMMAL, IN_VIVO_MAMMAL, HUMAN_INTERVENTIONAL, HUMAN_OBSERVATIONAL, IN_SILICO]
  exposureBasis: [PER_KG_BODY_WEIGHT_PER_DAY, ABSOLUTE_PER_DAY, SINGLE_DOSE, MEDIUM_CONCENTRATION, DIET_CONCENTRATION]
  resultKind: [MEASURED, CALCULATED, INFERRED]
  algorithmOutputKind: [AGE_ESTIMATE, PACE, RISK_SCORE, FEATURE_MEASURE, CLASSIFICATION, CALCULATED_QUANTITY]
  algorithmVersionBasis: [VENDOR_VERSION_STRING, PUBLICATION_VERSION, SERVICE_ENDPOINT_UNVERSIONED, UNKNOWN]
  referenceIntervalKind: [REFERENCE_INTERVAL, DECISION_LIMIT, GUIDELINE_TARGET]
  referenceIntervalDerivation: [ESTABLISHED, TRANSFERRED, VERIFIED, ADOPTED_FROM_MANUFACTURER, NOT_REPORTED]
  comparabilityVerdict: [COMPARABLE, COMPARABLE_WITH_CONVERSION, NOT_COMPARABLE, UNKNOWN]
  reportedStatus: [REPORTED, NOT_REPORTED, NOT_APPLICABLE]
  regulatoryStatusKind: [APPROVAL, CLEARANCE, DE_NOVO_AUTHORIZATION, DESIGNATION, ESTABLISHMENT_REGISTRATION, NOTIFICATION_ON_FILE, ENFORCEMENT_DISCRETION, WITHDRAWN, REVOKED]
  regulatoryResponseKind:
    NDI_NOTIFICATION: [NDI_ACKNOWLEDGED_WITHOUT_OBJECTION, NDI_INCOMPLETE, NDI_OBJECTION, NDI_OTHER_REGULATORY_ISSUE]
    GRAS_NOTICE: [GRAS_NO_QUESTIONS, GRAS_NO_BASIS, GRAS_CEASED_AT_NOTIFIER_REQUEST]
    PREMARKET_NOTIFICATION_510K: [SUBSTANTIALLY_EQUIVALENT, NOT_SUBSTANTIALLY_EQUIVALENT]
    DE_NOVO: [DE_NOVO_GRANTED, DE_NOVO_DECLINED]
    PMA: [PMA_APPROVED, PMA_DENIED, PMA_APPROVABLE, PMA_NOT_APPROVABLE]
    NDA_BLA: [APPROVED, COMPLETE_RESPONSE]
    ORPHAN_DESIGNATION: [ORPHAN_DESIGNATION_GRANTED, ORPHAN_DESIGNATION_DENIED, ORPHAN_DESIGNATION_REVOKED]
    ESTABLISHMENT_REGISTRATION: [REGISTRATION_ACTIVE, REGISTRATION_CANCELLED]
  capabilityStage: [OPERATING, PILOTING, PLANNED, SUSPENDED, DISCONTINUED]
  capacityBasis: [NAMEPLATE, UTILIZED, NOT_REPORTED]
  priceKind: [LIST, ONE_TIME, SUBSCRIPTION, COUPON_ADJUSTED, PER_UNIT]

baseArchetypes:
  Entity:
    required: [uid, entityType, createdAt]
    optional: [privacyClass, schemaVersion, maturity]
  VersionedState:
    required: [uid, stateType, createdAt, payloadHash]      # round 0007: replay compares state identity by hash
    optional: [effectiveFrom, effectiveTo, privacyClass]    # effective bounds are source-stated payload; query validity comes from the attachment episode
  Occurrence:
    required: [uid, occurrenceType, createdAt]
    optional: [startedAt, endedAt, privacyClass]
  InformationArtifact:
    required: [uid, artifactType, createdAt]
    optional: [publishedAt, observedAt, contentHash, privacyClass]
  Assertion:
    # Kernel changes accepted in 0.2.0: polarity (K-4), basisKind (KCR-3a, KCR-L3-001), recordedTo and contentHash
    # (KCR-0007-1), per-bound precision and basis (round 0007), assertionBasis and speechAct (KCR-4.2),
    # derivationRule for CALCULATED assertions. `confidence` is deprecated for new writes (INV-407).
    required: [uid, predicate, status, recordedAt, contentHash, validFromBasis, validToBasis]
    optional: [valueString, valueNumber, valueBoolean, unitCode, validFrom, validTo, validFromPrecision, validToPrecision, recordedTo, polarity, basisKind, predicateClass, assertionBasis, speechAct, reportedSpeechAct, quantityBasis, derivationRule, jurisdiction, extractionMethod, extractionConfidence, agentRunUid, roleTitleVerbatim, statedTense]
    deprecated:
      confidence: "replaced by extractionConfidence, which requires WAS_GENERATED_BY an Activity with methodVersion; existing 0.1.0 values are read as extractionConfidence with unknown method"
      agentRunUid: "retained for 0.1.0 compatibility; new writes link WAS_GENERATED_BY an Activity"
    statusSemantics: current_projection_of_capture_fidelity_adjudications_and_supersession
    rules:
      - valid time, literal value, subject and object are immutable after commit; a change in belief is a new Assertion linked by SUPERSEDES
      - recordedTo is written once, from null, when the assertion is superseded or withdrawn
      - exactly one subject; exactly one object or one typed literal
      - at most one asserter (ASSERTED_BY); corroboration is several Assertions INSTANCE_OF one Claim (round 0006 KCR-4.3)
      - basisKind is required when predicateClass is MECHANISM; CALCULATED requires derivationRule and at least one DERIVED_FROM_ASSERTION
  EvidenceAssessment:
    required: [uid, assessmentType, methodVersion, status, createdAt, recordedAt]   # round 0007 KCR-0007-2 and round 0002 KCR-2a
    optional: [summary, overallScore, confidence, privacyClass]
    rules:
      - assessments are immutable; a re-assessment is a new node linked by SUPERSEDES
      - a composite score requires methodVersion and all required dimensions; missing dimensions are never averaged away

modules:
  provenance:
    maturity: accepted
    privacyClass: public
    nodes:
      Source:
        archetype: Entity
        description: Stable identity of a retrieval endpoint (one canonicalUri) for a publisher page, registry record, database record, document, or media rendition. Live Document is carried as a Source (round 0006).
        properties: [canonicalUri, title, sourceKind, publisherUid]
      SourceSnapshot:
        archetype: InformationArtifact
        description: Captured content from a Source at a known retrieval time, with a hash whose basis is named. Immutable; a change at the source is a new snapshot and a SourceRevisionEvent.
        properties: [canonicalUri, publishedAt, publishedAtPrecision, observedAt, retrievedAt, contentHash, contentHashBasis, captureCompleteness, storageUri, archiveUri, publisherRevisionNotice, mimeType, language]
        requiredWhenCited: [contentHash, contentHashBasis, retrievedAt]   # round 0009 and 0006: reproducibility of an ACCEPTED assertion's support
        timeFields: {retrievedAt: when BellLabs fetched the bytes, observedAt: the instant the content is known to have been displayed (archive capture date for late sources), publishedAt: issue time stated by the source}
      SourceLocator:
        archetype: InformationArtifact
        description: Stable locator for the exact span, time range, page, or region supporting an assertion, bound to one SourceSnapshot. Round 0006 (KCR-4.1) replaces the untyped selector with typed selector fields; closes OPEN-QUESTIONS P0-5.
        properties: [uri, selectorKind, exact, prefix, suffix, quoteHash, normalizationVersion, startOffset, endOffset, mediaStartSeconds, mediaEndSeconds, mediaTimeBasis, page, section, mediaAnnotationUid, speakerLabelInSource]
        requiredBySelectorKind:
          TEXT_QUOTE: [exact, quoteHash, normalizationVersion]
          TEXT_POSITION: [exact, quoteHash, normalizationVersion, startOffset, endOffset, LOCATOR_IN_TEXT_VERSION]
          MEDIA_TIME: [exact, quoteHash, normalizationVersion, mediaStartSeconds, mediaEndSeconds]
          PDF_PAGE: [page, exact, quoteHash, normalizationVersion]
          IMAGE_REGION: [mediaAnnotationUid, normalizationVersion]
        deprecated: {selector: "untyped; split into the fields above"}
      DocumentTextVersion:
        archetype: InformationArtifact
        description: Live type kept. A text rendition derived from exactly one SourceSnapshot by a named Activity (publisher text, PDF extraction, transcription). Character offsets are defined only relative to a text version.
        properties: [textVersionHash, source, versionLabel, normalizationVersion]
      SourceRevisionEvent:
        archetype: Occurrence
        description: A correction, retraction, expression of concern, new version, silent change, withdrawal, or reinstatement of a Source, as issued by its publisher and as learned by BellLabs (round 0007 KCR-0007-3; closes OPEN-QUESTIONS P0-4).
        properties: [revisionKind, occurredAt, occurredAtPrecision, recordedAt]
      Adjudication:
        archetype: EvidenceAssessment
        description: Immutable BellLabs evaluation of one or more assertions. adjudicationKind CAPTURE_FIDELITY judges whether the record is an accurate capture (feeds Assertion.status); SUPPORT judges whether evidence supports the proposition (verdict). A re-review is a new Adjudication linked by SUPERSEDES.
        properties: [adjudicationKind, verdict, rationale, reviewerType, reviewedAt, recordedAt]
      ResolutionHypothesis:
        archetype: EvidenceAssessment
        description: Scored candidate identity, equivalence, or retelling-source resolution that may compete with alternatives.
        properties: [resolutionType, score, rationale, resolutionStatus]
      Agent:
        archetype: Entity
        description: A software or human agent identity (model, prompt, tool version). Runs are Activities, not Agent properties (round 0006 KCR-4.4).
        properties: [name, agentKind, model, promptVersion, toolVersion]
      Activity:
        archetype: Occurrence
        description: A bounded process that used and generated records (capture, transcription, segmentation, extraction, resolution, re-anchoring, adjudication, answer composition). Maps to prov:Activity. Live mongoResearchRunId maps to externalRunSystem and externalRunId.
        properties: [activityKind, startedAt, endedAt, methodVersion, externalRunSystem, externalRunId]
    relationships:
      HAS_SNAPSHOT: {from: Source, to: SourceSnapshot, class: structural}
      HAS_LOCATOR: {from: SourceSnapshot, to: SourceLocator, class: structural, cardinality: exactly_one_snapshot_per_locator}
      HAS_TEXT_VERSION: {from: Source, to: DocumentTextVersion, class: structural}
      TEXT_OF_SNAPSHOT: {from: DocumentTextVersion, to: SourceSnapshot, class: structural, cardinality: exactly_one}
      LOCATOR_IN_TEXT_VERSION: {from: SourceLocator, to: DocumentTextVersion, class: structural, cardinality: zero_or_one}
      REANCHORS: {from: SourceLocator, to: SourceLocator, class: structural, requiredProperties: [anchorMatch], note: newer snapshot locator to older snapshot locator of the same Source}
      RENDITION_OF: {from: Source, to: "Episode|Publication", class: structural}
      HAS_SUBJECT: {from: Assertion, to: "Entity|VersionedState|Occurrence|InformationArtifact", class: structural, cardinality: exactly_one}
      HAS_OBJECT: {from: Assertion, to: "Entity|VersionedState|Occurrence|InformationArtifact", class: structural, cardinality: zero_or_one}
      SUPPORTED_BY: {from: "Assertion|Adjudication|EvidenceAssessment", to: SourceLocator, class: asserted}
      CONTRADICTED_BY: {from: "Assertion|Adjudication", to: SourceLocator, class: asserted}
      ASSERTED_BY: {from: Assertion, to: "Person|Organization|Agent|PseudonymousActor|AnonymousActor", class: structural, cardinality: at_most_one, note: exactly_one for ClaimOccurrence}
      EVALUATES: {from: Adjudication, to: Assertion, class: structural}
      CONSIDERS_ASSESSMENT: {from: Adjudication, to: EvidenceAssessment, class: structural}
      SUPERSEDES: {from: "Assertion|Adjudication|EvidenceAssessment", to: "Assertion|Adjudication|EvidenceAssessment", class: structural, sameLabelRequired: true, properties: [supersessionKind, recordedAt, sourceRevisionEventUid], rule: newer.recordedAt >= older.recordedAt; a SUPERSEDED status requires an incoming SUPERSEDES}
      DERIVED_FROM_ASSERTION: {from: Assertion, to: Assertion, class: structural, note: inputs of a CALCULATED assertion (round 0005 KCR-L3-001)}
      REVISES_SOURCE: {from: SourceRevisionEvent, to: Source, class: structural, cardinality: exactly_one}
      PRIOR_SNAPSHOT: {from: SourceRevisionEvent, to: SourceSnapshot, class: structural, cardinality: zero_or_one}
      RESULTING_SNAPSHOT: {from: SourceRevisionEvent, to: SourceSnapshot, class: structural, cardinality: zero_or_one}
      ANNOUNCED_IN: {from: SourceRevisionEvent, to: SourceSnapshot, class: structural, cardinality: zero_or_one}
      PROPOSES_MATCH: {from: ResolutionHypothesis, to: "Entity|VersionedState|InformationArtifact|Assertion", class: structural}
      COMPETES_WITH: {from: ResolutionHypothesis, to: ResolutionHypothesis, class: structural}
      WAS_GENERATED_BY: {from: "Assertion|SourceSnapshot|DocumentTextVersion|SourceLocator|EvidenceAssessment", to: Activity, class: structural}
      USED: {from: Activity, to: "SourceSnapshot|SourceLocator|Assertion|DocumentTextVersion", class: structural}
      WAS_ASSOCIATED_WITH: {from: Activity, to: "Agent|Person", class: structural}
      ACTED_ON_BEHALF_OF: {from: Agent, to: Organization, class: structural}
      AUTHORIZED_BY: {from: Activity, to: PolicyVersion, class: structural, requiredProperties: [useKind]}
      ASSESSED_BY: {from: EvidenceAssessment, to: "Agent|Person", class: structural}
    assertedPredicates:
      - CORRECTS_SOURCE          # notice Source -> corrected Source or Publication
      - RETRACTS_SOURCE
      - EXPRESSES_CONCERN_ABOUT
      - REINSTATES_SOURCE
    provenanceStates:   # round 0006 (CQ-PV-01), PROV-O alignment
      someone_said_it: Assertion + ASSERTED_BY
      a_source_supports_it: SUPPORTED_BY -> SourceLocator in a SourceSnapshot
      evidence_warrants_a_broader_conclusion: EvidenceAssessment or Adjudication (SUPPORT)
      an_agent_used_the_source: Activity with USED, WAS_GENERATED_BY, WAS_ASSOCIATED_WITH
      a_policy_allows_a_downstream_use: AUTHORIZED_BY {useKind} -> PolicyVersion
    forbiddenImplications:
      - [ASSERTION_STATUS_ACCEPTED, PROPOSITION_TRUE]
      - [CORRECTS_SOURCE, FACT_CEASED]
      - [NOT_FOUND_IN_PARTIAL_CAPTURE, NOT_DISCLOSED]

  temporal:
    maturity: provisional
    privacyClass: public
    description: Executable time model (round 0007). Owns the bitemporal_attachment and asserted_edge profiles, timePrecision, validTimeBasis, supersessionKind, predicateExclusivity declarations, and the as-of query contract (../ontology-lab/query-shapes.md QS-2).
    relationships:
      HAS_STATE: {from: Entity, to: VersionedState, class: asserted, temporalProfile: bitemporal_attachment, temporalCardinality: NONEXCLUSIVE, note: generic attachment when no domain type exists}
    rules:
      - {id: TM-R1, rule: Valid time on an Assertion or attachment episode is never edited; a change in belief is a new recorded-time episode.}
      - {id: TM-R2, rule: A correction supersedes with SOURCE_CORRECTION and leaves the corrected state without a current attachment for the corrected interval.}
      - {id: TM-R3, rule: A fact ending supersedes with VALIDITY_BOUNDED; the old state stays attached for its bounded interval in current recorded time.}
      - {id: TM-R4, rule: Recorded time is service-assigned and never earlier than the supporting snapshot's retrievedAt.}
      - {id: TM-R5, rule: Mutually exclusive attachments may not definitely overlap in both valid and recorded time; possible overlaps (unknown or imprecise bounds) are queued for review.}
      - {id: TM-R6, rule: A late-arriving historical fact keeps its past validFrom; recordedFrom is the commit time; the archive capture time goes in SourceSnapshot.observedAt.}

  identity_resolution:
    maturity: provisional
    privacyClass: public
    nodes:
      Identifier:
        archetype: Entity
        description: An external identifier with its scheme and issuer (NCT, PMID, DOI, UNII, CAS, LOINC, GTIN, patent and FDA submission numbers). Names never establish identity; identifiers do so only within a scheme and a validity interval.
        properties: [scheme, value, issuer, jurisdiction, validFrom, validTo, normalizationRule]
        uniqueness: [scheme, issuer, value]
      TradeItemIdentifier: {archetype: Entity, parentLabel: Identifier, properties: [scheme, value, issuer, jurisdiction]}
      Mention: {archetype: InformationArtifact, properties: [surfaceForm, mentionKind], note: extracted before any entity is created; linked to a locator}
      EquivalenceAssessment:
        archetype: EvidenceAssessment
        description: Assessment that two distinct identities are the same work under different names, overlap, or are related. It never merges them (round 0006, CQ-EC-02).
        properties: [equivalenceKind, methodVersion, status, rationale]
    relationships:
      HAS_IDENTIFIER: {from: "Entity|VersionedState|InformationArtifact", to: Identifier, class: asserted}
      MENTIONS: {from: SourceLocator, to: Mention, class: structural}
      RESOLVES_MENTION: {from: ResolutionHypothesis, to: Mention, class: structural}
      COMPARES_IDENTITIES: {from: EquivalenceAssessment, to: "Entity|VersionedState", class: structural, cardinality: exactly_two_distinct}
    rules:
      - a merged uid keeps a redirect record so private snapshots that hold the old uid keep resolving (open: redirect contract, OPEN-QUESTIONS)
    forbiddenImplications:
      - [SIMILAR_NAME, SAME_IDENTITY]
      - [SHARED_IDENTIFIER_SCHEME_VALUE_ACROSS_ISSUERS, SAME_IDENTITY]

