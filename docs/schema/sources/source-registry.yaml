policy:
  principle: Authority is claim-specific, not organization-global.
  provenance: Entries added in 0.2.0 carry addedBy naming the ontology-lab round that relies on them. Locators and modeling consequences are stored, never page dumps. Entries whose URL could not be fetched directly in the authoring session say so in notes or verification fields; they are still claim-scoped, not endorsements.
  fields:
    authorityFor: Questions for which the source is normally primary or highly relevant.
    notAuthorityFor: Inferences the source cannot establish by itself.

