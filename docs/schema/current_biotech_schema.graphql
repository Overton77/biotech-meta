type Organization implements Entity & SearchIndexable @node @fulltext(indexes: [{indexName: "OrganizationName", fields: ["name", "searchText", "legalName", "displayName", "canonicalTicker"], queryName: "searchOrganizationsByName"}]) @vector(indexes: [{indexName: "OrganizationSearchEmbedding", provider: OPEN_AI, embeddingProperty: "searchEmbedding", queryName: "searchOrganizationsBySemanticText"}]) {
  id: ID! @id
  name: String!
  description: String
  mongoResearchRunId: String
  createdAt: DateTime! @timestamp(operations: [CREATE])
  updatedAt: DateTime! @timestamp(operations: [CREATE, UPDATE])
  searchText: String
  searchFields: [String!]
  embeddingModel: String
  embeddingDimensions: Int
  canonicalTicker: String
  legalName: String
  displayName: String
  organizationType: OrganizationType
  active: Boolean
  incorporatedOn: DateTime
  dissolvedOn: DateTime
  operatingFrom: DateTime
  operatingTo: DateTime
  foundedYear: Int
  fundingStage: FundingStage
  totalFundingUsd: Float
  employeeCountMin: Int
  employeeCountMax: Int
  employeeCountEstimate: Int
  employeeCountBand: EmployeeCountBand
  employeeCountRaw: String
  revenueModel: String
  valueChainStages: [String!]
  sector: String
  websiteUrl: String
  headquartersSummary: String
  operatingSummary: String
  marketCapUsd: Float
  pipelineSummary: String
  competitivePositionSummary: String
  isPublicCompany: Boolean
  isInvestor: Boolean
  isProviderOrganization: Boolean
  isResearchOrganization: Boolean
  isManufacturer: Boolean
  """Marks the timestamp of the current materialized state on this node."""
  currentAsOf: DateTime
  """
  Canonical semantic search embedding for the organization identity/current record.
  """
  searchEmbedding: [Float!]
  """
  Optional historical milestone snapshots.
  Non-temporal linkage only.
  """
  snapshots: [OrganizationSnapshot!]! @relationship(type: "HAS_SNAPSHOT", direction: OUT)
  listings: [Listing!]! @relationship(type: "LISTS", direction: OUT, properties: "ListingMetadata")
  locations: [PhysicalLocation!]! @relationship(type: "HAS_LOCATION", direction: OUT, properties: "TemporalMetadata")
  developsPlatforms: [TechnologyPlatform!]! @relationship(type: "DEVELOPS_PLATFORM", direction: OUT, properties: "RoleMetadata")
  usesPlatforms: [TechnologyPlatform!]! @relationship(type: "USES_PLATFORM", direction: OUT, properties: "UsageMetadata")
  usesTools: [ToolOrInstrument!]! @relationship(type: "USES", direction: OUT, properties: "UsageMetadata")
  offersProducts: [Producible!]! @relationship(type: "OFFERS", direction: OUT, properties: "RoleMetadata")
  offersProcedures: [Procedure!]! @relationship(type: "OFFERS_PROCEDURE", direction: OUT, properties: "RoleMetadata")
  developsTreatments: [Treatment!]! @relationship(type: "DEVELOPS_TREATMENT", direction: OUT, properties: "RoleMetadata")
  offersTreatments: [Treatment!]! @relationship(type: "OFFERS_TREATMENT", direction: OUT, properties: "RoleMetadata")
  worksOnConditions: [Condition!]! @relationship(type: "WORKS_ON_CONDITION", direction: OUT, properties: "RoleMetadata")
  manufactures: [Producible!]! @relationship(type: "MANUFACTURES", direction: OUT, properties: "RoleMetadata")
  performsProcesses: [ManufacturingProcess!]! @relationship(type: "PERFORMS_PROCESS", direction: OUT, properties: "RoleMetadata")
  controls: [Organization!]! @relationship(type: "CONTROLS", direction: OUT, properties: "OwnershipMetadata")
  contractsManufacturing: [ContractManufacturingTarget!]! @relationship(type: "CONTRACTS_MANUFACTURING", direction: OUT, properties: "RoleMetadata")
  sponsors: [Sponsorable!]! @relationship(type: "SPONSORS", direction: OUT, properties: "RoleMetadata")
  exhibitsAt: [Conference!]! @relationship(type: "EXHIBITS_AT", direction: OUT, properties: "RoleMetadata")
  operatesChannels: [Channel!]! @relationship(type: "OPERATES_CHANNEL", direction: OUT, properties: "RoleMetadata")
  employs: [Person!]! @relationship(type: "EMPLOYS", direction: OUT, properties: "RoleMetadata")
  hasBoardMembers: [Person!]! @relationship(type: "HAS_BOARD_MEMBER", direction: OUT, properties: "RoleMetadata")
  foundedBy: [Person!]! @relationship(type: "FOUNDED_BY", direction: OUT, properties: "RoleMetadata")
  hasCeos: [Person!]! @relationship(type: "HAS_CEO", direction: OUT, properties: "TemporalMetadata")
}

