    rounds: [0005]

  regulatory_and_ip:
    maturity: provisional
    dependencies: [kernel, provenance, temporal, identity_resolution, organizations, products_and_formulations, diagnostics]
    owns: [PatentFamily, PatentApplication, GrantedPatent, PatentClaim, PatentLicense, RegulatoryAgency, RegulatoryPathway, RegulatoryStep, RegulatorySubmission, RegulatoryResponse, RegulatoryStatus, OrphanDesignation, DrugApproval, APPLICATION_GRANTED_AS, LICENSE_COVERS, SUBMITTED_BY, SUBMISSION_ABOUT, SUPERSEDES_SUBMISSION, STATUS_OF, DESIGNATION_FOR, APPROVAL_FOR]
    externalAuthorities: [FDA_eCFR_21, FDA_GRAS_notice_inventory, FDA_NDI_notifications, FDA_510k_DeNovo_PMA_databases]
    rounds: [0005]

  manufacturing_readiness:
    maturity: candidate
    dependencies: [kernel, provenance, temporal, organizations, products_and_formulations]
    owns: [ManufacturingCapability, HAS_CAPABILITY_STATE]
    rounds: [0005]

  claims_and_documents:
    maturity: provisional
    dependencies: [kernel, provenance, temporal, identity_resolution, organizations]
    owns: [Document, Episode, EpisodeSegment, Channel, Series, Platform, Segmentation, Chunk, Claim, ClaimOccurrence, RelationshipAssertion, ClaimEvidenceAssessment, RetellingFidelityAssessment, ConflictRelevanceAssessment, APPEARS_IN, RESOLVES_TO_CHUNK, INSTANCE_OF, SUPPORTED_BY_CHUNK, assertionBasis, speechAct]
    liveSeams: [Document -> Source, ClaimOccurrence -> (:Assertion:ClaimOccurrence), UTTERED_BY -> ASSERTED_BY, SUPPORTED_BY->Chunk -> derived with locatorUid, mongoResearchRunId -> Activity.externalRunId]
    rounds: [0006]

  media:
    maturity: future
    dependencies: [kernel, provenance, claims_and_documents]
    owns: [MediaAsset, MediaVariant, MediaAnnotation, MediaSource, GraphView, FigurePanel, ProductLabelRegion]
    note: live media types kept as seams; MediaAnnotation may act as an IMAGE_REGION locator (round 0006); no round has opened media semantics

  events_and_narrative:
    maturity: future
    dependencies: [kernel, provenance, organizations, claims_and_documents]
    owns: [Community, Conference, Event, NarrativeArc]
    note: live types kept as seams; SPONSORS_CONTENT may target Conference

  protocols:
    maturity: provisional
    dependencies: [kernel, provenance, temporal, identity_resolution, substances_and_materials, products_and_formulations, diagnostics]
    owns: [Protocol, ProtocolEdition, ProtocolStep, Constraint, MeasurementPlan, ProtocolAdjustmentRule, Target, FunctionalGoal, Observation, ProtocolResult, HAS_PROTOCOL_EDITION, HAS_FUNCTIONAL_GOAL, FOR_PROTOCOL]
    note: Observation ownership decided in round 0008 (public, protocol-linked, source-attributed); private measurements are PersonalMeasurement
    rounds: [0008]

  safety_and_constraints:
    maturity: candidate
    dependencies: [kernel, provenance, temporal, substances_and_materials, products_and_formulations, studies_and_evidence]
    owns: [SafetySignal, ContraindicationAssertion, InteractionAssertion, UseConstraint]
    open: [SafetySignal as EvidenceAssessment over AdverseEventResult (round 0002 OQ-L2-10)]

  recommendation_decisions:
    maturity: provisional
    dependencies: [kernel, provenance, temporal, products_and_formulations, commerce, studies_and_evidence, safety_and_constraints, private_context]
    owns: [RecommendationRequest, RecommendationSnapshot, RecommendationOption, DecisionCriterionValue, UserDecision, PolicyVersion, DecisionCriterion]
    placement: private_context_store_except_PolicyVersion_and_DecisionCriterion
    rule: recommendations_are_private_decision_occurrences_not_timeless_product_edges
    rounds: [0008]

  private_context:
    maturity: provisional
    dependencies: [kernel, temporal, protocols, diagnostics]   # recommendation_decisions depends on this module, not the reverse
    owns: [UserContext, UserContextVersion, UserGoal, UserGoalVersion, PersonalMeasurement, PersonalLabReport, ProtocolInUse, ProtocolAdoptionVersion, ProtocolDeviation, SharingGrant, DisclosureEvent, PendingItem, PurchaseEvent, PersonalApplicabilityAssessment, ErasureTombstone]
    placement: private_context_store
    rounds: [0008]

  access_and_answers:
    maturity: candidate
    dependencies: [kernel, provenance, temporal]
    owns: [AnswerRecord]
    rounds: [0009]

projectionRules:
  - A module may depend only on the kernel or on explicitly declared modules.
  - Shared modules do not transfer ownership of their terms to consumers.
  - Imported external identifiers retain their source namespace and version metadata (Identifier records).
  - A projection may expose an external endpoint identity without importing the endpoint's full module.
  - Recommendation projections must include provenance, temporal, evidence, safety, and policy-version surfaces.
  - A projection with accessTier PUBLIC_ANSWER, OPERATOR_AUDIT or AGENT_PROJECTION never includes a private-personal module; private records are reached only by uid from the private context store.
  - Live GraphQL types that no module owns yet (media, events_and_narrative, consumer_devices) are seams: they keep their live meaning and are projected unchanged.
