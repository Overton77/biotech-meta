  consumer_devices:
    maturity: future
    dependencies: [kernel, provenance, temporal, identity_resolution, organizations, diagnostics]
    owns: [Device, DeviceModel, FirmwareVersion, Sensor, Modality, DeviceObservation]
    note: firmware version is treated as AssayVersion.softwareVersion until a round opens this module

  quality:
    maturity: provisional
    dependencies: [kernel, provenance, temporal, products_and_formulations, substances_and_materials, organizations]
