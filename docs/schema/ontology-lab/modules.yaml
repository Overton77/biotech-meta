manifest:
  name: belllabs-biotech-ontology-modules
  version: 0.2.0
  status: provisional
  canonicalCatalog: ../catalog/schema.yaml
  updatedAt: 2026-10-03
  ownershipRule: >
    Every shared concept has exactly one owning module. Other modules reference it by label and never
    redefine its properties. Kernel-owned concepts (Assertion, Source, SourceSnapshot, SourceLocator,
    Adjudication, ResolutionHypothesis, the temporal profiles, the confidence vector) change only through a
    kernel-change decision recorded in the catalog's kernelChangeDecisions block.

closurePolicies:
  semantic_kernel:
    include: [identity_keys, base_archetypes, shared_value_objects]
  relationship_endpoints:
    include: [relationship_property_type, endpoint_identity_surface, referenced_enums]
  validation:
    include: [invariants, forbidden_implications, module_shapes]
  projection:
    rule: dependencies_first_then_selected_elements_then_required_closure
  access:
    rule: accessTier other than OWNER_PRIVATE excludes every private-personal module and requires privateContext EXCLUDED

modules:
  kernel:
    maturity: accepted
    dependencies: []
    owns: [Entity, VersionedState, Occurrence, InformationArtifact, Assertion, EvidenceAssessment]
    sharedBy: [all]
    rounds: [0007, 0009]

  provenance:
    maturity: accepted
    dependencies: [kernel]
    owns: [Source, SourceSnapshot, SourceLocator, DocumentTextVersion, SourceRevisionEvent, Adjudication, ResolutionHypothesis, Agent, Activity, SUPERSEDES, DERIVED_FROM_ASSERTION, CORRECTS_SOURCE, RETRACTS_SOURCE, EXPRESSES_CONCERN_ABOUT, REINSTATES_SOURCE]
    alignments: [W3C_PROV_O, W3C_Web_Annotation_selectors, Biolink_source_provenance, NLM_publication_types]
    sharedBy: [all]
    rounds: [0006, 0007, 0009]

  temporal:
    maturity: provisional
    dependencies: [kernel, provenance]
    owns: [bitemporal_attachment_profile, asserted_edge_profile, timePrecision, validTimeBasis, supersessionKind, predicateExclusivity, HAS_STATE, as_of_query_contract]
    conventions:
      interval: half_open
      validTime: [validFrom, validTo]
      validTimeQualifiers: [validFromPrecision, validToPrecision, validFromBasis, validToBasis]
      systemTime: [recordedFrom, recordedTo]
      assertionSystemTime: [recordedAt, recordedTo]
      unknownBound: null
      rules:
        - ingestion_time_never_substitutes_for_unknown_valid_time
        - valid_time_is_immutable_after_commit
        - a_correction_is_a_new_recorded_time_episode_not_a_change_of_valid_time
        - recorded_time_is_service_assigned_and_never_backdated
    sharedBy: [all]
    rounds: [0007]

  identity_resolution:
    maturity: provisional
    dependencies: [kernel, provenance]
    owns: [Identifier, TradeItemIdentifier, Mention, EquivalenceAssessment, HAS_IDENTIFIER, uid_redirect_contract]
    sharedBy: [all]
    rounds: [0006, 0009]
    open: [redirect contract for merged uids]

  organizations:
    maturity: provisional
    dependencies: [kernel, provenance, temporal, identity_resolution]
    owns: [Organization, LegalEntity, ConsumerBrand, Facility, Person, PseudonymousActor, AnonymousActor, FINANCIAL_INTEREST_predicate_family]
    rounds: [0006]

  substances_and_materials:
    maturity: provisional
    dependencies: [kernel, provenance, identity_resolution]
    owns: [IngredientMaterial, BrandedIngredientMaterial, ChemicalSubstance, ChemicalForm, BotanicalTaxon, BotanicalPreparation, MicrobialTaxon, MicrobialStrain, MicrobialPreparation, MaterialMixture, Constituent, Nutrient, REALIZES_SUBSTANCE, HAS_CHEMICAL_FORM, FORM_OF_SUBSTANCE, HAS_ACTIVE_MOIETY, DERIVED_FROM_TAXON, HAS_STRAIN, STRAIN_OF, HAS_MIXTURE_COMPONENT, PROVIDES_CONSTITUENT, QUANTITATIVELY_CONTAINS]
    externalAuthorities: [ChEBI, FDA_GSRS_UNII, PubChem, NCBI_Taxonomy]
    liveSeams: [Compound -> ChemicalSubstance (catalog name wins), CompoundForm -> ChemicalForm + IngredientMaterial + dosageForm]
    rounds: [0002]

  products_and_formulations:
    maturity: provisional
    dependencies: [kernel, provenance, temporal, identity_resolution, organizations, substances_and_materials]
    owns: [FormulationVersion, IngredientComponent, ManufacturingSpecification, SpecificationVersion, ManufacturingProcess, ManufacturingStep, Trademark, HAS_FORMULATION_VERSION, USES_MATERIAL, GOVERNED_BY_SPECIFICATION, PRODUCED_BY_PROCESS, MARKETED_UNDER_MARK, CONTAINS, CONTAINS_COMPOUND_FORM]
    rounds: [0001, 0002, 0005]

  labels:
    maturity: provisional
    dependencies: [kernel, provenance, temporal, products_and_formulations, substances_and_materials]
    owns: [LabelSnapshot, LabelDeclaration, ServingDefinition, QuantityDeclaration, LABEL_FOR, DECLARES_FORMULATION, DECLARATION_IDENTIFIES_MATERIAL]
    rounds: [0005]

  products_and_commerce:
    maturity: provisional
    dependencies: [kernel, provenance, temporal, organizations, products_and_formulations]
    owns: [Product, ProductVariant, PackageConfiguration, MerchantListing, Offer, PriceObservation, SubscriptionPlan, Bundle, BundleComponent, InventoryItem, IndividualUnit, AffiliateLink, CommerceMatch, HAS_VARIANT, HAS_PACKAGE_CONFIGURATION, IDENTIFIED_BY, LISTING_FOR, USES_SUBSCRIPTION_PLAN, HOSTS_LISTING, LISTS_OFFER, SELLER_OF_RECORD_FOR, FULFILLS_OFFER, AFFILIATE_FOR_OFFER, COMPONENT_PRODUCT, INVENTORY_INSTANCE_OF, UNIT_FROM_LOT, SELLS_PRODUCT]
    rounds: [0005]

  studies_and_evidence:
    maturity: provisional
    dependencies: [kernel, provenance, temporal, identity_resolution, substances_and_materials, products_and_formulations, diagnostics]
    owns: [Study, TrialRegistration, RegistrationVersion, ProtocolVersion, StudyArm, StudyIntervention, InterventionComponent, StudyPopulation, OutcomeDefinition, StudyResult, AdverseEventResult, Publication, Dataset, EvidenceApplicability, ApplicabilityDimension, UseContextProfile, EndpointClassification, ResultInterpretation, EvidenceSynthesis, EvidenceStrengthAssessment, REGISTERED_AS, ASSIGNS_INTERVENTION, USES_INTERVENTION_MATERIAL, REPORTS_ON, PRODUCED_DATASET, ANALYZES_DATASET, CORRECTS, RETRACTS]
    externalAuthorities: [ClinicalTrialsGov, PubMed, DOI, FDA_NIH_BEST_glossary, FDA_surrogate_endpoint_table]
    rounds: [0002]

  mechanisms:
    maturity: candidate
    dependencies: [kernel, provenance, substances_and_materials, studies_and_evidence, diagnostics]
    owns: [MechanismEvidenceContext, Mechanism, Pathway, MolecularEntity, Species, AnatomicalContext, Organ, Outcome, Condition, AFFECTS_MECHANISM, MODULATES, APPLIES_TO_SPECIES, INFLUENCES_OUTCOME]
    rounds: [0003]

  diagnostics:
    maturity: candidate   # promoted from future in round 0004
    dependencies: [kernel, provenance, temporal, identity_resolution, organizations]
    owns: [Biomarker, Metric, LabTest, PanelDefinition, MeasurementMethod, Specimen, ReferenceSystem, AssayVersion, Algorithm, AlgorithmVersion, ReferenceIntervalVersion, ComparabilityAssessment, DiagnosticResult, MEASURES_METRIC, PERFORMED_WITH_ASSAY_VERSION, DERIVED_FROM_ALGORITHM_VERSION, REQUIRES_INPUT_METRIC, COMPATIBLE_WITH_ASSAY_VERSION, COMPARED_TO, HAS_REFERENCE_RANGE, SAME_TEST_AS]
    externalAuthorities: [LOINC, NGSP, IFCC, CLSI_EP28]
    liveSeams: [ReferenceRange -> projection of ReferenceIntervalVersion, Observation -> owned by protocols]
