# mapping; the owners write the final definitions.
- {live: Document, final: "Document (labels Document, Source, Entity)", action: keep, note: "always a Source; one canonicalUri; W20 writes the SDL"}
- {live: Document.id (stored documentId), final: Document.id, action: keep, note: "uid hu:document:<opaque> ends with ':' + documentId (V-117)"}
