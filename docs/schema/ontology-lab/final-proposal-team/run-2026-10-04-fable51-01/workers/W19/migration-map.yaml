- {live: Document.documentKey, final: Document.documentKey, action: keep, note: "W20; not identity across renditions"}
- {live: Document.sourceUrl (stored url), final: Source.canonicalUri, action: rename, note: "apply canonicalUri rule (W19-SR-10); a doi.org or identifiers.org value becomes an Identifier of the Publication, not a canonicalUri"}
