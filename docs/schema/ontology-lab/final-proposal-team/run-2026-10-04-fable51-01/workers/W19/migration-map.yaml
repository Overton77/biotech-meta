- {live: Document.isPeerReviewed, final: Document.isPeerReviewed, action: keep, note: "venue fact; unaffected by retraction"}
- {live: Document.isPrimarySource, final: null, action: retire, note: "derive per assertion: no outgoing RETELLS (Q-05); advisory deprecation first, read-only"}
- {live: Document.isRegulatorySource, final: "Source.sourceKind in [REGULATORY_RECORD, REGULATORY_GUIDANCE, LEGISLATION_OR_REGULATION]", action: derive, note: "plus SourceAuthorityAssessment scopes REGULATORY_ACTION / REGULATORY_FRAMEWORK"}
- {live: Document.isFinancialDisclosure, final: Document.isFinancialDisclosure, action: keep, note: "genre fact (CQ-CL-05)"}
- {live: "Document.sourceForEpisodes (SOURCE_OF -> Episode, RoleMetadata)", final: RENDITION_OF (Source -> Episode), action: rename, note: "direction Source -> work; RoleMetadata dropped; apply test R3 (a deck is never a rendition of a talk)"}
