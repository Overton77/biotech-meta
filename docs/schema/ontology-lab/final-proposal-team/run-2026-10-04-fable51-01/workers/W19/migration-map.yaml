- {live: Document.hasChunks, final: HAS_CHUNK (derived), action: keep, note: "W20"}
- {live: Document.about, final: ABOUT (derived retrieval), action: keep, note: "W20; never evidence"}
- {live: Document.authoredBy, final: "AUTHORED_BY (W20) and ASSERTED_BY on the document's assertions", action: keep, note: "authorship is not attribution of every sentence"}
- {live: "@fulltext DocumentSearch [name, sourceUrl, searchText]", final: "DocumentSearch on stored [title, url, searchText]", action: keep, note: "D-015; url stays the stored name of canonicalUri for Document until W20/W00 decide an alias"}
