capsules, GTIN 850015311857, versus a bottle of 90, GTIN 850015311895). Immutable payload attached to the variant by an
asserted, NONEXCLUSIVE HAS_PACKAGE_CONFIGURATION episode; a count change is a new configuration and a bounded episode, never
a new FormulationVersion. A multi-bottle kit offered as a "size" is a Bundle of configurations (W15), not a configuration.
Serves CQ-ID-05, CQ-PF-02, CQ-PF-03 (scope endpoint), CQ-AX-17. Canonical module products_and_commerce. Archetype
VersionedState.
"""
type PackageConfiguration implements Entity & VersionedStateArchetype
  @node(labels: ["PackageConfiguration", "VersionedState"]) {
  id: ID! @id
  "hu:package-configuration:<opaque> (token requested, W04-SR-01)"
