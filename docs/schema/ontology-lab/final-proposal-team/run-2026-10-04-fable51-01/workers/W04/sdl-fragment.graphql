"""
A time-bounded composition of one variant in one jurisdiction: an immutable payload (its IngredientComponents and the
ServingDefinition their per-serving amounts refer to) attached to the variant by asserted, bitemporal, EXCLUSIVE
HAS_FORMULATION_VERSION episodes. Any composition change (material, amount, basis, serving size) is a new version; a label
text change that does not establish a composition change is not (it is a new LabelSnapshot, CQ-ID-05). A correction makes a
replacement version and closes the old episode in recorded time (SOURCE_CORRECTION); a reformulation bounds the old episode
in valid time (VALIDITY_BOUNDED) (round 0007). It is NOT a measured composition (INV-006), NOT a lot, NOT a study
intervention. Serves CQ-ID-01, CQ-ID-02, CQ-ID-05, CQ-AX-17, CQ-AX-25, CQ-TM-01/02/05. Canonical module
products_and_formulations. Archetype VersionedState.
"""
type FormulationVersion implements Entity & VersionedStateArchetype
  @node(labels: ["FormulationVersion", "VersionedState"]) {
  id: ID! @id
  "hu:formulation:<opaque>"
  uid: String!
  name: String
  description: String
  mongoResearchRunId: String
  createdAt: DateTime! @timestamp(operations: [CREATE])
  updatedAt: DateTime! @timestamp(operations: [CREATE, UPDATE])
  privacyClass: PrivacyClass
  maturity: NodeMaturity
  schemaVersion: String
  "Always 'FormulationVersion'."
  stateType: String!
  "sha256:<hex> over the canonical composition payload: jurisdiction, serving (count, unit) and, per component in labelOrder, material uid, role, quantity, unitCode, quantityBasis, massBasis, amountReferent, nesting. declaredAs and versionName are excluded (label text is not composition)."
  payloadHash: String!
  "Source-stated effective bounds (e.g. 'new formula from lot X'); query validity comes from the attachment episode."
  effectiveFrom: DateTime
  effectiveTo: DateTime
  "Human label, e.g. 'Basis US label observed 2026-07-10'; never identity."
  versionName: String
  "Jurisdiction whose label or specification states this composition; exclusivity partition key (with FormulationEdgeProperties.jurisdiction)."
  jurisdiction: String

  """class: asserted; cardinality: one_or_more variants; catalog: HAS_FORMULATION_VERSION"""
  variants: [ProductVariant!]! @relationship(type: "HAS_FORMULATION_VERSION", direction: IN, properties: "FormulationEdgeProperties")
  """class: structural; cardinality: one_or_more; catalog: HAS_INGREDIENT_COMPONENT; orderIndex = label order"""
  components: [IngredientComponent!]! @relationship(type: "HAS_INGREDIENT_COMPONENT", direction: OUT, properties: "StructuralEdgeProperties")
  """class: structural; cardinality: zero_or_one; catalog: USES_SERVING_DEFINITION (domain extended to FormulationVersion, decision W04-D07): the serving that PER_SERVING component amounts refer to; part of the payload"""
  servingDefinition: [ServingDefinition!]! @relationship(type: "USES_SERVING_DEFINITION", direction: OUT, properties: "StructuralEdgeProperties")
  """class: asserted; cardinality: many; catalog: DECLARES_FORMULATION (LabelSnapshot -> FormulationVersion)"""
  declaredByLabels: [LabelSnapshot!]! @relationship(type: "DECLARES_FORMULATION", direction: IN, properties: "AssertedEdgeProperties")
}

"""
A contextual component inside one FormulationVersion: role, label order, declared quantity with unit, quantity basis, mass
basis and amount referent, and nesting under a blend. It points to the IngredientMaterial it uses (USES_MATERIAL, W02 owns
the material). It is NOT the material identity, NOT a measured amount (INV-006), and its amount refers to amountReferent
(INV-307): a salt-form label amount is never an active-moiety amount (active moiety is a CALCULATED Assertion). Serves
CQ-PF-01, CQ-ID-03, CQ-AX-17, CQ-AX-25. Canonical module products_and_formulations. Archetype VersionedState.
"""
type IngredientComponent implements Entity & VersionedStateArchetype
  @node(labels: ["IngredientComponent", "VersionedState"]) {
  id: ID! @id
  "hu:component:<opaque>"
  uid: String!
  name: String
  description: String
  mongoResearchRunId: String
  createdAt: DateTime! @timestamp(operations: [CREATE])
  updatedAt: DateTime! @timestamp(operations: [CREATE, UPDATE])
  privacyClass: PrivacyClass
  maturity: NodeMaturity
  schemaVersion: String
  "Always 'IngredientComponent'."
  stateType: String!
  "sha256:<hex> over the composition fields below except declaredAs."
  payloadHash: String!
  effectiveFrom: DateTime
  effectiveTo: DateTime
  "DIETARY_INGREDIENT, OTHER_INGREDIENT, PROPRIETARY_BLEND, BLEND_CONSTITUENT, CAPSULE_SHELL ... (controlled list pending, W04-SR-10; live DoseMetadata.role)."
  role: String
  "1-based order on the label panel."
  labelOrder: Int
  "Declared amount (live DoseMetadata.dose). Null with amountReferent NOT_STATED = no amount stated (not zero)."
  quantity: Float
  "UCUM unit (live DoseMetadata.doseUnit)."
  unitCode: String
  "PER_SERVING for US Supplement Facts amounts; the serving is the version's ServingDefinition."
  quantityBasis: QuantityBasis
  "SALT_FORM, ACTIVE_MOIETY, MATERIAL_AS_IS or UNSPECIFIED; required when quantity is set (V-W04-05). A label line naming the salt gives SALT_FORM; a line naming a material without its salt gives MATERIAL_AS_IS."
  massBasis: MassBasis
  "Which entity the amount refers to (21 CFR 101.36(b)(2)(ii), (b)(3)(ii), proprietary blend total); never ACTIVE_MOIETY (V-330)."
  amountReferent: AmountReferent
  "Ingredient text as printed (live DoseMetadata.componentName); display, excluded from payloadHash."
  declaredAs: String
  "True for (b)(2)/(b)(3) dietary ingredients; false for other ingredients (excipients); null = not classified."
  isDietaryIngredient: Boolean

  """class: structural; cardinality: exactly_one; catalog: HAS_INGREDIENT_COMPONENT"""
  formulationVersion: [FormulationVersion!]! @relationship(type: "HAS_INGREDIENT_COMPONENT", direction: IN, properties: "StructuralEdgeProperties")
  """class: structural; cardinality: many; catalog: NESTED_COMPONENT (blend -> constituent component)"""
  nestedComponents: [IngredientComponent!]! @relationship(type: "NESTED_COMPONENT", direction: OUT, properties: "StructuralEdgeProperties")
  """class: structural; cardinality: zero_or_one; catalog: NESTED_COMPONENT (inverse)"""
  parentComponent: [IngredientComponent!]! @relationship(type: "NESTED_COMPONENT", direction: IN, properties: "StructuralEdgeProperties")
  """class: asserted; cardinality: exactly_one (V-005); catalog: USES_MATERIAL"""
  material: [IngredientMaterial!]! @relationship(type: "USES_MATERIAL", direction: OUT, properties: "AssertedEdgeProperties")
}

"""
A captured product label: a SourceSnapshot specialization (same node, same `hu:snapshot:` uid) whose content is a label
panel for a variant or package, with jurisdiction, language and label version text. Immutable like every snapshot; a new
capture is a new node. It is NOT a formulation (its content is a declaration; DECLARES_FORMULATION is an assertion), NOT a
measured result (INV-006) and NOT a study intervention. Stored property names of the SourceSnapshot fields follow W00's
SourceSnapshot. Serves CQ-PF-01, CQ-PF-02, CQ-ID-02, CQ-ID-05, QS-7 (NOT_DECLARED_IN_COVERING_SOURCE). Canonical module
labels. Archetype InformationArtifact.
"""
type LabelSnapshot implements Entity & InformationArtifactArchetype
  @node(labels: ["LabelSnapshot", "SourceSnapshot", "InformationArtifact"]) {
  id: ID! @id
  "hu:snapshot:<opaque> (the capture's identity; token mapping requested, W04-SR-01)"
  uid: String!
  name: String
  description: String
  mongoResearchRunId: String
  createdAt: DateTime! @timestamp(operations: [CREATE])
  updatedAt: DateTime! @timestamp(operations: [CREATE, UPDATE])
  privacyClass: PrivacyClass
  maturity: NodeMaturity
  schemaVersion: String
  "Always 'LabelSnapshot'."
  artifactType: String!
  "Issue time stated by the source; null for most label pages."
  publishedAt: DateTime
  "When the content is known to have been displayed (archive capture time for late sources)."
  observedAt: DateTime
  "sha256:<hex>; basis in contentHashBasis."
  contentHash: String
  "When BellLabs fetched the bytes (W00 SourceSnapshot field)."
  retrievedAt: DateTime
  contentHashBasis: ContentHashBasis
  captureCompleteness: CaptureCompleteness
  canonicalUri: String
  storageUri: String
  archiveUri: String
  mimeType: String
  language: String
  "Jurisdiction of the label (US Supplement Facts = 'US')."
  jurisdiction: String
  "Any version marker printed on the label (lot-independent revision code), verbatim; null = none printed."
  labelVersionText: String

  """class: asserted; cardinality: zero_or_one variant; catalog: LABEL_FOR"""
  labelForVariants: [ProductVariant!]! @relationship(type: "LABEL_FOR", direction: OUT, properties: "AssertedEdgeProperties")
  """class: asserted; cardinality: zero_or_one package; catalog: LABEL_FOR; required when the label states servings per container (V-W04-07)"""
  labelForPackages: [PackageConfiguration!]! @relationship(type: "LABEL_FOR", direction: OUT, properties: "AssertedEdgeProperties")
  """class: asserted; cardinality: zero_or_one; catalog: DECLARES_FORMULATION"""
  declaresFormulations: [FormulationVersion!]! @relationship(type: "DECLARES_FORMULATION", direction: OUT, properties: "AssertedEdgeProperties")
  """class: structural; cardinality: many; catalog: HAS_DECLARATION; orderIndex = panelOrder"""
  declarations: [LabelDeclaration!]! @relationship(type: "HAS_DECLARATION", direction: OUT, properties: "StructuralEdgeProperties")
  """class: structural; cardinality: zero_or_one; catalog: USES_SERVING_DEFINITION"""
  servingDefinitions: [ServingDefinition!]! @relationship(type: "USES_SERVING_DEFINITION", direction: OUT, properties: "StructuralEdgeProperties")
}

"""
One declaration line or statement captured from a label panel, verbatim ("Elysium NR (Nicotinamide Riboside Chloride)
250 mg"), with its kind and panel order. It records what the label says; the material it names is an asserted
DECLARATION_IDENTIFIES_MATERIAL link, and its amount is a QuantityDeclaration. It is NOT measured composition (INV-006, V-011),
NOT an IngredientComponent and NOT a listing title (forbidden LISTING_TITLE_AMOUNT -> LABEL_DECLARED_AMOUNT). Serves CQ-PF-01,
CQ-PF-02, CQ-ID-03, CQ-ID-05. Canonical module labels. Archetype InformationArtifact.
"""
type LabelDeclaration implements Entity & InformationArtifactArchetype
  @node(labels: ["LabelDeclaration", "InformationArtifact"]) {
  id: ID! @id
  "hu:label-declaration:<opaque>"
  uid: String!
  name: String
  description: String
  mongoResearchRunId: String
  createdAt: DateTime! @timestamp(operations: [CREATE])
  updatedAt: DateTime! @timestamp(operations: [CREATE, UPDATE])
  privacyClass: PrivacyClass
  maturity: NodeMaturity
  schemaVersion: String
  "Always 'LabelDeclaration'."
  artifactType: String!
  publishedAt: DateTime
  observedAt: DateTime
  "sha256:<hex> of verbatimText under NFC-WS1."
  contentHash: String
  "The declaration exactly as printed (not normalized, not corrected)."
  verbatimText: String
  declarationKind: DeclarationKind
  "1-based order within the panel."
  panelOrder: Int

  """class: structural; cardinality: exactly_one; catalog: HAS_DECLARATION"""
  labelSnapshot: [LabelSnapshot!]! @relationship(type: "HAS_DECLARATION", direction: IN, properties: "StructuralEdgeProperties")
  """class: asserted; cardinality: zero_or_one; catalog: DECLARATION_IDENTIFIES_MATERIAL"""
  identifiesMaterials: [IngredientMaterial!]! @relationship(type: "DECLARATION_IDENTIFIES_MATERIAL", direction: OUT, properties: "AssertedEdgeProperties")
  """class: structural; cardinality: zero_or_one; catalog: HAS_QUANTITY_DECLARATION"""
  quantityDeclarations: [QuantityDeclaration!]! @relationship(type: "HAS_QUANTITY_DECLARATION", direction: OUT, properties: "StructuralEdgeProperties")
}

"""
The amount stated by one label declaration: value, UCUM unit, basis, percent daily value and its reported status, and the
amountReferent that says what entity the amount weighs (21 CFR 101.36). It is NOT a calculated active-moiety or nutrient
equivalent amount (those are CALCULATED Assertions, INV-307, V-330) and NOT a measurement (INV-006). Serves CQ-PF-01, CQ-PF-02,
CQ-AX-17. Canonical module labels. Archetype InformationArtifact.
"""
type QuantityDeclaration implements Entity & InformationArtifactArchetype
  @node(labels: ["QuantityDeclaration", "InformationArtifact"]) {
  id: ID! @id
  "hu:quantity-declaration:<opaque> (token requested, W04-SR-01)"
  uid: String!
  name: String
  description: String
  mongoResearchRunId: String
  createdAt: DateTime! @timestamp(operations: [CREATE])
  updatedAt: DateTime! @timestamp(operations: [CREATE, UPDATE])
  privacyClass: PrivacyClass
  maturity: NodeMaturity
  schemaVersion: String
  "Always 'QuantityDeclaration'."
  artifactType: String!
  publishedAt: DateTime
  observedAt: DateTime
  contentHash: String
  "Declared amount as printed; null with amountReferent NOT_STATED."
  value: Float
  "UCUM unit as printed (mg, mcg, g)."
  unitCode: String
  "Basis of the amount (US Supplement Facts: PER_SERVING). Catalog property `basis` (renamed for uniformity, migration-map)."
  quantityBasis: QuantityBasis
  "Percent daily value as printed; null when not printed."
  dailyValuePercent: Float
  "REPORTED (a percent is printed), NOT_APPLICABLE (label states 'Daily Value not established'), NOT_REPORTED (panel silent). Keeps 'not established' distinct from missing (INV-007)."
  dailyValueStatus: ReportedStatus
  "Referent of the amount; never ACTIVE_MOIETY / NUTRIENT_EQUIVALENT (V-330)."
  amountReferent: AmountReferent
  "uid of the IngredientMaterial, Nutrient, Constituent or blend component the amount weighs; null = unresolved."
  amountReferentUid: String

  """class: structural; cardinality: exactly_one; catalog: HAS_QUANTITY_DECLARATION"""
  declaration: [LabelDeclaration!]! @relationship(type: "HAS_QUANTITY_DECLARATION", direction: IN, properties: "StructuralEdgeProperties")
}

"""
A serving definition: serving count and unit noun ("2 Vegetarian Capsules") and, only when it belongs to a package label,
the stated servings per container. Attached structurally to a LabelSnapshot (what the label states) and to a
FormulationVersion (the serving that PER_SERVING amounts refer to; then servingsPerContainer is null because servings per
container is a package fact, 21 CFR 101.36(b)(1)(ii); V-W04-07). It is NOT a dose recommendation, NOT a protocol schedule and
NOT a person's intake. Serves CQ-PF-01, CQ-AX-17, CQ-PF-C02. Canonical module labels. Archetype VersionedState.
"""
type ServingDefinition implements Entity & VersionedStateArchetype
  @node(labels: ["ServingDefinition", "VersionedState"]) {
  id: ID! @id
  "hu:serving-definition:<opaque> (token requested, W04-SR-01)"
  uid: String!
  name: String
  description: String
  mongoResearchRunId: String
  createdAt: DateTime! @timestamp(operations: [CREATE])
  updatedAt: DateTime! @timestamp(operations: [CREATE, UPDATE])
  privacyClass: PrivacyClass
  maturity: NodeMaturity
  schemaVersion: String
  "Always 'ServingDefinition'."
  stateType: String!
  "sha256:<hex> over servingCount, unitDescription, servingsPerContainer."
  payloadHash: String!
  effectiveFrom: DateTime
  effectiveTo: DateTime
  "Dosage units per serving (2 for 'Serving Size: 2 Vegetarian Capsules')."
  servingCount: Float
  "Unit noun as printed ('Vegetarian Capsules'); 101.36(b)(1)(i) requires a term appropriate to the form."
  unitDescription: String
  "Servings per container as printed; package-scoped; null on a formulation's serving and when not stated."
  servingsPerContainer: Float
  "The serving statement verbatim ('Serving Size: 1 Vegetarian Capsule Servings Per Container: 90'), including qualifiers such as 'about'."
  servingStatementVerbatim: String

  """class: structural; cardinality: many; catalog: USES_SERVING_DEFINITION (from LabelSnapshot)"""
  labelSnapshots: [LabelSnapshot!]! @relationship(type: "USES_SERVING_DEFINITION", direction: IN, properties: "StructuralEdgeProperties")
  """class: structural; cardinality: many; USES_SERVING_DEFINITION from FormulationVersion (decision W04-D07)"""
  formulationVersions: [FormulationVersion!]! @relationship(type: "USES_SERVING_DEFINITION", direction: IN, properties: "StructuralEdgeProperties")
}

"""
Properties of HAS_FORMULATION_VERSION (ProductVariant -> FormulationVersion). Contains every field of the frozen
AssertedEdgeProperties (asserted_edge profile: one edge per recorded-time episode; bounds, precisions and bases equal the
authorizing Assertion's; only recordedTo may be written once, from null) plus `jurisdiction`, the exclusivity partition key
of predicateExclusivity HAS_FORMULATION_VERSION {EXCLUSIVE, partitionBy: [jurisdiction]}. jurisdiction equals the target
FormulationVersion.jurisdiction when both are set (V-W04-08); null only on legacy edges.
"""
type FormulationEdgeProperties @relationshipProperties {
  relationshipUid: String!
  assertionUid: String!
  validFrom: DateTime
  validTo: DateTime
  validFromPrecision: TimePrecision
  validToPrecision: TimePrecision
  validFromBasis: ValidTimeBasis!
  validToBasis: ValidTimeBasis!
  recordedFrom: DateTime!
  recordedTo: DateTime
  mongoResearchRunId: String
  jurisdiction: String
}

"""
Live product development/market stage display (live enum, values unchanged). DISCOVERY, RESEARCH, PRECLINICAL and CLINICAL
are company-reported development stages; DISCONTINUED is a market fact that needs a stated end; APPROVED is a derived
projection valid only with an APPROVAL RegulatoryStatus (V-322). Marketed is never approved.
"""
enum ProductStatus {
  DISCOVERY
  RESEARCH
  PRECLINICAL
  CLINICAL
  APPROVED
  DISCONTINUED
}

"""
How a product is marketed (commercial kind), not its jurisdictional regulatory classification (W13) and not a sector
taxonomy. Values are the kinds present in the live data and fixtures; new values are ledger requests.
"""
enum ProductKind {
  DIETARY_SUPPLEMENT
  CONVENTIONAL_FOOD
  DRUG
  BIOLOGIC
  MEDICAL_DEVICE
  CONSUMER_DEVICE
  DIAGNOSTIC_TEST_SERVICE
  COSMETIC
  OTHER
}

"""
Kind of a label declaration line, grounded in 21 CFR 101.36 for US Supplement Facts: NUTRIENT ((b)(2) dietary ingredient
with an RDI/DRV; amount is the nutrient, not its source), OTHER_DIETARY_INGREDIENT ((b)(3); amount is the ingredient as
listed), DIETARY_INGREDIENT (0.1.0 value: dietary ingredient not yet classified as (b)(2) or (b)(3)), PROPRIETARY_BLEND
(blend line; amount is the blend total), BLEND_CONSTITUENT (indented constituent; amount usually not stated),
SOURCE_INGREDIENT ('as'/'from' parenthetical source), OTHER_INGREDIENT ('Other Ingredients' excipient list), DIRECTIONS
(suggested use), WARNING, OTHER_STATEMENT.
"""
enum DeclarationKind {
  NUTRIENT
  OTHER_DIETARY_INGREDIENT
  DIETARY_INGREDIENT
  PROPRIETARY_BLEND
  BLEND_CONSTITUENT
  SOURCE_INGREDIENT
  OTHER_INGREDIENT
  DIRECTIONS
  WARNING
  OTHER_STATEMENT
}
