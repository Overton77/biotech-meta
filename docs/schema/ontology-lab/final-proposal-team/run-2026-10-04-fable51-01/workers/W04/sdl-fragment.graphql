"""
The enduring marketed concept (the brand-level product such as "Basis" or "Tru Niagen"), stable across reformulations,
renamings of variants, package changes and merchants. It is NOT a variant (consumer-distinguishable strength, dosage form,
flavor or jurisdiction), NOT a formulation (time-bounded composition), NOT a package (count, net quantity), NOT a listing
or offer, and NOT an approval or a regulatory classification. Composition, label and regulatory facts on this type are
display projections only (INV-005, V-322). Serves CQ-ID-01, CQ-ID-05, CQ-AX-17, CQ-AX-25 (via variants). Canonical
module products_and_commerce. Archetype Entity.
"""
