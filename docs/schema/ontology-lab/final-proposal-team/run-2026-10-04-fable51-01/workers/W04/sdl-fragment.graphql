"""
A consumer-distinguishable realization of a Product: labeled strength per dosage unit, dosage form, flavor or jurisdiction
that consumers, regulators or commerce systems distinguish (round 0001 Candidate B). Example: "Tru Niagen 300mg capsule
(US)" versus "Tru Niagen 150mg capsule (US)" (same 300 mg serving, different unit strength). It is NOT a package count
(PackageConfiguration), NOT a formulation (time-bounded composition attached by HAS_FORMULATION_VERSION) and does NOT stand
for its current formulation when a study names it (round 0002 R1; INV-201). Serves CQ-ID-01, CQ-ID-02, CQ-ID-05, CQ-PF-02,
CQ-AX-17, CQ-AX-25. Canonical module products_and_commerce. Archetype Entity.
"""
type ProductVariant implements Entity & EntityArchetype
  @node(labels: ["ProductVariant", "Entity"]) {
  id: ID! @id
  "hu:product-variant:<opaque>"
  uid: String!
  name: String
  description: String
  mongoResearchRunId: String
  createdAt: DateTime! @timestamp(operations: [CREATE])
  updatedAt: DateTime! @timestamp(operations: [CREATE, UPDATE])
  privacyClass: PrivacyClass
  maturity: NodeMaturity
  schemaVersion: String
  "Always 'ProductVariant'."
  entityType: String!
  "Labeled strength as marketed (verbatim, e.g. '300 mg NIAGEN per capsule'); composition is on the formulation version."
  strengthDescriptor: String
  "Dosage form of the marketed unit (e.g. CAPSULE, POWDER_STICK_PACK); receives the dosage-form part of live CompoundForm (D-002). Controlled list pending (seam W04-SR-10)."
  dosageForm: String
  flavor: String
  "Jurisdiction in which the variant is marketed (ISO 3166-1 alpha-2, or 'EU'); null = not recorded, never 'global'."
  jurisdiction: String

  """class: asserted; cardinality: exactly_one (service-enforced); catalog: HAS_VARIANT"""
  product: [Product!]! @relationship(type: "HAS_VARIANT", direction: IN, properties: "AssertedEdgeProperties")
  """class: asserted; cardinality: many; catalog: HAS_PACKAGE_CONFIGURATION; temporalCardinality NONEXCLUSIVE (30, 90 counts sold concurrently)"""
  packageConfigurations: [PackageConfiguration!]! @relationship(type: "HAS_PACKAGE_CONFIGURATION", direction: OUT, properties: "AssertedEdgeProperties")
  """class: asserted; cardinality: many episodes, at most one believed per (valid time, recorded time, jurisdiction); catalog: HAS_FORMULATION_VERSION; predicateExclusivity EXCLUSIVE partitionBy jurisdiction (V-508, V-509)"""
  formulationVersions: [FormulationVersion!]! @relationship(type: "HAS_FORMULATION_VERSION", direction: OUT, properties: "FormulationEdgeProperties")
  """class: asserted; cardinality: many; catalog: IDENTIFIED_BY (GTIN/UPC, retailer SKU, NSF Product ID as TradeItemIdentifier)"""
  tradeItemIdentifiers: [TradeItemIdentifier!]! @relationship(type: "IDENTIFIED_BY", direction: OUT, properties: "IdentifierLinkProperties")
  """class: asserted; cardinality: many; catalog: LABEL_FOR (LabelSnapshot -> ProductVariant)"""
  labelSnapshots: [LabelSnapshot!]! @relationship(type: "LABEL_FOR", direction: IN, properties: "AssertedEdgeProperties")
  """class: derived; cardinality: many; catalog: CONTAINS (ProductVariant -> IngredientMaterial); rule contains-v1; regenerable; never the only history (V-004, V-W04-02)"""
  containsMaterials: [IngredientMaterial!]! @relationship(type: "CONTAINS", direction: OUT, properties: "DerivedEdgeProperties") @settable(onCreate: false, onUpdate: false)
}

