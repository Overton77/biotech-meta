  name: String
  description: String
  mongoResearchRunId: String
  createdAt: DateTime! @timestamp(operations: [CREATE])
  updatedAt: DateTime! @timestamp(operations: [CREATE, UPDATE])
  privacyClass: PrivacyClass
  maturity: NodeMaturity
  schemaVersion: String
  "Always 'PackageConfiguration'."
  stateType: String!
  "sha256:<hex> over the canonical payload (packageForm, unitCount, unitDescription, netQuantity, netQuantityUnit) (D-016)."
  payloadHash: String!
  "Source-stated payload bounds only; query validity comes from the attachment episode."
  effectiveFrom: DateTime
  effectiveTo: DateTime
  "e.g. BOTTLE, BLISTER, STICK_PACK_CARTON, POUCH (free text until a controlled list is ruled)."
  packageForm: String
  "Count of dosage units in the package (capsules, stick packs). Null = not stated."
  unitCount: Int
  "Unit noun as printed ('vegetarian capsules')."
  unitDescription: String
  "Net quantity of contents when stated by weight or volume."
  netQuantity: Float
  "UCUM code for netQuantity (g, mL)."
  netQuantityUnit: String

  """class: asserted; cardinality: one_or_more (service-enforced); catalog: HAS_PACKAGE_CONFIGURATION"""
