  embeddingModel: String
  embeddingDimensions: Int
  "Regenerable embedding of name/description/searchText for QS-8 candidate lookup (INV-107); never evidence. Vector index added by Fable only (D-014)."
  searchEmbedding: [Float!]
  "How the product is marketed (commercial kind as presented by its marketer). Not a regulatory classification; jurisdictional status is RegulatoryStatus (W13). Null = not recorded."
