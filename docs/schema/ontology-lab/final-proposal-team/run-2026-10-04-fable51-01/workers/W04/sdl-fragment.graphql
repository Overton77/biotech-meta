  "Legacy display text."
  deliveryModel: String
  "Derived display. APPROVED only when a RegulatoryStatus{statusKind: APPROVAL} is STATUS_OF this product and is named in regulatoryProjectionStatusUids (V-322). Development stages are company statements, not approval."
