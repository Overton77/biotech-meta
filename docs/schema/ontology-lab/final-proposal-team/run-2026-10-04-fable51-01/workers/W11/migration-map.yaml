# W11 migration map: every live element in W11 scope (current_biotech_schema.graphql lines 566, 629-650, 1496-1544,
# 471-492 LocationType values) plus proposed-delta ManufacturingCapability (neo4j/proposed-delta.graphql 522-535, 731-745).
# action: keep | rename | move | split | merge | derive | retire
- {live: ManufacturingProcess, final: ManufacturingProcess, action: keep, note: "labels become [ManufacturingProcess, Entity]; uid backfilled hu:process:<id>; entityType MANUFACTURING_PROCESS"}
- {live: ManufacturingProcess.id, final: ManufacturingProcess.id, action: keep, note: "id = opaque segment of uid"}
- {live: ManufacturingProcess.name, final: ManufacturingProcess.name, action: keep, note: "String! -> String (D-013)"}
- {live: ManufacturingProcess.description, final: ManufacturingProcess.description, action: keep, note: ""}
- {live: ManufacturingProcess.mongoResearchRunId, final: ManufacturingProcess.mongoResearchRunId, action: keep, note: "internal tier"}
- {live: ManufacturingProcess.createdAt, final: ManufacturingProcess.createdAt, action: keep, note: ""}
- {live: ManufacturingProcess.updatedAt, final: ManufacturingProcess.updatedAt, action: keep, note: ""}
- {live: ManufacturingProcess.processClass, final: ManufacturingProcess.processKind, action: rename, note: "map free text to ProcessKind; unmapped strings copied to processKindVerbatim and processKind UNKNOWN; mapping table reviewed manually"}
- {live: ManufacturingProcess.qualitySystemKind, final: null, action: retire, note: "each non-null value becomes an Assertion{predicate: CLAIMS_CGMP_COMPLIANCE (cGMP/GMP strings) or CLAIMS_THIRD_PARTY_CERTIFICATION (candidate), status: PROPOSED, valueString: <value>} whose subject is the PERFORMS_PROCESS organization when known, else held for review; never a CertificationListing without the certifier's record"}
- {live: ManufacturingProcess.productionScale, final: ManufacturingCapability.capacityVerbatim, action: move, note: "free text moved to a ManufacturingCapability state {stage: from source or held, capacityBasis: NOT_REPORTED unless a number+unit+basis is parseable, capacityVerbatim: <value>}; the state is attached only through an Assertion with a locator (INV-305); orphan strings without provenance are held in a migration review queue, not attached"}
- {live: ManufacturingProcess.processTechnologySummary, final: ManufacturingProcess.processTechnologySummary, action: keep, note: "presentation only"}
- {live: ManufacturingProcess.hasSteps (HAS_STEP, OrderingMetadata), final: ManufacturingProcess.steps (HAS_STEP, StructuralEdgeProperties), action: keep, note: "orderIndex kept; sequenceIndex -> orderIndex when orderIndex null; seasonNumber/episodeNumber/startTime/endTime/publishedAt/rhetoricalRole dropped (no manufacturing meaning); D-004"}
- {live: ManufacturingProcess.inputsMaterials (INPUTS, DoseMetadata), final: "ManufacturingProcess.inputMaterials | inputSubstances (INPUTS, ProcessIoProperties)", action: split, note: "target Material resolved to IngredientMaterial (same uid) or ChemicalSubstance; edge requires an authorizing Assertion (asserted); DoseMetadata.role -> ioRole, componentName -> asReportedName, dose/doseUnit -> quantity/unitCode only when a process amount; edges without provenance become PROPOSED assertions with extractionMethod MIGRATION"}
- {live: ManufacturingProcess.outputsMaterials (OUTPUTS, DoseMetadata), final: "PRODUCED_BY_PROCESS (product of record) | ManufacturingStep.outputMaterials/outputSubstances (OUTPUTS)", action: split, note: "manual classification: the product of record becomes IngredientMaterial-[:PRODUCED_BY_PROCESS]->process; intermediates/by-products move to step-level OUTPUTS"}
- {live: ManufacturingProcess.producesMaterials (PRODUCES, DoseMetadata), final: "ManufacturingProcess.producedMaterials (PRODUCED_BY_PROCESS, IN)", action: merge, note: "edge direction reversed: (m)-[:PRODUCED_BY_PROCESS]->(p); one relationship type, one meaning; live PRODUCES deleted after copy"}
- {live: ManufacturingProcess.supportedBy (SUPPORTED_BY Chunk, ExtractionMetadata), final: null, action: retire, note: "provenance moves to Assertion -[:SUPPORTED_BY]-> SourceLocator; a chunk link survives only as W20 derived SUPPORTED_BY_CHUNK naming its locator (INV-404)"}
- {live: ManufacturingStep, final: ManufacturingStep, action: keep, note: "labels [ManufacturingStep, Entity]; uid hu:process-step:<id>"}
- {live: ManufacturingStep.stepClass, final: ManufacturingStep.stepKind, action: rename, note: "controlled string (candidate StepKind)"}
- {live: ManufacturingStep.environmentGrade, final: ManufacturingStep.environmentGrade, action: keep, note: "verbatim"}
- {live: ManufacturingStep.operationKind, final: ManufacturingStep.operationKind, action: keep, note: "verbatim, presentation"}
- {live: ManufacturingStep.usesPlatforms (USES_PLATFORM, UsageMetadata), final: "ManufacturingStep.usesPlatforms (USES_PLATFORM, UsageEdgeProperties)", action: keep, note: "relationship and property type owned by W08"}
- {live: ManufacturingStep.usesEquipment (USES_EQUIPMENT, UsageMetadata), final: "ManufacturingStep.usesEquipment (USES_EQUIPMENT, UsageEdgeProperties)", action: keep, note: "W08"}
- {live: ManufacturingStep.hasInputMaterials (HAS_INPUT, DoseMetadata), final: "ManufacturingStep.inputMaterials | inputSubstances (INPUTS)", action: merge, note: "relationship type renamed HAS_INPUT -> INPUTS (one type for process and step level); target resolution as for process INPUTS"}
- {live: ManufacturingStep.hasOutputMaterials (HAS_OUTPUT, DoseMetadata), final: "ManufacturingStep.outputMaterials | outputSubstances (OUTPUTS)", action: merge, note: "HAS_OUTPUT -> OUTPUTS"}
- {live: ManufacturingStep.supportedBy (SUPPORTED_BY Chunk), final: null, action: retire, note: "as for process"}
- {live: Material, final: null, action: retire, note: "CL-005/D-008: no ProcessMaterial. Each Material node is resolved: (a) an ingredient material -> relabel/merge into IngredientMaterial keeping or redirecting the uid (EquivalenceAssessment redirect if merged into an existing IngredientMaterial); (b) a chemically defined non-ingredient input (solvent, reagent, intermediate) -> ChemicalSubstance (W02) with the grade moved to ProcessIoProperties.gradeText on each use; (c) unresolvable -> held for review with label Material removed only after resolution (V-W11-12 migration check)"}
- {live: Material.materialType, final: "IngredientMaterial.materialKind (W02) | ProcessIoProperties.ioRole", action: split, note: "type words describing role (solvent, reagent, excipient) become ioRole on each edge; identity kinds go to W02"}
- {live: Material.materialGrade, final: ProcessIoProperties.gradeText, action: move, note: "grade is per use; W02 decides whether a grade is identity-relevant (for example pharmaceutical-grade Niagen is a separate IngredientMaterial in the round-0005 fixture)"}
- {live: Material.regulatoryCategoryHint, final: null, action: retire, note: "becomes a W13 RegulatoryStatus only with an agency record or an Assertion (round 0005 alignment)"}
- {live: Material.traceabilityCode, final: null, action: move, note: "to W12 ProductLot.lotCode or an Identifier on a material lot (seam W11-SR-13)"}
- {live: Material.partOfProducts (PART_OF, DoseMetadata), final: null, action: derive, note: "composition only via FormulationVersion -> IngredientComponent -> USES_MATERIAL (INV-005, W04); live PART_OF edges converted to PROPOSED IngredientComponent candidates for W04 review, then deleted"}
- {live: Material.supportedBy, final: null, action: retire, note: "as above"}
- {live: Organization.performsProcesses (PERFORMS_PROCESS, RoleMetadata), final: "ManufacturingProcess.performedBy (PERFORMS_PROCESS, AssertedEdgeProperties) + Organization field slot (W11-SR-06)", action: keep, note: "asserted; RoleMetadata.validFrom/validTo/recordedFrom/recordedTo copied when an Assertion is created; role/title/corporateRole* dropped; confidence -> Assertion.extractionConfidence with migration Activity (INV-407)"}
- {live: PhysicalLocation.hostsProcesses (HOSTS_PROCESS, TemporalMetadata), final: "ManufacturingProcess.hostedAt (HOSTS_PROCESS from Facility, AssertedEdgeProperties) + Facility field slot (W11-SR-06)", action: move, note: "start node relabelled PhysicalLocation -> Facility by W01 (CL-015); TemporalMetadata bounds copied to the new Assertion; confidence/notes dropped"}
- {live: PhysicalLocation.isManufacturingSite, final: null, action: derive, note: "W01-owned field; W11 view: derivable from an attached HAS_CAPABILITY_STATE or HOSTS_PROCESS; W01 decides retention"}
