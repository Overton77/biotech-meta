- {live: LocationType.PILOT_PLANT, final: null, action: retire, note: "W01 enum; W11-SR-07: piloting is ManufacturingCapability.stage PILOTING; migrate to MANUFACTURING_SITE plus a PROPOSED capability assertion"}
