#
# Imports by name only (owners): Entity, EntityArchetype, VersionedStateArchetype, SearchIndexable, PrivacyClass,
# NodeMaturity, TimePrecision, ValidTimeBasis, AssertedEdgeProperties, StructuralEdgeProperties (W00); Organization
# (W01); Product (W04); AssayVersion, MeasurementMethod, Metric, AlgorithmVersionBasis, MeasurementEdgeProperties (W07);
# ManufacturingStep (W11).
#
# Relationship types used here but owned elsewhere (endpoint fields on W08 types only; seam requests W08-SR-01..05):
# PERFORMED_WITH_ASSAY_VERSION and RUNS_ON_INSTRUMENT (W07), MEASURES_METRIC (W07). Relationship types owned here:
# DEVELOPS_PLATFORM, USES_PLATFORM, IMPLEMENTS_PLATFORM, USES_MODALITY, HAS_SENSOR, USES_EQUIPMENT, RUNS_ON_PLATFORM,
# and the candidates FIRMWARE_VERSION_OF, RUNS_FIRMWARE_VERSION, EMBODIES_MODEL (rename of live CLASSIFIED_AS),
# RUNS_ON_DEVICE. Union EquipmentModelTarget is the B6 rename of the live union ProductClassification.
#
# Boundaries written into every description below: a Device or ToolOrInstrument is an equipment MODEL identity; it
# never carries a regulatory status (510(k) clearance, De Novo, approval are W13 RegulatoryStatus records on a
# Product), a performance claim (an Assertion asserted by the manufacturer), an assay configuration (W07 AssayVersion)
# or a firmware state (FirmwareVersion / AssayVersion.softwareVersion). Individual units (serial numbers, a person's
# own device) are private and never appear in the shared graph (contract A9, D-012).
#
# Enforcement note: cardinality, relationship class and the forbidden implications are enforced by the write service
# and audited by V-W08-01 ... V-W08-10 (07-operations.md, fixtures/w08-validation.cypher), never by SDL alone.
