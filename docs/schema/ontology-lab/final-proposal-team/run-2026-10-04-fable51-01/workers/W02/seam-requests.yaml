# W02 seam requests (run-2026-10-04-fable51-01). Fable copies these into 03-conflict-ledger.md and assigns resolvers.
- id: W02-SR-01
  targetOwner: W00
  request: "Kernel change: allow an object assertion whose predicateClass is QUANTITY to carry valueNumber/unitCode/quantityBasis as qualifiers of the object (amend INV-003 and V-003: objects = 1 and literals <= 1 when predicateClass = QUANTITY; objects + literals = 1 otherwise). Asserted QUANTITATIVELY_CONTAINS edges then equal their assertion, and CALCULATED amounts name the substance they refer to."
  cq: [CQ-PF-01, CQ-ID-03, CQ-ID-C02]
  failingCase: "fx-91: one label component 'NR chloride 250 mg' yields two CALCULATED literal-only assertions (219.5 mg NR cation; 105.0 mg nicotinamide molar equivalent) with the same subject and predicate; Q-10 returns refersTo = null for both (AMBIGUOUS_UNDER_FROZEN_INV_003). The object form names the substance directly but V-003 reports objects 1 + literals 1. Separately, the Ph. Eur. Ginkgo QUANTITATIVELY_CONTAINS edges carry 22.0-27.0 % while their assertions cannot hold a number, so the edge is not a projection of its assertion (contract A5)."
  proposedRuling: "Accept for predicateClass QUANTITY only; V-003 amended; asserted_edge profile rule added: quantity qualifiers on the edge equal those of the assertion."
  primarySource: "M-06 (EFSA 2019 Table 2 '>= 90 wt %'), M-12 (Ph. Eur. ranges), M-03/M-04 (MW inputs)"
- id: W02-SR-02
  targetOwner: W00
  request: "Validator change V-006 -> V-006r: QUANTITATIVELY_CONTAINS requires unitCode, basis, comparator, contentStatementKind; quantity for EQ/APPROX/GE/GT/LE/LT; quantityLow < quantityHigh (and quantity null) for BETWEEN. Implemented as V-W02-10."
  cq: [CQ-ID-C02, CQ-ID-03]
  failingCase: "fx-91: Ph. Eur. 10.0 Ginkgo standardization '22.0%-27.0% ... 5.4%-6.6% terpene lactones' (M-12) as BETWEEN edges -> frozen V-006 returns 2 rows (quantity null) although the statement is complete; V-W02-10 returns 0 rows. Interim fallback without the ruling: two assertions (GE low, LE high) per range."
  proposedRuling: "Replace V-006 by V-006r; keep the catalog requiredQualifiers wording as [quantity shape, unitCode, basis]."
  primarySource: "M-11, M-12, M-06"
