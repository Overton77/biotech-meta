"""
Range of PROVIDES_CONSTITUENT and QUANTITATIVELY_CONTAINS (W02 owner): what a material is said to provide or contain.
"""
union MaterialContentTarget = Constituent | Nutrient | ChemicalSubstance

"""
Properties of QUANTITATIVELY_CONTAINS (asserted_edge profile). Contains every field of the frozen AssertedEdgeProperties
(W00) and adds the content qualifiers. One edge per recorded-time episode; valid bounds equal the authorizing assertion's.
Quantity shape: comparator EQ, APPROX, GE, GT, LE or LT uses quantity; BETWEEN uses quantityLow and quantityHigh with
quantity null (proposed V-006r, W02-SR-02; the frozen V-006 requires quantity). The authorizing assertion should carry the
same number (requested kernel change W02-SR-01). Specification acceptance limits are W12 SpecificationCriterion and lot
measurements are W12 MeasuredResult; they never become this edge.
"""
type QuantitativeContentProperties @relationshipProperties {
  relationshipUid: String!
  assertionUid: String!
  validFrom: DateTime
  validTo: DateTime
  validFromPrecision: TimePrecision
  validToPrecision: TimePrecision
  validFromBasis: ValidTimeBasis!
  validToBasis: ValidTimeBasis!
  recordedFrom: DateTime!
  recordedTo: DateTime
  mongoResearchRunId: String
  "Point value for EQ, APPROX, GE, GT, LE, LT; null for BETWEEN."
  quantity: Float
  "Lower bound for BETWEEN."
  quantityLow: Float
  "Upper bound for BETWEEN."
  quantityHigh: Float
  comparator: QuantityComparator!
  "UCUM unit ('%', 'mg/g', '{CFU}/g')."
  unitCode: String!
  basis: ContentBasis!
  "Mass basis of the quantity when it is a mass (SALT_FORM, ACTIVE_MOIETY, MATERIAL_AS_IS, UNSPECIFIED; W00 enum)."
  massBasis: MassBasis
  "How the measurand is expressed as stated (for example 'calculated as flavone glycosides')."
  expressedAs: String
  contentStatementKind: ContentStatementKind!
  "Verbatim statement text."
  verbatimText: String
}

"""What kind of material identity an IngredientMaterial is (W02). Branding is a label, not a kind."""
enum MaterialKind {
  "a material of one defined substance (any grade or supplier)"
  CHEMICALLY_DEFINED_MATERIAL
  "plant-derived preparation (BotanicalPreparation label)"
  BOTANICAL_PREPARATION
  "microorganism preparation (MicrobialPreparation label)"
  MICROBIAL_PREPARATION
  "combination of materials (MaterialMixture label)"
  MATERIAL_MIXTURE
  "protein, peptide or enzyme material whose gene-product identity is a MolecularEntity (CL-002 boundary)"
  PROTEIN_OR_ENZYME_PREPARATION
  "known only as what a source says was used; competing identities are ResolutionHypotheses"
  UNRESOLVED_MATERIAL
  "none of the above (for example gelatin, oils as other ingredients)"
  OTHER_MATERIAL
  "legacy 0.2.0 fixture value = CHEMICALLY_DEFINED_MATERIAL plus the BrandedIngredientMaterial label; not for new writes"
  BRANDED_CHEMICAL_MATERIAL
}

"""Physical form kinds that a structure authority does not register as separate substances (W02)."""
enum ChemicalFormKind {
  "a crystalline form or polymorph"
  CRYSTAL_FORM
  "non-crystalline solid"
  AMORPHOUS_FORM
  "a particle-size or processing grade (micronized)"
  PARTICLE_SIZE_GRADE
  "other stated physical form"
  OTHER_PHYSICAL_FORM
}

"""Herbal preparation types (EMA/Ph. Eur. vocabulary) (W02)."""
enum BotanicalPreparationType {
  POWDERED_HERBAL_SUBSTANCE
  DRY_EXTRACT
  SOFT_EXTRACT
  LIQUID_EXTRACT
  TINCTURE
  ESSENTIAL_OIL
  FATTY_OIL
  EXPRESSED_JUICE
  OTHER_PREPARATION
}

"""Stated viability of microorganisms in a preparation (W02). Null = not stated."""
enum ViabilityState {
  "live vegetative cells stated"
  VIABLE
  "live spores stated"
  VIABLE_SPORES
  "heat-killed or otherwise inactivated cells"
  INACTIVATED
  "cell fractions, lysates or metabolites without intact cells"
  CELL_FRACTION_OR_LYSATE
}

"""Kind of material mixture (W02)."""
enum MixtureKind {
  "blend declared as proprietary"
  PROPRIETARY_BLEND
  "named complex of stated components (PC Complex)"
  NAMED_COMPLEX
  "supplier premix of several ingredients"
  PREMIX
  "materials processed together into one material"
  CO_PROCESSED_MATERIAL
}

"""Kind of Constituent (W02)."""
enum ConstituentKind {
  "class of compounds (carotenoids, tocopherols, terpene lactones)"
  CHEMICAL_CLASS
  "measurand defined by a method ('flavonoids calculated as flavone glycosides')"
  ANALYTICAL_MEASURAND
  "undefined fraction ('phytonutrients')"
  NON_SPECIFIC_FRACTION
}

"""Kind of Nutrient (W02)."""
enum NutrientKind {
  VITAMIN
  MINERAL
  MACRONUTRIENT
  FATTY_ACID
  AMINO_ACID
  OTHER_NUTRIENT
}

"""Taxonomic rank (W02)."""
enum TaxonRank {
  GENUS
  SPECIES
  SUBSPECIES
  VARIETY
  FORMA
  CULTIVAR
  OTHER_RANK
}

"""What a material content quantity is relative to (W02)."""
enum ContentBasis {
  "mass of target per mass of material (% w/w)"
  MASS_FRACTION_W_W
  "% v/v"
  VOLUME_FRACTION_V_V
  "amount per mass of material (mg/g, {CFU}/g)"
  AMOUNT_PER_MASS_OF_MATERIAL
  "enzyme activity units per mass"
  ACTIVITY_PER_MASS_OF_MATERIAL
  "moles of target per mole of material substance"
  MOLAR_RATIO
}

"""Shape of a content statement (W02)."""
enum QuantityComparator {
  EQ
  APPROX
  GE
  GT
  LE
  LT
  "uses quantityLow and quantityHigh"
  BETWEEN
}

"""What kind of statement a QUANTITATIVELY_CONTAINS edge projects (W02). Specification limits and measurements are not here."""
enum ContentStatementKind {
  "the material is stated to be standardized/adjusted to this content"
  STANDARDIZATION_CLAIM
  "composition that defines the material in an authority record or monograph"
  DEFINITIONAL_COMPOSITION
  "typical composition reported by a source without a lot"
  TYPICAL_COMPOSITION_REPORTED
  "BellLabs calculation (assertion basisKind CALCULATED with derivationRule and inputs)"
  CALCULATED
}

