"""
The canonical identity of an actual material that can be used as an ingredient, administered in a study, or consumed or
produced by a process: a chemically defined material (a supplier's or generic grade of one substance in one form), a
branded material governed by a specification, a botanical preparation, a microbial preparation, or a mixture with nested
materials. It is NOT a chemical substance (structure identity: ChemicalSubstance), NOT a solid-state form (ChemicalForm),
NOT a dosage form or product (ProductVariant/StudyIntervention), NOT a contextual component with an amount
(IngredientComponent/InterventionComponent), and NOT a lot (ProductLot). Same substance never establishes same material
(INV-008). Live Ingredient and Material nodes migrate here keeping their opaque id (D-008). Serves CQ-ID-03, CQ-ID-06,
CQ-ST-01, CQ-ST-02, CQ-PF-01. Module substances_and_materials; archetype Entity; uid token material (also for every
specialization below, so reclassifying a material never changes its uid; W02-SR-03).
"""
type IngredientMaterial implements Entity & EntityArchetype & SearchIndexable
  @node(labels: ["IngredientMaterial", "Entity"])
  @fulltext(indexes: [{indexName: "IngredientSearch", fields: ["name", "description", "searchText"], queryName: "searchIngredients"}]) {
  id: ID! @id
  uid: String!
  name: String
  description: String
  mongoResearchRunId: String
  createdAt: DateTime! @timestamp(operations: [CREATE])
  updatedAt: DateTime! @timestamp(operations: [CREATE, UPDATE])
  privacyClass: PrivacyClass
  maturity: NodeMaturity
  schemaVersion: String
  entityType: String!
  """What kind of material identity this is (W02 enum). Null = not yet classified (migration); UNRESOLVED_MATERIAL = a
  material known only as what a source says was used. Branding is the BrandedIngredientMaterial label, not a kind."""
  materialKind: MaterialKind
  searchText: String
  searchFields: [String!]
  embeddingModel: String
  embeddingDimensions: Int
  """class: asserted; cardinality: many; catalog: REALIZES_SUBSTANCE; owner: W02; target is the exact substance the source states (a salt when stated; the active moiety when only the moiety is named)"""
  realizesSubstances: [ChemicalSubstance!]! @relationship(type: "REALIZES_SUBSTANCE", direction: OUT, properties: "AssertedEdgeProperties")
  """class: asserted; cardinality: many; catalog: HAS_CHEMICAL_FORM; owner: W02"""
  chemicalForms: [ChemicalForm!]! @relationship(type: "HAS_CHEMICAL_FORM", direction: OUT, properties: "AssertedEdgeProperties")
  """class: asserted; cardinality: many; catalog: PROVIDES_CONSTITUENT; owner: W02; non-quantitative; never implies QUANTITATIVELY_CONTAINS (forbidden implication, V-W02-01)"""
  providesConstituents: [MaterialContentTarget!]! @relationship(type: "PROVIDES_CONSTITUENT", direction: OUT, properties: "AssertedEdgeProperties")
  """class: asserted; cardinality: many; catalog: QUANTITATIVELY_CONTAINS; owner: W02; requires quantity shape, unitCode, basis (V-006 / proposed V-006r); spec limits are W12 SpecificationCriterion, lot results W12 MeasuredResult"""
  quantitativelyContains: [MaterialContentTarget!]! @relationship(type: "QUANTITATIVELY_CONTAINS", direction: OUT, properties: "QuantitativeContentProperties")
  """class: asserted; cardinality: many; catalog: HAS_MIXTURE_COMPONENT (inverse); owner: W02"""
  componentOfMixtures: [MaterialMixture!]! @relationship(type: "HAS_MIXTURE_COMPONENT", direction: IN, properties: "AssertedEdgeProperties")
  """class: asserted; cardinality: many; catalog: HAS_IDENTIFIER; owner: W00"""
  identifiers: [Identifier!]! @relationship(type: "HAS_IDENTIFIER", direction: OUT, properties: "IdentifierLinkProperties")
  """class: asserted; cardinality: many; catalog: GOVERNED_BY_SPECIFICATION; owner: W11; a specification change is a new SpecificationVersion, never a new material (W02 D-06)"""
  governedBySpecifications: [SpecificationVersion!]! @relationship(type: "GOVERNED_BY_SPECIFICATION", direction: OUT, properties: "AssertedEdgeProperties")
  """class: asserted; cardinality: many; catalog: PRODUCED_BY_PROCESS; owner: W11"""
  producedByProcesses: [ManufacturingProcess!]! @relationship(type: "PRODUCED_BY_PROCESS", direction: OUT, properties: "AssertedEdgeProperties")
  """class: derived; cardinality: many; catalog: AFFECTS_MECHANISM; owner: W03; regenerable projection of ACCEPTED DIRECT_MEASUREMENT mechanism assertions (INV-211)"""
  affectsMechanisms: [Mechanism!]! @relationship(type: "AFFECTS_MECHANISM", direction: OUT, properties: "DerivedEdgeProperties") @settable(onCreate: false, onUpdate: false)
  """class: derived; cardinality: many; catalog: MODULATES; owner: W03; regenerable projection of mechanism assertions"""
  modulates: [MolecularEntity!]! @relationship(type: "MODULATES", direction: OUT, properties: "DerivedEdgeProperties") @settable(onCreate: false, onUpdate: false)
}

