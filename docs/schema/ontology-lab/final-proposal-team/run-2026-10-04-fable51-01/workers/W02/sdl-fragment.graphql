riboside chloride described for NIAGEN. NOT a material (a supplier's material HAS_CHEMICAL_FORM it), NOT a dosage form
(ProductVariant/StudyIntervention.dosageForm; V-222b). Replaces the chemical part of live CompoundForm (D-002). Serves
