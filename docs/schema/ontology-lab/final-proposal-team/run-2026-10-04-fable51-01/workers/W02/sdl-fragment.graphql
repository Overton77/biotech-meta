"""
A chemical substance identified by its defining structure including counter-ions and stoichiometric solvates, at the
granularity of the FDA GSRS substance record (UNII): nicotinamide riboside chloride (UNII 8XM2XT8VWI) and nicotinamide
riboside (UNII 0I8H2M0L7N) are two ChemicalSubstances joined by HAS_ACTIVE_MOIETY. Endogenous metabolites (NAD+) are
ChemicalSubstances whatever their role (measured analyte, ingredient, mechanism participant); gene-encoded entities
(genes, proteins, enzymes) are MolecularEntity (W03; CL-002). NOT a material (IngredientMaterial), NOT a solid-state form
(ChemicalForm), NOT a combination (NRPT is not a substance; V-W02-03, V-W02-04), NOT a class of constituents
(Constituent). Replaces live Compound (D-002); identifiers are Identifier records, the keys below are materialized
lookups only. Serves CQ-ID-03, CQ-ID-04, CQ-PF-01, CQ-ST-02, CQ-ID-C01, CQ-ID-C04. Module substances_and_materials;
archetype Entity; uid token substance.
"""
type ChemicalSubstance implements Entity & EntityArchetype & SearchIndexable
  @node(labels: ["ChemicalSubstance", "Entity"])
  @fulltext(indexes: [{indexName: "CompoundSearch", fields: ["name", "preferredName", "description", "commonName", "casNumber", "searchText"], queryName: "searchCompounds"}]) {
