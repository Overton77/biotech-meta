  """class: asserted; cardinality: exactly_one across the three component fields; catalog: COMPONENT_PRODUCT (-> ProductVariant)."""
  componentVariant: [ProductVariant!]! @relationship(type: "COMPONENT_PRODUCT", direction: OUT, properties: "AssertedEdgeProperties")
  """class: asserted; cardinality: exactly_one across the three component fields; catalog: COMPONENT_PRODUCT (-> PackageConfiguration, W15 range extension W15-SR-07)."""
