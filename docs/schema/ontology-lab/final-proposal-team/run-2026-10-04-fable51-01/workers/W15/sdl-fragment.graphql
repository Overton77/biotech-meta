a printed code alone does not establish the lot identity) and NEVER a unit a private person bought or used (private, W23;
V-113..V-116). Recall exposure is a CommerceMatch candidate, never a property. Serves CQ-AX-19 (expansion; W12 testing),
CQ-CM-C03. Canonical module products_and_commerce. Archetype Entity.
