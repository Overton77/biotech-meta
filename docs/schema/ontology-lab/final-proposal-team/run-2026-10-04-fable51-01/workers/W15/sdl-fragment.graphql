"""
A merchant's stock-keeping record for an item it holds or sells (merchant SKU, FBA/WFS inventory id): the unit of
inventory reconciliation, recall exposure and authorized-channel checks. It is NOT a listing (a listing may draw on several
inventory records), NOT a lot (W12) and NOT a person's purchase (private, W23). Recalled, expired, counterfeit-suspected
or gray-market status is NEVER a property here: it is a CommerceMatch candidate with its supporting locators (OPEN-QUESTIONS
quality/commerce 5). Serves CQ-CM-C03 (candidate). Canonical module products_and_commerce. Archetype Entity.
"""
type InventoryItem implements Entity & EntityArchetype
  @node(labels: ["InventoryItem", "Entity"]) {
