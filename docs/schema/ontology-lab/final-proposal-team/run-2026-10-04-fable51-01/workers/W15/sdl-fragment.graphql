"""
A BellLabs assessment comparing a commerce record with a reference identity under a named method: listing or inventory
to variant/package/bundle (is it the same sellable item?), unit or inventory to a recalled lot scope, offer seller to a
brand's authorized-channel statement. It records candidates, outcome, score and rationale with supporting locators; it
never writes a LISTING_FOR, a recall status or a gray-market flag by itself. A listing whose identity is not established
keeps NO LISTING_FOR and an UNRESOLVED CommerceMatch; a recalled-lot or unauthorized-channel signal stays a PROPOSED
candidate until reviewed. Serves CQ-CM-02, CQ-AX-14 (commerce), CQ-CM-C03. Canonical module products_and_commerce.
Archetype EvidenceAssessment.
"""
type CommerceMatch implements Entity & EvidenceAssessmentArchetype
  @node(labels: ["CommerceMatch", "EvidenceAssessment"])
  @mutation(operations: [CREATE, UPDATE]) {
  id: ID! @id
  "hu:commerce-match:<opaque> (token requested, W15-SR-08)"
  uid: String! @settable(onCreate: true, onUpdate: false)
  name: String
  description: String
  mongoResearchRunId: String
  createdAt: DateTime! @timestamp(operations: [CREATE])
  updatedAt: DateTime! @timestamp(operations: [CREATE, UPDATE])
  privacyClass: PrivacyClass
  maturity: NodeMaturity
  schemaVersion: String
  "Always 'CommerceMatch'."
  assessmentType: String! @settable(onCreate: true, onUpdate: false)
  "Matching method and version (e.g. 'w15-gtin-title-match/v0')."
  methodVersion: String! @settable(onCreate: true, onUpdate: false)
  status: AssessmentStatus!
  recordedAt: DateTime! @settable(onCreate: true, onUpdate: false)
  recordedTo: DateTime @settable(onCreate: false, onUpdate: true)
  summary: String
  overallScore: Float
  "DEPRECATED; use score with methodVersion."
  confidence: Float @settable(onCreate: false, onUpdate: false)
  "Catalog matchKind (controlled, enum requested W15-SR-10): LISTING_TO_ITEM, INVENTORY_TO_ITEM, RECALL_SCOPE, AUTHORIZED_CHANNEL."
  matchKind: String! @settable(onCreate: true, onUpdate: false)
  "Outcome (controlled): SAME_ITEM, DIFFERENT_ITEM, IN_SCOPE, OUT_OF_SCOPE, NO_AUTHORIZATION_FOUND, AUTHORIZED, NOT_DETERMINABLE, UNRESOLVED."
  matchOutcome: String
  "Method score in [0,1] (catalog score); null = not scored. Never a truth value."
  score: Float @settable(onCreate: true, onUpdate: false)
  "Why the comparison came out as it did (catalog rationale), naming what could not be established."
  rationale: String @settable(onCreate: true, onUpdate: false)

  """class: structural; cardinality: one_or_more (at least two in practice: the record assessed and its candidate references; service-enforced); catalog: MATCHES_COMMERCE_ITEM, range CommerceItemTarget."""
  matchesItems: [CommerceItemTarget!]! @relationship(type: "MATCHES_COMMERCE_ITEM", direction: OUT)
  """class: structural; cardinality: one_or_more for RECALL_SCOPE and AUTHORIZED_CHANNEL; catalog: SUPPORTED_BY (W00)."""
  supportedBy: [SourceLocator!]! @relationship(type: "SUPPORTED_BY", direction: OUT)
  """class: structural; catalog: WAS_GENERATED_BY (W00; matching Activity)."""
  generatedBy: [Activity!]! @relationship(type: "WAS_GENERATED_BY", direction: OUT)
  """class: structural; catalog: SUPERSEDES (newer CommerceMatch -> older)."""
  supersedes: [CommerceMatch!]! @relationship(type: "SUPERSEDES", direction: OUT, properties: "SupersessionProperties")
  """class: structural; catalog: ASSESSED_BY (-> Agent)."""
  assessedByAgent: [Agent!]! @relationship(type: "ASSESSED_BY", direction: OUT)
  """class: structural; catalog: ASSESSED_BY (-> Person)."""
  assessedByPerson: [Person!]! @relationship(type: "ASSESSED_BY", direction: OUT)
}

# ---------------------------------------------------------------------------------------------------------------------
# 2. Relationship-property type
# ---------------------------------------------------------------------------------------------------------------------

"""
Successor of live ListingMetadata for listing-scoped asserted edges (LISTS_PROCEDURE, AVAILABLE_IN). Specializes
AssertedEdgeProperties: contains every field of it, plus `appointmentRequiredOverride` (live qualifier for procedure and
clinic listings, shares the edge's life). Live `listRole` is split into role relationship types, `localPriceAmount` /
`localCurrency` become PriceObservations, `notes` is not carried (migration-map.yaml).
"""
type ListingEdgeProperties @relationshipProperties {
  "Stable audit id hu:rel:<opaque>."
  relationshipUid: String!
  "uid of the one Assertion that authorizes this edge (predicate = edge type)."
  assertionUid: String!
  validFrom: DateTime
  validTo: DateTime
  validFromPrecision: TimePrecision
  validToPrecision: TimePrecision
  validFromBasis: ValidTimeBasis!
  validToBasis: ValidTimeBasis!
  "Service-assigned commit time of this episode."
  recordedFrom: DateTime!
  "Written once from null."
  recordedTo: DateTime
  mongoResearchRunId: String
  "Listing-level override: an appointment is required for this procedure/location even when the procedure does not require one generally. Null = not stated."
  appointmentRequiredOverride: Boolean
}

# ---------------------------------------------------------------------------------------------------------------------
# 3. Enums
# ---------------------------------------------------------------------------------------------------------------------

"""
Kind of displayed price (catalog conventions.priceKind, frozen). LIST = a reference/list price shown by the merchant
('List Price: $114.99'); ONE_TIME = the price to buy once now; SUBSCRIPTION = the price under a subscription plan;
COUPON_ADJUSTED = a price after a displayed coupon or promotion; PER_UNIT = a price per unit of quantity (with unitCode).
One observation per kind; kinds are never averaged (V-328). Owner W15.
"""
enum PriceKind {
  LIST
  ONE_TIME
  SUBSCRIPTION
  COUPON_ADJUSTED
  PER_UNIT
}

"""
Purchase mode of an Offer (new closed list for the catalog property offerKind; CANDIDATE values, ledger request W15-SR-10).
PURCHASE = can be bought once (subscription plans may additionally attach); SUBSCRIPTION_ONLY = requires a plan (Shopify
requires_selling_plan true); PREORDER; SERVICE_BOOKING = a procedure or test appointment (live Listing breadth); UNKNOWN.
Condition (new/used) is Offer.itemCondition, not a kind. Owner W15.
"""
enum OfferKind {
  PURCHASE
  SUBSCRIPTION_ONLY
  PREORDER
  SERVICE_BOOKING
  UNKNOWN
}

"""
Availability AS DISPLAYED with a price at an observation instant (CANDIDATE vocabulary aligned to schema.org ItemAvailability;
ledger request W15-SR-10). None of these values ends an offer or a product: DISCONTINUED_AS_DISPLAYED is a merchant
statement, OUT_OF_STOCK is a displayed state, NOT_DISPLAYED means the capture shows no availability statement (distinct
from a null field = not captured). Owner W15.
"""
enum ObservedAvailability {
  IN_STOCK
  LIMITED_STOCK
  OUT_OF_STOCK
  BACKORDER
  PREORDER
  CURRENTLY_UNAVAILABLE
  DISCONTINUED_AS_DISPLAYED
  NOT_DISPLAYED
  UNKNOWN
}

# ---------------------------------------------------------------------------------------------------------------------
# 4. Unions
# ---------------------------------------------------------------------------------------------------------------------

"""
Range of LISTING_FOR and INVENTORY_INSTANCE_OF: the sellable item identity a listing or an inventory record is for.
ProductVariant and PackageConfiguration are W04 identities; Bundle is W15's multi-item sellable unit (range extension,
W15-SR-07). A Product is deliberately absent: a listing is always for something more specific than the enduring product.
"""
union ListingTarget = ProductVariant | PackageConfiguration | Bundle

"""
Range of MATCHES_COMMERCE_ITEM: the commerce record being assessed and the reference identities it is compared with
(catalog ProductVariant | MerchantListing | InventoryItem, extended by W15 with Offer, IndividualUnit, PackageConfiguration,
Bundle, ProductLot and Organization for recall-scope and authorized-channel checks, W15-SR-07). Parent-only rule: Organization
covers its specializations.
"""
union CommerceItemTarget = MerchantListing | Offer | InventoryItem | IndividualUnit | ProductVariant | PackageConfiguration | Bundle | ProductLot | Organization
