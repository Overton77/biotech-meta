  failingCase: "One relationship type MEASURED_IN would carry two meanings (context compartment vs metric organ); V-239 joins on MEASURED_IN and would read a Metric edge as a context."
  proposedRuling: "Accept; W07 drops or renames Metric.measuredInOrgans."
