# W03 seam requests (run-2026-10-04-fable51-01). Fixture and query references are under workers/W03/fixtures/.
- id: W03-SR-01
  targetOwner: W00
  request: >
    Amend V-233 and V-234 (and INV-211 wording) so mechanism projections may cite inputs through derivationRule
    'mx-proj/v1' + derivedFromAssertionUids, as catalog relationshipClasses.derived already allows; adopt V-233r/V-234r
    from w03-validation.cypher. Register 'mx-proj/v1' as a catalog derivation rule.
  cq: [CQ-MX-05, CQ-MX-03]
  failingCase: >
    Positive fixture: six valid rule-mode edges (AFFECTS_MECHANISM x2, APPLIES_TO_SPECIES x2, ACTS_IN x2) pass V-112 but
    verbatim V-233 returns 4 rows and V-234 returns 2 rows (run 2026-10-04). Negative N12: the same edge encoded with
    projectionOfAssertionUid passes V-233 but fails V-112 CITED_PREDICATE_DIFFERS_FROM_EDGE_TYPE (INDUCES_PROCESS vs
    AFFECTS_MECHANISM). No encoding satisfies V-112 and verbatim V-233/V-234 together.
  proposedRuling: "Replace V-233/V-234 by V-233r/V-234r; keep V-112 unchanged; mechanism projections use rule mode."
- id: W03-SR-02
  targetOwner: W00
  request: >
    Add to the W00 Assertion types the outgoing field observedInContext: [MechanismEvidenceContext!]!
    @relationship(type: "OBSERVED_IN_CONTEXT", direction: OUT) (structural, zero_or_one) and widen the catalog note of
    DERIVED_FROM_ASSERTION to "inputs of a CALCULATED assertion or premises of an INFERRED_FROM_MEASUREMENT assertion".
  cq: [CQ-MX-01, CQ-MX-02]
  failingCase: >
    W00 sdl-fragment has no OBSERVED_IN_CONTEXT field, so GraphQL clients cannot reach a step's context from the
    assertion. Fixture assertion hu:assertion:trammell-nr-nad-synthesis-heart-inferred names its measured premise only
    through DERIVED_FROM_ASSERTION; V-231 forbids it a context; V-W03-04 (negative N14) requires the premise.
  proposedRuling: "Accept; W03 keeps the inverse field MechanismEvidenceContext.observedAssertions."
- id: W03-SR-03
  targetOwner: W07
  request: >
    Add a candidate structural edge Biomarker -HAS_ANALYTE-> ChemicalSubstance | MolecularEntity (zero_or_one) so that
    compartment-specific measurands of one analyte are joinable (NAD+ in whole blood, liver, heart).
  cq: [CQ-MX-03, CQ-MX-C04]
  failingCase: >
    Fixture measurands hu:biomarker:nad-plus-whole-blood (human), nad-plus-liver and nad-plus-heart (mouse) share no
    edge except by name; CQ-MX-C04 query returns 5 rows only through HAS_ANALYTE. Without it a level step in one
    compartment cannot be located in another (round 0003 M1) and Biomarker.inPathways cannot be derived.
  proposedRuling: "W07 defines HAS_ANALYTE as CANDIDATE; W03 meaning: the analyte identity of a compartment-specific measurand."
- id: W03-SR-04
  targetOwner: W00
  request: >
    Register uid tokens: Pathway -> 'pathway', Condition -> 'condition', RiskFactor -> 'risk-factor', and Organ ->
    'anatomical-context' (specialization shares the parent identity space, as LegalEntity shares 'org').
  cq: [CQ-MX-C01, CQ-MX-C03]
  failingCase: "Fixture nodes hu:pathway:reactome-r-hsa-196807, hu:condition:sarcopenia use unregistered tokens; liver is hu:anatomical-context:liver with labels Organ, AnatomicalContext."
  proposedRuling: "Accept the four tokens."
- id: W03-SR-05
  targetOwner: W02
  request: >
    CL-002 boundary: MolecularEntity = genome-encoded actors (gene, transcript, protein, complex, family, ncRNA);
    every small molecule including endogenous metabolites (NAD+, NAAD, NMN) is ChemicalSubstance keyed by structure.
    Add read-only derived fields on W02 types: ChemicalSubstance.affectsMechanisms (AFFECTS_MECHANISM OUT) and
    .modulates (MODULATES OUT); ChemicalForm.affectsMechanisms; IngredientMaterial.affectsMechanisms and .modulates;
    all with properties AssociationProjectionProperties and @settable(onCreate:false,onUpdate:false). Optionally
    ChemicalSubstance.participatesInPathways (PARTICIPATES_IN OUT, MechanismLinkProperties) for metabolite participants.
  cq: [CQ-MX-01, CQ-MX-05]
  failingCase: >
    PubChem CID 5892 "Nadide" (InChIKey BAWFJGJZGIEFAR-NNYOXOHSSA-N) is NAD+ as metabolite and as supplement substance;
    negative N8 creates MolecularEntity "NAD+ (Nadide)" with entityKind METABOLITE and V-W03-05 reports it.
  proposedRuling: "Rule CL-002 with this boundary; W02 adds the derived fields."
- id: W03-SR-06
  targetOwner: W07
  request: >
    Rulings for W07-SR-07: retire Biomarker.inPathways (IN_PATHWAY) in favour of analyte PARTICIPATES_IN (after
    W03-SR-03); merge Biomarker.expressedInOrgans (EXPRESSED_IN) into EXPRESSED_IN_CONTEXT (Organ is an
    AnatomicalContext); retire live Metric.measuredInOrgans (relationship type MEASURED_IN Metric -> Organ), whose name
    collides with MechanismEvidenceContext -MEASURED_IN-> AnatomicalContext; compartment of a measurand is
    Biomarker MEASURED_IN_MATRIX and Metric.systemKind.
