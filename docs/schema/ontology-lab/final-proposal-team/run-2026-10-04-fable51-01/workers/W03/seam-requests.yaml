- id: W03-SR-11
  targetOwner: W10
  request: >
    EXPOSURE dimension consumes MechanismEvidenceContext exposure fields. Basis mapping for ratio eligibility
    (INV-203): ABSOLUTE_PER_DAY <-> QuantityBasis PER_DAY; PER_KG_BODY_WEIGHT_PER_DAY <-> PER_KG_BODY_WEIGHT_PER_DAY;
    SINGLE_DOSE <-> SINGLE_DOSE only when exposureUnit and target unit agree on per-kg vs absolute; MEDIUM_CONCENTRATION
    and DIET_CONCENTRATION never ratio against a product amount. A derived hedValue never counts as human exposure evidence.
  cq: [CQ-MX-04, CQ-EV-04, CQ-AX-20]
  failingCase: "Trammell context: 185 mg/kg SINGLE_DOSE with derived HED 15.04 mg/kg; a product label states mg per serving; negative N13 shows MATCH without human exposure evidence (V-237)."
  proposedRuling: "W10 states the mapping in its EXPOSURE dimension card; V-237 unchanged."
