#                       candidates CQ-MX-C01..C04 (see 02-cq-coverage.md)
# Invariants: INV-004, INV-007, INV-104, INV-106, INV-210..213; validators V-112, V-230..V-239 (+ proposed V-233r/V-234r,
#             V-W03-01..10 in fixtures/w03-validation.cypher)
#
# Owned here (sole writer): node types Mechanism, Pathway, MolecularEntity, Species, AnatomicalContext, Organ, Outcome,
# Condition, RiskFactor, MechanismEvidenceContext; enums MechanismSetting, ExposureBasis, AnatomicalContextKind,
# RegulatorySign; relationship-property types MechanismLinkProperties, AssociationProjectionProperties.
# Live `Association` (and its `AssociationParticipant` union, `AssociationMetadata`, `MechanismLinkMetadata`) are retired;
# see migration-map.yaml. No `extend`. Other owners' types are referenced by name only:
#   W00: Entity, EntityArchetype, OccurrenceArchetype, SearchIndexable, PrivacyClass, NodeMaturity, Polarity, Assertion,
#        Identifier, IdentifierLinkProperties, StructuralEdgeProperties (fields embedded below are copied verbatim from
#        DerivedEdgeProperties / StructuralEdgeProperties as contract B4 requires)
#   W02: ChemicalSubstance, ChemicalForm, IngredientMaterial          W07: Biomarker, Metric          W09: StudyArm
