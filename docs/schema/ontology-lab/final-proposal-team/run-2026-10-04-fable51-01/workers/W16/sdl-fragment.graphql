"""Kind of public protocol (live enum, kept). A classification of the definition, not of any person's use."""
enum ProtocolType {
  TREATMENT_PROTOCOL
  SUPPLEMENT_PROTOCOL
  DIAGNOSTIC_PROTOCOL
  MONITORING_PROTOCOL
  TESTING_PROTOCOL
  SCREENING_PROTOCOL
  EXERCISE_PROTOCOL
  NUTRITION_PROTOCOL
  FASTING_PROTOCOL
  SLEEP_PROTOCOL
  RECOVERY_PROTOCOL
  DRUG_ADMINISTRATION_PROTOCOL
  DOSING_PROTOCOL
  TITRATION_PROTOCOL
  LAB_PANEL_PROTOCOL
  IMAGING_PROTOCOL
  BIOPSY_PROTOCOL
  SAMPLE_COLLECTION_PROTOCOL
  CLINICAL_TRIAL_PROTOCOL
  RESEARCH_PROTOCOL
  EXPERIMENTAL_PROTOCOL
  SOP
  WORKFLOW
  UNKNOWN
}

"""Recurrence pattern of a step or edition schedule (live enum, kept). Recurrence is schedule, never a DEPENDS_ON loop."""
enum SchedulePattern {
  ONE_TIME
  RECURRING
  DAILY
  WEEKLY
  MONTHLY
  CYCLIC
  INTERMITTENT
  AS_NEEDED
  EVENT_DRIVEN
  PHASE_BASED
  UNKNOWN
}

"""Unit for cadence intervals, occurrence periods and dependency lags (live enum, kept; YEAR and MINUTE requested in W16-SR-07)."""
enum CadenceUnit {
  HOUR
  DAY
  WEEK
  MONTH
  CYCLE
  AS_NEEDED
  UNKNOWN
}

"""Source-stated time-of-day anchor (live enum, kept). Clock times stay verbatim in timingText."""
enum TimeOfDay {
  MORNING
  AFTERNOON
  EVENING
  NIGHT
  BEDTIME
  UPON_WAKING
  PRE_MEAL
  WITH_MEAL
  POST_MEAL
  FASTED
  ANYTIME
  UNKNOWN
}

"""Day of week (live enum, kept)."""
enum DayOfWeek {
  MONDAY
  TUESDAY
  WEDNESDAY
  THURSDAY
  FRIDAY
  SATURDAY
  SUNDAY
}

"""Action kind of a protocol step (live enum, kept). AVOID is a step ("do not eat after 5 pm"), not the absence of a step."""
enum ProtocolStepType {
  ADMINISTER
  INGEST
  INJECT
  INFUSE
  APPLY
  MEASURE
  TEST
  SAMPLE
  OBSERVE
  RECORD
  MONITOR
  EXERCISE
  SLEEP
  FAST
  EAT
  AVOID
  ADJUST
  TITRATE
  RECOVER
  REVIEW
  DECISION
  OTHER
  UNKNOWN
}

"""How the source frames a step's necessity (catalog requirementLevel). Replaces live isOptional; isOptional=false never maps to ESSENTIAL."""
enum RequirementLevel {
  ESSENTIAL
  RECOMMENDED
  OPTIONAL
  CONDITIONAL
  NOT_STATED
}

"""Whether a requirement level or dependency was stated by the source or inferred editorially (catalog requirementBasis)."""
enum RequirementBasis {
  STATED_BY_SOURCE
  EDITORIAL_INFERENCE
  NOT_STATED
}

"""Kind of step-to-step dependency (catalog dependencyKind). Ordering kinds (REQUIRES_*) form a DAG per edition; CONCURRENT_WITH and MUTUALLY_EXCLUSIVE_WITH are symmetric and never ordering."""
enum StepDependencyKind {
  REQUIRES_PRIOR_COMPLETION
  REQUIRES_RESULT_OF
  CONCURRENT_WITH
  MUTUALLY_EXCLUSIVE_WITH
}

"""Role a constraint plays for a step, edition or adjustment rule (catalog constraintRole)."""
enum ConstraintRole {
  APPLIES_WHEN
  CONTRAINDICATED_WHEN
  REQUIRES_BEFORE
}

"""Kind of fact a constraint tests (catalog constraintKind). Replaces live free-text constraintType."""
enum ConstraintKind {
  POPULATION
  CONDITION_PRESENT
  CONDITION_ABSENT
  MEASUREMENT_THRESHOLD
  PHASE
  TIME_WINDOW
  CO_INTERVENTION
}

"""When a measurement plan measures (catalog planTiming). Replaces live free-text planType."""
enum MeasurementPlanTiming {
  BASELINE
  DURING
  FOLLOW_UP
  PERIODIC
}

"""What fires a review/adjustment rule (catalog triggerKind)."""
enum ReviewTriggerKind {
  THRESHOLD_CROSSED
  TREND
  ADVERSE_EVENT_REPORTED
  SCHEDULED_REVIEW
}

"""Comparator for rule and constraint thresholds and one-sided targets (catalog comparator). OUTSIDE_REFERENCE_RANGE never implies a condition."""
enum ThresholdComparator {
  GT
  GTE
  LT
  LTE
  OUTSIDE_REFERENCE_RANGE
}

"""What a rule says to do (catalog triggerAction). A public rule never authorizes a private dose change."""
enum ReviewTriggerAction {
  REVIEW
  PAUSE_STEP
  STOP_PROTOCOL
  ADJUST_DOSE
  CONTACT_CLINICIAN
}

"""Whose rule it is (catalog ruleBasis). BELLLABS_SAFETY_POLICY rules are INTERNAL and name a PolicyVersion uid."""
enum ReviewRuleBasis {
  STATED_BY_SOURCE
  BELLLABS_SAFETY_POLICY
}

"""How a protocol change became known (catalog protocolChangeProvenance). An edition carries only SOURCE_VERSIONED or SNAPSHOT_DIFF; THIRD_PARTY_REPORTED labels Assertions and query rows, never an edition."""
enum ProtocolChangeProvenance {
  SOURCE_VERSIONED
  SNAPSHOT_DIFF
  THIRD_PARTY_REPORTED
}

# ----------------------------------------------------------------------------------------------------
# Unions (owner W16). Members must exist in the final schema (owners listed in the banner).
# ----------------------------------------------------------------------------------------------------

"""Range of USES (step -> declared material/product). Replaces live StepSubstance; Compound/CompoundForm retired (D-002). Pinning a FormulationVersion binds the exact composition; a Product/ProductVariant target floats and is resolved as-of."""
union StepSubstanceTarget = IngredientMaterial | ChemicalSubstance | ChemicalForm | Product | ProductVariant | FormulationVersion | FoodItem | FoodProduct

"""Range of EMPLOYS (step -> device, test, assay version, instrument or exposure). Replaces live StepInstrument; AssayVersion and ToolOrInstrument added for version-pinned measurement steps."""
union StepInstrumentTarget = Device | LabTest | AssayVersion | ToolOrInstrument | Exposure

"""Range of TARGETS (stated purpose of a step or edition). Stated intent only; never efficacy evidence. Replaces live TherapeuticTarget."""
union TherapeuticTargetTarget = Condition | Outcome | Mechanism

"""Range of BASED_ON (constraint -> the fact it tests). Catalog range kept exactly. Replaces live ConstraintBasis."""
union ConstraintBasisTarget = Condition | Biomarker | LabTest | Metric

"""Range of ProtocolResult MENTIONS (extraction aid; a mention is not an endorsement or a result about the thing). Replaces live ProtocolResultMention; Compound -> ChemicalSubstance."""
union ProtocolResultMentionTarget = ChemicalSubstance | IngredientMaterial | Product | ProductVariant | Device | Condition | Treatment | Procedure | Lifestyle | SafetySignal | AdverseEffect

# ----------------------------------------------------------------------------------------------------
# Relationship-property types (owner W16). Each specializes a frozen W00 type and contains all its fields.
# ----------------------------------------------------------------------------------------------------

"""HAS_PROTOCOL_STEP edge (structural; specializes StructuralEdgeProperties: orderIndex, notes, mongoResearchRunId). Order belongs to the edge, so one unchanged step shared by two editions may sit at different positions (protocols.io V1 step 1 is V2 step 2)."""
type StepOrderProperties @relationshipProperties {
  orderIndex: Int
  notes: String
  mongoResearchRunId: String
  "Source's own step label or number as printed (\"2\", \"1.10.15\"); display and locator aid, never identity."
  sourceStepLabel: String
  "Source section heading containing the step (\"Routine Measurement\", \"Monitoring lithium\")."
  sectionLabel: String
}

"""DEPENDS_ON edge (structural; specializes StructuralEdgeProperties). Ordering kinds are acyclic within an edition (V-528p); lag bounds are a bounded range ("1 week after starting" = lagMin 1, lagMax 1, WEEK); both endpoints must belong to the same edition (V-527p)."""
type StepDependencyProperties @relationshipProperties {
  orderIndex: Int
  notes: String
  mongoResearchRunId: String
  dependencyKind: StepDependencyKind!
  "Minimum delay after the prerequisite completes (or its result is available) before this step; null = not stated."
  lagMin: Int
  "Maximum delay; null = not stated (never inferred from lagMin)."
  lagMax: Int
  lagUnit: CadenceUnit
  "Stated by the source or editorial inference."
  dependencyBasis: RequirementBasis
}

"""HAS_CONSTRAINT edge (structural; specializes StructuralEdgeProperties). Constraints combine in conjunctive normal form: edges with the same conditionGroup are OR-ed, different groups are AND-ed, a null group is its own group; negated tests the absence of the constraint's fact (needed for "every 6 months, or every 3 months for people in any of the following groups")."""
type ConstraintRoleProperties @relationshipProperties {
  orderIndex: Int
  notes: String
  mongoResearchRunId: String
  constraintRole: ConstraintRole!
  "Disjunction group key, unique within the owning step/edition/rule (\"g1\"). Same key = OR."
  conditionGroup: String
  "true = the role applies when the constraint's fact does NOT hold. Null is read as false."
  negated: Boolean
}

"""USES edge: declared dose of a public protocol step (structural; specializes StructuralEdgeProperties). Never a person's intake, never measured composition, never a calculated active-moiety amount (those are CALCULATED Assertions, INV-307). quantity..quantityMax is a bounded range ("Magnesium 500 to 600 mg daily"); verbatimDoseText always preserves the source text."""
type StepDoseProperties @relationshipProperties {
  orderIndex: Int
  notes: String
  mongoResearchRunId: String
  "Declared amount (lower bound when quantityMax is set). Null with verbatimDoseText = not normalized."
  quantity: Float
  "Upper bound of a declared range; null = single value or not stated."
  quantityMax: Float
  "UCUM unit (mg, g, mL, [iU], {capsule}, {scoop})."
  unitCode: String
  "PER_DOSE, PER_DAY ...: required when quantity is set (V-537p). \"200 mg twice daily\" is 200 PER_DOSE, not 400 PER_DAY."
  quantityBasis: QuantityBasis
  "SALT_FORM, ACTIVE_MOIETY, MATERIAL_AS_IS, UNSPECIFIED."
  massBasis: MassBasis
  amountReferent: AmountReferent
  "Route as stated or normalized code text (oral, subcutaneous, topical, inhaled). Controlled vocabulary pending (W16-SR-09)."
  route: String
  "Exact source dose text (\"Repatha 140 mg/mL every two weeks\")."
  verbatimDoseText: String
  "Source standardization text (\"standardized to 95% curcuminoids\"); live DoseMetadata.standardizedTo."
  standardizedToText: String
}

