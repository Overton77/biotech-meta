  cq: [CQ-ST-06, INV-207]
  failingCase: "S-07 Basis ('self-reported AEs'; 'no serious AEs reported') and S-19 ENERGIZE ('recorded and coded according to MedDRA'; 'No serious AEs were reported'): frozen V-217 returns 5 rows on faithful captures; the 0.2.0 fixture avoided this only by recording SYSTEMATIC, which the text does not support."
  proposedRuling: "Adopt V-217r + V-217i (80-queries.cypher)."
- id: W09-CR-02
  targetOwner: W00 / Fable
  request: "Replace V-221 with V-221r: null armType is checked; SHAM_COMPARATOR and NO_INTERVENTION exempt; bases required only when quantityStatus is REPORTED; device components need quantityStatus NOT_APPLICABLE; definition-only interventions (FOLLOWS_INTERVENTION_DEFINITION, no component) are complete."
