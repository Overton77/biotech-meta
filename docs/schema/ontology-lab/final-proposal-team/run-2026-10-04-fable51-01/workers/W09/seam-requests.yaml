- id: W09-SR-16
  targetOwner: W00 (predicate registry)
  request: "Register candidate asserted predicates CITES_AS_REFERENCE (publication -> literal citation; used for SOURCE_CORRECTION) and EVALUATES_RISK_FACTOR (migration target of the retired live edge); list RESULTS_UNPUBLISHED as a forbidden registry-only inference (V-W09-05)."
  cq: [CQ-EV-05, CQ-ST-08]
  failingCase: "fixtures/06 statement 6; fixtures/90 N16."
  proposedRuling: "Register as candidates."
- id: W09-SR-17
  targetOwner: Fable (operations, with W23)
  request: "Record that @neo4j/graphql 7.6.3 projects DateTime fields with apoc.date.convertFormat, so APOC Core is a runtime requirement of the API on Neo4j 5.26."
  cq: [operations]
  failingCase: "W09 GraphQL read of fixture data on embedded 5.26.31 Community without APOC: 'Unknown function apoc.date.convertFormat' when selecting RegistrationVersion.observedAt; the same query without DateTime fields succeeds."
  proposedRuling: "Operations file declares APOC Core as required for the GraphQL API (or the API avoids DateTime fields, which is not acceptable)."
# ---- conflict requests against frozen validators (contract A10: change only with primary source + failing case) ----
