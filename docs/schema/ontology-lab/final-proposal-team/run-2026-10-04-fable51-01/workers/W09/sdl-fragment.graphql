# Invariants: INV-201, INV-206..INV-209 (V-201, V-202, V-210..V-213, V-215..V-218, V-221, V-223).
# Contract: section B of 01-shared-contract.md. No `extend`. Only W09-owned types, enums, unions and relationship-property
