"""USES_INTERVENTION_MATERIAL and USES_INTERVENTION_DEVICE (asserted). Specializes AssertedEdgeProperties (all fields
repeated) + asReportedName: the name under which the source reports what was administered (required by V-202 when the
target is a ProductVariant; recommended for every target). The target is the material/product/device AS ADMINISTERED AT
STUDY TIME, never the variant's current formulation (round 0002 R1)."""
type InterventionMaterialProperties @relationshipProperties {
  relationshipUid: String!
  assertionUid: String!
  validFrom: DateTime
  validTo: DateTime
  validFromPrecision: TimePrecision
  validToPrecision: TimePrecision
  validFromBasis: ValidTimeBasis!
  validToBasis: ValidTimeBasis!
  recordedFrom: DateTime!
  recordedTo: DateTime
  mongoResearchRunId: String
  asReportedName: String
}

"""RESULT_FOR_ARM (structural). Specializes StructuralEdgeProperties (all fields) + armRole (explicit; never inferred from
edge order). CQ-ST-05."""
type ResultArmProperties @relationshipProperties {
  orderIndex: Int
  notes: String
  mongoResearchRunId: String
  armRole: ArmRole!
}

"""ANALYZES_DATASET (asserted). Specializes AssertedEdgeProperties (all fields) + analysisRole (catalog requiredQualifier).
CQ-ST-07, V-218."""
type DatasetAnalysisProperties @relationshipProperties {
  relationshipUid: String!
  assertionUid: String!
  validFrom: DateTime
  validTo: DateTime
  validFromPrecision: TimePrecision
  validToPrecision: TimePrecision
  validFromBasis: ValidTimeBasis!
  validToBasis: ValidTimeBasis!
  recordedFrom: DateTime!
  recordedTo: DateTime
  mongoResearchRunId: String
  analysisRole: DatasetAnalysisRole!
}

"""CORRECTS and RETRACTS (asserted; publication-level view of a SourceRevisionEvent, round 0007). Specializes
AssertedEdgeProperties (all fields) + sourceRevisionEventUid: the W00 SourceRevisionEvent (ERRATUM,
CORRECTED_AND_REPUBLISHED for CORRECTS; RETRACTION for RETRACTS) that revises a rendition Source of the target
Publication. CQ-EV-05. Registration requested in W09-SR-02."""
type PublicationRevisionProperties @relationshipProperties {
  relationshipUid: String!
  assertionUid: String!
  validFrom: DateTime
  validTo: DateTime
  validFromPrecision: TimePrecision
  validToPrecision: TimePrecision
  validFromBasis: ValidTimeBasis!
  validToBasis: ValidTimeBasis!
  recordedFrom: DateTime!
  recordedTo: DateTime
  mongoResearchRunId: String
  sourceRevisionEventUid: String!
}

"""READ-ONLY LEGACY properties of the live EVALUATES edge (live InterventionArmMetadata, stored names unchanged so legacy
edges stay readable). Never written. `confidence` is a deprecated bare confidence (contract A4) kept only for reading.
Successor fields: armLabel -> StudyArm.name; interventionRole -> StudyArm.armType; doseText ->
InterventionComponent.verbatimDoseText; doseAmount/doseUnit -> InterventionComponent.quantity/unitCode (+quantityBasis,
massBasis); route/frequency -> StudyIntervention.route/schedule/dosesPerDay. Registration requested in W09-SR-02."""
type LegacyInterventionArmProperties @relationshipProperties {
  armLabel: String
  interventionRole: String
  doseText: String
  doseAmount: Float
  doseUnit: String
  route: String
  frequency: String
  confidence: Float
  notes: String
  mongoResearchRunId: String
}

# ---------------------------------------------------------------------------------------------------------------------
# Node types (W09 sole writer)
# ---------------------------------------------------------------------------------------------------------------------

"""
Study: the identity of one research investigation (a trial, an observational study, a case report, a preclinical study).
It is NOT its registration (TrialRegistration), registry version (RegistrationVersion), protocol document
(ProtocolVersion), publication, dataset, arm, intervention or result (V-012). Registry status, enrollment, design and
results-posted live on RegistrationVersion with observedAt (INV-208, R10); publication ids live on Publication; evidence
level is a W10 EvidenceStrengthAssessment (INV-209). A Study never links directly to Product, ProductVariant or
FormulationVersion; evidence reaches commercial identities only through W10 EvidenceApplicability (INV-201, V-201).
`overallStatus` and `enrollmentCount` exist only as a derived read-only cache naming its RegistrationVersion (V-210).
CQ-ST-01..09, CQ-EV-03, CQ-ID-01/02. Module studies_and_evidence. Archetype Entity. uid token `study`.
"""
type Study implements Entity & EntityArchetype & SearchIndexable
  @node(labels: ["Study", "Entity"])
  @fulltext(indexes: [{indexName: "StudySearch", fields: ["name", "description", "searchText"], queryName: "searchStudies"}]) {
  id: ID! @id
  uid: String!
  "Presentation title (catalog Study.title maps here; D-013). Registry titles are versioned on RegistrationVersion."
  name: String
  description: String
  mongoResearchRunId: String
  createdAt: DateTime! @timestamp(operations: [CREATE])
  updatedAt: DateTime! @timestamp(operations: [CREATE, UPDATE])
  privacyClass: PrivacyClass
  maturity: NodeMaturity
  schemaVersion: String
  entityType: String!
  searchText: String
  searchFields: [String!]
  embeddingModel: String
  embeddingDimensions: Int
  "Embedding vector for the StudySearchEmbedding index Fable may declare with @vector (no provider; D-014). Derived, never evidence (INV-107)."
  searchEmbedding: [Float!]
  "Design kind as classified at ingestion from the registry or paper (CQ-EV-03 grouping). Null = not classified."
  studyKind: StudyKind
  "DERIVED cache (INV-208): overallStatus of the RegistrationVersion named by projectionOfRegistrationVersionUid. Never written by clients."
  overallStatus: String @settable(onCreate: false, onUpdate: false)
  "DERIVED cache (INV-208): enrollmentCount of the named RegistrationVersion; its actual/estimated type is only on the version."
  enrollmentCount: Int @settable(onCreate: false, onUpdate: false)
  "uid of the RegistrationVersion the two cache fields project (required whenever either cache field is non-null; V-210)."
  projectionOfRegistrationVersionUid: String @settable(onCreate: false, onUpdate: false)

  """class: asserted; cardinality: many (one study may have CT.gov + ISRCTN + ANZCTR registrations); catalog: REGISTERED_AS"""
  registeredAs: [TrialRegistration!]! @relationship(type: "REGISTERED_AS", direction: OUT, properties: "AssertedEdgeProperties")
  """class: structural; cardinality: many; catalog: HAS_PROTOCOL_VERSION"""
  protocolVersions: [ProtocolVersion!]! @relationship(type: "HAS_PROTOCOL_VERSION", direction: OUT, properties: "StructuralEdgeProperties")
  """class: structural; cardinality: many; catalog: HAS_ARM (live hasArms)"""
  arms: [StudyArm!]! @relationship(type: "HAS_ARM", direction: OUT, properties: "StructuralEdgeProperties")
  """class: structural; cardinality: many (one per source/version that states criteria); catalog: HAS_ELIGIBLE_POPULATION"""
  eligiblePopulations: [StudyPopulation!]! @relationship(type: "HAS_ELIGIBLE_POPULATION", direction: OUT, properties: "StructuralEdgeProperties")
  """class: structural; cardinality: many; catalog: HAS_ENROLLED_COHORT (live studiesPopulations / STUDIES merged)"""
  enrolledCohorts: [StudyPopulation!]! @relationship(type: "HAS_ENROLLED_COHORT", direction: OUT, properties: "StructuralEdgeProperties")
  """class: structural; cardinality: many; catalog: DEFINES_OUTCOME (live hasOutcomeMeasures / HAS_OUTCOME_MEASURE merged)"""
  outcomeDefinitions: [OutcomeDefinition!]! @relationship(type: "DEFINES_OUTCOME", direction: OUT, properties: "StructuralEdgeProperties")
  """class: asserted; cardinality: many; catalog: PRODUCED_DATASET (live hasDatasets / HAS_DATASET refined)"""
  producedDatasets: [Dataset!]! @relationship(type: "PRODUCED_DATASET", direction: OUT, properties: "AssertedEdgeProperties")
  """class: asserted (inverse field); cardinality: many; catalog: REPORTS_ON"""
  reportedIn: [Publication!]! @relationship(type: "REPORTS_ON", direction: IN, properties: "AssertedEdgeProperties")
  """class: asserted; cardinality: many; live INVESTIGATES kept. Written only when a registry/paper condition resolves to a W03
  Condition; non-disease registry text ("Safety: Healthy Subjects") stays in RegistrationVersion.conditionsVerbatim."""
  investigatesConditions: [Condition!]! @relationship(type: "INVESTIGATES", direction: OUT, properties: "AssertedEdgeProperties")
  """class: asserted; cardinality: many; live STUDIED_IN kept for the species of the studied population (preclinical
  contexts use W03 MechanismEvidenceContext -IN_SPECIES->)."""
  studiedInSpecies: [Species!]! @relationship(type: "STUDIED_IN", direction: OUT, properties: "AssertedEdgeProperties")
  """class: derived; cardinality: many; live SPONSORED_BY kept as a read-only projection: derivationRule
  'inverse-of:SPONSORS_STUDY@1' + derivedFromAssertionUids (W01 predicate SPONSORS_STUDY). Sponsorship never implies
  execution (FI SPONSORS_STUDY -> EXECUTES_STUDY)."""
  sponsoredBy: [Organization!]! @relationship(type: "SPONSORED_BY", direction: OUT, properties: "DerivedEdgeProperties") @settable(onCreate: false, onUpdate: false)
  """class: derived; cardinality: many; live OPERATED_BY kept as a read-only projection: derivationRule
  'inverse-of:SERVES_AS_CRO_FOR@1'. A registry "collaborator" is NOT a CRO (W09-SR-05)."""
  operatedBy: [Organization!]! @relationship(type: "OPERATED_BY", direction: OUT, properties: "DerivedEdgeProperties") @settable(onCreate: false, onUpdate: false)
  """class: derived; cardinality: many; live INVESTIGATED_BY kept as a read-only projection of a W01 investigator-role
  assertion (predicate requested in W09-SR-05)."""
  investigatedBy: [Person!]! @relationship(type: "INVESTIGATED_BY", direction: OUT, properties: "DerivedEdgeProperties") @settable(onCreate: false, onUpdate: false)
  """class: legacy (read-only); cardinality: many; live EVALUATES (InterventionArmMetadata). INV-201 / CL-017 / D-003:
  never written; successor path is HAS_ARM -> ASSIGNS_INTERVENTION -> HAS_INTERVENTION_COMPONENT ->
  USES_INTERVENTION_MATERIAL, and commercial applicability only through W10 EvidenceApplicability."""
  evaluates: [LegacyEvaluatedIntervention!]! @relationship(type: "EVALUATES", direction: OUT, properties: "LegacyInterventionArmProperties") @settable(onCreate: false, onUpdate: false)
}

"""
TrialRegistration: the identity of one registry entry (registry + registrationId, e.g. ClinicalTrials.gov NCT02678611,
ANZCTR ACTRN12624000959572). Not the Study (one study may have several registrations) and not a version of the entry.
The registration id is also an Identifier record (scheme NCT/ACTRN/ISRCTN, issuer the registry); the materialized
`registrationId` is a lookup key, not the identity. CQ-ST-08, CQ-ST-04. Module studies_and_evidence. Archetype Entity.
uid token `trial-registration`.
"""
type TrialRegistration implements Entity & EntityArchetype
  @node(labels: ["TrialRegistration", "Entity"]) {
  id: ID! @id
  uid: String!
  name: String
  description: String
  mongoResearchRunId: String
  createdAt: DateTime! @timestamp(operations: [CREATE])
  updatedAt: DateTime! @timestamp(operations: [CREATE, UPDATE])
  privacyClass: PrivacyClass
  maturity: NodeMaturity
  schemaVersion: String
  entityType: String!
  "Registry name, normalized (ClinicalTrials.gov, ANZCTR, ISRCTN, EU CTR ...). Identity key with registrationId."
  registry: String!
  "Registry-assigned id as displayed (NCT02678611). Materialized key; the Identifier record is authoritative."
  registrationId: String!

  """class: asserted (inverse field); cardinality: one_or_more; catalog: REGISTERED_AS"""
  studies: [Study!]! @relationship(type: "REGISTERED_AS", direction: IN, properties: "AssertedEdgeProperties")
  """class: structural; temporalProfile: bitemporal_attachment; exclusivity: EXCLUSIVE per registration (TM-R5);
  cardinality: many (one edge per recorded-time episode); catalog: HAS_REGISTRATION_VERSION"""
  versions: [RegistrationVersion!]! @relationship(type: "HAS_REGISTRATION_VERSION", direction: OUT, properties: "StateEpisodeProperties")
  """class: asserted; cardinality: many; identity_resolution HAS_IDENTIFIER (W00)"""
  identifiers: [Identifier!]! @relationship(type: "HAS_IDENTIFIER", direction: OUT, properties: "IdentifierLinkProperties")
}

"""
RegistrationVersion: one observed version of a registry entry, as captured by BellLabs (InformationArtifact). Holds
registered status, enrollment (with actual/estimated type), dates (with actual/anticipated type and precision), design,
site countries, verbatim conditions/interventions and whether results are posted. `observedAt` (BellLabs) is never a
substitute for `versionDate` (registry); unknown registry history stays null (round 0002; history BLOCKED for NCT02678611
on 2026-10-04). resultsPosted=false means "no registry results section as observed", never "unpublished"
(FI REGISTRY_RESULTS_NOT_POSTED -> RESULTS_UNPUBLISHED; V-212). Not the Study and not a publication.
CQ-ST-08, CQ-ST-04, CQ-ST-C03. Module studies_and_evidence. Archetype InformationArtifact. uid token `registration-version`.
"""
type RegistrationVersion implements Entity & InformationArtifactArchetype
  @node(labels: ["RegistrationVersion", "InformationArtifact"]) {
  id: ID! @id
  uid: String!
  name: String
  description: String
  mongoResearchRunId: String
  createdAt: DateTime! @timestamp(operations: [CREATE])
  updatedAt: DateTime! @timestamp(operations: [CREATE, UPDATE])
  privacyClass: PrivacyClass
  maturity: NodeMaturity
  schemaVersion: String
  artifactType: String!
  "Registry publication instant of this version, when the registry states it (first instant of its precision)."
  publishedAt: DateTime
  "When BellLabs saw this version as displayed (operational). Required (V-211)."
  observedAt: DateTime!
  "sha256 over the captured registry record (D-016); SYNTHETIC_FIXTURE basis in fixtures."
  contentHash: String
  "Registry's own date for this version (history tab). Null = history not obtained."
  versionDate: Date
  "Registry's own version number (CT.gov history). Null = not obtained."
  registryVersionNumber: Int
  "Registry 'last update posted' date shown on the version, the best version key when history is unavailable (CQ-ST-C03)."
  lastUpdatePostedDate: Date
  briefTitle: String
  officialTitle: String
  acronym: String
  "Registry overall status as displayed (CT.gov OverallStatus vocabulary or the registry's own); never copied onto Study except as the derived cache."
  overallStatus: String
  enrollmentCount: Int
  enrollmentCountType: EnrollmentCountType
  resultsPosted: Boolean
  resultsFirstPostedDate: Date
  startDate: Date
  startDatePrecision: TimePrecision
  startDateType: RegistryDateType
  primaryCompletionDate: Date
  primaryCompletionDatePrecision: TimePrecision
  primaryCompletionDateType: RegistryDateType
  completionDate: Date
  completionDatePrecision: TimePrecision
  completionDateType: RegistryDateType
  studyType: String
  allocation: String
  interventionModel: String
  masking: String
  primaryPurpose: String
  "Registry phase list as displayed (PHASE1, NA ...); a disagreeing narrative statement ('Phase 2' in a summary) is an Assertion."
  phase: [String!]
  "ISO 3166-1 alpha-2 codes of registered sites (live Study.countries). A publication's differing site list is an Assertion."
  siteCountries: [String!]
  fdaRegulatedDrug: Boolean
  fdaRegulatedDevice: Boolean
  "Registry 'conditions' text verbatim; resolved Conditions are INVESTIGATES assertions."
  conditionsVerbatim: [String!]
  "Registry intervention labels verbatim ('Basis 250', 'Mitopure 500mg')."
  interventionNamesVerbatim: [String!]
  sponsorNameVerbatim: String
  collaboratorNamesVerbatim: [String!]

  """class: structural (inverse field); cardinality: exactly_one (V-211); catalog: HAS_REGISTRATION_VERSION"""
  registration: [TrialRegistration!]! @relationship(type: "HAS_REGISTRATION_VERSION", direction: IN, properties: "StateEpisodeProperties")
  """class: structural; cardinality: one_or_more (coarse SECTION or WHOLE_SNAPSHOT locators allowed); provenance SUPPORTED_BY
  (domain extension requested in W09-SR-03)"""
  supportedBy: [SourceLocator!]! @relationship(type: "SUPPORTED_BY", direction: OUT)
}

"""
ProtocolVersion: one version of a study's own protocol or statistical analysis plan document (InformationArtifact), e.g.
a protocol PDF attached to a registry record or a published protocol paper. It is the research design document of ONE
study; a public, reusable consumer or practice protocol is a W16 ProtocolEdition (CL-007). Not a RegistrationVersion
(the registry's summary of the design). CQ-ST-04 (prespecification), CQ-ST-05. Module studies_and_evidence. Archetype
InformationArtifact. uid token requested `protocol-version` (W09-SR-04).
"""
type ProtocolVersion implements Entity & InformationArtifactArchetype
  @node(labels: ["ProtocolVersion", "InformationArtifact"]) {
  id: ID! @id
  uid: String!
  name: String
  description: String
