# ---------------------------------------------------------------------------------------------------------------------
# Enums (W09 sole writer). Values frozen at catalog `conventions` where the catalog defines them; the others are
# property-card vocabularies registered through W09-SR-01 (see seam-requests.yaml).
# ---------------------------------------------------------------------------------------------------------------------

"""What kind of measure an outcome definition is (catalog conventions.measureKind; FDA/NIH BEST clinical outcome
assessment categories). Observed from protocol or registry. Never an endpoint role: surrogate status is a W10
EndpointClassification. CQ-ST-03."""
enum MeasureKind {
  BIOMARKER
  PERFORMANCE_OUTCOME
  PATIENT_REPORTED_OUTCOME
  CLINICIAN_REPORTED_OUTCOME
  OBSERVER_REPORTED_OUTCOME
  CLINICAL_EVENT
}

"""Priority a source declares for an outcome (catalog conventions.outcomePriority). Carried per source by Assertions with
predicate DECLARES_OUTCOME_PRIORITY; OutcomeDefinition.priority is only the derived registered priority. CQ-ST-04."""
enum OutcomePriority {
  PRIMARY
  SECONDARY
  OTHER_PRESPECIFIED
  POST_HOC
  SAFETY
}

"""Role of an analysis in the study plan (catalog conventions.analysisKind). INV-206, V-215. CQ-ST-05."""
enum AnalysisKind {
  PRIMARY_PRESPECIFIED
  SECONDARY_PRESPECIFIED
  SUBGROUP_PRESPECIFIED
  SUBGROUP_POST_HOC
  EXPLORATORY
  SAFETY
}

"""Shape of the comparison behind an estimate (catalog conventions.comparisonKind). Within-arm change is never a
between-arm effect (forbidden implication WITHIN_ARM_CHANGE_SIGNIFICANT -> BETWEEN_ARM_EFFECT; V-216). CQ-ST-05."""
enum ComparisonKind {
  BETWEEN_ARM
  WITHIN_ARM_CHANGE
  ARM_DESCRIPTIVE
}

"""Reported significance outcome of the stated comparison (catalog conventions.statisticalConclusion). NOT_SIGNIFICANT is
never NO_EFFECT; NOT_TESTED (no test was run) differs from NOT_REPORTED (the source does not say). CQ-ST-05."""
enum StatisticalConclusion {
  SIGNIFICANT_FAVORABLE
  SIGNIFICANT_UNFAVORABLE
  NOT_SIGNIFICANT
  NOT_TESTED
  NOT_REPORTED
}

"""How adverse events were collected (catalog conventions.aeCollectionMethod). SYSTEMATIC = actively elicited by a
structured instrument or at scheduled assessment (ClinicalTrials.gov "Systematic Assessment"); SPONTANEOUS = volunteered
by participant or investigator ("Non-systematic Assessment"); NOT_DESCRIBED = the source records AEs but does not state
how. INV-207, V-217. CQ-ST-06."""
enum AeCollectionMethod {
  SYSTEMATIC
  SPONTANEOUS
  NOT_DESCRIBED
}

"""Role of a publication's analysis of a dataset (catalog conventions.datasetAnalysisRole). Independence is derived from
shared Study/Dataset (V-218). CQ-ST-07, CQ-AX-05."""
enum DatasetAnalysisRole {
  PRIMARY_REPORT
  SECONDARY_ANALYSIS
  POOLED_ANALYSIS
  REANALYSIS
}

"""Kind of publication record (catalog conventions.publicationKind). The journal's own designation wins; a differing
database publication type (PubMed "Published Erratum") is kept as an Assertion. CQ-EV-05."""
enum PublicationKind {
  ARTICLE
  AUTHOR_CORRECTION
  ERRATUM
  RETRACTION_NOTICE
  EXPRESSION_OF_CONCERN
  PREPRINT
  CONFERENCE_ABSTRACT
}

"""Whether a registry date is actual or anticipated (catalog conventions.registryDateType). Null = the registry or tool did
not say; never defaulted. CQ-ST-08."""
enum RegistryDateType {
  ACTUAL
  ANTICIPATED
}

"""Whether a registry enrollment count is actual or estimated (catalog conventions.enrollmentCountType). Null = not
reported by the source/tool, never ESTIMATED by default. CQ-ST-08."""
enum EnrollmentCountType {
  ACTUAL
  ESTIMATED
}

"""Direction of change as REPORTED by the source (live enum OutcomeDirection kept). Display/extraction value only:
NO_CHANGE is a reported direction, not a statistical conclusion and not evidence of no effect. CQ-ST-05."""
enum OutcomeDirection {
  IMPROVED
  WORSENED
  NO_CHANGE
  MIXED
  INCONCLUSIVE
  UNKNOWN
}

"""Arm type as registered or reported (ClinicalTrials.gov glossary arm types; live StudyArm.armType refined to enum).
V-221 exempts PLACEBO_COMPARATOR (and, per W09-CR-02, SHAM_COMPARATOR and NO_INTERVENTION). CQ-ST-01. W09-SR-01."""
enum ArmType {
  EXPERIMENTAL
  ACTIVE_COMPARATOR
  PLACEBO_COMPARATOR
  SHAM_COMPARATOR
  NO_INTERVENTION
  OTHER
}

"""Role of an arm in one result (property card RESULT_FOR_ARM.armRole). Explicit; never inferred from order. CQ-ST-05.
W09-SR-01."""
enum ArmRole {
  INTERVENTION
  COMPARATOR
}

"""Seriousness class of an adverse-event row (property card AdverseEventResult.seriousness). ANY = all AEs regardless of
seriousness. Severity (mild/moderate/severe) is not seriousness. CQ-ST-06. W09-SR-01."""
enum AeSeriousness {
  ANY
  SERIOUS
  NON_SERIOUS
}

"""Who judged relatedness of an adverse event to the intervention. NOT_REPORTED explicit. CQ-ST-06. W09-SR-01."""
enum RelatednessAssessor {
  INVESTIGATOR
  SPONSOR
  PARTICIPANT
  INDEPENDENT_COMMITTEE
  NOT_REPORTED
}

"""Availability of a dataset as stated by its data-availability statement (property card Dataset.accessLevel).
CQ-ST-07. W09-SR-01."""
enum DatasetAccessLevel {
  PUBLIC
  CONTROLLED
  ON_REQUEST
  UNAVAILABLE
  UNKNOWN
}

"""Which cohort a StudyPopulation state describes. Eligible (criteria), enrolled (registered/started), randomized and
analyzed cohorts differ (NCT02678611: 120 enrolled, 118 analyzed ITT). CQ-EV-04, CQ-ST-08. W09-SR-01."""
enum StudyPopulationKind {
  ELIGIBLE
  ENROLLED
  RANDOMIZED
  ANALYZED
}

"""Analysis set of an analyzed cohort or a result (catalog StudyResult.analysisPopulation; live fixture values).
CQ-ST-05. W09-SR-01."""
enum AnalysisSetKind {
  INTENTION_TO_TREAT
  MODIFIED_INTENTION_TO_TREAT
  PER_PROTOCOL
  SAFETY_SET
  COMPLETERS
  OTHER
  NOT_REPORTED
}

"""Kind of estimate a StudyResult reports (catalog StudyResult.resultKind; replaces the free values PERCENT_CHANGE and
ADVERSE_EVENT_COUNT used by the 0.2.0 fixture). CQ-ST-05. W09-SR-01."""
enum StudyResultKind {
  MEAN
  MEDIAN
  MEAN_DIFFERENCE
  PERCENT_CHANGE
  RATIO
  ODDS_RATIO
  HAZARD_RATIO
  RISK_DIFFERENCE
  AREA_UNDER_CURVE
  PROPORTION
  ADVERSE_EVENT_COUNT
  OTHER
}

"""How an estimate was obtained from the source text. CQ-ST-05. W09-SR-01."""
enum EstimateQualifier {
  AS_REPORTED
  APPROXIMATE
  READ_FROM_FIGURE
  CALCULATED_BY_BELLLABS
}

"""Study design kind (catalog Study.studyKind). Used to group support by evidence type (CQ-EV-03). W09-SR-01."""
enum StudyKind {
  INTERVENTIONAL_RANDOMIZED
  INTERVENTIONAL_NONRANDOMIZED
  INTERVENTIONAL_SINGLE_GROUP
  OBSERVATIONAL_COHORT
  OBSERVATIONAL_CASE_CONTROL
  CROSS_SECTIONAL
  CASE_REPORT
  CASE_SERIES
  PRECLINICAL
  SYSTEMATIC_REVIEW
  META_ANALYSIS
  OTHER
}

# ---------------------------------------------------------------------------------------------------------------------
# Unions (W09 sole writer)
# ---------------------------------------------------------------------------------------------------------------------

"""READ-ONLY LEGACY range of the live union `StudyIntervention` (D-003, CL-006). Reachable only through
Study.evaluates (@settable false). Members are the final-schema successors of the live members: Compound ->
ChemicalSubstance or MaterialMixture (D-002, W02), CompoundForm -> ChemicalForm or IngredientMaterial (W02),
Product (W04), FoodItem/FoodProduct/Lifestyle (W05), Treatment/Procedure (W06), Device (W08), Protocol (W16).
Never written; INV-201 makes every legacy EVALUATES edge to a Product a V-201 backlog row."""
union LegacyEvaluatedIntervention = Product | ChemicalSubstance | MaterialMixture | ChemicalForm | IngredientMaterial | FoodItem | FoodProduct | Protocol | Treatment | Device | Procedure | Lifestyle

"""CANDIDATE (CQ-ST-C02). Reusable definition a study intervention instantiates when what was administered is a procedure,
a treatment regimen, a public protocol edition or a lifestyle practice rather than (or in addition to) a material or device.
Members owned by W06 (Procedure, Treatment), W16 (ProtocolEdition), W05 (Lifestyle)."""
union InterventionDefinitionTarget = Procedure | Treatment | ProtocolEdition | Lifestyle

