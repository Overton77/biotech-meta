  COMPANY
  PUBLIC_COMPANY
  PRIVATE_COMPANY
  STARTUP
  SUBSIDIARY
  HOLDING_COMPANY
  OPERATING_COMPANY
  CONTRACT_RESEARCH_ORGANIZATION
