"""
A natural person who is a public actor in sourced material (author, investigator, executive, director, advisor,
speaker, host, guest). Identity is by Identifier (ORCID, SEC filer id, NPI) or ResolutionHypothesis, never by name.
A BellLabs user is never a Person node (private context lives outside the shared graph, contract A9); personal
data with no CQ (birth date and place, death date) is not stored. Roles are asserted, time-bounded edges; title
and bio are display text only. It is NOT a software Agent (catalog Agent) and NOT a pseudonymous handle.
CQ: CQ-CL-01, CQ-CL-05, CQ-EC-01, CQ-EC-03, CQ-EC-04, CQ-AX-18. Module: organizations. Archetype: Entity.
"""
type Person implements Entity & EntityArchetype & SearchIndexable & ActorIdentity
  @node(labels: ["Person", "Entity"])
  @fulltext(indexes: [{indexName: "PersonSearch", fields: ["name", "description", "bio", "title", "searchText"], queryName: "searchPeople"}]) {
  id: ID! @id
  uid: String!
  name: String
  description: String
  mongoResearchRunId: String
  createdAt: DateTime! @timestamp(operations: [CREATE])
  updatedAt: DateTime! @timestamp(operations: [CREATE, UPDATE])
  privacyClass: PrivacyClass
  maturity: NodeMaturity
  schemaVersion: String
  entityType: String!
  searchText: String
  searchFields: [String!]
  embeddingModel: String
  embeddingDimensions: Int
  searchEmbedding: [Float!]
  "Display headline only; never a role fact (roles are edges with roleTitleVerbatim)."
  title: String
  "Display biography text; facts in it are not queryable until asserted."
  bio: String
  "Display mirror of the primary ORCID Identifier; the Identifier record is authoritative."
  orcid: String

  """class: asserted; cardinality: many; catalog: HAS_IDENTIFIER (W00) -- ORCID, profile handles"""
  identifiers: [Identifier!]! @relationship(type: "HAS_IDENTIFIER", direction: OUT, properties: "IdentifierLinkProperties")
  """class: asserted; cardinality: many; catalog: BOARD_MEMBER_OF (FINANCIAL_INTEREST)"""
  boardMemberOf: [Organization!]! @relationship(type: "BOARD_MEMBER_OF", direction: OUT, properties: "RoleEdgeProperties")
  """class: asserted; cardinality: many; catalog: EMPLOYED_BY (FINANCIAL_INTEREST; officers with corporateRoleType)"""
  employedBy: [Organization!]! @relationship(type: "EMPLOYED_BY", direction: OUT, properties: "RoleEdgeProperties")
  """class: asserted; cardinality: many; catalog: ADVISES_ORGANIZATION (FINANCIAL_INTEREST; never ENDORSES_PRODUCT)"""
  advisesOrganizations: [Organization!]! @relationship(type: "ADVISES_ORGANIZATION", direction: OUT, properties: "RoleEdgeProperties")
  """class: asserted; cardinality: many; catalog: FOUNDED_ORGANIZATION (FINANCIAL_INTEREST)"""
  foundedOrganizations: [Organization!]! @relationship(type: "FOUNDED_ORGANIZATION", direction: OUT, properties: "RoleEdgeProperties")
  """class: asserted; cardinality: many; catalog: INVESTED_IN (FINANCIAL_INTEREST)"""
  investedIn: [Organization!]! @relationship(type: "INVESTED_IN", direction: OUT, properties: "OwnershipEdgeProperties")
  """class: asserted; cardinality: many; catalog: HOLDS_EQUITY_IN (FINANCIAL_INTEREST)"""
  holdsEquityIn: [Organization!]! @relationship(type: "HOLDS_EQUITY_IN", direction: OUT, properties: "OwnershipEdgeProperties")
  """class: asserted; cardinality: many; catalog: HAS_IP_INTEREST_IN (FINANCIAL_INTEREST)"""
  hasIpInterestIn: [Organization!]! @relationship(type: "HAS_IP_INTEREST_IN", direction: OUT, properties: "RoleEdgeProperties")
  """class: asserted; cardinality: many; catalog: RECEIVES_COMPENSATION_FROM (FINANCIAL_INTEREST)"""
  receivesCompensationFrom: [Organization!]! @relationship(type: "RECEIVES_COMPENSATION_FROM", direction: OUT, properties: "RoleEdgeProperties")
  """class: asserted; cardinality: many; catalog: AFFILIATED_WITH (verbatim role kept when the kind cannot be normalized)"""
  affiliatedWith: [Organization!]! @relationship(type: "AFFILIATED_WITH", direction: OUT, properties: "RoleEdgeProperties")
  """class: asserted; cardinality: many; catalog: ENDORSES_PRODUCT (only from an explicit ENDORSES_PRODUCT assertion)"""
  endorsesProducts: [Product!]! @relationship(type: "ENDORSES_PRODUCT", direction: OUT, properties: "AssertedEdgeProperties")
}

