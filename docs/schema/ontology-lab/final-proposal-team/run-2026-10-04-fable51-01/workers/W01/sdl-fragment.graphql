"""
A study or dataset participant known only by a token that a PUBLIC source (publication, public dataset, registry
results page) issued, specialized from PseudonymousActor (labels CohortParticipant, PseudonymousActor, Entity).
The token is unique only within its issuer, so identity is an Identifier with scheme PARTICIPANT_TOKEN and the
issuing study/dataset as issuer: 'P03' in two datasets is two participants. It is NEVER created from BellLabs user
data, NEVER linked to a Person in the shared graph (live HAS_PARTICIPANT_TOKEN retired: a person-to-token link is
re-identification; W23 owns the policy, CL-018), and carries an explicit privacyClass. Privacy seam with W23.
CQ: CQ-CL-09 (Expansion), CQ-PC-08. Module: organizations (placement: private_context policy). Archetype: Entity.
"""
type CohortParticipant implements Entity & EntityArchetype & ActorIdentity
  @node(labels: ["CohortParticipant", "PseudonymousActor", "Entity"]) {
