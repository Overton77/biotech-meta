"""
Holder side of a person-or-organization role toward an organization (ADVISES_ORGANIZATION, FOUNDED_ORGANIZATION,
INVESTED_IN, HOLDS_EQUITY_IN, HAS_IP_INTEREST_IN, RECEIVES_COMPENSATION_FROM, AFFILIATED_WITH, ENDORSES_PRODUCT).
LegalEntity nodes resolve as Organization (they carry the Organization label).
"""
union RoleHolderTarget = Person | Organization

# -----------------------------------------------------------------------------------------------------
# Node types (W01 sole writer)
# -----------------------------------------------------------------------------------------------------

"""
An organized body as an enduring identity: company, corporate group, division, university, institute, fund,
clinic operator, agency (agencies specialize it as RegulatoryAgency, W13; laboratories as TestingLaboratory,
W12). It is NOT a consumer brand (ConsumerBrand), NOT a physical site (Facility), NOT a trademark (Trademark,
W14), NOT a seller display account (W15 seam). An Organization without the LegalEntity label is an organization
whose registered legal identity is not established or that is not one legal person (for example a corporate
group printed once on a disclosure page). Time-varying facts (legal name, ticker, stage, size, sector) are
OrganizationSnapshot episodes; the few such fields kept here are current display projections. Roles are
asserted, time-bounded edges (architecture section 9); no field here is a role.
CQ: CQ-EC-01, CQ-EC-02, CQ-EC-03, CQ-CL-05, CQ-MF-01, CQ-AX-18. Module: organizations. Archetype: Entity.
"""
type Organization implements Entity & EntityArchetype & SearchIndexable
  @node(labels: ["Organization", "Entity"])
  @fulltext(indexes: [{indexName: "OrganizationName", fields: ["name", "searchText", "legalName", "displayName", "canonicalTicker"], queryName: "searchOrganizationsByName"}]) {
  id: ID! @id
  uid: String!
  name: String
  description: String
  mongoResearchRunId: String
  createdAt: DateTime! @timestamp(operations: [CREATE])
  updatedAt: DateTime! @timestamp(operations: [CREATE, UPDATE])
  privacyClass: PrivacyClass
  maturity: NodeMaturity
  schemaVersion: String
  entityType: String!
  searchText: String
  searchFields: [String!]
  embeddingModel: String
  embeddingDimensions: Int
  "Derived search vector (regenerable; never evidence). @vector is added by Fable at merge without provider."
  searchEmbedding: [Float!]
  "Display name preferred by the organization (presentation only; never identity)."
  displayName: String
  "Current legal name; display projection of the latest OrganizationSnapshot episode; non-null only on LegalEntity nodes (V-W01-11). History: OrganizationSnapshot.legalName."
  legalName: String
  "Current listing ticker; display projection. Authoritative: Identifier (scheme TICKER, issuer exchange, validity) and OrganizationSnapshot.canonicalTicker."
  canonicalTicker: String
  "Instant at which legalName/canonicalTicker were last materialized from the current state episode."
  currentAsOf: DateTime
  "Coarse classification (catalog organizationKind). Never a role (INV-009)."
  organizationType: OrganizationType
  "Jurisdiction of formation (LegalEntity) or of authority (agency); ISO 3166 code or registry jurisdiction string."
  jurisdiction: String

  """class: asserted (bitemporal_attachment); cardinality: many; catalog: HAS_STATE (W00) to OrganizationSnapshot"""
  states: [OrganizationSnapshot!]! @relationship(type: "HAS_STATE", direction: OUT, properties: "StateEpisodeProperties")
  """class: asserted; cardinality: many; catalog: HAS_IDENTIFIER (W00) -- registry numbers, SEC CIK, LEI, DUNS, ticker"""
  identifiers: [Identifier!]! @relationship(type: "HAS_IDENTIFIER", direction: OUT, properties: "IdentifierLinkProperties")

  """class: asserted; cardinality: many; catalog: PARENT_OF (control; a stake alone is HOLDS_EQUITY_IN)"""
  subsidiaries: [Organization!]! @relationship(type: "PARENT_OF", direction: OUT, properties: "OwnershipEdgeProperties")
  """class: asserted; cardinality: many; catalog: PARENT_OF (inverse reading; SUBSIDIARY_OF assertions are canonicalized to PARENT_OF)"""
  parentOrganizations: [Organization!]! @relationship(type: "PARENT_OF", direction: IN, properties: "OwnershipEdgeProperties")
  """class: asserted; cardinality: many; catalog: OWNS_BRAND"""
  ownsBrands: [ConsumerBrand!]! @relationship(type: "OWNS_BRAND", direction: OUT, properties: "AssertedEdgeProperties")
  """class: asserted; cardinality: many; catalog: OPERATES_FACILITY (replaces live HAS_LOCATION)"""
  operatesFacilities: [Facility!]! @relationship(type: "OPERATES_FACILITY", direction: OUT, properties: "FacilityEdgeProperties")

  """class: asserted; cardinality: many; catalog: MARKETS_PRODUCT (NONEXCLUSIVE)"""
  marketsProducts: [Product!]! @relationship(type: "MARKETS_PRODUCT", direction: OUT, properties: "RoleEdgeProperties")
  """class: asserted; cardinality: many; catalog: MANUFACTURES_PRODUCT (NONEXCLUSIVE; never from DISTRIBUTES_PRODUCT or SUPPLIES_INGREDIENT_MATERIAL)"""
  manufacturesProducts: [Product!]! @relationship(type: "MANUFACTURES_PRODUCT", direction: OUT, properties: "RoleEdgeProperties")
  """class: asserted; cardinality: many; catalog: DISTRIBUTES_PRODUCT ('Distributed by' on a label, 21 CFR 101.5(c))"""
  distributesProducts: [Product!]! @relationship(type: "DISTRIBUTES_PRODUCT", direction: OUT, properties: "RoleEdgeProperties")
  """class: asserted; cardinality: many; catalog: CONTRACT_MANUFACTURES_FOR (manufacturer -> client organization)"""
  contractManufacturesFor: [Organization!]! @relationship(type: "CONTRACT_MANUFACTURES_FOR", direction: OUT, properties: "RoleEdgeProperties")
  """class: asserted; cardinality: many; catalog: CONTRACT_MANUFACTURES_FOR (inverse reading)"""
  contractManufacturers: [Organization!]! @relationship(type: "CONTRACT_MANUFACTURES_FOR", direction: IN, properties: "RoleEdgeProperties")
  """class: asserted; cardinality: many; catalog: SUPPLIES_INGREDIENT_MATERIAL (not ingredient manufacture, not investigational-product provision)"""
  suppliesIngredientMaterials: [IngredientMaterial!]! @relationship(type: "SUPPLIES_INGREDIENT_MATERIAL", direction: OUT, properties: "RoleEdgeProperties")

  """class: asserted; cardinality: many; catalog: ADVISES_ORGANIZATION (FINANCIAL_INTEREST; never ENDORSES_PRODUCT)"""
  advisesOrganizations: [Organization!]! @relationship(type: "ADVISES_ORGANIZATION", direction: OUT, properties: "RoleEdgeProperties")
  """class: asserted; cardinality: many; catalog: FOUNDED_ORGANIZATION (FINANCIAL_INTEREST)"""
  foundedOrganizations: [Organization!]! @relationship(type: "FOUNDED_ORGANIZATION", direction: OUT, properties: "RoleEdgeProperties")
  """class: asserted; cardinality: many; catalog: INVESTED_IN (FINANCIAL_INTEREST; never HOLDS_EQUITY_IN)"""
  investedIn: [Organization!]! @relationship(type: "INVESTED_IN", direction: OUT, properties: "OwnershipEdgeProperties")
  """class: asserted; cardinality: many; catalog: HOLDS_EQUITY_IN (FINANCIAL_INTEREST; never PARENT_OF)"""
  holdsEquityIn: [Organization!]! @relationship(type: "HOLDS_EQUITY_IN", direction: OUT, properties: "OwnershipEdgeProperties")
  """class: asserted; cardinality: many; catalog: HAS_IP_INTEREST_IN (FINANCIAL_INTEREST)"""
  hasIpInterestIn: [Organization!]! @relationship(type: "HAS_IP_INTEREST_IN", direction: OUT, properties: "RoleEdgeProperties")
  """class: asserted; cardinality: many; catalog: RECEIVES_COMPENSATION_FROM (FINANCIAL_INTEREST; compensationKind)"""
  receivesCompensationFrom: [Organization!]! @relationship(type: "RECEIVES_COMPENSATION_FROM", direction: OUT, properties: "RoleEdgeProperties")
  """class: asserted; cardinality: many; catalog: AFFILIATED_WITH (unnormalized or membership tie; not FINANCIAL_INTEREST, not FUNDS_STUDY)"""
  affiliatedWith: [Organization!]! @relationship(type: "AFFILIATED_WITH", direction: OUT, properties: "RoleEdgeProperties")
  """class: asserted; cardinality: many; catalog: ENDORSES_PRODUCT (only from an explicit ENDORSES_PRODUCT assertion; V-007, V-422)"""
  endorsesProducts: [Product!]! @relationship(type: "ENDORSES_PRODUCT", direction: OUT, properties: "AssertedEdgeProperties")

  """class: asserted; cardinality: many; catalog: BOARD_MEMBER_OF (inverse reading; replaces live HAS_BOARD_MEMBER)"""
  boardMembers: [Person!]! @relationship(type: "BOARD_MEMBER_OF", direction: IN, properties: "RoleEdgeProperties")
  """class: asserted; cardinality: many; catalog: EMPLOYED_BY (inverse reading; replaces live EMPLOYS and HAS_CEO)"""
  employees: [Person!]! @relationship(type: "EMPLOYED_BY", direction: IN, properties: "RoleEdgeProperties")
  """class: asserted; cardinality: many; catalog: ADVISES_ORGANIZATION (inverse reading)"""
  advisors: [RoleHolderTarget!]! @relationship(type: "ADVISES_ORGANIZATION", direction: IN, properties: "RoleEdgeProperties")
  """class: asserted; cardinality: many; catalog: FOUNDED_ORGANIZATION (inverse reading; replaces live FOUNDED_BY)"""
  founders: [RoleHolderTarget!]! @relationship(type: "FOUNDED_ORGANIZATION", direction: IN, properties: "RoleEdgeProperties")
  """class: asserted; cardinality: many; catalog: INVESTED_IN (inverse reading)"""
  investors: [RoleHolderTarget!]! @relationship(type: "INVESTED_IN", direction: IN, properties: "OwnershipEdgeProperties")
  """class: asserted; cardinality: many; catalog: HOLDS_EQUITY_IN (inverse reading)"""
  equityHolders: [RoleHolderTarget!]! @relationship(type: "HOLDS_EQUITY_IN", direction: IN, properties: "OwnershipEdgeProperties")
  """class: asserted; cardinality: many; catalog: HAS_IP_INTEREST_IN (inverse reading)"""
  ipInterestHolders: [RoleHolderTarget!]! @relationship(type: "HAS_IP_INTEREST_IN", direction: IN, properties: "RoleEdgeProperties")
  """class: asserted; cardinality: many; catalog: RECEIVES_COMPENSATION_FROM (inverse reading)"""
  compensationRecipients: [RoleHolderTarget!]! @relationship(type: "RECEIVES_COMPENSATION_FROM", direction: IN, properties: "RoleEdgeProperties")
  """class: asserted; cardinality: many; catalog: AFFILIATED_WITH (inverse reading)"""
  affiliates: [RoleHolderTarget!]! @relationship(type: "AFFILIATED_WITH", direction: IN, properties: "RoleEdgeProperties")
}

"""
An organization registered as one legal person in a jurisdiction's registry (corporation, LLC, limited company,
trust). Specializes Organization (labels LegalEntity, Organization, Entity) and keeps the same uid token `org`.
Identity is the registered entity, not its name: a legal-name change (ChromaDex Corporation -> Niagen Bioscience,
Inc., effective 2025-03-19) is a new OrganizationSnapshot episode on the same node; two entities with similar
names (ChromaDex Corporation, the parent, and ChromaDex, Inc., its wholly owned subsidiary) are two nodes.
Never also a ConsumerBrand (V-433). Role traversal uses the Organization type (LegalEntity nodes appear there).
CQ: CQ-EC-02, CQ-MF-01, CQ-EC-C01. Module: organizations. Archetype: Entity.
"""
type LegalEntity implements Entity & EntityArchetype
  @node(labels: ["LegalEntity", "Organization", "Entity"]) {
  id: ID! @id
  uid: String!
  name: String
  description: String
  mongoResearchRunId: String
  createdAt: DateTime! @timestamp(operations: [CREATE])
  updatedAt: DateTime! @timestamp(operations: [CREATE, UPDATE])
  privacyClass: PrivacyClass
  maturity: NodeMaturity
  schemaVersion: String
  entityType: String!
  displayName: String
  "Current legal name (display projection; history in OrganizationSnapshot.legalName)."
  legalName: String
  canonicalTicker: String
  currentAsOf: DateTime
  organizationType: OrganizationType
  "Jurisdiction of formation as stated by the formation registry (for example US-DE)."
  jurisdiction: String
  "Display mirror of the primary formation-registry Identifier (HAS_IDENTIFIER isPrimary); the Identifier record is authoritative."
  registrationId: String
  "Source-stated incorporation date (registry); identity lifecycle bound, not a role."
  incorporatedOn: Date
  "Source-stated dissolution date (registry); null = unknown, never 'still active'."
  dissolvedOn: Date

  """class: asserted (bitemporal_attachment); cardinality: many; catalog: HAS_STATE (W00) to OrganizationSnapshot"""
  states: [OrganizationSnapshot!]! @relationship(type: "HAS_STATE", direction: OUT, properties: "StateEpisodeProperties")
  """class: asserted; cardinality: many; catalog: HAS_IDENTIFIER (W00)"""
  identifiers: [Identifier!]! @relationship(type: "HAS_IDENTIFIER", direction: OUT, properties: "IdentifierLinkProperties")
  """class: asserted; cardinality: many; catalog: PARENT_OF"""
  subsidiaries: [Organization!]! @relationship(type: "PARENT_OF", direction: OUT, properties: "OwnershipEdgeProperties")
  """class: asserted; cardinality: many; catalog: PARENT_OF (inverse reading)"""
  parentOrganizations: [Organization!]! @relationship(type: "PARENT_OF", direction: IN, properties: "OwnershipEdgeProperties")
  """class: asserted; cardinality: many; catalog: OWNS_BRAND"""
  ownsBrands: [ConsumerBrand!]! @relationship(type: "OWNS_BRAND", direction: OUT, properties: "AssertedEdgeProperties")
  """class: asserted; cardinality: many; catalog: OPERATES_FACILITY"""
  operatesFacilities: [Facility!]! @relationship(type: "OPERATES_FACILITY", direction: OUT, properties: "FacilityEdgeProperties")
}

"""
A consumer-facing brand identity (a name under which products or services are presented to consumers, such as
'Tru Niagen' or 'InsideTracker'). It is NOT the legal entity that owns or uses it (OWNS_BRAND, asserted), NOT a
registered trademark (Trademark, W14; a mark registration is evidence about a brand, not the brand), and NOT an
Organization: it carries no Organization label, cannot employ, has no board and holds no equity, so person-to-
company FINANCIAL_INTEREST edges never target it (V-W01-01). It may be the subject of SPONSORS_CONTENT (W21)
because sponsor reads name brands. CQ: CQ-EC-02, CQ-CL-05. Module: organizations. Archetype: Entity.
"""
type ConsumerBrand implements Entity & EntityArchetype
  @node(labels: ["ConsumerBrand", "Entity"]) {
  id: ID! @id
  uid: String!
  name: String
  description: String
  mongoResearchRunId: String
  createdAt: DateTime! @timestamp(operations: [CREATE])
  updatedAt: DateTime! @timestamp(operations: [CREATE, UPDATE])
  privacyClass: PrivacyClass
  maturity: NodeMaturity
  schemaVersion: String
  entityType: String!

  """class: asserted; cardinality: many; catalog: OWNS_BRAND (inverse reading)"""
  ownedBy: [Organization!]! @relationship(type: "OWNS_BRAND", direction: IN, properties: "AssertedEdgeProperties")
  """class: asserted; cardinality: many; catalog: HAS_IDENTIFIER (W00)"""
  identifiers: [Identifier!]! @relationship(type: "HAS_IDENTIFIER", direction: OUT, properties: "IdentifierLinkProperties")
}

"""
An identified physical site: a plant, laboratory site, clinic, office, warehouse or campus at an address. It
absorbs the live PhysicalLocation type (CL-015/T-004 ruling proposed: merge). A Facility is the subject of
establishment registrations (RegulatoryStatus STATUS_OF, W13; INV-304), capability states (HAS_CAPABILITY_STATE,
W11) and certification scope (COVERS, W12). It is NOT the organization that operates it (OPERATES_FACILITY,
asserted, time-bounded; operators change), NOT a laboratory organization (TestingLaboratory, W12, the certified
laboratory unit that operates one or more sites; CLIA certifies each laboratory location, 42 CFR 493.35(a)), NOT
a label's 'place of business' (21 CFR 101.5(e) allows the principal place of business instead of the plant), and
NOT a market or jurisdiction (geographic availability is W15's). REMOTE/VIRTUAL are never facility kinds.
CQ: CQ-MF-01, CQ-MF-04, CQ-AX-23. Module: organizations. Archetype: Entity.
"""
type Facility implements Entity & EntityArchetype
  @node(labels: ["Facility", "Entity"]) {
  id: ID! @id
  uid: String!
  name: String
  description: String
  mongoResearchRunId: String
  createdAt: DateTime! @timestamp(operations: [CREATE])
  updatedAt: DateTime! @timestamp(operations: [CREATE, UPDATE])
  privacyClass: PrivacyClass
  maturity: NodeMaturity
  schemaVersion: String
  entityType: String!
