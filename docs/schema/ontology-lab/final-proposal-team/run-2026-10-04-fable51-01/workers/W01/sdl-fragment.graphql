"""
One source-attributed state of an Organization's profile (legal name, ticker, stage, size, sector, summaries) as a
VersionedState payload, attached by HAS_STATE episodes (bitemporal_attachment). Payload fields never change
after commit; corrections and endings are new episodes (round 0007 section 12). Node-level validFrom/validTo/
recordedFrom/recordedTo are the TemporalSnapshot cache of the first episode only. It is NOT the organization's
identity and NOT evidence: its payload is supported through the Assertions named in assertionUids.
Live HAS_SNAPSHOT (Organization -> OrganizationSnapshot) is retired because HAS_SNAPSHOT is the provenance
Source -> SourceSnapshot edge (one relationship type, one meaning; W01-SR-03).
CQ: CQ-EC-C01, CQ-TM-01, CQ-TM-07. Module: organizations (time rules: temporal). Archetype: VersionedState.
