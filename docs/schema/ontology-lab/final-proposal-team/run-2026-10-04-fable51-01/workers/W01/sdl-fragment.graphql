  LABORATORY
  RESEARCH_INSTITUTE
  UNIVERSITY
  NONPROFIT
  FOUNDATION
  GOVERNMENT_AGENCY
  REGULATORY_AGENCY
  INVESTOR
  VENTURE_CAPITAL_FIRM
  PRIVATE_EQUITY_FIRM
  ACCELERATOR
  INCUBATOR
  DISTRIBUTOR
  MARKETPLACE
  RETAILER
  INSURER
  EMPLOYER
  PROFESSIONAL_ASSOCIATION
