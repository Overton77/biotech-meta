  uid: String!
  name: String
  description: String
  mongoResearchRunId: String
  createdAt: DateTime! @timestamp(operations: [CREATE])
  updatedAt: DateTime! @timestamp(operations: [CREATE, UPDATE])
  privacyClass: PrivacyClass
  maturity: NodeMaturity
  schemaVersion: String
  "State kind (live snapshotType), e.g. ORGANIZATION_PROFILE, LEGAL_NAME."
  stateType: String!
  "sha256:<hex> over the canonical payload (D-016)."
  payloadHash: String!
  "Source-stated effective bounds of the payload (for example a name change 'effective March 19, 2025'); query validity comes from the HAS_STATE episode."
  effectiveFrom: DateTime
  effectiveTo: DateTime
  "TemporalSnapshot cache of the first HAS_STATE episode (read-only projection)."
  validFrom: DateTime
  validTo: DateTime
  recordedFrom: DateTime
  recordedTo: DateTime
  searchText: String
  searchFields: [String!]
  embeddingModel: String
  embeddingDimensions: Int
  searchEmbedding: [Float!]
  "Uids of the Assertions whose content this payload projects (round 0007 seam)."
  assertionUids: [String!]
  legalName: String
  displayName: String
  canonicalTicker: String
  organizationType: OrganizationType
  active: Boolean
  foundedYear: Int
  fundingStage: FundingStage
  "US dollars as stated by the source."
  totalFundingUsd: Float
  employeeCountMin: Int
  employeeCountMax: Int
  employeeCountEstimate: Int
  employeeCountBand: EmployeeCountBand
  employeeCountRaw: String
  revenueModel: String
  valueChainStages: [String!]
  sector: String
  "Display link; a URL is never identity (the site is a Source)."
  websiteUrl: String
  headquarters: String
  headquartersSummary: String
  operatingSummary: String
  "US dollars as stated by the source at the episode's valid time."
  marketCapUsd: Float
  pipelineSummary: String
  competitivePositionSummary: String
