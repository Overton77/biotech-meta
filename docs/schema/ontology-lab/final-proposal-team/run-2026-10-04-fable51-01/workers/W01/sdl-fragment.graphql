# -----------------------------------------------------------------------------------------------------
# Relationship-property types (W01 sole writer). Each embeds every field of the frozen
# AssertedEdgeProperties (contract B4, asserted_edge profile) and adds domain qualifiers only.
# -----------------------------------------------------------------------------------------------------

"""
asserted_edge profile + role qualifiers. Specializes AssertedEdgeProperties (all its fields are present with the
same names, types and nullability). Used by BOARD_MEMBER_OF, EMPLOYED_BY, ADVISES_ORGANIZATION,
FOUNDED_ORGANIZATION, HAS_IP_INTEREST_IN, RECEIVES_COMPENSATION_FROM, AFFILIATED_WITH, MARKETS_PRODUCT,
MANUFACTURES_PRODUCT, DISTRIBUTES_PRODUCT, CONTRACT_MANUFACTURES_FOR, SUPPLIES_INGREDIENT_MATERIAL.
One edge per recorded-time episode; valid bounds, precisions and bases equal those of the authorizing Assertion
(V-505); projected only from an ACCEPTED assertion whose predicate equals the edge type (V-W01-02, V-W01-07).
Replaces live RoleMetadata (role, title, corporateRole -> roleTitleVerbatim; confidence and notes retired).
"""
type RoleEdgeProperties @relationshipProperties {
  relationshipUid: String!
  assertionUid: String!
  validFrom: DateTime
  validTo: DateTime
  validFromPrecision: TimePrecision
  validToPrecision: TimePrecision
  validFromBasis: ValidTimeBasis!
  validToBasis: ValidTimeBasis!
  recordedFrom: DateTime!
  recordedTo: DateTime
  mongoResearchRunId: String
  "Normalized role kind refining the edge type; null when the source gives none."
  roleType: RoleType
  "Role title or code exactly as the source printed it (copy of Assertion.roleTitleVerbatim), e.g. 'B', 'Director Since', 'scientific lead guy'."
  roleTitleVerbatim: String
  corporateRoleType: CorporateRoleType
  seniorityLevel: SeniorityLevel
  "Only on RECEIVES_COMPENSATION_FROM (V-W01-10)."
  compensationKind: CompensationKind
}

"""
asserted_edge profile + ownership qualifiers. Specializes AssertedEdgeProperties. Used by PARENT_OF (control),
HOLDS_EQUITY_IN (a stake of any size) and INVESTED_IN (having invested). Control, equity and investment are
three predicates (forbidden implications [INVESTED_IN, HOLDS_EQUITY_IN] and candidate [HOLDS_EQUITY_IN, PARENT_OF]).
Replaces live OwnershipMetadata (stakePercent kept; confidence and notes retired).
"""
type OwnershipEdgeProperties @relationshipProperties {
  relationshipUid: String!
  assertionUid: String!
  validFrom: DateTime
  validTo: DateTime
  validFromPrecision: TimePrecision
  validToPrecision: TimePrecision
  validFromBasis: ValidTimeBasis!
  validToBasis: ValidTimeBasis!
  recordedFrom: DateTime!
  recordedTo: DateTime
  mongoResearchRunId: String
  "Percent of the class or of total interest as stated by the source (0-100); null when not stated. Never computed silently: a computed share is a CALCULATED assertion."
  stakePercent: Float
  "Verbatim description of the stake (class of security, share count, voting and dispositive power, 'wholly owned')."
  stakeClassVerbatim: String
  "Role title or phrase exactly as printed (copy of Assertion.roleTitleVerbatim)."
  roleTitleVerbatim: String
}

"""
asserted_edge profile + the role a physical site plays for the operating organization. Specializes
AssertedEdgeProperties. Used by OPERATES_FACILITY. Replaces live TemporalMetadata on HAS_LOCATION.
"""
type FacilityEdgeProperties @relationshipProperties {
  relationshipUid: String!
  assertionUid: String!
  validFrom: DateTime
  validTo: DateTime
  validFromPrecision: TimePrecision
  validToPrecision: TimePrecision
  validFromBasis: ValidTimeBasis!
  validToBasis: ValidTimeBasis!
  recordedFrom: DateTime!
  recordedTo: DateTime
  mongoResearchRunId: String
  "Role of the site for this organization as stated (HEADQUARTERS, MANUFACTURING_SITE, LABORATORY ...)."
  facilityRole: LocationType
  roleTitleVerbatim: String
}

