- id: W01-SR-01
  targetOwner: "W00"
  request: "Register uid type tokens `org-snapshot` (OrganizationSnapshot) and `cohort-participant` (CohortParticipant); neither has a token in conventions.uidTypeTokens."
  cq: [CQ-EC-C01, CQ-CL-07, CQ-AX-14]
  failingCase: "w01-03 writes hu:org-snapshot:niagen-legal-name-chromadex-corporation and w01-06 writes hu:cohort-participant:w01-synthetic-dataset-a-p03; INV-106 requires a registered token."
  proposedRuling: "Add both tokens; LegalEntity keeps `org` (shared with Organization), Facility keeps `facility` (absorbs PhysicalLocation, no new token)."

- id: W01-SR-02
  targetOwner: "W00"
  request: "Make ActorIdentity.name nullable (`String`) to match D-013 (Entity.name nullable)."
  cq: [CQ-CL-01, CQ-CL-07]
  failingCase: "W01 fragment + kernel stub with live `interface ActorIdentity { name: String! }` fails @neo4j/graphql 7.6.3 build (graphql-js: Person.name String does not satisfy ActorIdentity.name String!; error at the first implementing type). With `name: String` the build succeeds (1,362 generated types)."
  proposedRuling: "ActorIdentity { id: ID!  name: String  description: String  mongoResearchRunId: String }; implemented by Person, PseudonymousActor, AnonymousActor, CohortParticipant."

- id: W01-SR-03
  targetOwner: "W00"
  request: "Retire live HAS_SNAPSHOT for Organization->OrganizationSnapshot (and, by the same rule, Product->ProductSnapshot W04 and Listing->ListingSnapshot W15); attach live *Snapshot states by HAS_STATE with StateEpisodeProperties. HAS_SNAPSHOT keeps its catalog meaning Source->SourceSnapshot only."
  cq: [CQ-TM-01, CQ-TM-07, CQ-EC-C01]
  failingCase: "Live schema lines 554/624, 773/818, 904/927 use HAS_SNAPSHOT for state attachment; catalog provenance uses HAS_SNAPSHOT for Source->SourceSnapshot (proposed-delta lines 1016/1157). A traversal (x)-[:HAS_SNAPSHOT]->(s) without labels mixes provenance captures with organization states; one relationship type, two meanings (same principle as CL-014). w01-03 attaches two legal-name states by HAS_STATE and Q-W01-04 answers ChromaDex Corporation/CDXC at 2024-06-01 and Niagen Bioscience, Inc./NAGE at 2025-06-01."
  proposedRuling: "One meaning per type. Organization.states / OrganizationSnapshot.organization use HAS_STATE (bitemporal_attachment); node-level time fields stay as the TemporalSnapshot cache (V-513). V-W01-08 rejects HAS_SNAPSHOT into an OrganizationSnapshot."

- id: W01-SR-04
  targetOwner: "W00"
  request: "Make QS-2a/QS-2b validity classes precision-aware (round 0007 section 9 rule) instead of comparing raw bounds; add POSSIBLE_START_PRECISION and POSSIBLE_END_PRECISION."
  cq: [CQ-TM-04, CQ-AX-18, CQ-CL-05]
  failingCase: "Steven Rubin BOARD_MEMBER_OF Niagen validFrom 2017-01-01 precision YEAR ('Director Since 2017'). At V=2017-05-15, QS-2b returns OPEN_END_* (validFrom <= V) i.e. 'yes'; the correct answer is POSSIBLE (he may have joined in December). Q-W01-01 probe P01 returns POSSIBLE_START_PRECISION / 'possibly'. Same for end bounds: Sinclair 'B (2011-2017)' at V=2017-06-15 must be POSSIBLE_END_PRECISION."
  proposedRuling: "Adopt the CASE ladder of Q-W01-01 (KNOWN_NOT_VALID, POSSIBLE_END_PRECISION, POSSIBLE_START_UNKNOWN, POSSIBLE_START_PRECISION, KNOWN, KNOWN_OPEN_END_WITNESSED, POSSIBLE_OPEN_END_STALE) in QS-2a/2b."

- id: W01-SR-05
  targetOwner: "Fable (example fixture claim-retelling-provenance.cypher; W21 informed)"
  request: "Correct the 0.2.0 example's role fixture. (a) \"B (2011-2017)\" is stored as validTo 2018-01-01 YEAR, which under the frozen bound rule (contract A6, round 0007 section 9) means \"ended during 2018\"; it must be validTo 2017-01-01 YEAR. (b) Person-to-company FINANCIAL_INTEREST assertions and the projected BOARD_MEMBER_OF edge target the ConsumerBrand hu:brand:insidetracker; a brand has no board, investors or advisors; retarget to the company (LegalEntity hu:org:segterra) with roleTitleVerbatim 'InsideTracker (Segterra)'."
  cq: [CQ-CL-05, CQ-EC-01, CQ-EC-02]
  failingCase: "(a) Q-W01-01 probe P07 (as recorded before the W01 fix) answers 'possibly' for 2018-06-01; with the corrected bound (P06) the answer is 'no'. (b) Combined load of the six 0.2.0 fixtures plus W01 fixtures: V-W01-01 returns 1 row (BOARD_MEMBER_OF david-a-sinclair -> hu:brand:insidetracker); V-434 cannot see it because it matches only (o:Organization)."
  proposedRuling: "Patch the example in Wave 6 (two values and four object references), recorded as an EXTRACTION_FIX supersession in the fixture as w01-01 demonstrates."

- id: W01-SR-06
  targetOwner: "W00 (validation) and Fable (catalog)"
  request: "Add an organizations `relationships:` block to the catalog (domain, range, class asserted, temporalProfile asserted_edge, temporalCardinality) for every W01 edge type so that validation-params.json $assertedTypes covers them; extend V-434 to ConsumerBrand targets (or adopt V-W01-01); add V-W01-01..V-W01-12 to validation.cypher."
  cq: [CQ-CL-05, CQ-EC-01, CQ-MF-01]
  failingCase: "validation-params.json generated from catalog 0.2.0 lists 68 asserted types and none of BOARD_MEMBER_OF, EMPLOYED_BY, ADVISES_ORGANIZATION, INVESTED_IN, HOLDS_EQUITY_IN, PARENT_OF, OWNS_BRAND, OPERATES_FACILITY, MARKETS_PRODUCT, MANUFACTURES_PRODUCT, DISTRIBUTES_PRODUCT, ENDORSES_PRODUCT, so V-101/V-106 never inspect them. Negative N4 (BOARD_MEMBER_OF to a brand) and N8 (OWNS_BRAND projected from a PROPOSED assertion) pass every 0.2.0 check and are caught only by V-W01-01/V-W01-07."
  proposedRuling: "Accept the relationship table in 04-model-cards.md section 3 as the catalog block; regenerate params; append V-W01-* checks."

- id: W01-SR-07
  targetOwner: "W00"
  request: "KERNEL CHANGE REQUEST. A point-in-time statement (\"beneficially owned ... as of April 25, 2025\"; \"based on Schedule 13D/A filed August 20, 2024\") states a witness instant, not an interval bound. The kernel forbids a bound with OBSERVATION_ONLY basis and derives witnesses only from SourceSnapshot.observedAt, so the source-stated witness date is lost."
  cq: [CQ-EC-01, CQ-EC-C02, CQ-TM-03]
  failingCase: "w01-04 HOLDS_EQUITY_IN Pioneer Step -> Niagen: bounds must be null/UNKNOWN; the snapshot observedAt (2026-10-04) and publishedAt (2025-04-29) are both later than the stated holding date 2024-08-20, so 'did Pioneer Step hold Niagen stock on 2024-09-01?' can only answer POSSIBLE_START_UNKNOWN; the filing actually witnesses the holding on 2024-08-20. Primary source: Niagen Bioscience DEF 14A 2025 (SEC EDGAR 0001628280-25-020690), beneficial ownership footnote."
  proposedRuling: "Add optional Assertion.statedAsOf (DateTime) + statedAsOfPrecision (TimePrecision), copied to asserted edges as witnessAt; the as-of ladder treats V == statedAsOf as KNOWN and keeps bounds null. Alternative (no kernel change): accept POSSIBLE answers and keep the date in roleTitleVerbatim (current W01 workaround)."

- id: W01-SR-08
  targetOwner: "W00"
  request: "For present-tense statements the open-end witness is the statement's publication instant (SourceSnapshot.publishedAt), not the capture instant (observedAt). QS-2 uses max(observedAt)."
  cq: [CQ-AX-18, CQ-TM-04]
  failingCase: "The 2025 proxy (publishedAt 2025-04-29) captured 2026-10-04 says Yu 'has been a director ... since August 2017'. With observedAt as witness, 'director on 2026-06-01?' is OPEN_END_SUPPORTED ('yes'); the source says nothing after 2025-04-29. Q-W01-01 uses coalesce(publishedAt, observedAt)."
  proposedRuling: "Witness = coalesce(snapshot.publishedAt, snapshot.observedAt) for assertions whose statedTense is PRESENT or null; live pages without publishedAt keep observedAt."

- id: W01-SR-09
  targetOwner: "Fable (catalog enum value; W01 owns OrganizationType)"
  request: "Add OrganizationType value CORPORATE_GROUP for an Organization that is a family of companies printed as one party (not one legal person, not a holding company)."
  cq: [CQ-CL-05, CQ-EC-03]
  failingCase: "Sinclair affiliations page: 'EdenRoc Sciences companies F,I,E,A,B, IP' followed by member lines ('MetroBiotech International, an EdenRoc Sciences company'). The group node hu:org:edenroc-sciences cannot be classified: HOLDING_COMPANY asserts a legal structure the page does not state; UNKNOWN loses the group/member distinction that V-434 depends on."
  proposedRuling: "Add CORPORATE_GROUP (candidate) to OrganizationType; a CORPORATE_GROUP node never carries LegalEntity."

- id: W01-SR-10
  targetOwner: "Fable (catalog organizations module)"
  request: "(1) Register candidate forbidden implications [HOLDS_EQUITY_IN, PARENT_OF] and [BOARD_MEMBER_OF, EMPLOYED_BY]. (2) Canonicalize SUBSIDIARY_OF assertions to PARENT_OF (subject = parent) with the source phrasing in roleTitleVerbatim; SUBSIDIARY_OF stays a registered alias for extraction only. (3) Mark OWNS_PRODUCT, LABELS_PRODUCT, OWNS_SPECIFICATION, OPERATES_LABORATORY, OPERATES_CERTIFICATION_PROGRAM, DEVELOPS_PRODUCT_CLASS, CLAIMS_CGMP_COMPLIANCE as assertion-only predicates (no projected edge type in 0.3). (4) Projection rule: a W01 asserted edge is projected only from an ACCEPTED assertion (V-W01-07)."
  cq: [CQ-EC-C02, CQ-EC-01, CQ-MF-01]
  failingCase: "Negative N3 (PARENT_OF Pioneer Step -> Niagen projected from the HOLDS_EQUITY_IN assertion) passes V-112 with catalog 0.2.0 pairs and is flagged FORBIDDEN_IMPLICATION_USED_AS_PREMISE only with the candidate pair (5 V-112 rows instead of 4). Proxy excerpt: Wendy Yu is a director and the investor's nominee while Pioneer Step only holds 6,917,783 shares; Robert Fried is both director and CEO; Steven Rubin is director only: board membership does not imply employment."
  proposedRuling: "Accept (1)-(4) into catalog 0.3 organizations."

