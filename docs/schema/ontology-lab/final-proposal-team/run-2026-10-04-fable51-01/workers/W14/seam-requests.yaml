# W14 seam requests (run-2026-10-04-fable51-01). Fable copies these into 03-conflict-ledger.md and assigns resolvers.
- id: W14-SR-01
  targetOwner: W00
  request: >
    Register uid type tokens for W14 primary labels in conventions.uidTypeTokens: PatentFamily: patent-family,
    PatentApplication: patent-application, GrantedPatent: granted-patent, PatentClaim: patent-claim,
    PatentLicense: patent-license, Trademark: trademark, IpRightStatus: ip-status (candidate). Add IpRightStatus to
    AssertionSubjectTarget (the W00 fragment already lists the six catalog W14 types).
  cq: [CQ-IP-C01, CQ-IP-C02, CQ-IP-C04, CQ-IP-C05]
  failingCase: >
    INV-106 cannot be checked for any W14 node: catalog 0.2.0 has no token for the six regulatory_and_ip /
    products_and_formulations IP types, so fixtures/w14-ip-core.cypher must use unregistered tokens.
  proposedRuling: Register the seven tokens; IpRightStatus enters the union only if W14-SR-02 is accepted.

- id: W14-SR-02
  targetOwner: Fable 5.1 (registry) with W00 (kernel check) and W13 (INV-010 neighbour)
  request: >
    Admit the CANDIDATE VersionedState IpRightStatus, its relationship IP_STATUS_OF (IpRightStatus -> PatentApplication |
    GrantedPatent | PatentClaim | Trademark, asserted, exactly_one, asserted_edge profile), and the union
    IpRightStatusSubjectTarget to the W14 registry row, and retire the catalog `status` property of PatentApplication,
    GrantedPatent and Trademark (no live data). Register the closed vocabularies IpRightStatusKind (17 values),
    PatentFamilyDefinition, PatentApplicationKind, PatentClaimKind and MarkDrawingKind as W14-owned enums (they are Strings
    in the fragment until registered). IP_STATUS_OF predicateExclusivity: NONEXCLUSIVE, with the definite in-force/terminal
    conflict checked by V-W14-14.
  cq: [CQ-IP-C01, CQ-IP-C04, CQ-IP-C05]
  failingCase: >
    F-STATUS-01 (fixtures/w14-ip-core.cypher; Q-01): Google Patents shows US 8,197,807 B2 "Status Active, Adjusted
    expiration 2026-11-19" (S1) while the Federal Circuit affirmed claims 1-3 patent-ineligible on 2023-02-13 (S5). One
    `status` string on GrantedPatent returns the claims as enforceable on 2026-10-04 and cannot carry the claim-level
    holding, its asserter, the expiry bound or the 2025-07-24 trademark renewal (S6) as a late-arriving bounded fact.
    Reusing RegulatoryStatus would violate INV-010.
  proposedRuling: Accept IpRightStatus as a W14 type (regulatory_and_ip); keep it distinct from RegulatoryStatus.

- id: W14-SR-03
  targetOwner: W01
  request: >
    (a) Register the asserted predicate GRANTS_PATENT_LICENSE (Organization licensor -> PatentLicense) in the
    organizations assertedPredicates. (b) Confirm the projections W14 writes on its side: OWNS_TRADEMARK Organization ->
    Trademark; ASSIGNED_PATENT Organization -> PatentFamily | PatentApplication | GrantedPatent; LICENSES_PATENT
    Organization (licensee) -> PatentLicense; all with AssertedEdgeProperties, not RoleEdgeProperties. (c) If W01 adds the
    outgoing fields on Organization, use the same type names, directions and property type (unions PatentLicenseTarget or
    a requested PatentAssignmentTarget = PatentFamily | PatentApplication | GrantedPatent, sole writer W14). (d) Add the
    proposed forbidden implications [OWNS_TRADEMARK, SUPPLIES_INGREDIENT_MATERIAL], [OWNS_TRADEMARK, MARKETS_PRODUCT],
    [OWNS_TRADEMARK, MANUFACTURES_PRODUCT], [ASSIGNED_PATENT, GRANTS_PATENT_LICENSE] and [ASSIGNED_PATENT, LICENSES_PATENT].
  cq: [CQ-IP-C02, CQ-IP-C04, CQ-EC-01, CQ-MF-01]
  failingCase: >
    Q-05 (fixtures/w14-ip-minimal-pairs.cypher MP-2): for the synthetic sublicense the naive licensor-from-assignee
    inference returns "Synthetic University" while the asserted licensor is "Synthetic Licensee A". Q-07 / N-7: the US
    NIAGEN mark owner of record is ChromaDex, Inc. (S6) while the supplier statement is by the group Niagen Bioscience, Inc.
    (S7); V-W14-12 flags a supplier role derived from mark ownership.
  proposedRuling: Register GRANTS_PATENT_LICENSE and the five forbidden pairs; W14 keeps writing the IP-side fields.

- id: W14-SR-04
  targetOwner: W00 (predicate registry) with W10 (efficacy predicates)
  request: >
    Register PATENT_CLAIMS as an asserted predicate of regulatory_and_ip (subject PatentClaim | GrantedPatent |
    PatentApplication | PatentFamily; object IngredientMaterial | ChemicalSubstance | ChemicalForm | Product |
    ProductVariant | StudyIntervention), assertion-only (no projected edge), so the catalog forbidden implication
    [PATENT_CLAIMS, PROVES_EFFICACY] has a concrete premise. W10 to confirm the list of efficacy/outcome predicates that
    V-W14-02 must check (fixture uses PROVES_EFFICACY, IMPROVES_OUTCOME, HAS_EFFECT_ON, SUPPORTS_EFFICACY,
    AFFECTS_MECHANISM, INFLUENCES_OUTCOME). Add the pairs to validation-params implicationPairs so the kernel V-112 also
    covers them (it already catches the N-1 OWNS_STUDY edge).
  cq: [CQ-IP-C01, CQ-IP-C03]
  failingCase: >
    N-2 (fixtures/w14-ip-negative.cypher): claim 1 of US 8,197,807 contains the limitation "increases NAD+ biosynthesis
    upon oral administration"; a CALCULATED PROVES_EFFICACY assertion derived from the curator's PATENT_CLAIMS reading is
    caught only by V-W14-02 today because the predicate is unregistered.
  proposedRuling: Register; add to implicationPairs.

- id: W14-SR-05
  targetOwner: W02
  request: >
    Add the outgoing field on BrandedIngredientMaterial: marks: [Trademark!]! @relationship(type: "MARKETED_UNDER_MARK",
    direction: OUT, properties: "AssertedEdgeProperties") with description "class: asserted; catalog:
    MARKETED_UNDER_MARK (W14 owns the relationship type)". Keep brandName as presentation only (never identity with
    Trademark.markText).
  cq: [CQ-IP-C04, CQ-EC-02]
  failingCase: >
    Q-07: without the outgoing field the material-to-mark traversal exists only from the Trademark side; GraphQL clients
    starting from the material cannot reach the mark, owner or status.
  proposedRuling: Accept.

- id: W14-SR-06
  targetOwner: W01 (with W21 for CQ-CL-05)
  request: >
    Decide whether a NAMED_INVENTOR role (Person -> PatentApplication | GrantedPatent) is needed for CQ-CL-05. W14
    keeps inventorNamesVerbatim on the artifacts and proposes the forbidden implications
    [NAMED_INVENTOR, ASSIGNED_PATENT] and [NAMED_INVENTOR, HAS_IP_INTEREST_IN] if the role is admitted.
  cq: [CQ-CL-05, CQ-EC-01]
  failingCase: >
    None in W14 fixtures (deliberately deferred). Illustration: US 8,197,807 names inventor Charles M. Brenner and the
    current assignee is Dartmouth (S1); inventorship is neither assignment nor a disclosed IP interest.
  proposedRuling: Defer; keep CANDIDATE.

- id: W14-SR-07
  targetOwner: W20 (and W19)
  request: >
    A patent publication captured as a Document (DocumentType PATENT or PATENT_APPLICATION, DocumentDomain PATENT_IP) is a
    rendition Source of the W14 artifact. Confirm the linking edge (W19/W20 RENDITION_OF or ABOUT) and that PatentClaim
    text extraction cites SourceLocators in that Document's snapshot. W14 adds no Document field.
  cq: [CQ-IP-C01, CQ-PV-01]
  failingCase: >
    S1: the claims text and the bibliographic page are one captured snapshot; without the Document link the claim
    hash can be reproduced only through assertion locators.
  proposedRuling: Use the existing ABOUT edge (W20) from Document to GrantedPatent or PatentApplication; no new type.

- id: W14-SR-08
  targetOwner: W00
  request: >
    Confirm that the PredicateClass for IP predicates is COMMERCIAL (OWNS_TRADEMARK, ASSIGNED_PATENT, LICENSES_PATENT,
    GRANTS_PATENT_LICENSE, LICENSE_COVERS, MARKETED_UNDER_MARK), REGULATORY (APPLICATION_GRANTED_AS, IP_STATUS_OF),
    IDENTITY (HAS_IDENTIFIER) and OTHER (PATENT_CLAIMS); no new PredicateClass value is requested.
  cq: [CQ-IP-C02]
  failingCase: none (classification consistency only)
  proposedRuling: Confirm.
