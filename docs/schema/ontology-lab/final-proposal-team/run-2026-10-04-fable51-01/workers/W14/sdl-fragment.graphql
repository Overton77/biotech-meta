# ---------------------------------------------------------------------------------------------------------------------
# Unions
# ---------------------------------------------------------------------------------------------------------------------

"""
Range of LICENSE_COVERS (catalog: PatentFamily|PatentApplication|GrantedPatent|PatentClaim). A license covers exactly
the members its source names (or the family when the source states family-level coverage); coverage is never inferred
from family membership (V-W14-05) and never implies that a product is licensed, made under the patent or effective.
"""
union PatentLicenseTarget = PatentFamily | PatentApplication | GrantedPatent | PatentClaim

"""
CANDIDATE (W14-SR-02). Range of IP_STATUS_OF: the jurisdictional right or claim whose legal status an IpRightStatus
describes. A patent-level status never implies a claim-level status and vice versa (V-W14-07).
"""
union IpRightStatusSubjectTarget = PatentApplication | GrantedPatent | PatentClaim | Trademark

# ---------------------------------------------------------------------------------------------------------------------
# Entities
# ---------------------------------------------------------------------------------------------------------------------

"""
A patent family as delimited by ONE stated family definition (familyDefinition: DOCDB simple family, INPADOC extended
family, the family list a source displays, or a curated grouping). Family membership is definition- and source-dependent:
the same application can belong to two PatentFamily nodes under different definitions, and they are compared through an
EquivalenceAssessment (OVERLAPPING_SCOPE), never merged. It is NOT a right (rights are applications, grants and claims in
one jurisdiction), NOT a legal status holder (status lives on IpRightStatus of members), and membership NEVER implies
license coverage or assignment of every member. CQ-IP-C05, CQ-IP-C02, CQ-EC-01. Module regulatory_and_ip. Archetype Entity.
"""
type PatentFamily implements Entity & EntityArchetype
  @node(labels: ["PatentFamily", "Entity"]) {
  id: ID! @id
  uid: String! @settable(onCreate: true, onUpdate: false)
  name: String
  description: String
  mongoResearchRunId: String
  createdAt: DateTime! @timestamp(operations: [CREATE])
  updatedAt: DateTime! @timestamp(operations: [CREATE, UPDATE])
  privacyClass: PrivacyClass
  maturity: NodeMaturity
  schemaVersion: String
  "Always 'PatentFamily'."
  entityType: String!
  "Materialized key of the family Identifier under familyDefinition (e.g. a DOCDB family id); null when the definition has no public id (SOURCE_DISPLAYED, CURATED). The Identifier record is authoritative."
  familyIdentifier: String
  "Controlled string DOCDB_SIMPLE | INPADOC_EXTENDED | SOURCE_DISPLAYED | CURATED (candidate enum PatentFamilyDefinition). Required: a family without a definition has no stable membership."
  familyDefinition: String!
  "Representative title as displayed by the defining source (presentation only)."
  title: String
  """class: structural; cardinality: one_or_more; catalog: FAMILY_HAS_APPLICATION (membership under this node's familyDefinition, as captured)"""
  applications: [PatentApplication!]! @relationship(type: "FAMILY_HAS_APPLICATION", direction: OUT, properties: "StructuralEdgeProperties")
  """class: asserted; cardinality: many; catalog: HAS_IDENTIFIER (W00)"""
  identifiers: [Identifier!]! @relationship(type: "HAS_IDENTIFIER", direction: OUT, properties: "IdentifierLinkProperties")
  """class: asserted (inverse view; Organization -> PatentFamily); cardinality: many; catalog: ASSIGNED_PATENT (only when the source states family-level holding, e.g. 'patents held by Dartmouth')"""
  assignees: [Organization!]! @relationship(type: "ASSIGNED_PATENT", direction: IN, properties: "AssertedEdgeProperties")
  """class: asserted (inverse view); cardinality: many; catalog: LICENSE_COVERS (only when the license source states family-level coverage)"""
  coveringLicenses: [PatentLicense!]! @relationship(type: "LICENSE_COVERS", direction: IN, properties: "AssertedEdgeProperties")
}

"""
A trademark RIGHT in one jurisdiction: one application/registration at one office (USPTO serial and registration, an EUIPO
filing, a Madrid international registration or a designation). markText is the sign as filed; the same markText in two
jurisdictions is two Trademark nodes (a name never establishes identity), and a related property listed on an office
record (e.g. an international registration 'based on this property') is a different Trademark, never an Identifier of
this one. It is NOT a ConsumerBrand (W01; a brand is an organizational identity, a mark registration is a right),
NOT a BrandedIngredientMaterial (W02; the material is marketed under the mark through MARKETED_UNDER_MARK), and NOT a
status holder by property: registration, renewal, scope amendments, cancellation and expiry are IpRightStatus episodes.
Ownership is the asserted OWNS_TRADEMARK edge; owning a mark never implies marketing, supplying or manufacturing the
material sold under it. CQ-IP-C04, CQ-EC-02, CQ-MF-01. Module products_and_formulations (T-001: stays; SDL written by W14).
Archetype Entity.
"""
type Trademark implements Entity & EntityArchetype
  @node(labels: ["Trademark", "Entity"]) {
  id: ID! @id
  uid: String! @settable(onCreate: true, onUpdate: false)
  name: String
  description: String
  mongoResearchRunId: String
  createdAt: DateTime! @timestamp(operations: [CREATE])
  updatedAt: DateTime! @timestamp(operations: [CREATE, UPDATE])
  privacyClass: PrivacyClass
  maturity: NodeMaturity
  schemaVersion: String
  "Always 'Trademark'."
  entityType: String!
  "Literal elements of the mark as filed (e.g. 'NIAGEN'). Presentation and search only; never identity."
  markText: String!
  "Office jurisdiction code of the right (ISO 3166-1 alpha-2 such as US; EM for EUIPO; WO for a Madrid international registration)."
  jurisdiction: String!
  "Office application / serial number as printed (USPTO serial '85932490'). Identifier record (scheme USPTO_TM_SERIAL) is authoritative."
  applicationSerialNumber: String
  "Office registration number as printed ('4606519'); null before registration. Identifier record (scheme USPTO_TM_REGISTRATION) is authoritative."
  registrationNumber: String
  "Materialized identity key '<jurisdiction>:<normalized application serial>' (digits only, no separators), stable from filing through registration; unique by constraint (07-operations.md)."
  officeKey: String!
  "Controlled string STANDARD_CHARACTER | SPECIAL_FORM | OTHER (candidate enum MarkDrawingKind); as filed."
  markDrawingKind: String
  """class: asserted (inverse view; Organization -> Trademark); cardinality: many (one per recorded-time episode); catalog: OWNS_TRADEMARK (organizations assertedPredicates)"""
  owners: [Organization!]! @relationship(type: "OWNS_TRADEMARK", direction: IN, properties: "AssertedEdgeProperties")
  """class: asserted (inverse view; BrandedIngredientMaterial -> Trademark); cardinality: many; catalog: MARKETED_UNDER_MARK (the outgoing field on BrandedIngredientMaterial is requested from W02, W14-SR-05)"""
  markedMaterials: [BrandedIngredientMaterial!]! @relationship(type: "MARKETED_UNDER_MARK", direction: IN, properties: "AssertedEdgeProperties")
  """class: asserted; cardinality: one_or_more; catalog: HAS_IDENTIFIER (W00)"""
  identifiers: [Identifier!]! @relationship(type: "HAS_IDENTIFIER", direction: OUT, properties: "IdentifierLinkProperties")
  """class: asserted (inverse view); cardinality: many (episodes); CANDIDATE: IP_STATUS_OF"""
  statuses: [IpRightStatus!]! @relationship(type: "IP_STATUS_OF", direction: IN, properties: "AssertedEdgeProperties")
}

