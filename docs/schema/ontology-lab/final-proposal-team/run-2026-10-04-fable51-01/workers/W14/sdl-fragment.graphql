"""
A patent application filed at one office (national, regional, PCT international or provisional), identified by office
and application number. The artifact is immutable: its bibliographic data as filed/published (title, applicant and
inventor names as printed) never change; its prosecution and legal status (pending, published, granted, abandoned,
withdrawn, lapsed) are IpRightStatus episodes. Claims as filed or published are PatentClaim nodes distinct from the granted
claims. The published document (A1 publication, PDF) is a Source/Document rendition (W19/W20 DocumentType
PATENT_APPLICATION), not this node. Printed inventor names are NOT inventor roles and NOT ownership (inventorship,
assignment and IP interest stay three separate facts). CQ-IP-C05, CQ-IP-C01, CQ-EC-01. Module regulatory_and_ip.
Archetype InformationArtifact.
"""
type PatentApplication implements Entity & InformationArtifactArchetype
  @node(labels: ["PatentApplication", "InformationArtifact"]) {
  id: ID! @id
  uid: String! @settable(onCreate: true, onUpdate: false)
  name: String
  description: String
  mongoResearchRunId: String
  createdAt: DateTime! @timestamp(operations: [CREATE])
  updatedAt: DateTime! @timestamp(operations: [CREATE, UPDATE])
  privacyClass: PrivacyClass
  maturity: NodeMaturity
  schemaVersion: String
  "Always 'PatentApplication'."
  artifactType: String!
  "First publication of the application (e.g. A1), when published; null = not published or unknown."
  publishedAt: DateTime
  "Instant the record was known to display these data (capture of the office or aggregator page)."
  observedAt: DateTime
  "sha256:<hex> over the captured bibliographic record (basis on the SourceSnapshot)."
  contentHash: String
  "Application number as printed by the office ('11/912,400', 'EP05722944', 'PCT/US2005/004337')."
  applicationNumber: String!
  "Office jurisdiction code (US, EP, JP, CA, AU; WO for a PCT international application)."
  jurisdiction: String!
  "Materialized identity key '<jurisdiction>:<normalized application number>' (e.g. 'US:11912400', 'EP:05722944'); unique by constraint."
  officeKey: String!
  "Filing date as stated by the office (date only)."
  filingDate: Date
  "Controlled string NATIONAL | REGIONAL | PCT_INTERNATIONAL | PROVISIONAL (candidate enum PatentApplicationKind)."
  applicationKind: String
  "Title as filed/published."
  title: String
  "Applicant names exactly as printed on the published application (immutable; never the current owner)."
  applicantNamesVerbatim: [String!]
  "Inventor names exactly as printed (immutable public bibliographic data; not Person identities and not ownership)."
  inventorNamesVerbatim: [String!]
  """class: structural (inverse view); cardinality: many (one per family definition); catalog: FAMILY_HAS_APPLICATION"""
  families: [PatentFamily!]! @relationship(type: "FAMILY_HAS_APPLICATION", direction: IN, properties: "StructuralEdgeProperties")
  """class: asserted; cardinality: zero_or_one per grant episode (a reissue is a second GrantedPatent); catalog: APPLICATION_GRANTED_AS"""
  grantedAs: [GrantedPatent!]! @relationship(type: "APPLICATION_GRANTED_AS", direction: OUT, properties: "AssertedEdgeProperties")
  """class: structural; cardinality: many; catalog: HAS_PATENT_CLAIM (claims as filed or as published; never the granted claims)"""
  claims: [PatentClaim!]! @relationship(type: "HAS_PATENT_CLAIM", direction: OUT, properties: "StructuralEdgeProperties")
  """class: asserted; cardinality: one_or_more; catalog: HAS_IDENTIFIER (application number, publication numbers)"""
  identifiers: [Identifier!]! @relationship(type: "HAS_IDENTIFIER", direction: OUT, properties: "IdentifierLinkProperties")
  """class: asserted (inverse view; Organization -> PatentApplication); cardinality: many; catalog: ASSIGNED_PATENT"""
  assignees: [Organization!]! @relationship(type: "ASSIGNED_PATENT", direction: IN, properties: "AssertedEdgeProperties")
  """class: asserted (inverse view); cardinality: many; catalog: LICENSE_COVERS"""
  coveringLicenses: [PatentLicense!]! @relationship(type: "LICENSE_COVERS", direction: IN, properties: "AssertedEdgeProperties")
  """class: asserted (inverse view); cardinality: many (episodes); CANDIDATE: IP_STATUS_OF"""
  statuses: [IpRightStatus!]! @relationship(type: "IP_STATUS_OF", direction: IN, properties: "AssertedEdgeProperties")
}

"""
A granted patent (one grant publication at one office, identified by office, patent number and kind code; a reissue or a
reexamination certificate is a further artifact). Immutable: bibliographic data as printed at grant. Whether it is in force,
expired (term end, adjusted term), lapsed for non-payment, or surrendered is an IpRightStatus episode on this node; whether
a CLAIM is valid, held invalid or cancelled is an IpRightStatus episode on that PatentClaim. An aggregator's "Active" is a
status assertion by that aggregator, never a claim-validity fact (V-W14-07). Holding the grant (ASSIGNED_PATENT), licensing
it (PatentLicense) and the claims' subject matter (PATENT_CLAIMS assertions) never imply efficacy, study ownership or that a
product practices the claims. CQ-IP-C01, CQ-IP-C02, CQ-EC-01. Module regulatory_and_ip. Archetype InformationArtifact.
"""
type GrantedPatent implements Entity & InformationArtifactArchetype
  @node(labels: ["GrantedPatent", "InformationArtifact"]) {
  id: ID! @id
  uid: String! @settable(onCreate: true, onUpdate: false)
  name: String
  description: String
  mongoResearchRunId: String
  createdAt: DateTime! @timestamp(operations: [CREATE])
  updatedAt: DateTime! @timestamp(operations: [CREATE, UPDATE])
  privacyClass: PrivacyClass
  maturity: NodeMaturity
  schemaVersion: String
  "Always 'GrantedPatent'."
  artifactType: String!
  "Grant publication instant (first instant of grantDate in UTC)."
  publishedAt: DateTime
  "Instant the record was known to display these data."
  observedAt: DateTime
  "sha256:<hex> over the captured grant record (basis on the SourceSnapshot)."
  contentHash: String
  "Patent number as printed ('8,197,807')."
  patentNumber: String!
  "Kind code of the grant publication ('B2', 'B1', 'E' for reissue)."
  kindCode: String
  "Office jurisdiction code (US, EP, AU ...)."
  jurisdiction: String!
  "Materialized identity key '<jurisdiction>:<digits of patent number>' (kind code excluded; e.g. 'US:8197807'); unique by constraint."
  officeKey: String!
  "Grant date as stated (date only)."
  grantDate: Date
  "Title as granted."
  title: String
  "Assignee names exactly as printed on the grant (immutable; the holder over time is ASSIGNED_PATENT)."
  assigneeNamesVerbatim: [String!]
  "Inventor names exactly as printed (immutable; not Person identities, not ownership, not IP interest)."
  inventorNamesVerbatim: [String!]
  """class: asserted (inverse view); cardinality: exactly_one per grant; catalog: APPLICATION_GRANTED_AS"""
  application: [PatentApplication!]! @relationship(type: "APPLICATION_GRANTED_AS", direction: IN, properties: "AssertedEdgeProperties")
  """class: structural; cardinality: one_or_more; catalog: HAS_PATENT_CLAIM (claims as granted)"""
  claims: [PatentClaim!]! @relationship(type: "HAS_PATENT_CLAIM", direction: OUT, properties: "StructuralEdgeProperties")
  """class: asserted; cardinality: one_or_more; catalog: HAS_IDENTIFIER (patent number with issuer and jurisdiction)"""
  identifiers: [Identifier!]! @relationship(type: "HAS_IDENTIFIER", direction: OUT, properties: "IdentifierLinkProperties")
  """class: asserted (inverse view; Organization -> GrantedPatent); cardinality: many (episodes); catalog: ASSIGNED_PATENT"""
  assignees: [Organization!]! @relationship(type: "ASSIGNED_PATENT", direction: IN, properties: "AssertedEdgeProperties")
  """class: asserted (inverse view); cardinality: many; catalog: LICENSE_COVERS"""
  coveringLicenses: [PatentLicense!]! @relationship(type: "LICENSE_COVERS", direction: IN, properties: "AssertedEdgeProperties")
  """class: asserted (inverse view); cardinality: many (episodes); CANDIDATE: IP_STATUS_OF"""
  statuses: [IpRightStatus!]! @relationship(type: "IP_STATUS_OF", direction: IN, properties: "AssertedEdgeProperties")
}

"""
One numbered claim of one application publication or one grant, with its verbatim text and hash. A claim as filed and the
claim of the same number as granted are two nodes (amendment changes text). Validity is never a property: a court or office
holding a claim invalid, unpatentable, cancelled or confirmed is an IpRightStatus episode on this node. What the claim
reads on (a material, substance, form or use) is a PATENT_CLAIMS Assertion with an asserter (owner statement, court finding
or curator reading); [PATENT_CLAIMS, PROVES_EFFICACY] is forbidden, so a functional limitation in the claim text ("increases
NAD+ biosynthesis upon oral administration") is never an efficacy finding. CQ-IP-C01, CQ-IP-C03. Module regulatory_and_ip.
Archetype InformationArtifact.
"""
type PatentClaim implements Entity & InformationArtifactArchetype
  @node(labels: ["PatentClaim", "InformationArtifact"])
  @fulltext(indexes: [{indexName: "PatentClaimText", fields: ["claimText"], queryName: "searchPatentClaims"}]) {
  id: ID! @id
  uid: String! @settable(onCreate: true, onUpdate: false)
  name: String
  description: String
  mongoResearchRunId: String
  createdAt: DateTime! @timestamp(operations: [CREATE])
  updatedAt: DateTime! @timestamp(operations: [CREATE, UPDATE])
  privacyClass: PrivacyClass
  maturity: NodeMaturity
  schemaVersion: String
  "Always 'PatentClaim'."
  artifactType: String!
  "Publication instant of the containing application publication or grant."
  publishedAt: DateTime
  "Instant the claim text was captured."
  observedAt: DateTime
  "sha256:<hex> of the captured claim record; equals claimTextHash when the record is the text alone."
  contentHash: String
  "Claim number within its parent publication."
  claimNumber: Int!
  "Controlled string INDEPENDENT | DEPENDENT (candidate enum PatentClaimKind)."
  claimKind: String!
  "Claim numbers this claim refers to (empty for an independent claim)."
  dependsOnClaimNumbers: [Int!]
  "Verbatim claim text as captured (public)."
  claimText: String
  "sha256:<hex> of claimText normalized with NFC-WS1 (catalog normalizationVersions)."
  claimTextHash: String!
  "Normalization applied before hashing ('NFC-WS1')."
  claimTextNormalization: String
  """class: structural (inverse view); cardinality: exactly_one across applicationParent and grantParent; catalog: HAS_PATENT_CLAIM"""
  applicationParent: [PatentApplication!]! @relationship(type: "HAS_PATENT_CLAIM", direction: IN, properties: "StructuralEdgeProperties")
  """class: structural (inverse view); cardinality: exactly_one across applicationParent and grantParent; catalog: HAS_PATENT_CLAIM"""
  grantParent: [GrantedPatent!]! @relationship(type: "HAS_PATENT_CLAIM", direction: IN, properties: "StructuralEdgeProperties")
  """class: asserted (inverse view); cardinality: many; catalog: LICENSE_COVERS (only when the license names claims)"""
  coveringLicenses: [PatentLicense!]! @relationship(type: "LICENSE_COVERS", direction: IN, properties: "AssertedEdgeProperties")
  """class: asserted (inverse view); cardinality: many (episodes); CANDIDATE: IP_STATUS_OF (claim-level validity)"""
  statuses: [IpRightStatus!]! @relationship(type: "IP_STATUS_OF", direction: IN, properties: "AssertedEdgeProperties")
}

# ---------------------------------------------------------------------------------------------------------------------
# Versioned states
# ---------------------------------------------------------------------------------------------------------------------

"""
The terms of one patent license as stated by one agreement version (or an amendment): exclusivity, field of use,
territory, sublicensing right, source-stated effective bounds, the verbatim rights definition and term clause. A license
amendment or replacement is a new PatentLicense linked by SUPERSEDES. Parties are asserted edges: the licensee through
LICENSES_PATENT (Organization -> PatentLicense) and the licensor through the CANDIDATE GRANTS_PATENT_LICENSE; the licensor
is never inferred from the assignee (a sublicense is granted by a licensee). What is licensed is the asserted LICENSE_COVERS
set exactly as the source names it; the rights-definition text ("and any Foreign Patents issuing therefrom") is kept
verbatim in coverageRuleText and never expanded into family-wide coverage. A term that a public filing redacts or omits is
null with its *ReportedStatus = NOT_REPORTED, never "unrestricted"; null with a null status is unknown (e.g. not captured).
A license NEVER implies ownership, sponsorship or funding of any study ([LICENSES_PATENT, OWNS_STUDY]), efficacy, that a
product practices the patent, or validity of the licensed claims. CQ-IP-C02, CQ-IP-C03, CQ-EC-01. Module regulatory_and_ip.
Archetype VersionedState.
"""
type PatentLicense implements Entity & VersionedStateArchetype
  @node(labels: ["PatentLicense", "VersionedState"]) {
  id: ID! @id
  uid: String! @settable(onCreate: true, onUpdate: false)
  name: String
  description: String
  mongoResearchRunId: String
  createdAt: DateTime! @timestamp(operations: [CREATE])
  updatedAt: DateTime! @timestamp(operations: [CREATE, UPDATE])
  privacyClass: PrivacyClass
  maturity: NodeMaturity
  schemaVersion: String
  "Always 'PatentLicense'."
  stateType: String!
  "sha256:<hex> over the canonical JSON of the payload fields below (replay identity, D-016)."
  payloadHash: String!
  "Source-stated effective date of these terms (payload); query validity comes from the LICENSES_PATENT / LICENSE_COVERS episodes."
  effectiveFrom: DateTime
  "Source-stated end; null = unknown or not stated (a 'life of the last-to-expire patent' term is null with termText kept verbatim)."
  effectiveTo: DateTime
  "Agreement title as stated ('Exclusive Patent License Agreement')."
  agreementTitle: String
  "true exclusive, false non-exclusive; null = unknown or not reported (see exclusivityReportedStatus). Never defaulted."
  exclusive: Boolean
  "REPORTED, NOT_REPORTED (redacted or withheld in the public source) or NOT_APPLICABLE; null = not assessed."
  exclusivityReportedStatus: ReportedStatus
  "Field of use verbatim ('human and animal therapeutics'); null = unknown or not reported."
  fieldOfUse: String
  "Whether the source reports the field of use; NOT_REPORTED is never 'all fields'."
  fieldOfUseReportedStatus: ReportedStatus
  "Territory verbatim ('worldwide')."
  territory: String
  "Normalized territory: ISO 3166-1 alpha-2 codes, or the single value 'WORLDWIDE'."
  territoryJurisdictions: [String!]
  "Whether the source reports the territory."
  territoryReportedStatus: ReportedStatus
  "true when the licensee may grant sublicenses per the source; null = unknown."
  sublicensable: Boolean
  "Verbatim definition of the licensed rights (named numbers plus any rule such as 'Foreign Patents issuing therefrom ... reissues, reexaminations or extensions')."
  coverageRuleText: String
  "Verbatim term clause ('shall remain in full force during the life of the last to expire patents ...')."
  termText: String
  """class: asserted; cardinality: one_or_more; catalog: LICENSE_COVERS (exactly the members the source names)"""
  covers: [PatentLicenseTarget!]! @relationship(type: "LICENSE_COVERS", direction: OUT, properties: "AssertedEdgeProperties")
  """class: asserted (inverse view; Organization -> PatentLicense); cardinality: one_or_more; catalog: LICENSES_PATENT (licensee side)"""
  licensees: [Organization!]! @relationship(type: "LICENSES_PATENT", direction: IN, properties: "AssertedEdgeProperties")
  """class: asserted (inverse view; Organization -> PatentLicense); cardinality: zero_or_one per episode; CANDIDATE: GRANTS_PATENT_LICENSE (licensor side; W14-SR-03)"""
  licensors: [Organization!]! @relationship(type: "GRANTS_PATENT_LICENSE", direction: IN, properties: "AssertedEdgeProperties")
  """class: structural; cardinality: zero_or_one; catalog: SUPERSEDES (W00; amendment or replacement of these terms)"""
  supersedes: [PatentLicense!]! @relationship(type: "SUPERSEDES", direction: OUT, properties: "SupersessionProperties")
}

"""
CANDIDATE (W14-SR-02; CQ-IP-C01, CQ-IP-C04; failing case fixtures/w14-ip-core.cypher F-STATUS-01). The legal status of one
jurisdictional IP right or claim for a bounded period: pending, published, granted/in force, registered, renewed, abandoned,
withdrawn, lapsed, expired, cancelled, or (claim level) held invalid, held unpatentable, cancelled, confirmed. Mirrors
RegulatoryStatus but is a separate type because patent status and regulatory status must stay distinct (INV-010). scopeText
carries the scope of the right during the episode (trademark goods/services as amended; claims affected by a decision).
Who says so is the asserter of the IP_STATUS_OF Assertion (office record, court, PTAB, owner filing, aggregator display);
an aggregator's display is never the office's status. An end of status is SUPERSEDES {VALIDITY_BOUNDED}; a vacated decision
or mis-extracted date is SUPERSEDES {SOURCE_CORRECTION | EXTRACTION_FIX} (TM-R2, TM-R3). Archetype VersionedState.
Module regulatory_and_ip.
"""
type IpRightStatus implements Entity & VersionedStateArchetype
  @node(labels: ["IpRightStatus", "VersionedState"]) {
  id: ID! @id
  uid: String! @settable(onCreate: true, onUpdate: false)
  name: String
  description: String
  mongoResearchRunId: String
  createdAt: DateTime! @timestamp(operations: [CREATE])
  updatedAt: DateTime! @timestamp(operations: [CREATE, UPDATE])
  privacyClass: PrivacyClass
  maturity: NodeMaturity
  schemaVersion: String
  "Always 'IpRightStatus'."
  stateType: String!
  "sha256:<hex> over statusKind, jurisdiction, scopeText, niceClasses, legalBasisCitation, proceedingReference, effective bounds."
  payloadHash: String!
  "Source-stated start of the status (grant date, registration date, decision date)."
