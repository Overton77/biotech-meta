"""
BellLabs' method-versioned judgement of whether ONE evidence target (a StudyIntervention, or a mechanism Assertion)
transfers to ONE use target (Product, ProductVariant, FormulationVersion, ProductLot, IngredientMaterial or a non-personal
UseContextProfile), decomposed into one ApplicabilityDimension node per required dimension with NOT_ASSESSED explicit
(INV-202, V-203..V-205). It is the ONLY path from study evidence to a commercial identity (INV-201, V-201): no Study,
StudyArm, StudyIntervention, StudyResult or Publication links to a product. It is NOT a truth verdict on the study, NOT
formulation continuity, NOT evidence strength, and never targets a private UserContext (V-524). The flat per-dimension
fields are a derived read-only projection of the dimension nodes for filtering; a composite `overallScore` is allowed only
with a calibrated composite method and every required dimension present and assessed (INV-204, V-207b, W10-V05); while
calibration is DEFERRED it stays null. Immutable; a re-assessment is a new node SUPERSEDES {RE_REVIEW} the old one.
CQs: CQ-EV-04, CQ-EV-06, CQ-RC-03, CQ-AX-20, CQ-MX-04. Module studies_and_evidence. Archetype EvidenceAssessment.
uid token `applicability`.
"""
type EvidenceApplicability implements Entity & EvidenceAssessmentArchetype
  @node(labels: ["EvidenceApplicability", "EvidenceAssessment"])
  @mutation(operations: [CREATE, UPDATE]) {
  id: ID! @id
  uid: String! @settable(onCreate: true, onUpdate: false)
  name: String
  description: String
  mongoResearchRunId: String
  createdAt: DateTime! @timestamp(operations: [CREATE]) @settable(onCreate: false, onUpdate: false)
  updatedAt: DateTime! @timestamp(operations: [CREATE, UPDATE])
  privacyClass: PrivacyClass
  maturity: NodeMaturity
  schemaVersion: String
  "Always 'EvidenceApplicability'."
  assessmentType: String! @settable(onCreate: true, onUpdate: false)
  "Applicability method version (applicability-v0.1 inherited; applicability-v0.2-candidate adds W02-SR-09 identity inputs and use-profile normalization). Required (V-207b)."
  methodVersion: String! @settable(onCreate: true, onUpdate: false)
  "Workflow state of this record; never the verdict."
  status: AssessmentStatus!
  "Service-assigned commit time (KCR-2a); never backdated, never earlier than the cited snapshots' retrievedAt (INV-502)."
  recordedAt: DateTime! @timestamp(operations: [CREATE]) @settable(onCreate: false, onUpdate: false)
  "Written once from null when superseded; equals the superseding node's recordedAt."
  recordedTo: DateTime @settable(onCreate: false, onUpdate: true)
  "Human-readable summary naming the weakest dimension; never a verdict field."
  summary: String @settable(onCreate: true, onUpdate: false)
  "Composite score. Null while composite calibration is DEFERRED; when present requires a calibrated method and all required dimensions assessed (INV-204, V-207b, W10-V05)."
  overallScore: Float @settable(onCreate: true, onUpdate: false)
  "DEPRECATED generic confidence (INV-407); never written."
  confidence: Float @settable(onCreate: false, onUpdate: false)
  "DERIVED read-only projection of the MATERIAL_IDENTITY dimension verdict (catalog derivedProperties)."
  identityMatch: ApplicabilityVerdict @settable(onCreate: false, onUpdate: false)
  "DERIVED read-only projection of the DOSE dimension verdict."
  doseMatch: ApplicabilityVerdict @settable(onCreate: false, onUpdate: false)
  "DERIVED read-only projection of the ROUTE dimension verdict."
  routeMatch: ApplicabilityVerdict @settable(onCreate: false, onUpdate: false)
  "DERIVED read-only projection of the SCHEDULE dimension verdict."
  scheduleMatch: ApplicabilityVerdict @settable(onCreate: false, onUpdate: false)
  "DERIVED read-only projection of the DURATION dimension verdict."
  durationMatch: ApplicabilityVerdict @settable(onCreate: false, onUpdate: false)
  "DERIVED read-only projection of the POPULATION dimension verdict."
  populationMatch: ApplicabilityVerdict @settable(onCreate: false, onUpdate: false)
  "DERIVED read-only projection of the OUTCOME_RELEVANCE dimension verdict."
  outcomeMatch: ApplicabilityVerdict @settable(onCreate: false, onUpdate: false)

  """class: structural; cardinality: exactly_one; catalog: HAS_EVIDENCE_TARGET (V-203)"""
  evidenceTarget: [EvidenceTargetTarget!]! @relationship(type: "HAS_EVIDENCE_TARGET", direction: OUT) @settable(onCreate: true, onUpdate: false)
  """class: structural; cardinality: exactly_one; catalog: ASSESSES_APPLICABILITY_TO (V-203; never UserContext, V-524)"""
  useTarget: [ApplicabilityUseTarget!]! @relationship(type: "ASSESSES_APPLICABILITY_TO", direction: OUT) @settable(onCreate: true, onUpdate: false)
  """class: structural; cardinality: zero_or_one; catalog: FOR_USE_CONTEXT (the non-personal use profile assumed, separate from the use target)"""
  forUseContext: [UseContextProfile!]! @relationship(type: "FOR_USE_CONTEXT", direction: OUT) @settable(onCreate: true, onUpdate: false)
  """class: structural; cardinality: many; catalog: BASED_ON_EVIDENCE (Study range)"""
  basedOnStudies: [Study!]! @relationship(type: "BASED_ON_EVIDENCE", direction: OUT) @settable(onCreate: true, onUpdate: false)
  """class: structural; cardinality: many; catalog: BASED_ON_EVIDENCE (StudyResult range; human exposure results for INV-212 / V-237)"""
  basedOnResults: [StudyResult!]! @relationship(type: "BASED_ON_EVIDENCE", direction: OUT) @settable(onCreate: true, onUpdate: false)
  """class: structural; cardinality: many; catalog: BASED_ON_EVIDENCE (Publication range)"""
  basedOnPublications: [Publication!]! @relationship(type: "BASED_ON_EVIDENCE", direction: OUT) @settable(onCreate: true, onUpdate: false)
  """class: structural; cardinality: many; catalog: BASED_ON_EVIDENCE (Assertion range)"""
  basedOnAssertions: [Assertion!]! @relationship(type: "BASED_ON_EVIDENCE", direction: OUT) @settable(onCreate: true, onUpdate: false)
  """class: structural; cardinality: one_per_dimension (each required dimension exactly once, V-204/V-205; a dimension node has exactly one parent, W10-V01); catalog: HAS_DIMENSION"""
  dimensions: [ApplicabilityDimension!]! @relationship(type: "HAS_DIMENSION", direction: OUT) @settable(onCreate: true, onUpdate: false)
  """class: structural; cardinality: many; catalog: SUPPORTED_BY (W00)"""
  supportedBy: [SourceLocator!]! @relationship(type: "SUPPORTED_BY", direction: OUT) @settable(onCreate: true, onUpdate: false)
  """class: structural; cardinality: zero_or_one; catalog: SUPERSEDES (W00; EvidenceApplicability -> EvidenceApplicability with the same evidence and use target, W10-V07)"""
  supersedes: [EvidenceApplicability!]! @relationship(type: "SUPERSEDES", direction: OUT, properties: "SupersessionProperties") @settable(onCreate: true, onUpdate: false)
  """class: structural (inverse); catalog: SUPERSEDES"""
  supersededBy: [EvidenceApplicability!]! @relationship(type: "SUPERSEDES", direction: IN, properties: "SupersessionProperties") @settable(onCreate: false, onUpdate: false)
  """class: structural; cardinality: zero_or_one; catalog: WAS_GENERATED_BY (W00; ADJUDICATION Activity carrying methodVersion)"""
  generatedBy: [Activity!]! @relationship(type: "WAS_GENERATED_BY", direction: OUT)
  """class: structural; cardinality: zero_or_one; catalog: ASSESSED_BY (W00, -> Agent)"""
  assessedByAgent: [Agent!]! @relationship(type: "ASSESSED_BY", direction: OUT)
  """class: structural; cardinality: zero_or_one; catalog: ASSESSED_BY (W00, -> Person; a public assessor only)"""
  assessedByPerson: [Person!]! @relationship(type: "ASSESSED_BY", direction: OUT)
}

"""
One dimension of one EvidenceApplicability: its class, verdict, compared values with quantity and mass bases, a ratio
computed only when quantity basis, mass basis and unit match on both sides (INV-203, V-206, W10-V03), the missing facts
that keep it UNKNOWN or PARTIAL (V-209; CQ-EV-06), and its own provenance (SUPPORTED_BY locators, CONSIDERS assertions,
CONSIDERS_ASSESSMENT for EndpointClassification, EvidenceStrengthAssessment or ResolutionHypothesis inputs).
EXPLANATION_ONLY dimensions are NOT_SCORED with a rationale (V-207). It is NOT a free-standing assessment: it belongs to
exactly one EvidenceApplicability and shares its methodVersion (W10-V01, W10-V06). Values are frozen copies at assessment
time; they never update when the source states change (a re-assessment re-creates all dimensions). No ratio band is
encoded: a non-identity ratio never yields MATCH until a calibrated method exists (W10-V04).
CQs: CQ-EV-04, CQ-EV-06, CQ-RC-03, CQ-MX-04. Module studies_and_evidence. Archetype EvidenceAssessment.
uid token `applicability-dimension`.
"""
type ApplicabilityDimension implements Entity & EvidenceAssessmentArchetype
  @node(labels: ["ApplicabilityDimension", "EvidenceAssessment"])
  @mutation(operations: [CREATE, UPDATE]) {
  id: ID! @id
  uid: String! @settable(onCreate: true, onUpdate: false)
  name: String
  description: String
  mongoResearchRunId: String
  createdAt: DateTime! @timestamp(operations: [CREATE]) @settable(onCreate: false, onUpdate: false)
  updatedAt: DateTime! @timestamp(operations: [CREATE, UPDATE])
  privacyClass: PrivacyClass
  maturity: NodeMaturity
  schemaVersion: String
  "Always 'ApplicabilityDimension'."
  assessmentType: String! @settable(onCreate: true, onUpdate: false)
  "Equals the parent EvidenceApplicability.methodVersion (W10-V06)."
  methodVersion: String! @settable(onCreate: true, onUpdate: false)
  status: AssessmentStatus!
  recordedAt: DateTime! @timestamp(operations: [CREATE]) @settable(onCreate: false, onUpdate: false)
  recordedTo: DateTime @settable(onCreate: false, onUpdate: true)
  summary: String @settable(onCreate: true, onUpdate: false)
  "Never set on a dimension (composites live on the parent only)."
  overallScore: Float @settable(onCreate: false, onUpdate: false)
  "DEPRECATED (INV-407); never written."
  confidence: Float @settable(onCreate: false, onUpdate: false)
  "Which dimension this node judges."
  dimension: ApplicabilityDimensionKind! @settable(onCreate: true, onUpdate: false)
  "Fixed by dimension (W10-V02)."
  dimensionClass: DimensionClass! @settable(onCreate: true, onUpdate: false)
  "Verdict; NOT_ASSESSED is explicit, UNKNOWN requires missingFacts (V-209)."
  verdict: ApplicabilityVerdict! @settable(onCreate: true, onUpdate: false)
  "MATERIAL_IDENTITY only: strongest established identity path (V-208, V-208b)."
  identityLevel: MaterialIdentityLevel @settable(onCreate: true, onUpdate: false)
  "Evidence-side category from the dimension's method vocabulary (dosage form, route, comparator, endpoint class, composition or population relation)."
  evidenceCategory: String @settable(onCreate: true, onUpdate: false)
  "Target-side category from the same vocabulary."
  targetCategory: String @settable(onCreate: true, onUpdate: false)
  "Evidence-side amount (copied, frozen); null = not extracted or not numeric."
  evidenceValue: Float @settable(onCreate: true, onUpdate: false)
  "Target-side amount (copied, normalized by the FOR_USE_CONTEXT profile when one is linked); null = unknown."
  targetValue: Float @settable(onCreate: true, onUpdate: false)
  "UCUM unit shared by evidenceValue and targetValue (mg/d, mg, /d, d); a ratio needs one unit for both."
  unitCode: String @settable(onCreate: true, onUpdate: false)
  "Quantity basis of evidenceValue; null = unknown (ratio must be null)."
  evidenceQuantityBasis: QuantityBasis @settable(onCreate: true, onUpdate: false)
  "Quantity basis of targetValue; null = unknown (ratio must be null)."
  targetQuantityBasis: QuantityBasis @settable(onCreate: true, onUpdate: false)
  "DOSE/EXPOSURE: mass basis of evidenceValue; UNSPECIFIED blocks the ratio."
  evidenceMassBasis: MassBasis @settable(onCreate: true, onUpdate: false)
  "DOSE/EXPOSURE: mass basis of targetValue."
  targetMassBasis: MassBasis @settable(onCreate: true, onUpdate: false)
  "CALCULATED targetValue / evidenceValue, only when both quantity bases, both mass bases (none UNSPECIFIED) and the unit match; otherwise null and the verdict is at most PARTIAL (INV-203, V-206, W10-V03)."
  ratio: Float @settable(onCreate: true, onUpdate: false)
  "Specific facts whose absence keeps the verdict UNKNOWN or PARTIAL; non-empty when UNKNOWN (V-209). Never 'more data needed'."
  missingFacts: [String!] @settable(onCreate: true, onUpdate: false)
  "Why; required for EXPLANATION_ONLY (V-207)."
  rationale: String @settable(onCreate: true, onUpdate: false)

  """class: structural (inverse); cardinality: exactly_one; catalog: HAS_DIMENSION"""
  applicability: [EvidenceApplicability!]! @relationship(type: "HAS_DIMENSION", direction: IN) @settable(onCreate: false, onUpdate: false)
  """class: structural; cardinality: many; catalog: CONSIDERS (assertions weighed, incl. CALCULATED amount conversions, INV-307)"""
