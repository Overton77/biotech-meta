"""
type RegulatoryStep implements Entity & EntityArchetype
  @node(labels: ["RegulatoryStep", "Entity"]) {
  id: ID! @id
  uid: String!
  name: String
  description: String
  mongoResearchRunId: String
  createdAt: DateTime! @timestamp(operations: [CREATE])
  updatedAt: DateTime! @timestamp(operations: [CREATE, UPDATE])
  privacyClass: PrivacyClass
  maturity: NodeMaturity
  schemaVersion: String
  entityType: String!
  "Free text step kind (kept from live; not a filter until a CQ needs one)."
  stepKind: String
