"""
What was filed with an agency (GRAS notice GRN 000635, NDI notification 1062, 510(k) K234070, De Novo DEN200080, NDA
217785 ORIG-1, an orphan designation request). Distinct from the agency's answer and from any resulting status (round
0005 C3: different dates, issuers and lifecycles). Its submitter and subject are asserted edges (the agency record or
the filer states them). Clocks: submittedAt (date on the filing), receivedAt (agency receipt), filingDate (agency
filing date; for NDI it resets on a substantive amendment, recorded as superseding assertions, property card
"RegulatorySubmission.filingDate"). CQ-MF-02, CQ-MF-03, CQ-PF-04, CQ-TM-03. Module regulatory_and_ip. Archetype
InformationArtifact.
"""
type RegulatorySubmission implements Entity & InformationArtifactArchetype
  @node(labels: ["RegulatorySubmission", "InformationArtifact"]) {
  id: ID! @id
  uid: String!
  name: String
  description: String
  mongoResearchRunId: String
  createdAt: DateTime! @timestamp(operations: [CREATE])
  updatedAt: DateTime! @timestamp(operations: [CREATE, UPDATE])
  privacyClass: PrivacyClass
  maturity: NodeMaturity
  schemaVersion: String
  artifactType: String!
  publishedAt: DateTime
  observedAt: DateTime
  contentHash: String
  "Program family the filing belongs to (equals the UNDER_PATHWAY target's pathwayKind; V-W13-04)."
  submissionKind: PathwayKind!
  "Verbatim agency subtype (ORIG-1, SUPPL-6, Traditional, Direct, amendment). Not a filter."
  submissionSubtype: String
  "Verbatim agency number as printed (GRN 000635, K234070). Authoritative identifiers are Identifier records."
  identifier: String
  jurisdiction: String!
  "Date on the submission document as stated by the source (GRN 000635: notice dated 2016-03-08)."
  submittedAt: DateTime
  "Agency receipt date (GRN 000635: 2016-03-09; K234070: 2023-12-22)."
  receivedAt: DateTime
  "Agency filing date; current projection of the latest accepted filing-date assertion (history in assertions)."
  filingDate: DateTime
  "Conditions of use as the submitter proposed them (verbatim). The agency's conditions live on the response."
  conditionsOfUseText: String
  """class: structural; cardinality: exactly_one; catalog: UNDER_PATHWAY"""
  underPathway: [RegulatoryPathway!]! @relationship(type: "UNDER_PATHWAY", direction: OUT)
  """class: structural; cardinality: zero_or_one; catalog: new UNDER_LEGAL_BASIS_VERSION (the regime the filing was made
  under, e.g. GRN 000635 under proposed 21 CFR 170.36)"""
  underLegalBasisVersion: [RegulatoryPathwayVersion!]! @relationship(type: "UNDER_LEGAL_BASIS_VERSION", direction: OUT)
  """class: asserted; cardinality: one_or_more over time; catalog: SUBMITTED_BY (notifier; a consultant filing on behalf
  of a notifier is not the submitter: GRN 000635 was sent by Spherix Consulting on behalf of ChromaDex)"""
  submittedBy: [Organization!]! @relationship(type: "SUBMITTED_BY", direction: OUT, properties: "AssertedEdgeProperties")
  """class: asserted; cardinality: one_or_more; catalog: SUBMISSION_ABOUT (range RegulatorySubjectTarget, per-edge
  members in the union description)"""
  submissionAbout: [RegulatorySubjectTarget!]! @relationship(type: "SUBMISSION_ABOUT", direction: OUT, properties: "AssertedEdgeProperties")
  """class: asserted; cardinality: zero_or_one; catalog: SUPERSEDES_SUBMISSION (resubmission chain, e.g. NDIN 1062
  refers to NDIN 882; GRAS inventory resubmission links)"""
  supersedesSubmission: [RegulatorySubmission!]! @relationship(type: "SUPERSEDES_SUBMISSION", direction: OUT, properties: "AssertedEdgeProperties")
  """class: structural; cardinality: many; catalog: SUBMISSION_HAS_RESPONSE"""
  responses: [RegulatoryResponse!]! @relationship(type: "SUBMISSION_HAS_RESPONSE", direction: OUT)
  """class: asserted (IdentifierLinkProperties); cardinality: many; W00 HAS_IDENTIFIER (scheme FDA_GRN, FDA_NDI,
  FDA_510K, FDA_DEN, FDA_NDA, EU_NOVEL_FOOD_ENTRY ...; scheme registry is W00's)"""
  identifiers: [Identifier!]! @relationship(type: "HAS_IDENTIFIER", direction: OUT, properties: "IdentifierLinkProperties")
}

"""
What the agency answered to a submission (FDA letter, database decision): closed per-pathway responseKind, issue date,
the agency's verbatim conditions of use and its own disclaimer text (GRN 000635: "The agency has not, however, made its
own determination regarding the GRAS status of the subject use of NR."). It is NOT a status: whether a status follows is
a separate record linked by RESULTS_FROM_RESPONSE. Immutable; an agency correction or a later letter is a new response.
A company's restatement is a CHARACTERIZES_REGULATORY_RESPONSE Assertion whose subject is this node (V-335). CQ-MF-02,
CQ-MF-03, CQ-PF-04. Module regulatory_and_ip. Archetype InformationArtifact.
"""
type RegulatoryResponse implements Entity & InformationArtifactArchetype
  @node(labels: ["RegulatoryResponse", "InformationArtifact"]) {
  id: ID! @id
  uid: String!
  name: String
  description: String
  mongoResearchRunId: String
  createdAt: DateTime! @timestamp(operations: [CREATE])
  updatedAt: DateTime! @timestamp(operations: [CREATE, UPDATE])
  privacyClass: PrivacyClass
  maturity: NodeMaturity
  schemaVersion: String
  artifactType: String!
  publishedAt: DateTime
  observedAt: DateTime
  contentHash: String
  responseKind: RegulatoryResponseKind!
  "Agency-stated decision code verbatim (SESE, DENG, 'FDA has no questions'). Not a filter."
  decisionTextVerbatim: String
  "Letter or decision date as stated by the agency (live RegulatoryStatus.decisionDate moves here)."
  issuedAt: DateTime
  jurisdiction: String!
  "Agency's conditions of use, verbatim (null = not captured, V-331)."
  conditionsOfUseText: String
  "Agency's own disclaimer sentences, verbatim, in letter order (null = not captured)."
  agencyDisclaimerText: String
  """class: structural; cardinality: exactly_one; catalog: ISSUED_BY"""
  issuedBy: [RegulatoryAgency!]! @relationship(type: "ISSUED_BY", direction: OUT)
  """class: structural; cardinality: exactly_one (inverse); catalog: SUBMISSION_HAS_RESPONSE"""
  submission: [RegulatorySubmission!]! @relationship(type: "SUBMISSION_HAS_RESPONSE", direction: IN)
  """class: structural; cardinality: many (inverse); catalog: RESULTS_FROM_RESPONSE"""
  resultingStatuses: [RegulatoryStatus!]! @relationship(type: "RESULTS_FROM_RESPONSE", direction: IN)
}

# ---------------------------------------------------------------------------------------------------------------------
# Status and its specializations (versioned states)
# ---------------------------------------------------------------------------------------------------------------------

"""
A jurisdiction-specific regulatory standing of exactly one subject (live name kept, meaning narrowed, round 0005):
closed statusKind, jurisdiction, scope, legal basis. Only statusKind APPROVAL is approval and it must result from an
approving response (V-336); ESTABLISHMENT_REGISTRATION is a status of a Facility only (INV-304, V-323). A marketed
product with no status is NOT approved, and the absence of a status node is NOT_RECORDED, never "not approved" (QS-7).
Validity over time is the STATUS_OF episode; effectiveFrom/effectiveTo are source-stated payload. It is NOT the
submission, NOT the response and NOT a badge on a brand. CQ-MF-02, CQ-AX-23, CQ-PF-03, CQ-MF-06. Module
regulatory_and_ip. Archetype VersionedState.
"""
type RegulatoryStatus implements Entity & VersionedStateArchetype
  @node(labels: ["RegulatoryStatus", "VersionedState"]) {
  id: ID! @id
  uid: String!
  name: String
  description: String
  mongoResearchRunId: String
  createdAt: DateTime! @timestamp(operations: [CREATE])
  updatedAt: DateTime! @timestamp(operations: [CREATE, UPDATE])
  privacyClass: PrivacyClass
  maturity: NodeMaturity
  schemaVersion: String
  stateType: String!
  payloadHash: String!
  "Source-stated start (live effectiveDate)."
  effectiveFrom: DateTime
  "Source-stated end (live expirationOrRenewalDate); null = unknown or not stated, never 'ongoing'."
  effectiveTo: DateTime
  statusKind: RegulatoryStatusKind!
  "Jurisdiction (live jurisdictionCode merged). Required (V-333)."
  jurisdiction: String!
  "Verbatim scope (indication, intended use, food categories, project area). Answers quote it."
  scopeText: String
  "Agency product classification code where stated (510(k) SAF, De Novo QPN)."
  productCode: String
  "Whether a predetermined change control plan was authorized; null = not stated."
  pcccAuthorized: Boolean
  "Citation of the legal basis as stated or normalized (kept for answers; the structural link is UNDER_LEGAL_BASIS_VERSION)."
  legalBasisCitation: String
  "Live statusCode free text, kept verbatim for migration; never a filter (filters use statusKind)."
  statusCodeVerbatim: String
  """class: asserted; cardinality: exactly_one; catalog: STATUS_OF (range RegulatorySubjectTarget)"""
  statusOf: [RegulatorySubjectTarget!]! @relationship(type: "STATUS_OF", direction: OUT, properties: "AssertedEdgeProperties")
  """class: structural; cardinality: zero_or_one; catalog: RESULTS_FROM_RESPONSE (required for APPROVAL, V-336)"""
  resultsFromResponse: [RegulatoryResponse!]! @relationship(type: "RESULTS_FROM_RESPONSE", direction: OUT)
  """class: structural; cardinality: exactly_one; catalog: UNDER_LEGAL_BASIS"""
  underLegalBasis: [RegulatoryPathway!]! @relationship(type: "UNDER_LEGAL_BASIS", direction: OUT)
  """class: structural; cardinality: zero_or_one; catalog: new UNDER_LEGAL_BASIS_VERSION; the version must belong to the
  UNDER_LEGAL_BASIS pathway (V-W13-05) and the status episode may not outlive the version episode (V-334r)"""
  underLegalBasisVersion: [RegulatoryPathwayVersion!]! @relationship(type: "UNDER_LEGAL_BASIS_VERSION", direction: OUT)
  """class: structural; cardinality: exactly_one; catalog: ISSUED_BY (live RegulatoryStatus.issuedBy; RoleMetadata dropped)"""
  issuedBy: [RegulatoryAgency!]! @relationship(type: "ISSUED_BY", direction: OUT)
  """class: derived (read-only legacy); cardinality: many (inverse); live Product.hasRegulatoryStatuses
  (HAS_REGULATORY_STATUS). derivationRule W13-DR-01: Product p HAS_REGULATORY_STATUS s iff an accepted STATUS_OF
  assertion has s as subject and p as object; derivedFromAssertionUids = [that assertion]. Never written for a Facility
  status, never read as approval unless s.statusKind = APPROVAL."""
  legacyHeldBy: [Product!]! @relationship(type: "HAS_REGULATORY_STATUS", direction: IN, properties: "DerivedEdgeProperties") @settable(onCreate: false, onUpdate: false)
}

"""
Orphan designation as a specialization label of RegulatoryStatus (statusKind DESIGNATION, V-321). Designation is not
approval (forbidden [HAS_ORPHAN_DESIGNATION, IS_APPROVED]); the FDA OOPD record for "nicotinamide riboside and
