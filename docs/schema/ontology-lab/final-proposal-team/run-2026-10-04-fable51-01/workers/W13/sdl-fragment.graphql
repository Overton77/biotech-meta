# ---------------------------------------------------------------------------------------------------------------------
# Enums (values frozen at catalog 0.2.0; proposed additions are in seam-requests.yaml, NOT here)
# ---------------------------------------------------------------------------------------------------------------------

"""
Kind of legal standing a RegulatoryStatus represents (catalog conventions.regulatoryStatusKind). Only APPROVAL is
approval (INV-304). CLEARANCE (510(k) substantially equivalent), DE_NOVO_AUTHORIZATION, DESIGNATION (orphan and similar),
ESTABLISHMENT_REGISTRATION (Facility only), NOTIFICATION_ON_FILE (NDI acknowledged without objection, GRAS no
questions) and ENFORCEMENT_DISCRETION (policy, revocable) never project to approval. WITHDRAWN and REVOKED are
end states of an earlier status kind recorded as their own status node, never as an overwrite.
"""
enum RegulatoryStatusKind {
  APPROVAL
  CLEARANCE
  DE_NOVO_AUTHORIZATION
  DESIGNATION
  ESTABLISHMENT_REGISTRATION
  NOTIFICATION_ON_FILE
  ENFORCEMENT_DISCRETION
  WITHDRAWN
  REVOKED
}

"""
What the agency answered (catalog conventions.regulatoryResponseKind). The enum is the union of the per-pathway closed
lists; the value must belong to the list of the submission's pathway kind (V-W13-03): NDI_NOTIFICATION -> NDI_*;
GRAS_NOTICE -> GRAS_*; PREMARKET_NOTIFICATION_510K -> SUBSTANTIALLY_EQUIVALENT | NOT_SUBSTANTIALLY_EQUIVALENT;
DE_NOVO -> DE_NOVO_*; PMA -> PMA_*; NDA, BLA -> APPROVED | COMPLETE_RESPONSE; ORPHAN_DESIGNATION -> ORPHAN_DESIGNATION_*;
FOOD_FACILITY_REGISTRATION, DEVICE_ESTABLISHMENT_REGISTRATION -> REGISTRATION_*. Only APPROVED and PMA_APPROVED are
approving responses (V-336). Company wording ("no objection") is never a response kind; it is a
CHARACTERIZES_REGULATORY_RESPONSE Assertion.
"""
enum RegulatoryResponseKind {
  NDI_ACKNOWLEDGED_WITHOUT_OBJECTION
  NDI_INCOMPLETE
  NDI_OBJECTION
  NDI_OTHER_REGULATORY_ISSUE
  GRAS_NO_QUESTIONS
  GRAS_NO_BASIS
  GRAS_CEASED_AT_NOTIFIER_REQUEST
  SUBSTANTIALLY_EQUIVALENT
  NOT_SUBSTANTIALLY_EQUIVALENT
  DE_NOVO_GRANTED
  DE_NOVO_DECLINED
  PMA_APPROVED
  PMA_DENIED
  PMA_APPROVABLE
  PMA_NOT_APPROVABLE
  APPROVED
  COMPLETE_RESPONSE
  ORPHAN_DESIGNATION_GRANTED
  ORPHAN_DESIGNATION_DENIED
  ORPHAN_DESIGNATION_REVOKED
  REGISTRATION_ACTIVE
  REGISTRATION_CANCELLED
}

"""
Kind of regulatory program a RegulatoryPathway is, and the family a RegulatorySubmission is filed under (values from
round 0005 and validators V-320b, V-331). Jurisdiction is NOT encoded in the value: it is the pathway's
`jurisdiction`. Non-US program kinds (EU/GB novel food) are proposed in W13-SR-03 and are not values yet.
"""
enum PathwayKind {
  NDI_NOTIFICATION
  GRAS_NOTICE
  PREMARKET_NOTIFICATION_510K
  DE_NOVO
  PMA
  NDA
  BLA
  ORPHAN_DESIGNATION
  FOOD_FACILITY_REGISTRATION
  DEVICE_ESTABLISHMENT_REGISTRATION
  COMPOUNDING_503B_BULKS_POLICY
  LDT_POLICY
}

# ---------------------------------------------------------------------------------------------------------------------
# Union
# ---------------------------------------------------------------------------------------------------------------------

"""
What a regulatory submission, status, designation or approval is about. Per-edge allowed members (V-W13-01):
STATUS_OF and SUBMISSION_ABOUT -> Product | ProductVariant | IngredientMaterial | AlgorithmVersion | AssayVersion |
Facility | MaterialMixture; a status with statusKind ESTABLISHMENT_REGISTRATION -> Facility only (INV-304, V-323), and a
Facility carries no other status kind; OrphanDesignation / DrugApproval -> IngredientMaterial | MaterialMixture |
StudyIntervention | Product. AssayVersion is added for laboratory-developed tests (LDT failing case, W13-D06);
MaterialMixture for a designated combination such as "nicotinamide riboside and pterostilbene" (FDA OOPD record,
W13-D07). A subject is never a ConsumerBrand, an Organization or a display name.
"""
union RegulatorySubjectTarget = Product | ProductVariant | IngredientMaterial | AlgorithmVersion | AssayVersion | Facility | MaterialMixture | StudyIntervention

# ---------------------------------------------------------------------------------------------------------------------
# Agency, pathway, legal-basis version, step
# ---------------------------------------------------------------------------------------------------------------------

"""
A public authority that runs regulatory programs and issues responses and statuses (FDA, European Commission, UK Food
Standards Agency). It is an Organization specialization, so one agency has one organization identity (uid token `org`,
like LegalEntity; W13-SR-02). It is NOT a jurisdiction: the agency's home jurisdiction is a property, and each record it
issues carries its own jurisdiction. CQ-MF-02, CQ-AX-23. Module regulatory_and_ip. Archetype Entity.
"""
type RegulatoryAgency implements Entity & EntityArchetype
  @node(labels: ["RegulatoryAgency", "Organization", "Entity"]) {
  id: ID! @id
  uid: String!
  name: String
  description: String
  mongoResearchRunId: String
  createdAt: DateTime! @timestamp(operations: [CREATE])
  updatedAt: DateTime! @timestamp(operations: [CREATE, UPDATE])
  privacyClass: PrivacyClass
  maturity: NodeMaturity
  schemaVersion: String
  entityType: String!
  "Agency code as used by the agency or by BellLabs normalization (FDA, EC, FSA). Not identity."
  agencyCode: String
  "Home jurisdiction code (W13-SR-01 convention), e.g. US, EU, GB. Records it issues carry their own jurisdiction."
  jurisdiction: String
  """class: structural; cardinality: many; catalog: OVERSEES (live RegulatoryAgency.overseesPathways; RoleMetadata
  replaced by StructuralEdgeProperties because the live role fields carry no meaning on this edge)"""
  overseesPathways: [RegulatoryPathway!]! @relationship(type: "OVERSEES", direction: OUT, properties: "StructuralEdgeProperties")
}

"""
A regulatory program of one jurisdiction (FDA NDI notification, FDA GRAS notification, FDA 510(k), EU novel food
authorisation once W13-SR-03 is ruled). Stable identity across legal-basis changes; the legal basis in force over time
is carried by RegulatoryPathwayVersion states attached through HAS_PATHWAY_VERSION episodes (decision W13-D02, closes
OPEN-QUESTIONS Priority 1 diagnostics item 4 / OQ-L3-07). It is NOT an event and NOT a status. `legalBasisCitation`,
`effectiveFrom` and `effectiveTo` on this type are read-only current projections of the version episodes, kept for
the catalog and live field names. CQ-MF-02, CQ-MF-C02, CQ-TM-03. Module regulatory_and_ip. Archetype Entity.
"""
type RegulatoryPathway implements Entity & EntityArchetype
  @node(labels: ["RegulatoryPathway", "Entity"]) {
  id: ID! @id
  uid: String!
  name: String
  description: String
  mongoResearchRunId: String
  createdAt: DateTime! @timestamp(operations: [CREATE])
  updatedAt: DateTime! @timestamp(operations: [CREATE, UPDATE])
  privacyClass: PrivacyClass
  maturity: NodeMaturity
  schemaVersion: String
  entityType: String!
  "Program kind (closed). Live pathwayKind was free text."
  pathwayKind: PathwayKind!
  "Jurisdiction of the program (W13-SR-01 convention). Live jurisdictionCode is merged here."
  jurisdiction: String!
  "Verbatim live submissionCategory text (kept; not a filter)."
  submissionCategory: String
  "Derived (read-only): legalBasisCitation of the version whose current episode covers now; null when none or unknown."
  legalBasisCitation: String @settable(onCreate: false, onUpdate: false)
  "Derived (read-only): earliest validFrom over current version episodes."
  effectiveFrom: DateTime @settable(onCreate: false, onUpdate: false)
  "Derived (read-only): validTo of the latest current version episode when every episode is closed; null = unknown or open."
  effectiveTo: DateTime @settable(onCreate: false, onUpdate: false)
  """class: structural (bitemporal_attachment profile); cardinality: many over time, EXCLUSIVE per pathway in valid and
  recorded time (W13-SR-05); catalog: new HAS_PATHWAY_VERSION. One edge per recorded-time episode; a vacatur or repeal
  learned later closes the episode (recordedTo) and opens a new one with validTo (SUPERSEDES VALIDITY_BOUNDED on the
  authorizing assertion)."""
  versions: [RegulatoryPathwayVersion!]! @relationship(type: "HAS_PATHWAY_VERSION", direction: OUT, properties: "StateEpisodeProperties")
  """class: structural; cardinality: many; catalog: HAS_REGULATORY_STEP (template steps, ordered by orderIndex)"""
  hasSteps: [RegulatoryStep!]! @relationship(type: "HAS_REGULATORY_STEP", direction: OUT, properties: "StructuralEdgeProperties")
  """class: structural; cardinality: many; catalog: OVERSEES (inverse view)"""
  overseenBy: [RegulatoryAgency!]! @relationship(type: "OVERSEES", direction: IN, properties: "StructuralEdgeProperties")
  """class: derived (read-only legacy); cardinality: many; live Product.followsRegulatoryPathways (FOLLOWS_PATHWAY).
  derivationRule W13-DR-02: Product p FOLLOWS_PATHWAY pathway w iff an accepted SUBMISSION_ABOUT assertion has a
  submission UNDER_PATHWAY w as subject and p (or a variant of p) as object; derivedFromAssertionUids = those assertions.
  Never evidence of a favourable response or of a status."""
  legacyFollowedBy: [Product!]! @relationship(type: "FOLLOWS_PATHWAY", direction: IN, properties: "DerivedEdgeProperties") @settable(onCreate: false, onUpdate: false)
}

"""
One legal-basis regime of a RegulatoryPathway: the instrument(s) under which the program operated over an interval
(e.g. FDA LDT oversight under 21 CFR 809.3(a) as amended by 89 FR 37286, legally effective 2024-07-05 until the
2025-03-31 vacatur; GRAS notification under proposed 21 CFR 170.36 (62 FR 18938) until the 2016-10-17 effective date of
21 CFR part 170 subpart E). Payload is immutable (payloadHash); when the regime held is carried by the HAS_PATHWAY_VERSION
episode (valid and recorded time), so a vacatur learned late never rewrites what was known before. Two clocks are kept
apart: legal effect (episode valid time; payload effectiveFrom/effectiveTo as stated by the instrument) and codified text
(codifiedTextFrom/codifiedTextTo, e.g. the CFR text reverted only on 2025-09-19). It is NOT a status of any product.
CQ-MF-C02, CQ-MF-02, CQ-TM-03. Module regulatory_and_ip. Archetype VersionedState. NEW (W13-D02; token W13-SR-04).
"""
type RegulatoryPathwayVersion implements Entity & VersionedStateArchetype
  @node(labels: ["RegulatoryPathwayVersion", "VersionedState"]) {
  id: ID! @id
  uid: String!
  name: String
  description: String
  mongoResearchRunId: String
  createdAt: DateTime! @timestamp(operations: [CREATE])
  updatedAt: DateTime! @timestamp(operations: [CREATE, UPDATE])
  privacyClass: PrivacyClass
  maturity: NodeMaturity
  schemaVersion: String
  stateType: String!
  payloadHash: String!
  "Start of legal effect as stated by the instrument (e.g. 'This rule is effective July 5, 2024'). Payload, not query validity."
  effectiveFrom: DateTime
  "End of legal effect only when the instrument itself states it (sunset). A vacatur or repeal ends the episode instead."
  effectiveTo: DateTime
  "Short label, e.g. 'LDT rule 2024 (vacated)'. Presentation only."
  versionLabel: String
  "Primary legal basis citation, e.g. '21 CFR 809.3(a) as amended by 89 FR 37286'."
  legalBasisCitation: String!
  "Every instrument that opens or closes this regime: FR documents, court judgments, policy pages (verbatim citations)."
  instrumentCitations: [String!]
  "When the codified text matching this regime took effect (may differ from legal effect)."
  codifiedTextFrom: DateTime
  "When the codified text was removed or changed (e.g. 2025-09-19 for the LDT reversion)."
  codifiedTextTo: DateTime
  jurisdiction: String!
  """class: structural; cardinality: exactly_one (inverse); catalog: new HAS_PATHWAY_VERSION"""
  pathway: [RegulatoryPathway!]! @relationship(type: "HAS_PATHWAY_VERSION", direction: IN, properties: "StateEpisodeProperties")
}

"""
A template step of a pathway definition (live type kept): filing, 75-day wait, response, classification order. It is
NOT an event; dated events are RegulatorySubmission and RegulatoryResponse. CQ-MF-02 (explanation only). Module
