  targetOwner: W13
  request: "(a) Confirm that Treatment is NOT added to STATUS_OF / DESIGNATION_FOR / APPROVAL_FOR ranges (concepts reach regulatory states only through their Products). (b) RegulatoryStatusKind cannot express 'withdrawn or revoked, source does not distinguish' (OOPD 465514 'Designated/Designation Withdrawn or Revoked'): add a value or a documented null-plus-scopeText convention. (c) Baseline V-333 counts only STATUS_OF although DESIGNATION_FOR and APPROVAL_FOR are catalog aliases: count aliases or require STATUS_OF. (d) OOPD 'Designated/Approved' is two facts (designation state + approval states) and must be split at ingestion. (e) Register forbidden implication [DESIGNATION_SCOPE, APPROVED_INDICATION] (exa-cel designated 'Treatment of beta-thalassemia'; approved for TDT, age-bounded)."
  cq: [CQ-MF-02, CQ-AX-23]
  failingCase: "edaravone/ALS: Treeway designation withdrawn or revoked, not approved; RADICAVA NDA 209176 approved (search extract). A concept-level status would merge two sponsors' facts. Baseline V-333 reports hu:reg-status:us-oopd-465514-treeway-designation-ended (statusKind null)."
  proposedRuling: "(a) accept; (b) add statusKind DESIGNATION_ENDED_UNSPECIFIED or allow null with scopeText; (c) count aliases; (d)(e) accept."
