"""
A curated media work-object (image, video, audio, figure, chart, diagram, 3D model) that BellLabs references or
holds, independent of any one byte rendition. Byte facts (format, size, dimensions, hashes, storage) live on its
MediaVariant renditions; exactly one ORIGINAL variant exists when bytes are held, and `contentHash` repeats that
variant's raw-byte hash (V-611). It is NOT a Source or SourceSnapshot (the evidence capture of a retrieval
endpoint; the two share bytes only through equal raw-byte hashes and DERIVED_FROM_SOURCE), NOT a claim that what
it shows is true, and NOT permission to display it (rights are MediaRightsRecord states; permission is a
PolicyVersion decision through AUTHORIZED_BY). Depiction and explanation links are assertions, never causal proof;
EVIDENCES is a derived shortcut that exists only when an Assertion is SUPPORTED_BY an IMAGE_REGION locator on an
original captured rendition. CQs: CQ-MD-C01, CQ-MD-C02, CQ-MD-C03, CQ-MD-C04, CQ-MD-C05, CQ-MD-C06, CQ-PV-01,
CQ-PV-06. Module: media. Archetype: InformationArtifact.
"""
type MediaAsset implements Entity & InformationArtifactArchetype & SearchIndexable
  @node(labels: ["MediaAsset", "InformationArtifact"])
  @fulltext(indexes: [{indexName: "MediaAssetSearch", fields: ["name", "description", "title", "altText", "caption", "transcriptText", "ocrText", "searchText"], queryName: "searchMediaAssets"}]) {
  id: ID! @id
  "hu:media-asset:<opaque>; token proposed in W22-SR-01"
  uid: String!
  name: String
  description: String
  mongoResearchRunId: String
  createdAt: DateTime! @timestamp(operations: [CREATE])
  updatedAt: DateTime! @timestamp(operations: [CREATE, UPDATE])
  privacyClass: PrivacyClass
  maturity: NodeMaturity
  schemaVersion: String
  "Always 'MEDIA_ASSET'."
  artifactType: String!
  "Publication instant stated by the publishing source (live sourcePublishedAt). Null = not stated."
  publishedAt: DateTime
  publishedAtPrecision: TimePrecision
  "Instant the asset is known to have been displayed at its source (archive capture date for late sources)."
  observedAt: DateTime
  "sha256:<hex> over the raw bytes of the ORIGINAL variant (live checksumSha256). Never a publisher-stated checksum."
  contentHash: String
  contentHashBasis: ContentHashBasis
  searchText: String
  searchFields: [String!]
  embeddingModel: String
  embeddingDimensions: Int
  "Embedding of caption/alt/OCR text; computed outside the API. Vector index only if Fable accepts 07-operations.md R-3."
  searchEmbedding: [Float!]
  assetType: MediaAssetType!
  "Purpose declared by the creator or curator. Never implies a link role; EVIDENCE here never implies EVIDENCES."
  mediaPurpose: MediaPurpose
  "How the ORIGINAL bytes came to exist (captured by a camera or instrument, generated by a model, rendered...)."
  generationMode: MediaGenerationMode
  "Creator- or publisher-disclosed synthetic content. Null = not disclosed (unknown), never false."
  isSynthetic: Boolean
  "The ORIGINAL bytes are an edited or composited version of an earlier capture, as disclosed or detected. Null = unknown."
  isEdited: Boolean
  "Verbatim disclosure of modifications (required by e.g. CC BY 4.0 'indicate if changes were made'); null = none found."
  editDisclosureText: String
  "Creation or capture instant stated by the creator or embedded metadata (e.g. Commons DateTimeOriginal), not our retrieval."
  capturedAt: DateTime
  capturedAtPrecision: TimePrecision
  "Presentation URL of the asset's landing page; never identity."
  canonicalUrl: String
  title: String
  "Alt text as published by the source; presentation and search only (depiction is asserted through DEPICTS)."
  altText: String
  "Caption as published; a caption used as support is cited through a SourceLocator, not through this field."
  caption: String
  "Derived search text (transcription); never a locator."
  transcriptText: String
  "Derived search text (OCR); never a locator."
  ocrText: String
  """class: structural; cardinality: one_or_more when bytes are held (exactly one ORIGINAL); catalog: HAS_MEDIA_VARIANT (CL-014 rename of media HAS_VARIANT)"""
  variants: [MediaVariant!]! @relationship(type: "HAS_MEDIA_VARIANT", direction: OUT)
  """class: structural; cardinality: many; catalog: DERIVED_FROM_SOURCE (retargeted from retired MediaSource to the W00 SourceLocator: WHOLE_SNAPSHOT for a standalone file, PDF_PAGE for a figure, IMAGE_REGION for a crop of a page capture, MEDIA_TIME for a frame)"""
  sourceLocators: [SourceLocator!]! @relationship(type: "DERIVED_FROM_SOURCE", direction: OUT, properties: "MediaSourceProperties")
  """class: structural; cardinality: many; catalog: PART_OF_MEDIA (inverse; orderIndex orders panels)"""
  figurePanels: [FigurePanel!]! @relationship(type: "PART_OF_MEDIA", direction: IN, properties: "StructuralEdgeProperties")
  """class: asserted; cardinality: many; catalog: DEPICTS (projection of one Assertion per episode; depiction is not source support)"""
  depicts: [MediaSubjectTarget!]! @relationship(type: "DEPICTS", direction: OUT, properties: "MediaLinkProperties")
  """class: asserted; cardinality: many; catalog: EXPLAINS (aboutness/topic of an explanatory asset; never causal proof, never EVIDENCES)"""
  explains: [MediaSubjectTarget!]! @relationship(type: "EXPLAINS", direction: OUT, properties: "MediaLinkProperties")
  """class: asserted; cardinality: many; catalog: VISUALIZES (a chart or figure renders a proposition or result)"""
  visualizes: [MediaVisualizableRelationshipTarget!]! @relationship(type: "VISUALIZES", direction: OUT, properties: "MediaLinkProperties")
  """class: derived (rule MEDIA-EV-1, regenerable, never the only history); cardinality: many; catalog: EVIDENCES. Written only by the derivation job from Assertion-SUPPORTED_BY->SourceLocator{IMAGE_REGION}-LOCATES_REGION->MediaAnnotation<-HAS_ANNOTATION-ORIGINAL MediaVariant"""
  evidences: [MediaVisualizableRelationshipTarget!]! @relationship(type: "EVIDENCES", direction: OUT, properties: "DerivedEdgeProperties") @settable(onCreate: false, onUpdate: false)
  """class: structural; cardinality: zero_or_one; catalog: VISUALIZES_TRAVERSAL (this asset is a rendering of a GraphView; rendering parameters live on the generating Activity)"""
  visualizesTraversal: [GraphView!]! @relationship(type: "VISUALIZES_TRAVERSAL", direction: OUT, properties: "StructuralEdgeProperties")
  """class: asserted; cardinality: many (one per stated rights offer or terms version; dual licences are two records); catalog: HAS_RIGHTS_RECORD (candidate CQ-MD-C03). Absence of any record means rights NOT CHECKED, never permission"""
  rightsRecords: [MediaRightsRecord!]! @relationship(type: "HAS_RIGHTS_RECORD", direction: OUT, properties: "AssertedEdgeProperties")
  """class: structural; cardinality: many; catalog: ASSESSES_MEDIA (inverse)"""
  suitabilityAssessments: [MediaSuitabilityAssessment!]! @relationship(type: "ASSESSES_MEDIA", direction: IN)
  """class: structural; cardinality: zero_or_one; catalog: WAS_GENERATED_BY (W00 relationship; domain extension requested W22-SR-03). Creation, extraction or generation lineage"""
  generatedBy: [Activity!]! @relationship(type: "WAS_GENERATED_BY", direction: OUT)
}

"""
One byte rendition of a MediaAsset: the ORIGINAL as obtained, a publisher-provided rendition (a CDN width
variant), or a BellLabs derivative (crop, thumbnail, annotation overlay, transcode). Identity of the bytes is the
raw-byte `contentHash` (sha256); a rendition that equals a SourceSnapshot's bytes shares that snapshot's hash, which
is the only link between asset bytes and evidence captures. `perceptualHash` is a similarity feature and never
establishes byte identity, asset identity or rights. A publisher-stated checksum (e.g. Wikimedia Commons SHA-1) is
kept in `statedChecksum`, never in `contentHash`. Every non-ORIGINAL variant has a generating Activity (CAPTURE for
publisher renditions, MEDIA_TRANSFORMATION that USED the parent variant and, for crops, the region annotation;
V-607, V-614). CQs: CQ-MD-C04, CQ-MD-C06, CQ-PV-02, CQ-PV-03. Module: media. Archetype: InformationArtifact.
"""
type MediaVariant implements Entity & InformationArtifactArchetype
  @node(labels: ["MediaVariant", "InformationArtifact"]) {
  id: ID! @id
  "hu:media-variant:<opaque>; token proposed in W22-SR-01"
  uid: String!
  name: String
  description: String
  mongoResearchRunId: String
  createdAt: DateTime! @timestamp(operations: [CREATE])
  updatedAt: DateTime! @timestamp(operations: [CREATE, UPDATE])
  privacyClass: PrivacyClass
  maturity: NodeMaturity
  schemaVersion: String
  "Always 'MEDIA_VARIANT'."
  artifactType: String!
  publishedAt: DateTime
  observedAt: DateTime
  "sha256:<hex> over the raw bytes of this rendition (D-016); SYNTHETIC_FIXTURE basis in fixtures."
  contentHash: String
  contentHashBasis: ContentHashBasis
  variantKind: MediaVariantKind!
  mediaFormat: MediaFormat
  mimeType: String
  "BellLabs object-store location of the bytes; internal operational field."
  storageUri: String
  "Delivery URL of this rendition (e.g. a CDN width variant); never identity."
  url: String
  fileSizeBytes: Int
  widthPx: Int
  heightPx: Int
  durationSeconds: Float
  frameRate: Float
  colorSpace: String
  "Perceptual hash value; meaningful only with its algorithm; a match is a near-duplicate hint, not identity."
  perceptualHash: String
  "Algorithm and parameters of perceptualHash (e.g. 'pHash-DCT-64'); required when perceptualHash is set."
  perceptualHashAlgorithm: String
  "Checksum stated by the hosting service, recorded verbatim (e.g. Commons imageinfo sha1); never our contentHash."
  statedChecksum: String
  "Algorithm of statedChecksum as stated (e.g. 'SHA-1')."
  statedChecksumAlgorithm: String
  """class: structural; cardinality: exactly_one; catalog: HAS_MEDIA_VARIANT (inverse)"""
  asset: [MediaAsset!]! @relationship(type: "HAS_MEDIA_VARIANT", direction: IN)
  """class: structural; cardinality: many; catalog: HAS_ANNOTATION (moved from MediaAsset: coordinates are defined only on one rendition's raster)"""
  annotations: [MediaAnnotation!]! @relationship(type: "HAS_ANNOTATION", direction: OUT)
  """class: structural; cardinality: zero_or_one (exactly_one for non-ORIGINAL); catalog: WAS_GENERATED_BY (W00; W22-SR-03)"""
  generatedBy: [Activity!]! @relationship(type: "WAS_GENERATED_BY", direction: OUT)
}

"""
An intentional, stable selection of a region, time range, frame range or 3D sub-object on exactly one MediaVariant,
in the coordinate frame named by `normalizationVersion` (IMG-PX1 proposed in W22-SR-05). It may back a W00
`SourceLocator{selectorKind: IMAGE_REGION}` through `mediaAnnotationUid` plus the structural LOCATES_REGION edge
(D-010); it never replaces the locator or the snapshot, and a locator may use it as support only when the
annotated variant's bytes equal the locator's snapshot bytes (V-602) and the variant is an ORIGINAL capture
(V-606). It is NOT a Chunk and NOT a claim about what the region shows (that is ANNOTATES_SUBJECT, asserted).
CQs: CQ-PV-02, CQ-MD-C04, CQ-MD-C05. Module: media. Archetype: InformationArtifact.
"""
type MediaAnnotation implements Entity & InformationArtifactArchetype
  @node(labels: ["MediaAnnotation", "InformationArtifact"]) {
  id: ID! @id
  "hu:media-annotation:<opaque>; token proposed in W22-SR-01"
  uid: String!
  name: String
  description: String
  mongoResearchRunId: String
  createdAt: DateTime! @timestamp(operations: [CREATE])
  updatedAt: DateTime! @timestamp(operations: [CREATE, UPDATE])
  privacyClass: PrivacyClass
  maturity: NodeMaturity
  schemaVersion: String
  "Always 'MEDIA_ANNOTATION'."
  artifactType: String!
  publishedAt: DateTime
  observedAt: DateTime
  "sha256 over the canonical serialization of the selection (type, normalizationVersion, coordinates); optional."
  contentHash: String
  annotationType: AnnotationType!
  label: String
  "Text read inside the region (OCR or manual); derived, never a quote anchor by itself."
  text: String
  "Coordinate frame of x/y/width/height/polygon (e.g. 'IMG-PX1'); required when the annotation backs a locator."
  normalizationVersion: String
  x: Float
  y: Float
  width: Float
  height: Float
  polygonJson: String
  maskUri: String
  startTimeSeconds: Float
  endTimeSeconds: Float
  frameStart: Int
  frameEnd: Int
  meshObjectName: String
  vertexGroupName: String
  volumeRegionJson: String
  """class: structural; cardinality: exactly_one; catalog: HAS_ANNOTATION (inverse)"""
  variant: [MediaVariant!]! @relationship(type: "HAS_ANNOTATION", direction: IN)
  """class: asserted; cardinality: many; catalog: ANNOTATES_SUBJECT (what the region shows, as asserted)"""
  annotatesSubjects: [MediaSubjectTarget!]! @relationship(type: "ANNOTATES_SUBJECT", direction: OUT, properties: "MediaLinkProperties")
  """class: structural; cardinality: many; catalog: LOCATES_REGION (W00 defines SourceLocator -[:LOCATES_REGION]-> MediaAnnotation; this is the inverse field, D-010)"""
  locatedBy: [SourceLocator!]! @relationship(type: "LOCATES_REGION", direction: IN)
  """class: structural; cardinality: zero_or_one; catalog: WAS_GENERATED_BY (W00; W22-SR-03)"""
  generatedBy: [Activity!]! @relationship(type: "WAS_GENERATED_BY", direction: OUT)
}

