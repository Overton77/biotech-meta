  "Whether the asset shows the subject it is linked to (right product variant, right pathway)."
  DEPICTION_ACCURACY
  "Whether the asset is what it purports to be (unaltered capture, disclosed generation or editing)."
  AUTHENTICITY
  "Accuracy of text or regions extracted from the asset (OCR of a Supplement Facts panel)."
  EXTRACTION_ACCURACY
}

"Verdict of one suitability dimension. UNKNOWN and NOT_ASSESSED stay distinct (contract A7)."
enum SuitabilityVerdict {
  SUITABLE
  MARGINAL
  UNSUITABLE
  UNKNOWN
  NOT_ASSESSED
}

"Status of a stated rights record (new). Only a PolicyVersion decides permission; NO_STATEMENT_FOUND and AMBIGUOUS never permit."
enum MediaRightsStatus {
  "A licence offer to the public (Creative Commons BY, BY-SA ...)."
  OPEN_LICENSE
  "A public-domain dedication or mark stated by the source (CC0, PDM)."
  PUBLIC_DOMAIN
  "An explicit reservation of rights ('All rights reserved')."
  ALL_RIGHTS_RESERVED
  "Terms that allow only limited uses (e.g. personal and non-commercial viewing)."
  RESTRICTED_TERMS
  "A permission granted to BellLabs by the rights holder (a recorded grant)."
  PERMISSION_GRANTED
  "BellLabs or its contractor holds the rights (own capture or own generation), as recorded by BellLabs."
  HELD_BY_OPERATOR
  "The checked sources state nothing about rights (checked, none found). Not permission."
  NO_STATEMENT_FOUND
  "Statements conflict or their scope over this asset is unclear. Not permission."
  AMBIGUOUS
}

"Kind of rights statement (new); ODRL 2.2 alignment noted in the model card (Offer, Agreement, Set), not adopted."
