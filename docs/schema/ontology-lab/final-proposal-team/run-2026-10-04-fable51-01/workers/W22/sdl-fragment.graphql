enum RightsStatementScope {
  "This asset specifically (a Commons file page licence)."
  THIS_ASSET
  "A named class of content on a site (Reactome 'Pathway Illustrations')."
  CONTENT_CLASS_ON_SITE
  "All content of a site (site terms of service)."
  ENTIRE_SITE
  "The containing work (an article copyright notice that covers its figures unless excepted)."
