"""
A method-versioned BellLabs assessment of ONE suitability dimension of one media asset (optionally inspected on one
rendition) for one intended display role and optional subject: display quality, depiction accuracy, authenticity,
or extraction accuracy. Each dimension is its own node; dimensions are never averaged into one score. It replaces
the live unsourced `qualityScore`/`authenticityScore`, which migrate with methodVersion 'legacy-unsourced' and are
ignored by selection queries. It is NOT an evidence verdict, NOT a truth or support adjudication, and NOT rights
clearance. Immutable; a re-assessment is a new node linked by SUPERSEDES. CQs: CQ-MD-C01, CQ-MD-C02.
Module: media. Archetype: EvidenceAssessment. Maturity: candidate promoted by failing case mp1/mp2 (unsourced 0.97
score outranking a method-versioned SUITABLE assessment).
"""
type MediaSuitabilityAssessment implements Entity & EvidenceAssessmentArchetype
  @node(labels: ["MediaSuitabilityAssessment", "EvidenceAssessment"]) {
  id: ID! @id
  "hu:media-assessment:<opaque>; token proposed in W22-SR-01"
  uid: String!
  name: String
  description: String
  mongoResearchRunId: String
  createdAt: DateTime! @timestamp(operations: [CREATE])
  updatedAt: DateTime! @timestamp(operations: [CREATE, UPDATE])
  privacyClass: PrivacyClass
  maturity: NodeMaturity
  schemaVersion: String
  "Always 'MEDIA_SUITABILITY'."
  assessmentType: String!
  "Method and criteria version (e.g. 'bl-media-display-quality-v1'); 'legacy-unsourced' marks migrated live scores."
  methodVersion: String!
  status: AssessmentStatus!
  recordedAt: DateTime!
  recordedTo: DateTime
  summary: String
  "Score on the method's scale; meaningful only with methodVersion and scoreScale. Not a probability of truth."
  overallScore: Float
  "Deprecated (contract A4); not written by new assessments."
  confidence: Float
  dimension: MediaSuitabilityDimension!
  verdict: SuitabilityVerdict!
  "Display role the suitability is judged for (PRIMARY_IMAGE, THUMBNAIL, MECHANISM_DIAGRAM...)."
  intendedRole: MediaRelationRole
  "Scale of overallScore, e.g. '0..1 higher-better'."
  scoreScale: String
  "Verbatim criteria applied (e.g. 'min short edge 800 px; no watermark; legible labels at 400 px')."
  criteriaSummary: String
  """class: structural; cardinality: exactly_one; catalog: ASSESSES_MEDIA"""
  assessesMedia: [MediaAsset!]! @relationship(type: "ASSESSES_MEDIA", direction: OUT)
  """class: structural; cardinality: zero_or_one; catalog: ASSESSED_ON_VARIANT (new; the rendition inspected; display quality differs between an 1946 px and a 416 px rendition)"""
  assessedOnVariant: [MediaVariant!]! @relationship(type: "ASSESSED_ON_VARIANT", direction: OUT)
  """class: structural; cardinality: zero_or_one; catalog: ASSESSES_SUITABILITY_FOR (new; the subject the role is judged for)"""
  forSubject: [MediaSubjectTarget!]! @relationship(type: "ASSESSES_SUITABILITY_FOR", direction: OUT)
  """class: structural; cardinality: exactly_one for non-legacy assessments (V-609); catalog: WAS_GENERATED_BY (W00)"""
