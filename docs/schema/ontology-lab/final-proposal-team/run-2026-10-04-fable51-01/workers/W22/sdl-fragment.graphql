enum MediaCaptureRelation {
  "ORIGINAL variant bytes equal the snapshot bytes (same raw-byte hash)."
  SAME_BYTES_AS_SNAPSHOT
  "Bytes cut from a region or page of a larger capture (figure from a PDF page, crop of a page screenshot)."
  EXTRACTED_FROM_REGION
  "A frame or clip taken from a MEDIA_TIME range of a captured rendition."
  FRAME_FROM_TIME_RANGE
  "Rendered by BellLabs from data or text found at the locator (e.g. a diagram drawn from a pathway record)."
  RENDERED_FROM_SOURCE_DATA
  "Transcoded or re-encoded from the captured bytes."
  TRANSCODED_FROM_SNAPSHOT
}

"Separately assessed suitability dimensions (new; candidate type MediaSuitabilityAssessment)."
enum MediaSuitabilityDimension {
  "Technical fitness for a display role: resolution, legibility, artefacts, watermarks, cropping."
