}

"""
The rights terms that a named source states for a media asset, as one immutable state: a licence offer
(CC BY-SA 3.0 on a Wikimedia Commons file; CC0 on a BioImage Archive study), a copyright notice ('Copyright 2016
Elsevier Inc. All rights reserved.'), site terms ('personal and non-commercial purposes'), a content-class licence
(Reactome 'Pathway Illustrations' CC BY 4.0 versus data CC0), or a permission grant. Each offer or terms version is
its own record (a dual-licensed file has two). Attached to the asset by HAS_RIGHTS_RECORD, an asserted edge whose
Assertion is SUPPORTED_BY a locator on the captured licence/terms text. Booleans are null when the statement is
silent. It is NOT permission for any BellLabs use: permission is a PolicyVersion decision (W23) recorded through
Activity -AUTHORIZED_BY {useKind}-> PolicyVersion; public availability, absence of a record, NO_STATEMENT_FOUND and
AMBIGUOUS never permit. No legal conclusion (fair use, copyrightability of facts) is recorded here. CQs: CQ-MD-C03,
CQ-PV-06, CQ-PV-01 (state 5 input). Module: media (rights seam W23). Archetype: VersionedState. Maturity: candidate
promoted by failing cases mp4 (one license string cannot hold the Commons dual offer, the Reactome content-class
split, or 'not checked' versus 'checked, none found').
"""
type MediaRightsRecord implements Entity & VersionedStateArchetype
  @node(labels: ["MediaRightsRecord", "VersionedState"]) {
  id: ID! @id
  "hu:media-rights:<opaque>; token proposed in W22-SR-01"
  uid: String!
  name: String
  description: String
  mongoResearchRunId: String
  createdAt: DateTime! @timestamp(operations: [CREATE])
  updatedAt: DateTime! @timestamp(operations: [CREATE, UPDATE])
  privacyClass: PrivacyClass
  maturity: NodeMaturity
  schemaVersion: String
  "Always 'MEDIA_RIGHTS'."
  stateType: String!
  "sha256:<hex> over the canonical payload (status, kind, scope, licence, holder, duties, restrictions)."
  payloadHash: String!
  "Start of the terms as stated (e.g. 'Last updated: November 17, 2022'); null = not stated."
  effectiveFrom: DateTime
  effectiveTo: DateTime
  rightsStatus: MediaRightsStatus!
  statementKind: RightsStatementKind!
  statementScope: RightsStatementScope!
  "Licence short name as stated, e.g. 'CC BY-SA 3.0'."
  licenseName: String
  "Canonical licence URL as stated, e.g. 'https://creativecommons.org/licenses/by-sa/3.0'."
  licenseUri: String
  "Rights holder as stated (e.g. 'Elsevier Inc'); identity resolution to an Organization is a separate hypothesis."
  rightsHolderText: String
  "Attribution string the statement requires or supplies (e.g. 'Lybbar12')."
  attributionText: String
  attributionRequired: Boolean
  shareAlikeRequired: Boolean
  "The statement requires modifications to be indicated (CC BY 4.0; Reactome 'modifications ... clearly indicated')."
  modificationIndicationRequired: Boolean
  "Null = the statement is silent; never defaulted to true."
  commercialUseAllowed: Boolean
  derivativesAllowed: Boolean
  "Verbatim restriction text (e.g. 'solely for your personal and non-commercial purposes')."
  restrictionsText: String
  """class: asserted; cardinality: many; catalog: HAS_RIGHTS_RECORD (inverse)"""
  assets: [MediaAsset!]! @relationship(type: "HAS_RIGHTS_RECORD", direction: IN, properties: "AssertedEdgeProperties")
}

"""
asserted_edge profile (contract B4 AssertedEdgeProperties, every field kept) specialised for media links
(DEPICTS, EXPLAINS, VISUALIZES, ANNOTATES_SUBJECT). Successor of live MediaLinkMetadata: `confidence`,
`isCanonical`, `isRepresentative` and `notes` are retired. `role` is the depiction/explanation role; `isPrimary`
is the asserting source's own designation (e.g. og:image, first carousel position), not BellLabs' display choice,
which is derived by the selection query from MediaSuitabilityAssessment and rights; `salience` is a ranking
feature computed by `salienceMethodVersion`, never an evidence verdict.
"""
type MediaLinkProperties @relationshipProperties {
  relationshipUid: String!
  assertionUid: String!
  validFrom: DateTime
  validTo: DateTime
  validFromPrecision: TimePrecision
  validToPrecision: TimePrecision
  validFromBasis: ValidTimeBasis!
  validToBasis: ValidTimeBasis!
  recordedFrom: DateTime!
  recordedTo: DateTime
  mongoResearchRunId: String
  role: MediaRelationRole
  isPrimary: Boolean
  salience: Float
  salienceMethodVersion: String
  "Alt text, caption or label text that grounds the link, verbatim."
  sourceText: String
}

"""
Structural lineage from a MediaAsset to the W00 SourceLocator its bytes were obtained from. Successor of live
MediaSourceMetadata (sourceRole -> captureRelation; sourceConfidence, extractionMethod, extractedAt -> the generating
Activity). `captureRelation` SAME_BYTES_AS_SNAPSHOT is the only case where asset bytes and evidence capture are the
same bytes; it still does not make the asset a Source.
"""
type MediaSourceProperties @relationshipProperties {
  sourceType: MediaSourceType
  captureRelation: MediaCaptureRelation!
  "Surrounding text at the source (e.g. alt text or figure title), verbatim."
  contextText: String
  mongoResearchRunId: String
}

"""
Media subject range (contract B6): identities AND concepts a media asset, panel, annotation or graph view may
depict, explain, be assessed for or include. Preserves the concept coverage of live MediaSubject (Mechanism,
Pathway, Biomarker, Metric, Condition, Protocol ...), renamed to final names (D-002, D-007, D-008). Removed members
(migration-map.yaml): snapshot states, retired legacy names, CohortParticipant and AnonymousActor (privacy and
no identity to depict), retrieval units (DocumentTextVersion, Segmentation, Chunk), propositions (moved to
MediaVisualizableRelationshipTarget) and media types themselves. Membership follows the ownership registry; Fable
prunes members absent from the merged schema.
"""
union MediaSubjectTarget =
  | Organization | LegalEntity | ConsumerBrand | Facility | Person | PseudonymousActor
  | Product | ProductVariant | PackageConfiguration | Trademark | CertificationProgram | MerchantListing
  | ChemicalSubstance | ChemicalForm | IngredientMaterial | BrandedIngredientMaterial | BotanicalTaxon | BotanicalPreparation | MicrobialTaxon | MicrobialStrain
  | Mechanism | Pathway | MolecularEntity | Species | AnatomicalContext | Organ | Outcome | Condition | RiskFactor
  | Biomarker | Metric | LabTest | PanelDefinition | MeasurementMethod | Specimen
  | TechnologyPlatform | ToolOrInstrument | Device | Sensor | Modality
  | FoodItem | FoodProduct | Exposure | Lifestyle | Treatment | Procedure
  | ManufacturingProcess | ManufacturingStep
  | RegulatoryAgency | RegulatoryPathway | RegulatoryStep | RegulatoryStatus
  | Study | StudyArm | StudyPopulation | OutcomeDefinition | StudyResult | Dataset | Publication
  | Protocol | ProtocolEdition | ProtocolStep | Constraint | MeasurementPlan | Target | FunctionalGoal | Observation | ProtocolAdjustmentRule | ProtocolResult
  | AdverseEffect | SafetySignal
  | Community | Conference | Event | NarrativeArc
  | Platform | Channel | Series | Episode | EpisodeSegment | Claim | ExperienceReport
  | Document

"""
Propositions and results a chart or figure can visualize, and (derived only) evidence: generic Assertion,
ClaimOccurrence, RelationshipAssertion, the Claim proposition, a W09 StudyResult, and the live W03 Association
(kept only if W03 keeps it; Fable prunes). Successor of live MediaVisualizableRelationship.
"""
union MediaVisualizableRelationshipTarget = Assertion | ClaimOccurrence | RelationshipAssertion | Claim | StudyResult | Association

