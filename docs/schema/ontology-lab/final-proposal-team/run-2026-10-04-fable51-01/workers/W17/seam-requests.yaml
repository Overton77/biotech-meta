  proposedRuling: "Accept D-W17-02; the registry note 'asserted projection embedding AssertedEdgeProperties' is superseded by the structural profile."
- id: W17-SR-05
  targetOwner: W00
  request: "AssertionSubjectTarget: remove SafetySignal (no source asserts about a BellLabs assessment); keep AdverseEffect (object of agency listings). SupportedRecordTarget: add SafetySignal (agency-import signals are SUPPORTED_BY the listing row and its as-of header)."
