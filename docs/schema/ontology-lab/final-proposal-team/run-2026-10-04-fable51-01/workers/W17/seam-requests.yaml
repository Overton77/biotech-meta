- id: W17-SR-06
  targetOwner: W10 (W00 resolves an archetype-subtype dispute)
  request: >
    (a) Confirm SafetySignal as a distinct EvidenceAssessment subtype beside EvidenceSynthesis (a signal returns a lifecycle
    state for a subject-effect pair; a synthesis returns a claim verdict); an EvidenceSynthesis may INCLUDES_RESULT a SafetySignal
    if W10 wants it. (b) Confirm UseContextProfile may be a POPULATION scope member of a UseConstraint (non-personal
    descriptors such as 'patients of Chinese descent', 'pregnant patients'). (c) EvidenceStrength stays the legacy hint enum
    referenced by SafetySignal.legacyEvidenceStrengthHint. (d) Applicability: a study that excluded a co-exposure (NCT02678611
    excluded lipid-lowering drugs) gives no evidence about that co-exposure (FI-W17-09) -> POPULATION / BACKGROUND_CONTEXT
    dimension.
  cq: [CQ-SF-C01, CQ-ST-06, CQ-EV-04]
  failingCase: "AEMS lenvatinib row 'no action was necessary at the time' has no claim-verdict equivalent; fixture 02 needs CLOSED_NO_ACTION."
  proposedRuling: "Accept (a)-(c); W10 decides (d) wording."
- id: W17-SR-07
  targetOwner: W23
  request: >
    Private-store contract: RecommendationOption.blockingConstraintUids accepts hu:use-constraint: uids (and W16
    hu:constraint: uids for protocol-sourced blocks); evidenceAssertionUids carries the Contraindication/InteractionAssertion
    uids read at evidenceRecordedAt; when the block is caused by absent interaction data for a declared co-exposure, the option
    cites the policy DecisionCriterion uid (criterionKind SAFETY_BLOCK) and missingFactKeys 'INTERACTION_DATA:<option uid>:<co-exposure uid>'
    so the PCS CHECK (BLOCKED requires non-empty blocking uids) holds without fabricating a shared constraint. The mapping
    ConstraintLevel / interaction polarity -> BLOCK | PENALIZE lives in the RECOMMENDATION_RANKING PolicyVersion payload; the
    evaluation checks both directions (option as constrained subject or as co-exposure member) as Q-W17-04 does.
  cq: [CQ-RC-06, CQ-RC-07]
  failingCase: "Q-W17-04 case G (NR + simvastatin: no record) must block under policy v3 but has no UseConstraint; N10 shows the leak if one is created."
  proposedRuling: "Accept."
