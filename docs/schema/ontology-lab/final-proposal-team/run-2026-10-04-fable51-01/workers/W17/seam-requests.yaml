- id: W17-SR-01
  targetOwner: Fable (ownership registry)
  request: >
    Register under W17 (module safety_and_constraints) the elements beyond the registry row that the fragment defines:
    relationship types SIGNAL_BASED_ON, CONSTRAINS_USE_OF, CONSTRAINT_SCOPE, RESOLVES_TO_CONSTRAINT; relationship-property
    types SignalInputProperties, ConstraintScopeProperties; enums SignalStatus, ConstraintLevel, ConstraintScopeRole,
    SafetySubjectRole; unions SafetySignalInputTarget, UseConstraintScopeTarget.
  cq: [CQ-ST-06, CQ-RC-06, CQ-RC-07, CQ-SF-C01, CQ-SF-C03]
  failingCase: "Without SIGNAL_BASED_ON {aeReportedStatus} a not-reported study is either dropped or written as a zero (N3, V-W17-03); without UseConstraint scope edges Q-W17-04 cannot tell case D (block) from E (penalize) or F (out of dose band)."
  proposedRuling: "Accept; each element maps to a run fixture and validator (02-cq-coverage.md section 2)."
