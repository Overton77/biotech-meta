interface Entity { id: ID!  uid: String!  name: String  description: String  mongoResearchRunId: String }
interface SearchIndexable { searchText: String  searchFields: [String!]  embeddingModel: String  embeddingDimensions: Int }
interface EntityArchetype { entityType: String! }
interface AssertionArchetype { predicate: String!  status: AssertionStatus!  recordedAt: DateTime!  recordedTo: DateTime  contentHash: String  polarity: Polarity  basisKind: BasisKind  predicateClass: PredicateClass  assertionBasis: AssertionBasis  speechAct: SpeechAct  reportedSpeechAct: SpeechAct  valueString: String  valueNumber: Float  valueBoolean: Boolean  unitCode: String  quantityBasis: QuantityBasis  validFrom: DateTime  validTo: DateTime  validFromPrecision: TimePrecision  validToPrecision: TimePrecision  validFromBasis: ValidTimeBasis  validToBasis: ValidTimeBasis  jurisdiction: String  derivationRule: String  extractionMethod: String  extractionConfidence: Float  agentRunUid: String  confidence: Float }
interface EvidenceAssessmentArchetype { assessmentType: String!  methodVersion: String!  status: AssessmentStatus!  recordedAt: DateTime!  recordedTo: DateTime  summary: String  overallScore: Float  confidence: Float }
enum PrivacyClass { PUBLIC INTERNAL }
enum NodeMaturity { CANDIDATE PROVISIONAL ACCEPTED DEPRECATED }
enum AssertionStatus { EXTRACTED PROPOSED ACCEPTED REJECTED DISPUTED SUPERSEDED UNRESOLVED }
enum AssessmentStatus { PROPOSED ACCEPTED SUPERSEDED WITHDRAWN }
enum Polarity { POSITIVE NEGATIVE MIXED UNKNOWN }
enum BasisKind { DIRECT_MEASUREMENT INFERRED_FROM_MEASUREMENT CITED_FROM_PRIOR_WORK HYPOTHESIS CALCULATED }
enum PredicateClass { MECHANISM ROLE COMMERCIAL REGULATORY QUANTITY IDENTITY CLAIM OTHER }
enum AssertionBasis { PERSONAL_EXPERIENCE THIRD_PARTY_ANECDOTE MANUFACTURER_CLAIM STUDY_RESULT MECHANISM_REASONING EXPERT_OPINION UNSTATED }
enum SpeechAct { STATES REPORTS_PRACTICE RECOMMENDS CAUTIONS SPECULATES QUESTIONS DENIES }
enum TimePrecision { INSTANT DAY MONTH QUARTER YEAR DECADE }
enum ValidTimeBasis { STATED_BY_SOURCE PUBLICATION_PROXY OBSERVATION_ONLY INFERRED UNKNOWN }
enum QuantityBasis { PER_DAY PER_DOSE PER_SERVING PER_KG_BODY_WEIGHT_PER_DAY SINGLE_DOSE }
enum MassBasis { SALT_FORM ACTIVE_MOIETY MATERIAL_AS_IS UNSPECIFIED }
enum ReportedStatus { REPORTED NOT_REPORTED NOT_APPLICABLE }
enum SupersessionKind { SOURCE_CORRECTION VALIDITY_BOUNDED EXTRACTION_FIX RESOLUTION_FIX DUPLICATE_MERGE RE_REVIEW SOURCE_REVISION }
enum MechanismSetting { IN_VITRO_CELL_FREE IN_VITRO_CELL EX_VIVO IN_VIVO_NONMAMMAL IN_VIVO_MAMMAL HUMAN_INTERVENTIONAL HUMAN_OBSERVATIONAL IN_SILICO }
enum EvidenceStrength { LOW MODERATE HIGH }
enum ThresholdComparator { GT GTE LT LTE OUTSIDE_REFERENCE_RANGE }
