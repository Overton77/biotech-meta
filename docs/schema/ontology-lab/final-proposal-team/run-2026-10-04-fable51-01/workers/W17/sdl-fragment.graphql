severity verdict, and NOT the same identity as a W03 Condition with a similar name: a harm concept that is also a
disease keeps two nodes and no merge by name (FI SIMILAR_NAME -> SAME_IDENTITY). MedDRA or other terminology codes are
Identifier records (HAS_IDENTIFIER); names are never identity. Live type kept (line 1021). CQ-ST-06, CQ-SF-C01.
Canonical module: safety_and_constraints (candidate). Archetype Entity. uid token `adverse-effect` (W17-SR-02).
