"""
UseConstraint: the shared, stable identity of one scoped use concern -- "use of S (optionally above a dose band, by a
route, in a jurisdiction) together with these scope members (conditions, non-personal populations, co-exposures with
optional dose bands)". It is the identity a private RecommendationOption names in blockingConstraintUids (W23
private-store contract, R-18) and the grouping key for every ContraindicationAssertion and InteractionAssertion about
that scope (derived RESOLVES_TO_CONSTRAINT, rule uc-match/v1). Like a Claim it carries NO truth value, NO level and NO
in-force flag: whether it is stated, removed, unknown or unrecorded at a viewpoint is computed from its live
assertions (QS-W17-03). It is NOT a protocol Constraint (W16: a reusable condition a protocol step tests), NOT a
person's condition or medication (private), NOT a block (the policy decides), and its absence for a pair is NOT
evidence of safety. Never created to represent a person's undeclared-interaction gap (that block cites the policy's
DecisionCriterion and missingFactKeys, W17-SR-07). Identity key: subject uid + subject dose band + route +
jurisdiction + the set of (scopeRole, member uid, member dose band); identityKeyHash = sha256 of that canonical tuple.
CQ-RC-06, CQ-RC-07 (which decisions cite a changed constraint), CQ-SF-C03. Canonical module: safety_and_constraints
(candidate). Archetype Entity. uid token `use-constraint` (W17-SR-02).
"""
type UseConstraint implements Entity & EntityArchetype
  @node(labels: ["UseConstraint", "Entity"]) {
  id: ID! @id
  uid: String!
  "Display label written by BellLabs ('simvastatin above 10 mg/day with verapamil'); never identity."
  name: String
  description: String
  mongoResearchRunId: String
  createdAt: DateTime! @timestamp(operations: [CREATE])
  updatedAt: DateTime! @timestamp(operations: [CREATE, UPDATE])
  privacyClass: PrivacyClass
  maturity: NodeMaturity
  schemaVersion: String
  "constant USE_CONSTRAINT"
  entityType: String!
  "sha256:<hex> over the canonical identity tuple (uc-key/v1); unique (operations.cypher)."
  identityKeyHash: String! @settable(onCreate: true, onUpdate: false)
  "Version of the identity-key canonicalization."
  identityKeyVersion: String! @settable(onCreate: true, onUpdate: false)
  "Dose band of the constrained subject; all five or none (V-W17-08)."
  doseComparator: ThresholdComparator @settable(onCreate: true, onUpdate: false)
  doseValue: Float @settable(onCreate: true, onUpdate: false)
  doseUnitCode: String @settable(onCreate: true, onUpdate: false)
  doseQuantityBasis: QuantityBasis @settable(onCreate: true, onUpdate: false)
  doseMassBasis: MassBasis @settable(onCreate: true, onUpdate: false)
  route: String @settable(onCreate: true, onUpdate: false)
  "Jurisdiction the constraint scope is drawn from; null = not jurisdiction-specific."
  jurisdiction: String @settable(onCreate: true, onUpdate: false)

  """class: structural (identity); cardinality: exactly_one; catalog: CONSTRAINS_USE_OF (new, W17-SR-01)"""
  constrainsUseOf: [SafetySubjectTarget!]! @relationship(type: "CONSTRAINS_USE_OF", direction: OUT, properties: "StructuralEdgeProperties") @settable(onCreate: true, onUpdate: false)
  """class: structural (identity); cardinality: one_or_more; catalog: CONSTRAINT_SCOPE (new, W17-SR-01)"""
  scope: [UseConstraintScopeTarget!]! @relationship(type: "CONSTRAINT_SCOPE", direction: OUT, properties: "ConstraintScopeProperties") @settable(onCreate: true, onUpdate: false)
  """class: derived (inverse of RESOLVES_TO_CONSTRAINT); read-only"""
  contraindicationAssertions: [ContraindicationAssertion!]! @relationship(type: "RESOLVES_TO_CONSTRAINT", direction: IN, properties: "DerivedEdgeProperties") @settable(onCreate: false, onUpdate: false)
  """class: derived (inverse of RESOLVES_TO_CONSTRAINT); read-only"""
