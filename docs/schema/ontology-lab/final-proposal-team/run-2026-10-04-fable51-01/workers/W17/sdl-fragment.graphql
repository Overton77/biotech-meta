  embeddingModel: String
  embeddingDimensions: Int
  "Lifecycle state assigned by this assessment."
  signalStatus: SignalStatus!
  "Controlled string (candidate values NEW_EFFECT, INCREASED_FREQUENCY, DOSE_RELATED_TOLERABILITY, LAB_ABNORMALITY, INTERACTION); live field kept."
  signalType: String
  "Assessed severity of the effect in this assessment; null = not assessed. SERIOUS is legacy (V-W17-10)."
