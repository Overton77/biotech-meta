"""
ContraindicationAssertion: one source's directive restricting the use of its subject (a substance, material, product,
variant, treatment, procedure, lifestyle or exposure) in a condition or population (predicate USE_CONSTRAINED_IN,
object Condition or UseContextProfile) or together with a co-exposure (predicate USE_CONSTRAINED_WITH, object the
co-exposure), at a stated level (constraintLevel, levelVerbatim) and optional dose band, route and jurisdiction. Full
kernel Assertion contract: one subject, one object, at most one asserter, status = capture fidelity, polarity
(NEGATIVE = the source states the restriction does not apply or is removed, e.g. FDA 2021 statin pregnancy), bitemporal.
It is NOT an interaction fact (InteractionAssertion), NOT the shared constraint identity (UseConstraint, reached by the
derived RESOLVES_TO_CONSTRAINT), NOT a block (the private policy decides), and NOT evidence of safety when absent.
Named after the catalog element; covers every directive level, including those weaker than a contraindication.
CQ-RC-06, CQ-PR-03, CQ-SF-C03. Canonical module: safety_and_constraints (candidate). Archetype Assertion (labels
ContraindicationAssertion:Assertion). uid token `assertion` (as RelationshipAssertion; W17-SR-02).
"""
type ContraindicationAssertion implements Entity & AssertionArchetype
  @node(labels: ["ContraindicationAssertion", "Assertion"]) {
  id: ID! @id
  uid: String!
  name: String
  description: String
  mongoResearchRunId: String
  createdAt: DateTime! @timestamp(operations: [CREATE])
  updatedAt: DateTime! @timestamp(operations: [CREATE, UPDATE])
  privacyClass: PrivacyClass
  maturity: NodeMaturity
  schemaVersion: String
  "USE_CONSTRAINED_IN | USE_CONSTRAINED_WITH (candidate predicates, W17-SR-03)."
  predicate: String! @settable(onCreate: true, onUpdate: false)
  status: AssertionStatus!
  recordedAt: DateTime! @timestamp(operations: [CREATE]) @settable(onCreate: false, onUpdate: false)
  recordedTo: DateTime @settable(onCreate: false, onUpdate: true)
  contentHash: String @settable(onCreate: true, onUpdate: false)
  "POSITIVE = restriction stated; NEGATIVE = stated not to apply / removed; UNKNOWN = source says it cannot tell. Required (V-W17-04)."
  polarity: Polarity @settable(onCreate: true, onUpdate: false)
  basisKind: BasisKind @settable(onCreate: true, onUpdate: false)
  predicateClass: PredicateClass @settable(onCreate: true, onUpdate: false)
  assertionBasis: AssertionBasis @settable(onCreate: true, onUpdate: false)
  "Normally CAUTIONS (directive) or STATES."
  speechAct: SpeechAct @settable(onCreate: true, onUpdate: false)
  reportedSpeechAct: SpeechAct @settable(onCreate: true, onUpdate: false)
  "Never written: the object is a node (kernel object XOR literal)."
  valueString: String @settable(onCreate: false, onUpdate: false)
  valueNumber: Float @settable(onCreate: false, onUpdate: false)
  valueBoolean: Boolean @settable(onCreate: false, onUpdate: false)
