"""
InteractionAssertion: one source's statement that concurrent exposure to its subject (the perpetrator: St. John's wort,
kava, green tea extract, grapefruit juice, verapamil) changes the exposure to or effect of its object (the affected
substance, material or product), with polarity POSITIVE (interaction stated), NEGATIVE (studied and not found, needs a
measurement basis, V-W17-05), UNKNOWN (predicted or possible, e.g. from in vitro data only) or MIXED, an evidence
setting (W03 MechanismSetting), a mechanism and effect (controlled strings) and the source's own evidence grade when it
gives one (reportedEvidenceGrade; never a BellLabs strength, FI-W17-06). It is NOT a directive (that is a
ContraindicationAssertion, possibly from the same sentence), NOT a block, and its absence is NOT "no interaction"
(QS-7 NOT_RECORDED). An UNKNOWN interaction still resolves to a UseConstraint so a private policy can block on it
(CQ-RC-06). CQ-RC-06, CQ-SF-C04. Canonical module: safety_and_constraints (candidate). Archetype Assertion (labels
InteractionAssertion:Assertion). uid token `assertion` (W17-SR-02).
"""
type InteractionAssertion implements Entity & AssertionArchetype
  @node(labels: ["InteractionAssertion", "Assertion"]) {
