  relatesToEffects: [AdverseEffect!]! @relationship(type: "RELATES_TO_EFFECT", direction: OUT, properties: "StructuralEdgeProperties")
  """class: derived (ruleOnly uc-match/v1); cardinality: zero_or_one; catalog: RESOLVES_TO_CONSTRAINT (new, W17-SR-01)"""
  useConstraint: [UseConstraint!]! @relationship(type: "RESOLVES_TO_CONSTRAINT", direction: OUT, properties: "DerivedEdgeProperties") @settable(onCreate: false, onUpdate: false)
