"""
HAS_SAFETY_SIGNAL (structural: subject -> SafetySignal assessment, written in the assessment's commit and immutable
with it). Specializes StructuralEdgeProperties (orderIndex, notes, mongoResearchRunId, all kept) and adds the exposure
scope of THIS subject inside the signal (live SafetyMetadata.doseText, route, frequency, exposureContext,
populationSubset). Live SafetyMetadata.evidenceStrength and confidence are removed: strength is the assessment's own
method-versioned content (INV-209); a migrated value is kept only as SafetySignal.legacyEvidenceStrengthHint (V-W17-07).
Not an asserted-edge profile: no Assertion has a BellLabs assessment as its object (D-W17-02, fixture N4). Dose text is
verbatim; normalized dose bounds live on UseConstraint/ContraindicationAssertion, not here. CQ-ST-06, CQ-SF-C01.
"""
type SafetyEdgeProperties @relationshipProperties {
  orderIndex: Int
  notes: String
  mongoResearchRunId: String
  "Stable audit id hu:rel:<opaque> (MERGE key)."
  relationshipUid: String!
  "PRIMARY exactly once per SafetySignal; CO_EXPOSURE for interaction signals."
  subjectRole: SafetySubjectRole!
  "Verbatim exposure context (live SafetyMetadata.exposureContext)."
  exposureContext: String
  "Verbatim dose text as reported by the inputs ('500 mg NR + 100 mg PT daily'); never parsed into a threshold here."
  doseText: String
  route: String
  frequency: String
  "Verbatim population subset (live SafetyMetadata.populationSubset); a non-personal descriptor only."
  populationSubset: String
}

"""
SIGNAL_BASED_ON (structural: SafetySignal -> StudyResult | Study | Assertion). Specializes StructuralEdgeProperties
(orderIndex, notes, mongoResearchRunId) and adds aeReportedStatus (kernel ReportedStatus) so a considered study whose
publication has no AE report is recorded as NOT_REPORTED instead of being dropped or read as zero (INV-207, CQ-ST-06),
and inputRole (controlled string: INDEX_ARM, COMPARATOR_ARM, AGENCY_LISTING, MEASURED_LAB, NOT_REPORTED_STUDY).
"""
type SignalInputProperties @relationshipProperties {
  orderIndex: Int
  notes: String
  mongoResearchRunId: String
  "REPORTED for AE rows and listings; NOT_REPORTED for a Study input whose sources report no AEs; NOT_APPLICABLE for non-AE inputs."
  aeReportedStatus: ReportedStatus!
  inputRole: String
}

"""
CONSTRAINT_SCOPE (structural, part of UseConstraint identity). Specializes StructuralEdgeProperties (orderIndex, notes,
mongoResearchRunId) and adds scopeRole and an optional dose band for a CO_EXPOSURE member ("lipid-modifying dosages
of niacin (>= 1 gram/day)"). A dose band needs comparator, value, unit and quantity basis together (V-W17-08).
CQ-RC-06, CQ-SF-C03.
"""
type ConstraintScopeProperties @relationshipProperties {
  orderIndex: Int
  notes: String
  mongoResearchRunId: String
  scopeRole: ConstraintScopeRole!
  doseComparator: ThresholdComparator
  doseValue: Float
  "UCUM unit of doseValue."
  doseUnitCode: String
  doseQuantityBasis: QuantityBasis
  doseMassBasis: MassBasis
}

