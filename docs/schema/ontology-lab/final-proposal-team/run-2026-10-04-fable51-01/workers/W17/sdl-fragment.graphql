"""
SafetySignal: one immutable, method-versioned BellLabs evaluation that a subject-effect pair (optionally with a
co-exposure) shows a reported or measured pattern warranting attention, with its lifecycle state (signalStatus), its
exact inputs (AdverseEventResults and other StudyResults, Studies considered with their AE reporting status, and source
assertions such as an FDA AEMS potential-signal listing) and its scope. A re-evaluation is a new SafetySignal that
SUPERSEDES the old (KCR-2a); the old stays replayable at its recordedAt. It is NOT a fact that the subject causes the
effect (an agency listing "does not mean that FDA has concluded that the drug has the listed risk"), NOT an adverse
event, NOT an agency's own statement (that is an Assertion input), and NOT a use constraint (a signal never blocks a
recommendation by itself; a UseConstraint does). Live type kept and re-founded (line 1041; round 0002 OQ-L2-10 closed
as proposed by D-W17-01). Live evidenceStrength becomes legacyEvidenceStrengthHint, never a verdict (INV-209).
CQ-ST-06, CQ-AX-24, CQ-SF-C01, CQ-SF-C02. Canonical module: safety_and_constraints (candidate). Archetype
EvidenceAssessment. uid token `safety-signal` (W17-SR-02).
"""
