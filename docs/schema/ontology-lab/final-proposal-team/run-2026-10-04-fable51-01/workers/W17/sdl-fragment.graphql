  assessmentType: String!
  "Method and version that produced this assessment (bl-safety-signal/0.1, agency-signal-import/0.1, live-migration/0)."
  methodVersion: String!
  "Workflow state of the record (kernel AssessmentStatus); never the signal state."
  status: AssessmentStatus!
  "Service-assigned commit time; never backdated."
  recordedAt: DateTime!
  "Written once from null when superseded."
  recordedTo: DateTime
  summary: String
  "Must stay null: no composite score is defined for safety signals (INV-204)."
  overallScore: Float
  "DEPRECATED generic confidence (INV-407); never written."
