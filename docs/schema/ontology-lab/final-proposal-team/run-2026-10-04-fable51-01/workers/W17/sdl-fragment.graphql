  uid: String!
  name: String
  description: String
  mongoResearchRunId: String
  createdAt: DateTime! @timestamp(operations: [CREATE])
  updatedAt: DateTime! @timestamp(operations: [CREATE, UPDATE])
  privacyClass: PrivacyClass
  maturity: NodeMaturity
  schemaVersion: String
  "INTERACTS_WITH (candidate predicate, W17-SR-03); subject = perpetrator, object = affected."
  predicate: String! @settable(onCreate: true, onUpdate: false)
  status: AssertionStatus!
  recordedAt: DateTime! @timestamp(operations: [CREATE]) @settable(onCreate: false, onUpdate: false)
  recordedTo: DateTime @settable(onCreate: false, onUpdate: true)
  contentHash: String @settable(onCreate: true, onUpdate: false)
  "Required (V-W17-05): UNKNOWN is explicit, never null."
  polarity: Polarity @settable(onCreate: true, onUpdate: false)
  "DIRECT_MEASUREMENT (human PK/clinical study), INFERRED_FROM_MEASUREMENT (in vitro or mechanism extrapolation), CITED_FROM_PRIOR_WORK, HYPOTHESIS."
  basisKind: BasisKind @settable(onCreate: true, onUpdate: false)
  predicateClass: PredicateClass @settable(onCreate: true, onUpdate: false)
  assertionBasis: AssertionBasis @settable(onCreate: true, onUpdate: false)
  speechAct: SpeechAct @settable(onCreate: true, onUpdate: false)
  reportedSpeechAct: SpeechAct @settable(onCreate: true, onUpdate: false)
  valueString: String @settable(onCreate: false, onUpdate: false)
  valueNumber: Float @settable(onCreate: false, onUpdate: false)
  valueBoolean: Boolean @settable(onCreate: false, onUpdate: false)
  unitCode: String @settable(onCreate: false, onUpdate: false)
  quantityBasis: QuantityBasis @settable(onCreate: false, onUpdate: false)
  validFrom: DateTime @settable(onCreate: true, onUpdate: false)
  validTo: DateTime @settable(onCreate: true, onUpdate: false)
  validFromPrecision: TimePrecision @settable(onCreate: true, onUpdate: false)
  validToPrecision: TimePrecision @settable(onCreate: true, onUpdate: false)
  validFromBasis: ValidTimeBasis @settable(onCreate: true, onUpdate: false)
  validToBasis: ValidTimeBasis @settable(onCreate: true, onUpdate: false)
  jurisdiction: String @settable(onCreate: true, onUpdate: false)
  derivationRule: String @settable(onCreate: true, onUpdate: false)
  extractionMethod: String @settable(onCreate: true, onUpdate: false)
  extractionConfidence: Float @settable(onCreate: true, onUpdate: false)
  agentRunUid: String @settable(onCreate: false, onUpdate: false)
  confidence: Float @settable(onCreate: false, onUpdate: false)
  "Setting of the evidence the source cites (IN_VITRO_CELL, HUMAN_INTERVENTIONAL ...); required unless basisKind is HYPOTHESIS or CITED_FROM_PRIOR_WORK (V-W17-05)."
  evidenceSetting: MechanismSetting @settable(onCreate: true, onUpdate: false)
  "Controlled string (candidate: CYP3A4_INHIBITION, CYP3A4_INDUCTION, CYP2C9_INHIBITION, P_GP_INHIBITION, P_GP_INDUCTION, OATP_INHIBITION, VITAMIN_K_ANTAGONISM, PHARMACODYNAMIC_ADDITIVE, NOT_STATED)."
  interactionMechanism: String @settable(onCreate: true, onUpdate: false)
  "Controlled string (candidate: INCREASES_OBJECT_EXPOSURE, DECREASES_OBJECT_EXPOSURE, ALTERS_OBJECT_EFFECT, INCREASES_ADVERSE_EFFECT_RISK, NOT_STATED)."
  interactionEffect: String @settable(onCreate: true, onUpdate: false)
  "Verbatim magnitude ('approximately doubled'); null = not reported."
  exposureChangeText: String @settable(onCreate: true, onUpdate: false)
  "Verbatim dose of the perpetrator when stated ('lipid-modifying dosages (>= 1 gram/day)')."
  subjectDoseText: String @settable(onCreate: true, onUpdate: false)
  "Verbatim dose of the affected object when stated."
  objectDoseText: String @settable(onCreate: true, onUpdate: false)
  "Verbatim population qualifier ('The risk of myopathy is greater in Chinese patients')."
  populationScopeText: String @settable(onCreate: true, onUpdate: false)
  "The SOURCE's own evidence grade for its statement (e.g. 'C'); what the source said, never a BellLabs assessment (FI-W17-06)."
