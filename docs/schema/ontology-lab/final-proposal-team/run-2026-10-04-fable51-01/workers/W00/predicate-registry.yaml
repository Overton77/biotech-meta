relationshipClassUpdates:
- type: HAS_SNAPSHOT
  class: structural
  domainRange: Source -> SourceSnapshot ONLY
  ruling: W00-R-16
- type: HAS_STATE
  class: asserted (bitemporal_attachment, StateEpisodeProperties)
  domainRange: Organization -> OrganizationSnapshot; Product -> ProductSnapshot; MerchantListing -> ListingSnapshot (state caches, relabelled
    from live HAS_SNAPSHOT)
  ruling: W00-R-16
- type: EVALUATES
  class: structural
  domainRange: Adjudication -> Assertion ONLY
  ruling: W00-R-17
- type: LEGACY_EVALUATES
  class: legacy (read-only; Study.evaluates, LegacyInterventionArmProperties)
  domainRange: Study -> LegacyEvaluatedIntervention
  ruling: W00-R-17
- type: MENTIONS
  class: structural
  domainRange: SourceLocator -> Mention ONLY
  ruling: W00-R-19
- type: MENTIONS_ENTITY
  class: derived, ruleOnly (RetrievalEdgeProperties, W20 sole writer)
  domainRange: Chunk|Episode|ProtocolResult|ProductLabelRegion -> entity (AssertionSubjectTarget or the owner union)
  ruling: W00-R-19
- type: HAS_IDENTIFIER
  class: asserted (IdentifierLinkProperties)
  domainRange: Entity|VersionedState|InformationArtifact -> Identifier (TradeItemIdentifier included)
  ruling: W00-R-20
- type: IDENTIFIED_BY
  class: retired; relabelled HAS_IDENTIFIER at migration
  domainRange: '-'
  ruling: W00-R-20
- type: RESOLVES_TO_CHUNK
  class: derived, ruleOnly
  domainRange: SourceLocator -> Chunk
  ruling: W00-R-23
- type: HAS_CHUNK
  class: derived, ruleOnly
  domainRange: (W20)
  ruling: W00-R-23
- type: OCCURS_IN_SEGMENT
  class: derived, ruleOnly (chunk form)
  domainRange: (W20)
  ruling: W00-R-23
- type: ABOUT
  class: derived, ruleOnly (RetrievalEdgeProperties)
  domainRange: (W20)
  ruling: W00-R-23
- type: SUPPORTED_BY_CHUNK
  class: derived, NOT ruleOnly (needs derivedFromAssertionUids; W20-V01)
  domainRange: (W20)
  ruling: W00-R-23
- type: SUPPORTED_BY_DOCUMENT
  class: derived, NOT ruleOnly (W20-V02)
  domainRange: (W20)
  ruling: W00-R-23
- type: HAS_CURRENT_PROTOCOL_STEP
  class: derived, ruleOnly (rule protocol-current-steps-v1)
  domainRange: Protocol -> ProtocolStep
  ruling: W00-R-23
- type: COMPARED_TO
  class: derived; ruleOnly only for the same-version clause (derivationRule INV-301 same AssayVersion|AlgorithmVersion); cross-version needs derivedFromAssessmentUids
  domainRange: DiagnosticResult -> DiagnosticResult
  ruling: W00-R-23
- type: RECOMMENDS
  class: 'derived, rule mode: derivationRule + exactly one derivedFromAssertionUids (speechAct RECOMMENDS); never assertionUid'
  domainRange: Person -> RecommendableTarget
  ruling: W00-R-25
- type: AFFECTS_MECHANISM|MODULATES|APPLIES_TO_SPECIES|INFLUENCES_OUTCOME|ACTS_IN
  class: derived, rule mode mx-proj/v1 (or 1:1 projectionOfAssertionUid)
  domainRange: (W03)
  ruling: W00-R-26
- type: DELIMITED_BY
  class: structural (W21)
  domainRange: EpisodeSegment -> SourceLocator (at most one per rendition)
  ruling: W00-R-29
- type: WAS_GENERATED_BY
  class: structural
  domainRange: adds Segmentation, AnswerRecord, MediaAsset, MediaVariant, MediaAnnotation, MediaSuitabilityAssessment (EvidenceAssessment), PriceObservation,
    Offer, AffiliateLink -> Activity
  ruling: W00-R-18
- type: USED
  class: structural
  domainRange: Activity -> adds MediaAsset, MediaVariant, MediaAnnotation (MediaRightsRecord DEFERRED)
  ruling: W00-R-18
- type: SUPPORTED_BY
  class: structural
