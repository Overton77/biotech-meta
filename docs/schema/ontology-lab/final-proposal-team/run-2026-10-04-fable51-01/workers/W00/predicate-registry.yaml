registry: Predicate and relationship-class registrations ruled by W00 (reconciliation pass, run-2026-10-04-fable51-01)
rulingId: W00-R-07 (predicates, exclusivity, implication pairs); per-type rulings named on each relationship row
conventions:
  status: REGISTERED = enters the owner module assertedPredicates at merge; CANDIDATE = usable, assertions stay PROPOSED-eligible only, catalog
    maturity CANDIDATE; CONFIRMED = class confirmed, no change; DEFERRED = no failing case or no owner
  predicateClass: kernel enum PredicateClass (no new value requested or added)
  quantityRule: 'W00-R-02: a QUANTITY-class assertion may carry one HAS_OBJECT plus one numeric literal (valueNumber + unitCode, with quantityBasis/massBasis/amountReferent);
    every other class keeps INV-003 literal-xor-object (V-003r)'
