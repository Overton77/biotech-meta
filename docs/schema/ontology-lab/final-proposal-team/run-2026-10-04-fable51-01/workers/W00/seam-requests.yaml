# W00 seam requests and kernel-change requests (run-2026-10-04-fable51-01). The frozen contract stands until Fable rules.
# Evidence ids: S-xx in 03-source-manifest.md; fixtures in fixtures/*.cypher; probes/tests in 06-fixtures-and-queries.md.
# kind: KCR = kernel-change request against 01-shared-contract.md (primary source + failing case); SEAM = request to another owner;
#       FIX = defect in a catalog validator or text (no contract change).

- id: W00-SR-01
  kind: KCR
  targetOwner: Fable (contract B3, AssertionArchetype)
  request: "Add massBasis: MassBasis and amountReferent: AmountReferent to the AssertionArchetype interface (contract A11 already makes them mandatory qualifiers). Under the frozen text they exist only on the generic Assertion type; ClaimOccurrence and RelationshipAssertion (W21) should mirror them."
  cq: [CQ-PV-04, CQ-EV-01]
  primarySource: "S-03 round 0006 case packet (INHERITED): YouTube description of Lifespan #4 'Dr. Sinclair says he takes 1 gram of Spermidine, but the active ingredient in the capsules is 1-2 milligrams'; catalog conventions.quantityBasis = PER_DAY|PER_DOSE|PER_SERVING|PER_KG_BODY_WEIGHT_PER_DAY|SINGLE_DOSE."
  failingCase: "examples/claim-retelling-provenance.cypher stores Assertion.quantityBasis = 'UNSPECIFIED' (an amount-referent meaning, not a per-day basis). Read through the frozen QuantityBasis enum it fails GraphQL serialization (fixture 12 / test T4a) and the 1000-fold salt/product/active-ingredient ambiguity has no field. Fixture 04/05 write massBasis UNSPECIFIED on the generic Assertion and read cleanly."
  proposedRuling: "Accept; migrate quantityBasis 'UNSPECIFIED' to quantityBasis null + massBasis UNSPECIFIED (migration-map.yaml)."

- id: W00-SR-02
  kind: KCR
  targetOwner: Fable (contract B2 skeleton `id: ID! @id`)
  request: "Keep `id: ID! @id` for API-created nodes but make uid assignment a service responsibility: the GraphQL API cannot satisfy INV-106 (uid ends with ':' + id) on create because @id removes `id` from the create input and the client must already send uid. Either (a) all creates of kernel types go through the ingestion service (API create mutations restricted with @mutation or authorization at deployment), or (b) replace `@id` by a client/service-supplied `id: ID!` for kernel types. W00 recommends (a) for the final proposal and records (b) as the alternative."
  cq: [CQ-AX-09, CQ-ID-04]
  primarySource: "S-01 Neo4j GraphQL Library 7 docs, Autogeneration: '@id ... The format of each generated ID is a UUID generated by the randomUUID() function. The field will not be present in input types for mutations.'"
  failingCase: "Test T5a (executed): createAssertions with uid 'hu:assertion:w00-api-created' returns an autogenerated UUID id; V-117 then reports uid not ending with ':' + id (T5 validation row)."
  proposedRuling: "Accept (a); V-117 stays a hard check; API-created records without a service uid are rejected by the write guard."

- id: W00-SR-03
  kind: SEAM
  targetOwner: W20 (Document) with Fable
  request: "Document nodes carry the labels Document, Source, Entity (D-005) and are therefore also read by the Source type, whose `id: ID!` reads stored property `id`. Document stores its live id as `documentId` (B2 alias). Dual-write `id` = `documentId` (and `entityType`, `canonicalUri`) on every Document node so the Source projection is readable."
  cq: [CQ-EV-01, CQ-PV-02]
  primarySource: "S-01/S-02 Neo4j GraphQL Library 7 (@alias maps one GraphQL field to one stored property per type); executed probe P-1 (labels-subset types read the same node)."
  failingCase: "Fixture 12(d) / test T4d: `sources(where: {uid: {eq: 'hu:document:w00-legacy-doc-1'}}) { id }` raises 'Cannot return null for non-nullable field Source.id'."
  proposedRuling: "Accept dual-write; V-W00-08 audits it."

- id: W00-SR-04
  kind: KCR
  targetOwner: Fable (contract B5 enums)
  request: "Add a kernel enum ResolutionStatus {PROPOSED ACCEPTED REJECTED UNRESOLVED} for ResolutionHypothesis.resolutionStatus (the OUTCOME of the hypothesis), distinct from AssessmentStatus (the workflow state of the record). Until ruled, resolutionStatus is a controlled String in the W00 fragment."
  cq: [CQ-AX-14, CQ-AX-15, CQ-ID-04]
  primarySource: "catalog provenance.ResolutionHypothesis.properties lists resolutionStatus separately from status; examples/diagnostic-comparison.cypher line 547 writes status 'REJECTED', resolutionStatus 'REJECTED'."
  failingCase: "AssessmentStatus has no REJECTED or UNRESOLVED; the repository fixture's status 'REJECTED' is unreadable by the frozen enum (V-W00-09 row) and an UNRESOLVED material-identity hypothesis cannot be distinguished from a PROPOSED one by status."
  proposedRuling: "Accept as candidate; migrate status 'REJECTED' -> status ACCEPTED + resolutionStatus REJECTED."

- id: W00-SR-05
  kind: KCR
  targetOwner: Fable (contract A2 merge redirect)
  request: "Contract A2 says merges publish a redirect through an EquivalenceAssessment; the catalog says an EquivalenceAssessment never merges and EquivalenceKind has no value meaning 'same identity, merged'. Name the redirect record: W00 proposes EquivalenceKind value SAME_IDENTITY_MERGED (candidate) plus `redirectToUid` on the retired node kept with maturity DEPRECATED, and SUPERSEDES {DUPLICATE_MERGE} for re-pointed assertions."
  cq: [CQ-ID-04, CQ-AX-14]
  primarySource: "catalog identity_resolution.rules: 'a merged uid keeps a redirect record so private snapshots that hold the old uid keep resolving (open: redirect contract, OPEN-QUESTIONS)'; catalog identity_resolution.EquivalenceAssessment.description."
  failingCase: "Two Organization nodes for one legal entity ingested twice (hu:org:a, hu:org:b): no enum value can express 'b merged into a', so a private RecommendationSnapshot holding hu:org:b cannot resolve after the merge. Until ruled, W00 recommends that no merge is executed: duplicates stay with an ACCEPTED ResolutionHypothesis (resolutionType DUPLICATE_IDENTITY)."
  proposedRuling: "Open for Fable; blocks executing merges, not the schema."

- id: W00-SR-06
  kind: FIX
  targetOwner: Fable (validation.cypher V-112)
  request: "V-112 tests r.hypothesisUid, a property no frozen relationship-property type has. Read the hypothesis citation of INSTANCE_OF from DerivedEdgeProperties.derivedFromAssessmentUids (a ResolutionHypothesis is an EvidenceAssessment)."
  cq: [CQ-AX-08, CQ-EV-02]
  primarySource: "catalog claims_and_documents.INSTANCE_OF oneOf [derivationRule, hypothesisUid]; contract B4 DerivedEdgeProperties."
  failingCase: "An INSTANCE_OF edge written with hypothesisUid fails the GraphQL projection (no such field) and an INSTANCE_OF with derivationRule + derivedFromAssessmentUids passes V-112 only through the LICENSING clause; fixtures/validation-w00.cypher V-112 is the corrected text."
  proposedRuling: "Accept the corrected V-112."

- id: W00-SR-07
  kind: SEAM
  targetOwner: W04 (IDENTIFIED_BY) and W07 (Metric identifiers)
  request: "IDENTIFIED_BY (ProductVariant|PackageConfiguration|MerchantListing -> TradeItemIdentifier, asserted) and HAS_IDENTIFIER (Entity|VersionedState|InformationArtifact -> Identifier, asserted) carry one meaning. Merge IDENTIFIED_BY into HAS_IDENTIFIER with IdentifierLinkProperties (TradeItemIdentifier is an Identifier), keeping IDENTIFIED_BY only as a migration relabel; examples/diagnostic-comparison.cypher uses IDENTIFIED_BY for Metric -> Identifier (LOINC), which is outside IDENTIFIED_BY's catalog domain."
  cq: [CQ-ID-04]
  primarySource: "catalog products_and_commerce.IDENTIFIED_BY and identity_resolution.HAS_IDENTIFIER; examples/diagnostic-comparison.cypher lines 241-245; examples/filing-vs-capability.cypher line 417."
  failingCase: "QS-1a/CQ-ID-04 'which identifiers support this match' must union two relationship types with different property contracts; IDENTIFIED_BY edges in the fixtures carry no assertionUid (V-101 row when IDENTIFIED_BY is listed as asserted)."
  proposedRuling: "Merge; one relationship type, one meaning (the CL-014 principle)."

- id: W00-SR-08
  kind: SEAM
  targetOwner: W01 (OrganizationSnapshot), W04 (ProductSnapshot), Fable
  request: "Live HAS_SNAPSHOT is used for Organization -> OrganizationSnapshot and Product -> ProductSnapshot (state caches, round 0007 §12: semantically HAS_STATE) and by the catalog for Source -> SourceSnapshot (capture). Relabel the live state-cache edges to HAS_STATE (StateEpisodeProperties) in the final schema; keep HAS_SNAPSHOT for Source -> SourceSnapshot only."
  cq: [CQ-TM-01, CQ-PV-02]
  primarySource: "current_biotech_schema.graphql lines 554, 624, 773, 818; catalog provenance.HAS_SNAPSHOT; round 0007 §12."
  failingCase: "A traversal (x)-[:HAS_SNAPSHOT]->(s) without a label guard mixes captures with state caches; V-512 REVISION_SNAPSHOT_FOREIGN and QS-2a lastObservedAt depend on HAS_SNAPSHOT meaning capture."
  proposedRuling: "Relabel; one relationship type, one meaning."

- id: W00-SR-09
  kind: KCR
  targetOwner: Fable (conventions.uidTypeTokens)
  request: "Register uid tokens: mention (Mention), equivalence-assessment is NOT needed (use the registered 'assessment' token for EquivalenceAssessment), media-annotation (MediaAnnotation, W22), policy-version already registered; and confirm 'rel' for relationshipUid. W19 asks separately for source-authority, coverage-requirement, source-discovery (W19-SR-05)."
  cq: [CQ-AX-14]
  primarySource: "catalog conventions.uidTypeTokens (no Mention, no MediaAnnotation entry); INV-106."
  failingCase: "fixtures 08 and 10 must invent 'hu:mention:' and 'hu:media-annotation:' uids; V-117 accepts the format but INV-106 'registered token per primary label' cannot be checked."
  proposedRuling: "Accept mention and media-annotation."

- id: W00-SR-10
  kind: KCR
  targetOwner: Fable (conventions.normalizationVersions)
  request: "IMAGE_REGION requires normalizationVersion (catalog requiredBySelectorKind) but the registry defines only NFC-WS1 (a text normalization). Register a region-coordinate convention, e.g. IMG-REL-XYWH-1 = 'x, y, width, height as fractions of the captured rendition's pixel dimensions, origin top-left'; W22 owns the MediaAnnotation geometry fields."
  cq: [CQ-PV-02, CQ-EV-01]
  primarySource: "catalog provenance.SourceLocator.requiredBySelectorKind.IMAGE_REGION; conventions.normalizationVersions."
  failingCase: "fixture 10 must write normalizationVersion 'IMG-REL-XYWH-1', an unregistered value; a crop re-derived from a different-resolution rendition cannot be checked without a named convention."
  proposedRuling: "Accept with W22."

- id: W00-SR-11
  kind: SEAM
  targetOwner: Fable (merge rule for unions and interfaces, contract B6)
  request: "Add to B6: a union (and any interface used as a relationship target) never lists both a type and a specialization whose @node labels are a superset of its labels; the specialization is read through the parent. Applies to Source/Document, Assertion/ClaimOccurrence/RelationshipAssertion, Organization/LegalEntity/RegulatoryAgency/TestingLaboratory, IngredientMaterial/BrandedIngredientMaterial..., RegulatoryStatus/DrugApproval/OrphanDesignation, StudyResult/AdverseEventResult, Identifier/TradeItemIdentifier, SourceSnapshot/LabelSnapshot (if W04 keeps the SourceSnapshot label)."
  cq: [CQ-EV-01, CQ-AX-14]
  primarySource: "Executed probe P-1 (06-fixtures-and-queries.md §4): @neo4j/graphql 7.6.3 returns a Document node twice through a union listing Source and Document (__typename Source and Document)."
  failingCase: "Probe P-1: `subject` over union Source|Document|Person returned 2 rows for 1 related node."
  proposedRuling: "Accept; Fable prunes specialization members at merge."

- id: W00-SR-12
  kind: FIX
  targetOwner: Fable (validation.cypher V-432)
  request: "V-432 matches (e)-[:COMPARES]->(n) for EquivalenceAssessment; the catalog relationship is COMPARES_IDENTITIES (COMPARES belongs to W07 ComparabilityAssessment). Replace with fixtures/validation-w00.cypher V-W00-05."
