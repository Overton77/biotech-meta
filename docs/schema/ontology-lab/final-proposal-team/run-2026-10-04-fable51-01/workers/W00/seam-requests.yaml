- id: W00-SR-13
  kind: SEAM
  targetOwner: every domain owner with asserted relationship types; Fable
  request: "Enum-typed and non-null GraphQL fields must exist in storage with the exact contract spelling for Cypher-ingested records: privacyClass PUBLIC|INTERNAL (catalog lowercase values are migrated), AssessmentStatus values (repository fixtures write 'FINAL'), archetype discriminator fields (entityType/stateType/occurrenceType/artifactType/assessmentType), id, createdAt, updatedAt, and on relationship episodes validFromBasis/validToBasis (default UNKNOWN). Leak checks must test both 'private-personal' and any upper-case spelling."
  cq: [CQ-AX-07, CQ-AX-12]
  primarySource: "Executed tests T4a-T4c (GraphQL enum serialization and non-null errors)."
  failingCase: "fixture 12: legacy shapes from examples/*.cypher raise GraphQL errors on read (T4)."
  proposedRuling: "Accept as ingestion contract (07-operations.md §6) plus migration (migration-map.yaml)."

- id: W00-SR-14
  kind: SEAM
  targetOwner: Fable (runtime prerequisites)
  request: "Record APOC Core as a runtime prerequisite of @neo4j/graphql 7.6.3 for any schema with DateTime fields (the generated Cypher calls apoc.date.convertFormat). The run harness must load apoc-core and apoc-common 5.26.31 (Maven Central)."
  cq: [CQ-TM-01, CQ-TM-03]
  primarySource: "S-09 Neo4j GraphQL docs 'Integrating the library': 'The APOC core plugin must be installed' (SEARCH_EXTRACT); executed: without APOC every DateTime read fails with \"Unknown function 'apoc.date.convertFormat'\"."
  failingCase: "Test T1 on plain 5.26.31 Community: assertions and sourceRevisionEvents queries fail; with apoc-core 5.26.31 they succeed."
  proposedRuling: "Accept; add to 00-baseline runtime pins and validation harness."

