  primarySource: "catalog identity_resolution.COMPARES_IDENTITIES; validation.cypher V-432."
  failingCase: "fixture 08: a well-formed EquivalenceAssessment with two COMPARES_IDENTITIES edges is reported by V-432 (comparedCount 0)."
