"""
A surface form extracted from a located span BEFORE any entity is created or chosen (e.g. "NR", "Dr.
Sinclair"). A mention is not an identity, not an endorsement ([MENTIONS_PRODUCT, ENDORSES_PRODUCT]) and not
evidence; candidate identities are ResolutionHypotheses that RESOLVE_MENTION it. Immutable. Archetype:
