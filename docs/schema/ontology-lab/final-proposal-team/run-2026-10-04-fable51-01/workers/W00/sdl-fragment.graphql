# 6. Unions (contract B6). CANDIDATE membership from 02-ownership-registry.md; Fable prunes members that do
#    not survive the merge. Parent-only rule: a specialization whose labels include a member's labels is
#    NOT listed (it is read through the parent; listing both returns each such node twice — executed probe).
# -----------------------------------------------------------------------------------------------------

"""
Range of HAS_SUBJECT / HAS_OBJECT (catalog: Entity|VersionedState|Occurrence|InformationArtifact), reused as
the range of HAS_IDENTIFIER (inverse), PROPOSES_MATCH and COMPARES_IDENTITIES (validation narrows those).
Members: every registry node type of those four archetypes, except (a) Assertion- and EvidenceAssessment-
archetype types (out of the catalog range; an assertion about an assertion is a SUPERSEDES/RETELLS/
QUALIFIED_BY structure, an assertion about an assessment is a new assessment), (b) specializations covered
by their parent (Document by Source; LegalEntity, RegulatoryAgency, TestingLaboratory by Organization;
BrandedIngredientMaterial, BotanicalPreparation, MicrobialPreparation, MaterialMixture by IngredientMaterial;
DrugApproval, OrphanDesignation by RegulatoryStatus; AdverseEventResult by StudyResult; TradeItemIdentifier
by Identifier), (c) regenerable retrieval records (Chunk, Segmentation), (d) W23 internal records
(AnswerRecord, PolicyVersion, DecisionCriterion) so no INTERNAL type is reachable through a public assertion,
(e) CohortParticipant (private-data seam CL-018), the DiagnosticResult interface and every CANDIDATE type.
"""
union AssertionSubjectTarget =
  # W00
    Source | SourceSnapshot | SourceLocator | SourceRevisionEvent | Agent | Activity | Identifier | Mention
  # W01
  | Organization | ConsumerBrand | Facility | OrganizationSnapshot | Person | PseudonymousActor | AnonymousActor
  # W02
