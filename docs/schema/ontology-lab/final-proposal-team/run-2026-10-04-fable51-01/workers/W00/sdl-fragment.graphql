"""
Assessment of how two DISTINCT identities relate when they look alike (same work under different names,
overlapping scope, related, not equivalent). It never merges them (round 0006, CQ-EC-02); identity claims
are ResolutionHypotheses. COMPARES_IDENTITIES has exactly two distinct targets (V-432 as corrected in
fixtures/validation-w00.cypher). The merge-redirect record named in contract A2 has no EquivalenceKind value
yet (W00-SR-05). Archetype: EvidenceAssessment. Module: identity_resolution. CQs: CQ-ID-04, CQ-AX-14.
"""
type EquivalenceAssessment implements Entity & EvidenceAssessmentArchetype
  @node(labels: ["EquivalenceAssessment", "EvidenceAssessment"])
  @mutation(operations: [CREATE, UPDATE]) {
