# -----------------------------------------------------------------------------------------------------
# 1. Shared GraphQL interfaces (contract B3)
# -----------------------------------------------------------------------------------------------------

"""
Live GraphQL interface shared by every node type of the final schema. It is a GraphQL interface, NOT the
`Entity` archetype label: a SourceSnapshot implements this interface but carries the `InformationArtifact`
archetype label. `uid` (`hu:<token>:<opaque>`) is the canonical identity; `id` is the opaque segment of
`uid` stored beside it (INV-106). `name` is presentation only and never identity; it is nullable (D-013) so
that Cypher-ingested kernel records without a display name are readable. `mongoResearchRunId` is the
operational last-writer pointer; authoritative lineage is WAS_GENERATED_BY an Activity whose
`externalRunId` equals it (V-430). Module: kernel. CQs: CQ-AX-09, CQ-ID-04.
"""
interface Entity {
  "Opaque segment of uid. API-created nodes get a UUID from @id; Cypher-ingested nodes must write it themselves."
  id: ID!
  "Canonical identity hu:<type-token>:<opaque>; uniqueness is created by operations.cypher, never by a directive."
  uid: String!
  "Presentation label only; never identity (D-013: nullable)."
  name: String
  "Free-text description; presentation only."
  description: String
  "Operational last-writer run id (internal); maps to Activity.externalRunId; never provenance."
  mongoResearchRunId: String
}

"""
Live retrieval surface. Derived search text and embeddings are regenerable projections that name their
derivation (`searchFields`, `embeddingModel`, `embeddingDimensions`) and are never evidence (INV-107).
Module: kernel. CQ: CQ-AX-14.
"""
interface SearchIndexable {
  "Derived text used by fulltext indexes; regenerable; never evidence."
  searchText: String
  "Stored property names searchText was derived from."
  searchFields: [String!]
  "Embedding model identifier for the embedding stored beside this node, if any."
  embeddingModel: String
  "Dimension of the stored embedding; must equal the vector length (V-119)."
  embeddingDimensions: Int
}

"""
Live compatibility interface for the live state caches (OrganizationSnapshot, ProductSnapshot; live
ListingSnapshot is retired by D-007). The node-level times are a cache of the node's first HAS_STATE
episode (round 0007 section 12); authority is the episode relationship (StateEpisodeProperties) and its
Assertion. Payload is frozen after commit except one write of `recordedTo` (V-513). Module: temporal.
CQ: CQ-TM-01.
"""
interface TemporalSnapshot {
  "Cache of the first episode's valid start (half-open; null = unknown)."
  validFrom: DateTime
  "Cache of the first episode's valid end (exclusive; null = unknown, never 'ongoing')."
  validTo: DateTime
  "Cache of the first episode's recorded start (service-assigned)."
  recordedFrom: DateTime
  "Cache of the first episode's recorded end (written once)."
  recordedTo: DateTime
}

"""
Live compatibility interface for actor identities that can assert (Person, PseudonymousActor,
AnonymousActor). `uid` is added (every implementer already implements Entity) and `name` is relaxed to
nullable for the same reason as D-013; both changes are backward compatible for implementers. An actor
identity is never an Agent (software/curator identity) and a handle-only speaker is a PseudonymousActor;
a link from a handle to a Person is a ResolutionHypothesis. Module: organizations (interface kept by W00).
CQ: CQ-EV-02, CQ-PV-01.
"""
interface ActorIdentity {
  "Opaque segment of uid."
  id: ID!
  "Canonical identity."
  uid: String!
  "Presentation label; never identity."
  name: String
  "Free-text description."
  description: String
  "Operational last-writer run id (internal)."
  mongoResearchRunId: String
}

"""
Archetype contract for persistent identities (archetype label `Entity`). `entityType` is the catalog node
name of the record (for example 'Source', 'Agent', 'Identifier') and is required on every stored node so the
archetype is readable without label introspection. Module: kernel (baseArchetypes.Entity).
"""
interface EntityArchetype {
  "Catalog node name of this identity."
  entityType: String!
}

"""
Archetype contract for bounded states (archetype label `VersionedState`). The state node holds payload plus
`payloadHash` (`sha256:<hex>` over canonicalized payload, D-016) and never its own valid or recorded time:
query validity comes from the attachment episode (StateEpisodeProperties). `effectiveFrom`/`effectiveTo`
are the source-stated payload period, a distinct clock (CQ-TM-03). Module: kernel.
"""
interface VersionedStateArchetype {
  "Catalog node name of this state."
  stateType: String!
  "sha256:<hex> over the canonicalized immutable payload; replay compares states by it."
  payloadHash: String!
  "Source-stated effective start printed in the payload (not query validity)."
  effectiveFrom: DateTime
  "Source-stated effective end printed in the payload (not query validity)."
  effectiveTo: DateTime
}

"""
Archetype contract for things that happened (archetype label `Occurrence`): activities, source revision
events, test executions, price observations. `startedAt`/`endedAt` are when it happened, never when
BellLabs recorded it. Module: kernel.
"""
interface OccurrenceArchetype {
  "Catalog node name of this occurrence."
  occurrenceType: String!
  "When the occurrence started (null = unknown)."
  startedAt: DateTime
  "When the occurrence ended (null = unknown or not ended)."
  endedAt: DateTime
}

"""
Archetype contract for representations and records (archetype label `InformationArtifact`).
`publishedAt` (issuer time), `observedAt` (seen as displayed) and the record's own capture clocks are
distinct (CQ-TM-03). `contentHash` is `sha256:<hex>` with a named basis where the type carries one.
Module: kernel.
"""
interface InformationArtifactArchetype {
  "Catalog node name of this artifact."
  artifactType: String!
  "Issuer's date for this version of the artifact."
  publishedAt: DateTime
  "When the content is known to have been displayed (archive capture time for late sources)."
  observedAt: DateTime
  "sha256:<hex> of the content (basis named on the type, e.g. SourceSnapshot.contentHashBasis)."
  contentHash: String
}

"""
Archetype contract for attributable propositions (archetype label `Assertion`). Exactly one subject
(HAS_SUBJECT) and exactly one object (HAS_OBJECT) or one typed literal (`valueString`, `valueNumber`,
`valueBoolean` with `unitCode`); at most one asserter (ASSERTED_BY). `status` is CAPTURE FIDELITY, a
current projection of CAPTURE_FIDELITY adjudications and SUPERSEDES records; it is never truth (INV-406).
Valid time and content are immutable after commit; `recordedAt` is service-assigned at commit and never
backdated; `recordedTo` is written once on supersession. `confidence` is deprecated (INV-407): use
`extractionConfidence` with WAS_GENERATED_BY an Activity. Module: kernel (baseArchetypes.Assertion).
CQs: CQ-EV-01, CQ-EV-02, CQ-TM-01, CQ-PV-04.
"""
interface AssertionArchetype {
  "Controlled predicate registered in the catalog (relationship names and assertedPredicates)."
  predicate: String!
  "Capture-fidelity status (current projection; never truth)."
  status: AssertionStatus!
  "Recorded-time start: service-assigned commit time; never backdated; never before supporting snapshot retrievedAt."
  recordedAt: DateTime!
  "Recorded-time end: written once from null when superseded; equals SUPERSEDES.recordedAt."
  recordedTo: DateTime
  "sha256:<hex> over canonicalized immutable content (required for new writes; service-enforced)."
  contentHash: String
  "Affirms, denies, mixed or unknown; 'not reported' is NOT a NEGATIVE assertion."
  polarity: Polarity
  "Epistemic basis; required when predicateClass is MECHANISM; CALCULATED needs derivationRule and DERIVED_FROM_ASSERTION inputs."
  basisKind: BasisKind
  "Coarse class of the predicate (candidate enum)."
  predicateClass: PredicateClass
  "Basis on which the asserter presents the proposition (round 0006)."
  assertionBasis: AssertionBasis
  "What this asserter does (states, reports practice, recommends ...)."
  speechAct: SpeechAct
  "Speech act this assertion attributes to another party (retellings)."
  reportedSpeechAct: SpeechAct
  "Typed literal (string); exclusive with HAS_OBJECT and the other literals."
  valueString: String
  "Typed literal (number) with unitCode; exclusive with HAS_OBJECT and the other literals."
  valueNumber: Float
  "Typed literal (boolean); exclusive with HAS_OBJECT and the other literals."
  valueBoolean: Boolean
  "UCUM unit of valueNumber."
  unitCode: String
  "Per-day / per-dose / per-serving basis of a quantity literal (catalog quantityBasis)."
  quantityBasis: QuantityBasis
  "Valid-time start (half-open, first instant of its precision period; null = unknown)."
  validFrom: DateTime
  "Valid-time end (exclusive; null = unknown, never 'ongoing'; no sentinel dates)."
  validTo: DateTime
  "Precision of validFrom; required when validFrom is non-null."
  validFromPrecision: TimePrecision
  "Precision of validTo; required when validTo is non-null."
  validToPrecision: TimePrecision
  "Why validFrom has its value; OBSERVATION_ONLY/UNKNOWN force a null bound; INFERRED needs derivationRule."
  validFromBasis: ValidTimeBasis
  "Why validTo has its value; same rules as validFromBasis."
  validToBasis: ValidTimeBasis
  "Jurisdiction scope of the proposition (ISO 3166 code or catalog jurisdiction string)."
  jurisdiction: String
  "Named rule for a CALCULATED assertion or an INFERRED bound (e.g. successor_state_start)."
  derivationRule: String
  "Legacy extraction method label; authoritative method is the WAS_GENERATED_BY Activity.methodVersion."
  extractionMethod: String
  "Extraction dimension of the confidence vector; requires WAS_GENERATED_BY an Activity (V-428)."
  extractionConfidence: Float
  "DEPRECATED 0.1.0 run pointer; new writes link WAS_GENERATED_BY an Activity."
  agentRunUid: String
  "DEPRECATED (INV-407): read as extractionConfidence with unknown method; never written by new ingestion."
  confidence: Float
}

"""
Archetype contract for adjudicated evaluations (archetype label `EvidenceAssessment`). Immutable; a
re-assessment is a new node linked by SUPERSEDES (KCR-2a). `methodVersion` is required: a score without a
method is not one of the confidence-vector dimensions. `status` is the workflow state of the assessment
record (AssessmentStatus), never the verdict and never an Assertion status. Module: kernel.
CQs: CQ-EV-02, CQ-AX-09.
"""
interface EvidenceAssessmentArchetype {
  "Catalog node name of this assessment."
  assessmentType: String!
  "Identifier and version of the method or policy that produced it."
  methodVersion: String!
  "Workflow state of the assessment record."
  status: AssessmentStatus!
  "Service-assigned commit time; never backdated."
  recordedAt: DateTime!
  "Written once from null when superseded."
  recordedTo: DateTime
  "Short human-readable summary (not a verdict field)."
  summary: String
  "Composite score; allowed only with methodVersion and every required dimension (INV-204)."
  overallScore: Float
  "DEPRECATED generic confidence; name the dimension instead."
  confidence: Float
}

# -----------------------------------------------------------------------------------------------------
# 2. Shared relationship-property types (contract B4)
# -----------------------------------------------------------------------------------------------------

"""
asserted_edge profile (catalog temporalProfiles.asserted_edge; K-1, D-011). An asserted edge is a
regenerable projection of exactly one Assertion: one relationship per recorded-time episode. `assertionUid`
names that Assertion; its predicate equals the edge type and its subject/object equal the edge endpoints.
Valid bounds, precisions and bases equal the Assertion's (V-505); `recordedFrom >= assertion.recordedAt`
and is service-assigned; `recordedTo` is written once and equals the Assertion's `recordedTo` once closed.
All other properties are immutable. Never carries `projectionOfAssertionUid` (that is DerivedEdgeProperties).
A domain specialization (e.g. RoleEdgeProperties) must contain every field below and say so.
"""
type AssertedEdgeProperties @relationshipProperties {
  "Stable audit id hu:rel:<opaque>; MERGE key for parallel episodes."
  relationshipUid: String!
  "uid of the one Assertion that authorizes this edge."
  assertionUid: String!
  "Copied from the Assertion; null = unknown."
  validFrom: DateTime
  "Copied from the Assertion; null = unknown, never 'ongoing'."
  validTo: DateTime
  "Copied from the Assertion."
  validFromPrecision: TimePrecision
  "Copied from the Assertion."
  validToPrecision: TimePrecision
  "Copied from the Assertion; UNKNOWN when the bound is null and no basis is stated."
  validFromBasis: ValidTimeBasis!
  "Copied from the Assertion; UNKNOWN when the bound is null and no basis is stated."
  validToBasis: ValidTimeBasis!
  "Service-assigned commit time of this episode; never client-supplied."
  recordedFrom: DateTime!
  "Written once from null when the episode is closed."
  recordedTo: DateTime
  "Operational last-writer run id (internal)."
  mongoResearchRunId: String
}

"""
bitemporal_attachment profile (catalog temporalProfiles.bitemporal_attachment, round 0007) for state
attachments: HAS_STATE and domain attachments such as HAS_FORMULATION_VERSION, HAS_REGISTRATION_VERSION,
HAS_PROTOCOL_EDITION, HAS_PACKAGE_CONFIGURATION. One relationship per recorded-time episode; immutable
except one write of `recordedTo`. `assertionUid` is nullable in SDL only because the profile is shared with
the external private store; in the shared graph every attachment is source-derived and V-101 requires it.
EXCLUSIVE types (catalog predicateExclusivity) may not definitely overlap in valid and recorded time.
"""
type StateEpisodeProperties @relationshipProperties {
  "Stable audit id hu:rel:<opaque>."
  relationshipUid: String!
  "Authorizing Assertion uid (required in the shared graph)."
  assertionUid: String
  "Valid start; null = unknown."
  validFrom: DateTime
  "Valid end (exclusive); null = unknown."
  validTo: DateTime
  "Required when validFrom is non-null."
  validFromPrecision: TimePrecision
  "Required when validTo is non-null."
  validToPrecision: TimePrecision
  "Basis of validFrom."
  validFromBasis: ValidTimeBasis!
  "Basis of validTo."
  validToBasis: ValidTimeBasis!
  "Service-assigned commit time; never backdated."
  recordedFrom: DateTime!
  "Written once from null."
  recordedTo: DateTime
  "Operational last-writer run id (internal)."
  mongoResearchRunId: String
}

"""
Derived edge (catalog relationshipClasses.derived; K-2, D-011): a regenerable traversal shortcut that is
never the only history. Exactly one citation form: `projectionOfAssertionUid` (1:1 projection; the cited
predicate equals the edge type), or `derivationRule` plus `derivedFromAssertionUids`, or `derivationRule`
plus `derivedFromAssessmentUids` (an EvidenceAssessment licenses it; a ResolutionHypothesis uid goes here,
which is how INSTANCE_OF records its `hypothesisUid`), or `derivationRule` alone only for catalog
`ruleOnly: true` types. The cited or input predicate is never the premise of a forbidden implication for
the edge type (V-112). Never carries `assertionUid`.
"""
type DerivedEdgeProperties @relationshipProperties {
  "uid of the single Assertion this edge projects (1:1 projection)."
  projectionOfAssertionUid: String
  "Identifier and version of the derivation rule (e.g. contains/v1)."
  derivationRule: String
  "Assertions the rule consumed (non-empty when derivationRule is set, unless ruleOnly or assessment-licensed)."
  derivedFromAssertionUids: [String!]
  "EvidenceAssessments (incl. ResolutionHypothesis) that license the derivation."
  derivedFromAssessmentUids: [String!]
  "When the projection job wrote this edge (operational)."
  derivedAt: DateTime
  "Operational last-writer run id (internal)."
  mongoResearchRunId: String
}

"""
Structural edge with optional ordering: part of the internal shape of one captured record (catalog
relationshipClasses.structural). Needs no Assertion. `orderIndex` orders siblings when the source orders them.
"""
type StructuralEdgeProperties @relationshipProperties {
  "Zero-based order among siblings, when the source orders them."
  orderIndex: Int
  "Operational note; never evidence."
  notes: String
  "Operational last-writer run id (internal)."
  mongoResearchRunId: String
}

"""
SUPERSEDES qualifiers (K-4, round 0007). Newer → older, like label to like label (Assertion, Adjudication,
or one EvidenceAssessment type). `recordedAt` equals the newer record's recordedAt and the older record's
recordedTo. SOURCE_CORRECTION = the source changed content (the corrected state has no current attachment
for the corrected interval); VALIDITY_BOUNDED = same content, an end became known (old state stays
attached for its bounded interval). `sourceRevisionEventUid` names the SourceRevisionEvent when one exists.
"""
type SupersessionProperties @relationshipProperties {
  "Why the newer record replaced the older one."
  supersessionKind: SupersessionKind!
  "Commit time of the supersession (service-assigned)."
  recordedAt: DateTime!
  "uid of the SourceRevisionEvent that triggered it, if any."
  sourceRevisionEventUid: String
}

"""
AUTHORIZED_BY qualifier (provenance state 5): which downstream use a PolicyVersion allowed for one Activity.
PROV-O has no permission vocabulary; the semantics are BellLabs-defined. Internal.
"""
type AuthorizationProperties @relationshipProperties {
  "The use the policy allowed."
  useKind: UseKind!
}

"""
REANCHORS qualifier: newer-snapshot locator → older-snapshot locator of the same Source (V-409). Re-anchoring
never mutates the old locator; failure to re-anchor creates no edge and never means the passage was removed.
"""
type ReanchorProperties @relationshipProperties {
  "EXACT or FUZZY match of the quote anchor."
  anchorMatch: AnchorMatch!
  "uid of the REANCHORING Activity that produced the match."
  activityUid: String
}

"""
HAS_IDENTIFIER episode (asserted; asserted_edge profile plus `isPrimary`). The validity of the ASSIGNMENT of
an identifier to a record lives here; the Identifier node holds only the identifier string's own scheme,
issuer, value and scheme-level validity. A shared (scheme, value) across issuers never establishes identity.
Specializes AssertedEdgeProperties (contains every field of it).
"""
type IdentifierLinkProperties @relationshipProperties {
  "Stable audit id hu:rel:<opaque>."
  relationshipUid: String!
  "Authorizing Assertion (predicate HAS_IDENTIFIER)."
  assertionUid: String!
  "Start of the assignment; null = unknown."
  validFrom: DateTime
  "End of the assignment (exclusive); null = unknown."
  validTo: DateTime
  "Required when validFrom is non-null."
  validFromPrecision: TimePrecision
  "Required when validTo is non-null."
  validToPrecision: TimePrecision
  "Basis of validFrom."
  validFromBasis: ValidTimeBasis!
  "Basis of validTo."
  validToBasis: ValidTimeBasis!
  "Service-assigned commit time."
  recordedFrom: DateTime!
  "Written once from null."
  recordedTo: DateTime
  "Whether the source presents it as the record's primary identifier in its scheme."
  isPrimary: Boolean
  "Operational last-writer run id (internal)."
  mongoResearchRunId: String
}

