"""
Range of ASSERTED_BY (catalog: Person|Organization|Agent|PseudonymousActor|AnonymousActor; KCR-4.3). At most
one per Assertion; exactly one per ClaimOccurrence. Organization covers its specializations (LegalEntity,
RegulatoryAgency, TestingLaboratory). The asserter's affiliation is never encoded in the assertion; it is
computed from time-bounded role assertions.
"""
union AsserterTarget = Person | Organization | Agent | PseudonymousActor | AnonymousActor

"""
Domain of SUPPORTED_BY / CONTRADICTED_BY seen from the SourceLocator (catalog: Assertion|Adjudication|
EvidenceAssessment). `Assertion` covers ClaimOccurrence and RelationshipAssertion (parent-only rule); the
EvidenceAssessment members are the catalog EvidenceAssessment-archetype types (CANDIDATE list; pruned by Fable).
"""
union SupportedRecordTarget =
    Assertion | Adjudication | ResolutionHypothesis | EquivalenceAssessment
  | EvidenceApplicability | ApplicabilityDimension | EndpointClassification | ResultInterpretation
  | EvidenceSynthesis | EvidenceStrengthAssessment
  | ClaimEvidenceAssessment | RetellingFidelityAssessment | ConflictRelevanceAssessment
  | ComparabilityAssessment | PassFailInterpretation | CommerceMatch
