  | Constituent | Nutrient
  # W03
  | Mechanism | Pathway | MolecularEntity | Species | AnatomicalContext | Organ | Outcome | Condition
  | RiskFactor | MechanismEvidenceContext | Association
  # W04
  | Product | ProductVariant | PackageConfiguration | ProductSnapshot | FormulationVersion | IngredientComponent
  | LabelSnapshot | LabelDeclaration | ServingDefinition | QuantityDeclaration
  # W05
  | FoodItem | FoodProduct | Exposure | Lifestyle
  # W06
  | Treatment | Procedure
  # W07
  | Biomarker | Metric | LabTest | PanelDefinition | MeasurementMethod | Specimen | ReferenceSystem
  | AssayVersion | Algorithm | AlgorithmVersion | ReferenceIntervalVersion | ReferenceRange
  # W08
  | TechnologyPlatform | ToolOrInstrument | Device | Sensor | Modality
  # W09
  | Study | TrialRegistration | RegistrationVersion | ProtocolVersion | StudyArm | StudyIntervention
  | InterventionComponent | StudyPopulation | OutcomeDefinition | StudyResult | Publication | Dataset
  # W10
  | UseContextProfile
  # W11
  | ManufacturingSpecification | SpecificationVersion | ManufacturingProcess | ManufacturingStep
  | ManufacturingCapability
  # W12
  | ProductLot | TestSample | TestExecution | TestMethod | MeasuredResult | SpecificationCriterion
  | LotTestSummary | CertificateOfAnalysis | CertificationProgram | CertificationListing | CertificationScope
  # W13
  | RegulatoryPathway | RegulatoryStep | RegulatorySubmission | RegulatoryResponse | RegulatoryStatus
  # W14
  | PatentFamily | PatentApplication | GrantedPatent | PatentClaim | PatentLicense | Trademark
  # W15
  | MerchantListing | Offer | PriceObservation | SubscriptionPlan | Bundle | BundleComponent | InventoryItem
  | IndividualUnit | AffiliateLink
