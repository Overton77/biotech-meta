"Privacy class of a shared-graph element. There is no private-personal value: private records never enter the shared graph (D-012, INV-506). Stored values are these SCREAMING_SNAKE spellings."
enum PrivacyClass {
  PUBLIC
  INTERNAL
}

"Schema maturity of a node type or record (catalog conventions.nodeMaturity)."
enum NodeMaturity {
  CANDIDATE
  PROVISIONAL
  ACCEPTED
  DEPRECATED
}

"Capture-fidelity workflow status of an Assertion (catalog assertionStatus). ACCEPTED = accepted as an accurate record of what the asserter said in this source; never truth."
enum AssertionStatus {
  EXTRACTED
  PROPOSED
  ACCEPTED
  REJECTED
  DISPUTED
  SUPERSEDED
  UNRESOLVED
}

"Workflow state of an EvidenceAssessment record (contract B5). Not a verdict."
enum AssessmentStatus {
  PROPOSED
  ACCEPTED
  SUPERSEDED
  WITHDRAWN
}

"CAPTURE_FIDELITY judges the record (feeds Assertion.status); SUPPORT judges the proposition (never changes status)."
enum AdjudicationKind {
  CAPTURE_FIDELITY
  SUPPORT
}

"Adjudication verdict; meaning depends on AdjudicationKind (catalog verdictSemantics)."
enum AdjudicationVerdict {
  SUPPORTED
  PARTIALLY_SUPPORTED
  CONTRADICTED
  INSUFFICIENT
  NOT_APPLICABLE
}

"Who reviewed: a person, an agent, an automated policy, or the 0.2.0 migration."
enum ReviewerType {
  HUMAN
  AGENT
  POLICY
  MIGRATION
}

"Epistemic basis of a proposition (rounds 0003 and 0005)."
enum BasisKind {
  DIRECT_MEASUREMENT
  INFERRED_FROM_MEASUREMENT
  CITED_FROM_PRIOR_WORK
  HYPOTHESIS
  CALCULATED
}

"CANDIDATE (contract B5, owner W00): coarse predicate class; MECHANISM requires basisKind (INV-210)."
enum PredicateClass {
  MECHANISM
  ROLE
  COMMERCIAL
  REGULATORY
  QUANTITY
  IDENTITY
  CLAIM
  OTHER
}

"On what basis the asserter presents the proposition (round 0006); distinct from basisKind and ClaimType."
enum AssertionBasis {
  PERSONAL_EXPERIENCE
  THIRD_PARTY_ANECDOTE
  MANUFACTURER_CLAIM
  STUDY_RESULT
  MECHANISM_REASONING
  EXPERT_OPINION
  UNSTATED
}

"What an utterance does; a practice report is not a recommendation."
enum SpeechAct {
  STATES
  REPORTS_PRACTICE
  RECOMMENDS
  CAUTIONS
  SPECULATES
  QUESTIONS
  DENIES
}

"Polarity of the proposition; NEGATIVE needs its own assertion and is never inferred from absence."
enum Polarity {
  POSITIVE
  NEGATIVE
  MIXED
  UNKNOWN
}

"Precision of a time bound; a bound is stored as the first UTC instant of its precision period."
enum TimePrecision {
  INSTANT
  DAY
  MONTH
  QUARTER
  YEAR
  DECADE
}

"Why a valid-time bound has its value (per bound)."
enum ValidTimeBasis {
  STATED_BY_SOURCE
  PUBLICATION_PROXY
  OBSERVATION_ONLY
  INFERRED
  UNKNOWN
}

"Why a newer record superseded an older one."
enum SupersessionKind {
  SOURCE_CORRECTION
  VALIDITY_BOUNDED
  EXTRACTION_FIX
  RESOLUTION_FIX
  DUPLICATE_MERGE
  RE_REVIEW
  SOURCE_REVISION
}

"Publisher revision kind (NLM publication types plus web silent change)."
