    under the edge property name, typed by the owner, copied to the edge and covered by contentHash. Generic key/value string lists on Assertion (W09 option
    a) are rejected: untyped and outside the owners'' enums. Failing case W09 fixtures/03 (analysisRole in valueString -> V-003 rows).'
