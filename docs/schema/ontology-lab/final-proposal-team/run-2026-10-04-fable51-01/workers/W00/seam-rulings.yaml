    Refinement specializations (a node may gain the label later) use the parent token (T2: LegalEntity, RegulatoryAgency, TestingLaboratory -> org; IngredientMaterial
    subtypes and FoodItem -> material; Organ -> anatomical-context; LabelSnapshot -> snapshot; DrugApproval, OrphanDesignation -> regulatory-status). Creation-time
    kinds may carry their own token (T3: Document, ClaimOccurrence, AdverseEventResult, CohortParticipant, SourceDiscoveryRecord, TradeItemIdentifier).
    Collisions: platform = W21 Platform, TechnologyPlatform = technology-platform (W08 yields, as W08 proposed); outcome = W03 Outcome, OutcomeDefinition
    = outcome-definition; SpecificationCriterion = spec-criterion (owner W12 over W11 suggestion; W11 fallback: migrate). experience-report rejected (type
    retired). 16 merged-fragment labels still have no token (owners W10, W17, W18, W21 assessments, W08 ToolOrInstrument); V-W00-16 reports them as LABEL_HAS_NO_TOKEN.'
  artifacts: uid-token-registry.yaml; V-W00-16; fixtures/validation-params-w00.json uidTypeTokens
- rulingId: W00-R-02
  theme: 'QUANTITY assertions: object plus quantity'
  ruling: 'For predicateClass QUANTITY only, an Assertion may carry one HAS_OBJECT plus one numeric literal (valueNumber + unitCode, with quantityBasis,
    massBasis, amountReferent); objects + literals >= 1 and valueString/valueBoolean never ride with an object. Every other class keeps INV-003 literal-xor-object.
    Failing cases: W02 fx-91 (two literal-only CALCULATED amounts, refersTo null), W04 w04-03 (component -> NR cation 263.42 mg fails V-003), W07-SR-13
    (CHANGED_BETWEEN delta). W01-SR-22 (stake) is COMMERCIAL and keeps its workaround; the QUANTITY route is its future path. W04 literal-only fallback
    stays valid.'
