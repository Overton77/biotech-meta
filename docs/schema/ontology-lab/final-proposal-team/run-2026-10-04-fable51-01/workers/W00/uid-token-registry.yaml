registry: uidTypeTokens (keyed by primary label) - W00 reconciliation pass, run-2026-10-04-fable51-01
rulingId: W00-R-01
rules:
  T1: One token per primary label; the uid is hu:<token>:<opaque>; the token is lower-case kebab and never encodes a name.
  T2: 'Refinement specialization (a node of the parent type may later gain the specialization label: LegalEntity, RegulatoryAgency, TestingLaboratory,
    the IngredientMaterial subtypes, FoodItem, Organ, LabelSnapshot, DrugApproval, OrphanDesignation) uses the PARENT token, because uid is immutable
    and reclassification must not mint a new identity (W02-SR-03 failing case fx-02; W05-SR-01; W03-SR-04; W13-SR-02).'
  T3: 'Creation-time kind (the specialization label is fixed when the record is created: Document, ClaimOccurrence, AdverseEventResult, CohortParticipant,
    SourceDiscoveryRecord) may carry its own token; the catalog 0.2.0 precedents Document: document and ClaimOccurrence: claim-occurrence are
    kept.'
  T4: Lower-case alias keys of catalog 0.2.0 (fixture tokens) stay valid for 0.2.0 fixtures only; production ingestion uses the label-keyed token.
    V-W00-16 checks the label-keyed map.
  T5: Retired types (MR-02) get no token; their nodes migrate to the successor type and token with a SAME_IDENTITY_MERGED redirect when the token
    changes.
