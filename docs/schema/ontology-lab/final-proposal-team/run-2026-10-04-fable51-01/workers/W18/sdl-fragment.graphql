# -----------------------------------------------------------------------------------------------------
# Enums (owner W18)
# -----------------------------------------------------------------------------------------------------

"""
Coarse category of a public occurrence for timelines and facets. A category says what kind of occurrence was
reported; it is never a truth, impact or status value. Live values kept unchanged; finer kinds (FILING, APPROVAL,
LAUNCH, TOPLINE_READOUT, PRESENTATION, SHARE_PRICE_MOVE ...) go in Event.eventType (controlled string). Owner W18;
new values only by ledger request.
"""
enum EventCategory {
  CORPORATE_EVENT
  FINANCING_EVENT
  MNA_EVENT
  PARTNERSHIP_EVENT
  LICENSING_EVENT
  REGULATORY_EVENT
  CLINICAL_EVENT
  RESEARCH_EVENT
  PRODUCT_EVENT
  MANUFACTURING_EVENT
  FACILITY_EVENT
  HIRING_EVENT
  LEADERSHIP_EVENT
  BOARD_EVENT
  LEGAL_EVENT
  LITIGATION_EVENT
  POLICY_EVENT
  MARKET_EVENT
  COMMERCIAL_EVENT
  CONFERENCE_EVENT
  MEDIA_EVENT
  SAFETY_EVENT
  RECALL_EVENT
  DATA_READOUT_EVENT
  OTHER
  UNKNOWN
}

"""
Ordinal impact level. Used only as the value of an EventImpactAssessment (method-versioned, scoped to one event and
optionally one affected subject). It is never a bare property of an Event (the live Event.impactLevel is retired:
one stored value cannot say who judged, for whom, or by which method). UNKNOWN = assessed but undeterminable; an
event with no assessment is NOT_ASSESSED by absence, never UNKNOWN. Live values kept. Owner W18.
"""
enum ImpactLevel {
  LOW
  MODERATE
  HIGH
  CRITICAL
  UNKNOWN
}

"""
Reported lifecycle of an occurrence, materialized from the event's assertions (EVENT_SCHEDULED, EVENT_OCCURRED,
EVENT_CANCELLED, EVENT_EFFECTIVE) as recorded; it is capture of what sources said, never truth. PLANNED: only a
future-tense scheduling statement exists. ANNOUNCED: legacy value -- an intention was disclosed without a schedule
(new writes use PLANNED with a null or coarse date). IN_PROGRESS: a source states the occurrence has started and not
ended. COMPLETED: an EVENT_OCCURRED assertion exists. CANCELLED, DELAYED: stated by a source. UNKNOWN: no lifecycle
statement captured. A PLANNED event never becomes COMPLETED by the passage of its planned date (W18-V13). Owner W18.
"""
enum EventStatus {
  PLANNED
  ANNOUNCED
  IN_PROGRESS
  COMPLETED
  CANCELLED
  DELAYED
  UNKNOWN
}

# -----------------------------------------------------------------------------------------------------
# Unions (owner W18)
# -----------------------------------------------------------------------------------------------------

"""
Range of INVOLVES: the parties that took part in an occurrence (applicant, decision maker, presenter, acquirer,
counterparty, host). Things an event concerns (a product, a study, a substance) are subjects (EventSubjectTarget),
not participants. Replaces the live union EventParticipant, whose members Product, Compound, Study,
TechnologyPlatform, Treatment and Procedure move to EventSubjectTarget. Agencies are Organization nodes
(["RegulatoryAgency","Organization","Entity"]) and resolve through Organization.
"""
union EventParticipantTarget = Organization | Person | Community

"""
Range of EVENT_ABOUT (Event) and ARC_ABOUT, IMPACT_ON (assessments): what an occurrence or an arc concerns. Replaces
the live union EventSubject (Compound -> ChemicalSubstance per D-002; Conference and Publication added because a
conference can be the subject of a cancellation event and a publication of a publication event).
"""
union EventSubjectTarget =
    Organization | Person | Product | ChemicalSubstance | Study | Condition | TechnologyPlatform | Protocol
  | Treatment | Procedure | SafetySignal | AdverseEffect | Lifestyle | Conference | Publication

"""
Range of SPONSORS_CONTENT (relationship type owned and written by W21; catalog round 0006:
Organization|ConsumerBrand -> Episode|Series|Channel|Document|Conference). Defined here because it is the conference
seam; W21 and W01 consume it for Organization.sponsorsContent / ConsumerBrand.sponsorsContent. Replaces live union
Sponsorable (Conference | Channel | Episode), adding Series and Document. Sponsorship is a FINANCIAL_INTEREST
member and never implies endorsement by the sponsor, by the host, or of any product shown (catalog
forbiddenImplications [SPONSORS_CONTENT, ENDORSES_PRODUCT]; W18 adds [SPONSORS_CONTENT, HOSTS_EVENT]).
"""
union SponsorableTarget = Conference | Channel | Episode | Series | Document

"""
Range of DOCUMENTED_BY_RECORD: the domain record that is the authoritative representation of the same occurrence
(the agency response for an approval, the publication record for a publication event, the registry version for a
registry change). The record keeps its owner's semantics (W13, W09); the Event is the timeline occurrence and never
duplicates the record's fields. Registry admission requested (W18-SR-03).
"""
union EventRecordTarget = RegulatoryResponse | RegulatorySubmission | DrugApproval | Publication | RegistrationVersion

# -----------------------------------------------------------------------------------------------------
# Relationship-property types (owner W18; each contains every field of the frozen W00 type it specializes)
# -----------------------------------------------------------------------------------------------------

"""
Properties of the asserted role edges INVOLVES (Event -> participant), SPEAKS_AT (Person -> Event), ATTENDS
(Person -> Conference) and EXHIBITS_AT (Organization -> Conference). Contains every field of the frozen
AssertedEdgeProperties (W00) and adds the event role. Successor of live RoleMetadata on these edges. A role at an
event is not an organizational role: "Bill Sibold, CEO" in a speaker listing is roleTitleVerbatim here and never
creates EMPLOYED_BY (W01).
"""
type EventRoleEdgeProperties @relationshipProperties {
  relationshipUid: String!
  assertionUid: String!
  validFrom: DateTime
  validTo: DateTime
  validFromPrecision: TimePrecision
  validToPrecision: TimePrecision
  validFromBasis: ValidTimeBasis!
  validToBasis: ValidTimeBasis!
  recordedFrom: DateTime!
  recordedTo: DateTime
  mongoResearchRunId: String
  """Controlled string: PRESENTER, SPEAKER, MODERATOR, PANELIST, HOST, ORGANIZER, EXHIBITOR, ATTENDEE, APPLICANT, DECISION_MAKER, ANNOUNCER, ACQUIRER, TARGET, LICENSOR, LICENSEE, COUNTERPARTY, OTHER."""
  participantRole: String!
  """Role or title exactly as printed in the source (never normalized by guesswork)."""
  roleTitleVerbatim: String
}

"""
Properties of the asserted edge CAUSED_BY (effect Event -> cause Event). Contains every field of the frozen
AssertedEdgeProperties (W00) and copies three kernel fields of the authorizing Assertion so that the edge cannot be
read without its epistemic basis: basisKind (required; W18-V01), assertionBasis, speechAct. A CAUSED_BY edge exists
only as the projection of one Assertion with predicate CAUSED_BY and polarity POSITIVE; temporal order
(FOLLOWED_BY), membership in a narrative arc, or a regulatory "based on" statement is never its premise
(forbidden implications [FOLLOWED_BY, CAUSED_BY], [ARC_INCLUDES_EVENT, CAUSED_BY]). The edge carries no truth: support
is a SUPPORT Adjudication on the assertion.
"""
type CausalEdgeProperties @relationshipProperties {
  relationshipUid: String!
  assertionUid: String!
  validFrom: DateTime
  validTo: DateTime
  validFromPrecision: TimePrecision
  validToPrecision: TimePrecision
  validFromBasis: ValidTimeBasis!
  validToBasis: ValidTimeBasis!
  recordedFrom: DateTime!
  recordedTo: DateTime
  mongoResearchRunId: String
  """Epistemic basis of the causal claim in the source (equals the assertion's basisKind)."""
  basisKind: BasisKind!
  """On what basis the asserter presents it (equals the assertion's assertionBasis)."""
  assertionBasis: AssertionBasis
  """Speech act of the authorizing assertion (STATES vs SPECULATES matters for causal claims)."""
  speechAct: SpeechAct
}

"""
Properties of the asserted edge RECORDING_OF (Episode -> Event): the publisher or host states that this published
audio/video work records that occurrence. Contains every field of AssertedEdgeProperties and adds coverage. A
recording is a separate work (W21 Episode); its renditions, transcripts and media times belong to W21/W00. A slide
deck shown at the same occurrence is PRESENTED_AT the Event and is never RENDITION_OF the recording (CL-003 R4).
"""
type RecordingEdgeProperties @relationshipProperties {
  relationshipUid: String!
  assertionUid: String!
  validFrom: DateTime
  validTo: DateTime
  validFromPrecision: TimePrecision
  validToPrecision: TimePrecision
  validFromBasis: ValidTimeBasis!
  validToBasis: ValidTimeBasis!
  recordedFrom: DateTime!
  recordedTo: DateTime
  mongoResearchRunId: String
  """Controlled string: FULL, PARTIAL, EXCERPT, UNKNOWN (how much of the occurrence the recording is stated to cover)."""
  recordingCoverage: String!
}

