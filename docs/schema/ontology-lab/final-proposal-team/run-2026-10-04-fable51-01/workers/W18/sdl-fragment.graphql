"""
A self-identified group without its own legal identity whose members share a field, condition or practice (a
patient community, an online forum, a scientific interest group). It is an Entity. It is NOT an Organization (a
society with legal identity such as AASLD is an Organization, W01), NOT a Channel or Series (W21) and NOT a
membership roster: membership of persons is private behaviour data and is never stored in the shared graph
(contract A9). Its only shared-graph role is hosting events and appearing as an event participant. Serves
CQ-EN-C04 (who hosted the occurrence). Module events_and_narrative; archetype Entity; uid token `community`
(requested, W18-SR-01). Maturity CANDIDATE: kept as the live seam; no failing case requires more.
"""
type Community implements Entity & EntityArchetype
  @node(labels: ["Community", "Entity"]) {
  id: ID! @id
  uid: String!
  name: String
  description: String
  mongoResearchRunId: String
  createdAt: DateTime! @timestamp(operations: [CREATE])
  updatedAt: DateTime! @timestamp(operations: [CREATE, UPDATE])
  privacyClass: PrivacyClass
  maturity: NodeMaturity
  schemaVersion: String
  "Always 'Community'."
  entityType: String!
  """Controlled string: PATIENT_COMMUNITY, ONLINE_FORUM, SCIENTIFIC_INTEREST_GROUP, PROFESSIONAL_NETWORK, OTHER."""
  communityType: String
  """class: asserted (AssertedEdgeProperties); cardinality: many; catalog: HOSTS_EVENT (live Community.hostsEvents)"""
  hostsEvents: [Event!]! @relationship(type: "HOSTS_EVENT", direction: OUT, properties: "AssertedEdgeProperties")
  """class: asserted (AssertedEdgeProperties); cardinality: many; catalog: HOSTS_EVENT"""
  hostsConferences: [Conference!]! @relationship(type: "HOSTS_EVENT", direction: OUT, properties: "AssertedEdgeProperties")
  """class: asserted (EventRoleEdgeProperties); cardinality: many; catalog: INVOLVES (inverse view)"""
  involvedInEvents: [Event!]! @relationship(type: "INVOLVES", direction: IN, properties: "EventRoleEdgeProperties")
}

"""
One edition of an organized meeting as announced by its organizer: "44th Annual J.P. Morgan Healthcare Conference"
(San Francisco, 2026-01-12 to 2026-01-15), "The Liver Meeting 2026" (Denver, 2026-11-05 to 2026-11-09). It is an
Entity: the edition identity exists before, and independently of, its holding (it is announced, sponsored and
exhibited at, and it can be postponed, moved online or cancelled -- those are Events EVENT_ABOUT the Conference). It
is NOT the recurring series (seriesName is presentation only; a series identity is CANDIDATE, see model cards), NOT a
session (a talk is an Event HAS_EVENT from the conference), NOT a recording (W21 Episode) and NOT an Organization
(the host is HOSTS_EVENT; a conference named after a bank is not thereby hosted by it). startDate/endDate are the
organizer-stated local calendar dates (inclusive, as printed), not valid-time bounds. Serves CQ-EN-C04, CQ-EC-01
(qualified participation). Module events_and_narrative; archetype Entity; uid token `conference` (requested).
"""
type Conference implements Entity & EntityArchetype
  @node(labels: ["Conference", "Entity"]) {
  id: ID! @id
  uid: String!
  name: String
  description: String
  mongoResearchRunId: String
  createdAt: DateTime! @timestamp(operations: [CREATE])
  updatedAt: DateTime! @timestamp(operations: [CREATE, UPDATE])
  privacyClass: PrivacyClass
  maturity: NodeMaturity
  schemaVersion: String
  "Always 'Conference'."
  entityType: String!
  """Controlled string: SCIENTIFIC_CONGRESS, INVESTOR_CONFERENCE, TRADE_SHOW, PATIENT_MEETING, REGULATORY_MEETING, WEBINAR_PROGRAM, OTHER."""
  conferenceType: String
  """Name of the recurring series as printed (e.g. 'The Liver Meeting'); presentation only, never identity."""
  seriesName: String
  """Edition label as printed (e.g. '44th Annual', 'TLM 2026')."""
  editionLabel: String
  """First day as stated by the organizer (local calendar date). Live DateTime retyped to Date (migration-map)."""
  startDate: Date
  """Last day as stated by the organizer (local calendar date, inclusive as printed)."""
  endDate: Date
  """IANA time zone of the venue (e.g. America/Los_Angeles); session instants are stored in UTC on Event."""
  timeZone: String
  """Venue/city text as printed; presentation only (venue Facility deferred, CL-015)."""
  location: String
  """Controlled string: IN_PERSON, VIRTUAL, HYBRID, UNKNOWN."""
  attendanceMode: String
  """Organizer page URL; presentation only. The page is a Source with snapshots; this string is never a locator."""
  websiteUrl: String
  """class: asserted (AssertedEdgeProperties); cardinality: many (usually one); catalog: HOSTS_EVENT"""
  hostedByOrganizations: [Organization!]! @relationship(type: "HOSTS_EVENT", direction: IN, properties: "AssertedEdgeProperties")
  """class: asserted (AssertedEdgeProperties); cardinality: many; catalog: HOSTS_EVENT"""
  hostedByCommunities: [Community!]! @relationship(type: "HOSTS_EVENT", direction: IN, properties: "AssertedEdgeProperties")
  """class: structural (StructuralEdgeProperties, orderIndex = program order); cardinality: many; catalog: HAS_EVENT (live Conference.hasEvents)"""
  hasEvents: [Event!]! @relationship(type: "HAS_EVENT", direction: OUT, properties: "StructuralEdgeProperties")
  """class: asserted (EventRoleEdgeProperties); cardinality: many; catalog: EXHIBITS_AT (live Organization.exhibitsAt, inverse view)"""
  exhibitors: [Organization!]! @relationship(type: "EXHIBITS_AT", direction: IN, properties: "EventRoleEdgeProperties")
  """class: asserted (EventRoleEdgeProperties); cardinality: many; catalog: ATTENDS (public persons only; live Person.attends, inverse view)"""
  attendees: [Person!]! @relationship(type: "ATTENDS", direction: IN, properties: "EventRoleEdgeProperties")
  """class: asserted (FINANCIAL_INTEREST member; asserted_edge); cardinality: many; catalog: SPONSORS_CONTENT (type owned by W21)"""
  sponsoringOrganizations: [Organization!]! @relationship(type: "SPONSORS_CONTENT", direction: IN, properties: "AssertedEdgeProperties")
  """class: asserted (FINANCIAL_INTEREST member; asserted_edge); cardinality: many; catalog: SPONSORS_CONTENT (type owned by W21)"""
  sponsoringBrands: [ConsumerBrand!]! @relationship(type: "SPONSORS_CONTENT", direction: IN, properties: "AssertedEdgeProperties")
  """class: asserted (AssertedEdgeProperties); cardinality: many; catalog: EVENT_ABOUT (inverse view: events about this edition, e.g. a postponement)"""
  subjectOfEvents: [Event!]! @relationship(type: "EVENT_ABOUT", direction: IN, properties: "AssertedEdgeProperties")
}

"""
A dated public occurrence reported by sources: a filing, a data readout (the public disclosure of results), an
approval, a launch, a recall, a financing, a conference session, a share-price move. Archetype Occurrence. Three
clocks are kept apart (CQ-TM-03): startedAt/endedAt = when it happened (valid time; live happenedAt/happenedAtEnd);
announcedAt = when it was first publicly announced by a party to it (publication time of the announcing snapshot);
effectiveFrom = when a legal, regulatory or contractual effect begins (live effectiveAt). The recorded clock lives on
the assertions (recordedAt) and edges (recordedFrom), never on the Event. Every time on this node is a
materialization of an Assertion named in timeAssertionUid / announcementAssertionUid / effectiveAssertionUid; the
assertions are the history (late arrivals and corrections are new assertions; the materialization is recomputed).
An Event is NOT the regulatory or publication record that documents it (DOCUMENTED_BY_RECORD -> W13/W09 records),
NOT a source (it is REPORTED_IN sources), NOT evidence for anything it is about, and temporal order between events
(FOLLOWED_BY) never implies cause (CAUSED_BY needs its own assertion with basisKind). Serves CQ-TM-03, CQ-EV-01,
CQ-EN-C01..C04, CQ-EN-C06. Module events_and_narrative; archetype Occurrence; uid token `event` (requested).
"""
type Event implements Entity & OccurrenceArchetype & SearchIndexable
  @node(labels: ["Event", "Occurrence"])
  @fulltext(indexes: [{indexName: "EventSearch", fields: ["name", "description", "summaryText"], queryName: "searchEvents"}]) {
  id: ID! @id
  uid: String!
  name: String
  description: String
  mongoResearchRunId: String
  createdAt: DateTime! @timestamp(operations: [CREATE])
  updatedAt: DateTime! @timestamp(operations: [CREATE, UPDATE])
  privacyClass: PrivacyClass
  maturity: NodeMaturity
  schemaVersion: String
  "Always 'Event'."
  occurrenceType: String!
  """When it happened (valid-time start; first instant of its precision period). Materialized from the assertion named in timeAssertionUid. Live happenedAt."""
  startedAt: DateTime
  """When it ended, for durative occurrences (valid-time end, half-open). Null = unknown or instantaneous, never 'ongoing'. Live happenedAtEnd."""
  endedAt: DateTime
  startedAtPrecision: TimePrecision
  startedAtBasis: ValidTimeBasis
  endedAtPrecision: TimePrecision
  endedAtBasis: ValidTimeBasis
  """uid of the EVENT_OCCURRED (or, while PLANNED, EVENT_SCHEDULED) Assertion whose validFrom/validTo this node materializes."""
  timeAssertionUid: String
  """Publication instant of the first announcement by a party to the occurrence (SourceSnapshot.publishedAt behind the announcing assertion's locator); null when no first-party announcement was captured."""
  announcedAt: DateTime
  announcedAtPrecision: TimePrecision
  """uid of the Assertion whose supporting snapshot gives announcedAt."""
  announcementAssertionUid: String
  """When the occurrence's legal/regulatory/contractual effect begins (live effectiveAt). Only from an EVENT_EFFECTIVE assertion; never proxied from announcedAt or startedAt (W18-V04)."""
  effectiveFrom: DateTime
  effectiveFromPrecision: TimePrecision
  effectiveFromBasis: ValidTimeBasis
  """uid of the EVENT_EFFECTIVE Assertion that licenses effectiveFrom."""
  effectiveAssertionUid: String
  """IANA time zone in which the source stated a local time (sessions); instants are stored in UTC."""
  localTimeZone: String
  """Jurisdiction of a regulatory or legal occurrence (ISO 3166 / 'EU'); mandatory qualifier for REGULATORY_EVENT (contract A11)."""
  jurisdiction: String
  eventCategory: EventCategory
  """Controlled string, finer than eventCategory: FILING, APPROVAL, CONDITIONAL_APPROVAL, LAUNCH, TOPLINE_READOUT, PUBLICATION, PRESENTATION, SHARE_PRICE_MOVE, RECALL_INITIATED, RECALL_CLASSIFIED, POSTPONEMENT, CANCELLATION, OTHER."""
  eventType: String
  """Materialized lifecycle (EventStatus semantics); never truth."""
  eventStatus: EventStatus
  summaryText: String
  searchText: String
  searchFields: [String!]
  embeddingModel: String
  embeddingDimensions: Int
  """Derived retrieval vector (INV-107); @vector is added only by Fable at merge, without provider."""
  searchEmbedding: [Float!]
  """class: structural; cardinality: zero_or_one; catalog: HAS_EVENT (the conference edition whose program contains this session)"""
  conference: [Conference!]! @relationship(type: "HAS_EVENT", direction: IN, properties: "StructuralEdgeProperties")
  """class: asserted (AssertedEdgeProperties); cardinality: many; catalog: HOSTS_EVENT"""
  hostedByOrganizations: [Organization!]! @relationship(type: "HOSTS_EVENT", direction: IN, properties: "AssertedEdgeProperties")
  """class: asserted (AssertedEdgeProperties); cardinality: many; catalog: HOSTS_EVENT (live Community.hostsEvents)"""
  hostedByCommunities: [Community!]! @relationship(type: "HOSTS_EVENT", direction: IN, properties: "AssertedEdgeProperties")
  """class: asserted (EventRoleEdgeProperties, participantRole required); cardinality: many; catalog: INVOLVES (live Event.involves)"""
  involves: [EventParticipantTarget!]! @relationship(type: "INVOLVES", direction: OUT, properties: "EventRoleEdgeProperties")
  """class: asserted (AssertedEdgeProperties); cardinality: one_or_more; catalog: EVENT_ABOUT (live Event.about, ABOUT renamed: W20 ABOUT is derived retrieval aboutness)"""
  about: [EventSubjectTarget!]! @relationship(type: "EVENT_ABOUT", direction: OUT, properties: "AssertedEdgeProperties")
  """class: asserted (AssertedEdgeProperties); cardinality: zero_or_one per record kind; catalog: DOCUMENTED_BY_RECORD (new)"""
  documentedBy: [EventRecordTarget!]! @relationship(type: "DOCUMENTED_BY_RECORD", direction: OUT, properties: "AssertedEdgeProperties")
  """class: derived (DerivedSupportProperties: locatorUid of an event assertion's supporting locator in a snapshot of this Source); cardinality: many; catalog: REPORTED_IN (live Event.reportedIn -> Document; range widened to Source)"""
  reportedIn: [Source!]! @relationship(type: "REPORTED_IN", direction: OUT, properties: "DerivedSupportProperties") @settable(onCreate: false, onUpdate: false)
  """class: derived (DerivedSupportProperties, segmentationHash required); cardinality: many; catalog: SUPPORTED_BY_CHUNK (type owned by W20; live Event.supportedBy -> Chunk renamed)"""
  supportedByChunks: [Chunk!]! @relationship(type: "SUPPORTED_BY_CHUNK", direction: OUT, properties: "DerivedSupportProperties") @settable(onCreate: false, onUpdate: false)
  """class: asserted (CausalEdgeProperties; projection of one CAUSED_BY assertion with basisKind); cardinality: many; catalog: CAUSED_BY (this event is the effect)"""
  causedBy: [Event!]! @relationship(type: "CAUSED_BY", direction: OUT, properties: "CausalEdgeProperties")
  """class: asserted (CausalEdgeProperties); cardinality: many; catalog: CAUSED_BY (inverse view: this event is the stated cause)"""
  causes: [Event!]! @relationship(type: "CAUSED_BY", direction: IN, properties: "CausalEdgeProperties")
  """class: derived (DerivedEdgeProperties: rule valid-time-order-v1 over the two time assertions, or projectionOfAssertionUid of a source-stated order); cardinality: many; catalog: FOLLOWED_BY. Never implies CAUSED_BY."""
  followedBy: [Event!]! @relationship(type: "FOLLOWED_BY", direction: OUT, properties: "DerivedEdgeProperties") @settable(onCreate: false, onUpdate: false)
  """class: derived (inverse view); catalog: FOLLOWED_BY"""
  precededBy: [Event!]! @relationship(type: "FOLLOWED_BY", direction: IN, properties: "DerivedEdgeProperties") @settable(onCreate: false, onUpdate: false)
  """class: asserted (EventRoleEdgeProperties); cardinality: many; catalog: SPEAKS_AT (live Person.speaksAt, inverse view)"""
  speakers: [Person!]! @relationship(type: "SPEAKS_AT", direction: IN, properties: "EventRoleEdgeProperties")
  """class: asserted (RecordingEdgeProperties); cardinality: many; catalog: RECORDING_OF (new; Episode -> Event)"""
  recordings: [Episode!]! @relationship(type: "RECORDING_OF", direction: IN, properties: "RecordingEdgeProperties")
  """class: asserted (AssertedEdgeProperties); cardinality: many; catalog: PRESENTED_AT (new; slide deck or poster Document -> Event; never RENDITION_OF the recording)"""
  presentedDocuments: [Document!]! @relationship(type: "PRESENTED_AT", direction: IN, properties: "AssertedEdgeProperties")
  """class: structural (inverse view); catalog: ARC_INCLUDES_EVENT"""
  includedInArcs: [NarrativeArc!]! @relationship(type: "ARC_INCLUDES_EVENT", direction: IN, properties: "StructuralEdgeProperties") @settable(onCreate: false, onUpdate: false)
  """class: structural (inverse view); catalog: ASSESSES_EVENT"""
  impactAssessments: [EventImpactAssessment!]! @relationship(type: "ASSESSES_EVENT", direction: IN) @settable(onCreate: false, onUpdate: false)
}

"""
A curated interpretation that selects and orders events into a story about one or more subjects ("from the
MAESTRO-NASH topline readout to the first approved MASH therapy"). Archetype EvidenceAssessment (decision W18-D04):
it is a dated, method-versioned, immutable judgment by an assessor (BellLabs curator or agent, WAS_GENERATED_BY an
Activity), revised only by a new arc that SUPERSEDES it, reproducible from eventsRecordedAsOf. It is NOT a source
(nothing may be SUPPORTED_BY it, cite it in derivedFromAssessmentUids, or CONSIDERS_ASSESSMENT it -- W18-V03), NOT a
provenance-state-3 warrant (assessmentType NARRATIVE_ARC is excluded from "evidence warrants a broader conclusion",
CQ-PV-01), carries NO truth or score (overallScore and confidence stay null), and its ordering never implies cause
([ARC_INCLUDES_EVENT, CAUSED_BY]). A third party's published narrative is source content (W21 assertions), not a
NarrativeArc. NOT a W21 Series/Channel/Episode container. Serves CQ-EN-C05, CQ-PV-01. Module events_and_narrative;
uid token `narrative-arc` (requested). Maturity CANDIDATE.
"""
type NarrativeArc implements Entity & EvidenceAssessmentArchetype & SearchIndexable
  @node(labels: ["NarrativeArc", "EvidenceAssessment"])
  @fulltext(indexes: [{indexName: "NarrativeArcSearch", fields: ["name", "description", "themeSummary", "searchText"], queryName: "searchNarrativeArcs"}]) {
  id: ID! @id
  uid: String!
  name: String
  description: String
  mongoResearchRunId: String
  createdAt: DateTime! @timestamp(operations: [CREATE])
  updatedAt: DateTime! @timestamp(operations: [CREATE, UPDATE])
  privacyClass: PrivacyClass
  maturity: NodeMaturity
  schemaVersion: String
  "Always 'NARRATIVE_ARC'."
  assessmentType: String! @settable(onCreate: true, onUpdate: false)
  """Curation method and version (e.g. 'arc-curation-v0.1'); required."""
  methodVersion: String! @settable(onCreate: true, onUpdate: false)
  status: AssessmentStatus!
  """Service-assigned commit time."""
  recordedAt: DateTime! @timestamp(operations: [CREATE]) @settable(onCreate: false, onUpdate: false)
  """Written once, from null, when a newer arc supersedes this one."""
  recordedTo: DateTime @settable(onCreate: false, onUpdate: true)
  summary: String @settable(onCreate: true, onUpdate: false)
  """Must stay null: an arc carries no score (W18-V03)."""
  overallScore: Float @settable(onCreate: false, onUpdate: false)
  """Must stay null (deprecated generic confidence)."""
  confidence: Float @settable(onCreate: false, onUpdate: false)
  """Recorded-time viewpoint at which member events were selected (reproducibility of the arc)."""
  eventsRecordedAsOf: DateTime! @settable(onCreate: true, onUpdate: false)
  """Controlled string: COMPANY_MILESTONE_PATH, THERAPEUTIC_AREA_HISTORY, REGULATORY_SAGA, CONTROVERSY, MARKET_NARRATIVE, OTHER."""
  arcType: String @settable(onCreate: true, onUpdate: false)
  themeSummary: String @settable(onCreate: true, onUpdate: false)
  """Presentation facet (live impactDomain); not an impact assessment."""
  impactDomain: String @settable(onCreate: true, onUpdate: false)
  """Earliest member-event startedAt at creation (computed; live NarrativeArc.startedAt renamed: an arc is not an occurrence)."""
  periodStart: DateTime @settable(onCreate: true, onUpdate: false)
  periodStartPrecision: TimePrecision @settable(onCreate: true, onUpdate: false)
  """Latest member-event time at creation (computed); null = unknown, never 'ongoing'."""
  periodEnd: DateTime @settable(onCreate: true, onUpdate: false)
  periodEndPrecision: TimePrecision @settable(onCreate: true, onUpdate: false)
  searchText: String
  searchFields: [String!]
  embeddingModel: String
  embeddingDimensions: Int
  """Derived retrieval vector (INV-107); @vector is added only by Fable at merge, without provider."""
  searchEmbedding: [Float!]
  """class: structural (StructuralEdgeProperties, orderIndex = narrative order, notes = inclusion rationale); cardinality: one_or_more; catalog: ARC_INCLUDES_EVENT (live NarrativeArc.hasEvents / HAS_EVENT renamed: one type, one meaning)"""
  includesEvents: [Event!]! @relationship(type: "ARC_INCLUDES_EVENT", direction: OUT, properties: "StructuralEdgeProperties") @settable(onCreate: true, onUpdate: false)
  """class: structural; cardinality: one_or_more; catalog: ARC_ABOUT (live NarrativeArc.about / ABOUT renamed)"""
  about: [EventSubjectTarget!]! @relationship(type: "ARC_ABOUT", direction: OUT) @settable(onCreate: true, onUpdate: false)
  """class: structural; cardinality: zero_or_one; catalog: SUPERSEDES (NarrativeArc -> NarrativeArc, same label; newer.recordedAt >= older.recordedAt)"""
  supersedes: [NarrativeArc!]! @relationship(type: "SUPERSEDES", direction: OUT, properties: "SupersessionProperties") @settable(onCreate: true, onUpdate: false)
  """class: structural (inverse); catalog: SUPERSEDES"""
  supersededBy: [NarrativeArc!]! @relationship(type: "SUPERSEDES", direction: IN, properties: "SupersessionProperties") @settable(onCreate: false, onUpdate: false)
  """class: structural; cardinality: exactly_one for new writes; catalog: WAS_GENERATED_BY (the curation Activity, which names its agent)"""
  wasGeneratedBy: [Activity!]! @relationship(type: "WAS_GENERATED_BY", direction: OUT) @settable(onCreate: true, onUpdate: false)
}

"""
A method-versioned judgment of how significant one Event was, in one domain (MARKET, CLINICAL_PRACTICE, REGULATORY,
SCIENTIFIC, COMMERCIAL, PATIENT_ACCESS), optionally for one affected subject. Archetype EvidenceAssessment; replaces
the live bare Event.impactLevel (decision W18-D05). It is NOT a truth verdict about the event, NOT a causal claim
(that an event moved a share price is a CAUSED_BY assertion, which an impact assessment may cite via SUPPORTED_BY its
locator, never replace), and a company's self-description ("a historic moment") is source content, not an
assessment. Immutable; re-assessment SUPERSEDES. Serves CQ-EN-C06. Module events_and_narrative; uid token
`event-impact` (requested). Maturity CANDIDATE (included because fixture 02 needs two conflicting judgments).
"""
type EventImpactAssessment implements Entity & EvidenceAssessmentArchetype
  @node(labels: ["EventImpactAssessment", "EvidenceAssessment"]) {
  id: ID! @id
  uid: String!
  name: String
  description: String
  mongoResearchRunId: String
  createdAt: DateTime! @timestamp(operations: [CREATE])
  updatedAt: DateTime! @timestamp(operations: [CREATE, UPDATE])
  privacyClass: PrivacyClass
  maturity: NodeMaturity
  schemaVersion: String
  "Always 'EVENT_IMPACT'."
  assessmentType: String! @settable(onCreate: true, onUpdate: false)
  """Assessment method and version (required; W18-V12)."""
  methodVersion: String! @settable(onCreate: true, onUpdate: false)
  status: AssessmentStatus!
  recordedAt: DateTime! @timestamp(operations: [CREATE]) @settable(onCreate: false, onUpdate: false)
  recordedTo: DateTime @settable(onCreate: false, onUpdate: true)
  summary: String @settable(onCreate: true, onUpdate: false)
  overallScore: Float @settable(onCreate: true, onUpdate: false)
  confidence: Float @settable(onCreate: false, onUpdate: false)
  impactLevel: ImpactLevel! @settable(onCreate: true, onUpdate: false)
  """Controlled string: MARKET, CLINICAL_PRACTICE, REGULATORY, SCIENTIFIC, COMMERCIAL, PATIENT_ACCESS, OTHER."""
  impactDomain: String! @settable(onCreate: true, onUpdate: false)
  """class: structural; cardinality: exactly_one; catalog: ASSESSES_EVENT (new)"""
  assessesEvent: [Event!]! @relationship(type: "ASSESSES_EVENT", direction: OUT) @settable(onCreate: true, onUpdate: false)
  """class: structural; cardinality: zero_or_one; catalog: IMPACT_ON (new) -- the subject for whom the impact is judged"""
  impactOn: [EventSubjectTarget!]! @relationship(type: "IMPACT_ON", direction: OUT) @settable(onCreate: true, onUpdate: false)
  """class: structural; cardinality: many; catalog: SUPPORTED_BY (EvidenceAssessment -> SourceLocator)"""
  supportedBy: [SourceLocator!]! @relationship(type: "SUPPORTED_BY", direction: OUT) @settable(onCreate: true, onUpdate: false)
  """class: structural; cardinality: zero_or_one; catalog: SUPERSEDES"""
  supersedes: [EventImpactAssessment!]! @relationship(type: "SUPERSEDES", direction: OUT, properties: "SupersessionProperties") @settable(onCreate: true, onUpdate: false)
  """class: structural; cardinality: exactly_one for new writes; catalog: WAS_GENERATED_BY"""
  wasGeneratedBy: [Activity!]! @relationship(type: "WAS_GENERATED_BY", direction: OUT) @settable(onCreate: true, onUpdate: false)
}
