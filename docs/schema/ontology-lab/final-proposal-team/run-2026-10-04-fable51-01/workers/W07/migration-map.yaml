# W07 migration map: live current_biotech_schema.graphql (digest 86b5e0b5...f112) -> final W07 SDL.
# Global steps for every W07 node label: backfill uid = 'hu:<token>:' + id (tokens: biomarker, metric, lab-test,
# panel-definition (requested), method, specimen-type, reference-range (requested)); add the archetype label
# (Entity, VersionedState or InformationArtifact); backfill entityType/stateType/artifactType; privacyClass 'PUBLIC';
# Entity.name becomes nullable (D-013, no data change). Legacy asserted edges are readable through non-null
# MeasurementEdgeProperties/AssertedEdgeProperties only after their assertions are backfilled (operations 07, step M3).

