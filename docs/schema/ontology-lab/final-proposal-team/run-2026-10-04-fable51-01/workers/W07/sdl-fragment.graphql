# ---------------------------------------------------------------------------------------------------------------------
# Enums (values frozen at catalog 0.2.0 conventions)
# ---------------------------------------------------------------------------------------------------------------------

"""Whether a diagnostic result was measured, calculated from measured values by a fixed rule, or inferred by a model
(catalog conventions.resultKind). Forbidden implication [INFERRED_RESULT, MEASURED_RESULT]. INV-303, V-303."""
enum DiagnosticResultKind {
  MEASURED
  CALCULATED
  INFERRED
}

"""What kind of quantity an AlgorithmVersion returns (catalog conventions.algorithmOutputKind). A PACE is never
differenced against an AGE_ESTIMATE. CQ-DX-04."""
enum AlgorithmOutputKind {
  AGE_ESTIMATE
  PACE
  RISK_SCORE
  FEATURE_MEASURE
  CLASSIFICATION
  CALCULATED_QUANTITY
}

"""Basis on which an AlgorithmVersion is pinned (catalog conventions.algorithmVersionBasis). VENDOR_VERSION_STRING:
the implementer of the software states a version string (also used for an authors' reference package such as
DunedinPACE R package 0.99.0); PUBLICATION_VERSION: pinned only by a publication; SERVICE_ENDPOINT_UNVERSIONED: a
service output pinned only by retrievedAt (never trendable, V-312); UNKNOWN: unresolved. INV-303, V-308."""
enum AlgorithmVersionBasis {
  VENDOR_VERSION_STRING
  PUBLICATION_VERSION
  SERVICE_ENDPOINT_UNVERSIONED
  UNKNOWN
}

"""Meaning of the bounds of a ReferenceIntervalVersion (catalog conventions.referenceIntervalKind). Labs print a
reference interval and guideline decision limits in the same "reference values" field (Mayo HBA1C, Labcorp 001453);
each is a separate ReferenceIntervalVersion. Forbidden implication [OUTSIDE_REFERENCE_INTERVAL, INDICATES_CONDITION]."""
enum ReferenceIntervalKind {
  REFERENCE_INTERVAL
  DECISION_LIMIT
  GUIDELINE_TARGET
}

"""How the laboratory obtained the interval (catalog conventions.referenceIntervalDerivation; CLSI EP28-A3c
establishment (>= 120 reference individuals per partition), transference (method comparison) and verification
(as few as 20 reference individuals)). NOT_REPORTED when the source is silent. A value for guideline-sourced limits
is requested in W07-SR-06 (candidate ADOPTED_FROM_GUIDELINE), not added here."""
enum ReferenceIntervalDerivation {
  ESTABLISHED
  TRANSFERRED
  VERIFIED
  ADOPTED_FROM_MANUFACTURER
  NOT_REPORTED
}

"""Verdict of a ComparabilityAssessment (catalog conventions.comparabilityVerdict). Only COMPARABLE and
COMPARABLE_WITH_CONVERSION license a shared axis (INV-301, V-302, V-304)."""
enum ComparabilityVerdict {
  COMPARABLE
  COMPARABLE_WITH_CONVERSION
  NOT_COMPARABLE
  UNKNOWN
}

"""Value state of a diagnostic result (catalog private_context.resultQualifier values, reused for the shared contract
per contract A7 so that belowDetection, unmeasured and invalid specimen stay distinct). Registry addition requested
(W07-SR-03); a NOT_REPORTED value for source-attributed public results is requested there, not added here."""
enum ResultQualifier {
  NUMERIC
  BELOW_DETECTION
  ABOVE_QUANTIFICATION
  NOT_MEASURED
  INVALID_SPECIMEN
}

# ---------------------------------------------------------------------------------------------------------------------
# Union and relationship-property type
# ---------------------------------------------------------------------------------------------------------------------

"""Range of COMPARES: exactly two versions of the same kind (V-311). Defined once here (contract B6)."""
union ComparableVersionTarget = AssayVersion | AlgorithmVersion | ReferenceIntervalVersion

"""
asserted_edge profile for MEASURES_METRIC (LabTest, Device, Sensor -> Metric). Successor of live MeasurementMetadata.
Contains every field of the frozen AssertedEdgeProperties (W00) plus the live measurement qualifiers, kept as verbatim
extraction text (role, method, methodRole, unit, sampleType, referenceRangeText, notes) or device signal descriptors
(signalType, samplingRateHz, rangeMin, rangeMax, accuracy). The qualifiers are never authoritative: method, instrument,
specimen type and software version live on AssayVersion; the interval printed on a report is a
ReferenceIntervalVersion. Reused by W08 (Device/Sensor MEASURES_METRIC). Structural result payload edges
(Observation -> Metric) use StructuralEdgeProperties, not this type (W07-SR-04).
"""
type MeasurementEdgeProperties @relationshipProperties {
  relationshipUid: String!
  assertionUid: String!
  validFrom: DateTime
  validTo: DateTime
  validFromPrecision: TimePrecision
  validToPrecision: TimePrecision
  validFromBasis: ValidTimeBasis!
  validToBasis: ValidTimeBasis!
  recordedFrom: DateTime!
  recordedTo: DateTime
  mongoResearchRunId: String
  role: String
  method: String
  methodRole: String
  unit: String
  sampleType: String
  signalType: String
  samplingRateHz: Float
  rangeMin: Float
  rangeMax: Float
  accuracy: Float
  referenceRangeText: String
  notes: String
}

# ---------------------------------------------------------------------------------------------------------------------
# DiagnosticResult contract (interface; no node type of its own)
# ---------------------------------------------------------------------------------------------------------------------

"""
The contract every diagnostic result store meets (catalog diagnostics.DiagnosticResult, interfaceOnly; round 0004;
CL-008). A result is a reported value of one measurand from one specimen or one computation, with its result kind,
value state, collection (observedAt) and report (reportedAt) times, the AssayVersion that measured it or the
AlgorithmVersion that computed it, and the ReferenceIntervalVersion(s) printed with it at report time. It is NOT an
assay, NOT a measurand, NOT a trend and NOT a condition. Implemented in the shared graph only by W16's public,
source-attributed Observation (labels ["Observation", "DiagnosticResult", "InformationArtifact"], W07-SR-02); the
private PersonalMeasurement implements the same contract in the private store and never appears here (INV-506, D-012).
Rules: MEASURED needs producedByAssayVersion; CALCULATED/INFERRED need computedByAlgorithmVersion (INV-303, V-303);
two results share an axis only per INV-301 (V-302, V-304, V-312); the interval is the one printed at report time and
belongs to the same AssayVersion (INV-302, V-306). CQ-DX-02, CQ-DX-03, CQ-DX-05, CQ-DX-06, CQ-DX-08, CQ-AX-21.
Module diagnostics. Archetype InformationArtifact.
"""
interface DiagnosticResult implements Entity & InformationArtifactArchetype {
  id: ID!
  uid: String!
  name: String
  description: String
  mongoResearchRunId: String
  artifactType: String!
  publishedAt: DateTime
  "Specimen collection time (or computation input time for CALCULATED/INFERRED). Null when unknown; ingestion time never substitutes."
  observedAt: DateTime
  contentHash: String
  privacyClass: PrivacyClass
  resultKind: DiagnosticResultKind!
  valueNumber: Float
  valueString: String
  "UCUM unit as reported (never converted in place; conversion is a ComparabilityAssessment rule)."
  unitCode: String
  valueStatus: ResultQualifier
  "When the issuing lab or service reported the value (report date)."
  reportedAt: DateTime
  """class: structural; cardinality: exactly_one when resultKind = MEASURED, else zero_or_one; catalog: PRODUCED_BY_ASSAY_VERSION"""
  producedByAssayVersion: [AssayVersion!]! @declareRelationship
  """class: structural; cardinality: exactly_one when resultKind in (CALCULATED, INFERRED) unless an UNRESOLVED assertion is pending; catalog: COMPUTED_BY_ALGORITHM_VERSION"""
  computedByAlgorithmVersion: [AlgorithmVersion!]! @declareRelationship
  """class: structural; cardinality: many (one per printed interval or limit, each of the producing AssayVersion); catalog: INTERPRETED_WITH_REFERENCE_INTERVAL_VERSION"""
  interpretedWithReferenceIntervalVersion: [ReferenceIntervalVersion!]! @declareRelationship
}

