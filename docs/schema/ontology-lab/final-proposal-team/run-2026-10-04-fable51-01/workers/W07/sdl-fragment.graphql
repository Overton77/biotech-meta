"""
A specimen TYPE (whole blood EDTA, dried blood spot, saliva). Specimen instances (a person's draw) are private and
never in the shared graph (INV-506). It is NOT an anatomical compartment (W03 AnatomicalContext) and NOT a container
(tube colour is collection text). CQ-DX-01, CQ-DX-08. Module diagnostics. Archetype Entity.
"""
type Specimen implements Entity & EntityArchetype
  @node(labels: ["Specimen", "Entity"]) {
  id: ID! @id
  uid: String!
  name: String
  description: String
  mongoResearchRunId: String
  createdAt: DateTime! @timestamp(operations: [CREATE])
  updatedAt: DateTime! @timestamp(operations: [CREATE, UPDATE])
  privacyClass: PrivacyClass
  maturity: NodeMaturity
  schemaVersion: String
  entityType: String!
  "Specimen type code (renames live specimenType), e.g. WHOLE_BLOOD_EDTA, CAPILLARY_WHOLE_BLOOD, SALIVA."
  specimenTypeCode: String
  "Collection setting text (venipuncture, at-home fingerstick)."
  collectionSetting: String
  """class: structural (inverse view); cardinality: many; catalog: ACCEPTS_SPECIMEN_TYPE"""
  acceptedByAssayVersions: [AssayVersion!]! @relationship(type: "ACCEPTS_SPECIMEN_TYPE", direction: IN, properties: "StructuralEdgeProperties")
}

"""
A metrological reference a calibration claims traceability to: a standardization program (NGSP), a reference
measurement procedure (IFCC RMP for HbA1c) or a reference material. It is NOT a certification (NGSP certification of
a lab or method is a time-bounded W12 CertificationListing) and NOT a conversion rule (that lives on a
ComparabilityAssessment). CQ-DX-03. Module diagnostics. Archetype Entity.
"""
type ReferenceSystem implements Entity & EntityArchetype
  @node(labels: ["ReferenceSystem", "Entity"]) {
