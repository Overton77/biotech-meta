  """class: structural (inverse view); cardinality: many; catalog: CALIBRATION_TRACEABLE_TO"""
  traceableAssayVersions: [AssayVersion!]! @relationship(type: "CALIBRATION_TRACEABLE_TO", direction: IN, properties: "StructuralEdgeProperties")
}

"""
An algorithm family as sources name it ("GrimAge", "DunedinPACE", "Owkin H&E cell detection"). A retrieval
convenience only: comparability never flows through the family (forbidden [SAME_ALGORITHM_FAMILY,
SAME_ALGORITHM_VERSION]). CQ-DX-04. Module diagnostics. Archetype Entity.
"""
