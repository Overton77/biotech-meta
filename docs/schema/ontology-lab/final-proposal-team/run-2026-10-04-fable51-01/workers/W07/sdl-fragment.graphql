  assayVersions: [AssayVersion!]! @relationship(type: "PERFORMED_WITH_ASSAY_VERSION", direction: OUT, properties: "AssertedEdgeProperties")
  """class: derived (regenerable from MEASURES_METRIC + QUANTIFIES); cardinality: many; legacy MEASURES"""
