  privacyClass: PrivacyClass
  maturity: NodeMaturity
  schemaVersion: String
  entityType: String!
  "STANDARDIZATION_PROGRAM, REFERENCE_MEASUREMENT_PROCEDURE, REFERENCE_MATERIAL (open vocabulary)."
