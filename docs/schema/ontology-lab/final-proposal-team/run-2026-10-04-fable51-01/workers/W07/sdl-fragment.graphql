# ---------------------------------------------------------------------------------------------------------------------
# Versioned states: assay version, algorithm version, reference interval version
# ---------------------------------------------------------------------------------------------------------------------

"""
How one laboratory ran one measurement procedure: performing lab (exactly one), method principle, instrument model,
reagent kit, software version, specimen types, measured metrics and calibration traceability. Two labs with the same
kit on the same analyzer have two AssayVersions; a change of instrument model, kit version, software version,
calibrator traceability or method principle creates a new AssayVersion (round 0004). Unknown fields stay unknown
(softwareVersionStatus NOT_REPORTED); two NOT_REPORTED assay versions never merge by default. Payload edges are
structural; which LabTest ran with this version, and when, is the asserted PERFORMED_WITH_ASSAY_VERSION edge.
Device firmware is softwareVersion until W08 opens FirmwareVersion (CQ-DX-09). Identity: payloadHash over (operator
uid, method uid, instrument uid, assayKitIdentifier, softwareVersion, sorted metric/specimen/reference-system uids).
CQ-DX-01, CQ-DX-02, CQ-DX-03, CQ-DX-06, CQ-AX-21. Module diagnostics. Archetype VersionedState.
"""
type AssayVersion implements Entity & VersionedStateArchetype
  @node(labels: ["AssayVersion", "VersionedState"]) {
  id: ID! @id
  uid: String!
  name: String
  description: String
  mongoResearchRunId: String
  createdAt: DateTime! @timestamp(operations: [CREATE])
  updatedAt: DateTime! @timestamp(operations: [CREATE, UPDATE])
  privacyClass: PrivacyClass
  maturity: NodeMaturity
  schemaVersion: String
  stateType: String!
  payloadHash: String!
  "Source-stated start (payload only; query validity comes from PERFORMED_WITH_ASSAY_VERSION episodes)."
  effectiveFrom: DateTime
  effectiveTo: DateTime
  "Manufacturer reagent kit or application as the source names it (e.g. 'Tina-quant Hemoglobin A1c Gen.3'); never a lot."
  assayKitIdentifier: String
  "Instrument or analysis software version (e.g. Tosoh G8 '5.24'); identity-defining."
  softwareVersion: String
  "REPORTED, NOT_REPORTED or NOT_APPLICABLE for softwareVersion (required)."
  softwareVersionStatus: ReportedStatus!
  "UCUM unit this assay version reports in."
  reportedUnitCode: String
  """class: structural; cardinality: exactly_one (V-301b); catalog: ASSAY_OPERATED_BY"""
  operatedBy: [Organization!]! @relationship(type: "ASSAY_OPERATED_BY", direction: OUT, properties: "StructuralEdgeProperties")
  """class: structural; cardinality: zero_or_one (V-301a); catalog: USES_METHOD"""
  usesMethod: [MeasurementMethod!]! @relationship(type: "USES_METHOD", direction: OUT, properties: "StructuralEdgeProperties")
  """class: structural; cardinality: zero_or_one (V-301a); catalog: RUNS_ON_INSTRUMENT"""
  runsOnInstrument: [ToolOrInstrument!]! @relationship(type: "RUNS_ON_INSTRUMENT", direction: OUT, properties: "StructuralEdgeProperties")
  """class: structural; cardinality: one_or_more (an HbA1c analyzer may report NGSP % and IFCC mmol/mol); catalog: ASSAY_FOR_METRIC"""
  forMetrics: [Metric!]! @relationship(type: "ASSAY_FOR_METRIC", direction: OUT, properties: "StructuralEdgeProperties")
  """class: structural; cardinality: many; catalog: ACCEPTS_SPECIMEN_TYPE"""
  acceptsSpecimenTypes: [Specimen!]! @relationship(type: "ACCEPTS_SPECIMEN_TYPE", direction: OUT, properties: "StructuralEdgeProperties")
  """class: structural; cardinality: many; catalog: CALIBRATION_TRACEABLE_TO"""
  traceableTo: [ReferenceSystem!]! @relationship(type: "CALIBRATION_TRACEABLE_TO", direction: OUT, properties: "StructuralEdgeProperties")
  """class: asserted (inverse view); cardinality: many; catalog: PERFORMED_WITH_ASSAY_VERSION"""
  usedByLabTests: [LabTest!]! @relationship(type: "PERFORMED_WITH_ASSAY_VERSION", direction: IN, properties: "AssertedEdgeProperties")
  """class: structural (inverse view); cardinality: many; catalog: FOR_ASSAY_VERSION"""
  referenceIntervalVersions: [ReferenceIntervalVersion!]! @relationship(type: "FOR_ASSAY_VERSION", direction: IN, properties: "StructuralEdgeProperties")
  """class: asserted (inverse view); cardinality: many; catalog: COMPATIBLE_WITH_ASSAY_VERSION"""
  compatibleAlgorithmVersions: [AlgorithmVersion!]! @relationship(type: "COMPATIBLE_WITH_ASSAY_VERSION", direction: IN, properties: "AssertedEdgeProperties")
}

"""
One fixed algorithm realization: coefficients, inputs, training reference, output kind and unit. A retrain, a new
input, a coefficient change, a training-range change, or a vendor reimplementation on another array (TruDiagnostic
"custom algorithms trained directly on our arrays") creates a new AlgorithmVersion linked by
DERIVED_FROM_ALGORITHM_VERSION. versionBasis is required (INV-303, V-308); an unversioned service endpoint is pinned by
retrievedAt and is never trendable (V-312). A score labelled only with a family name stays unresolved (competing
ResolutionHypotheses), never defaulted to the latest version. CQ-DX-02, CQ-DX-04, CQ-DX-05, CQ-DX-07.
Module diagnostics. Archetype VersionedState.
"""
type AlgorithmVersion implements Entity & VersionedStateArchetype
  @node(labels: ["AlgorithmVersion", "VersionedState"]) {
  id: ID! @id
  uid: String!
  name: String
  description: String
  mongoResearchRunId: String
  createdAt: DateTime! @timestamp(operations: [CREATE])
  updatedAt: DateTime! @timestamp(operations: [CREATE, UPDATE])
  privacyClass: PrivacyClass
  maturity: NodeMaturity
  schemaVersion: String
  stateType: String!
  payloadHash: String!
  effectiveFrom: DateTime
  effectiveTo: DateTime
  "Version string as the source states it; null when none is stated."
  versionLabel: String
  versionBasis: AlgorithmVersionBasis!
  outputKind: AlgorithmOutputKind!
  "UCUM unit of the output (a = years; a/a = years per year); null when the source states none."
  outputUnitCode: String
  "Training population as the source states it (e.g. 'trained on individuals aged between 40 and 92')."
  trainingPopulationText: String
  "Retrieval pin; required when versionBasis = SERVICE_ENDPOINT_UNVERSIONED (one AlgorithmVersion per retrieval pin)."
  retrievedAt: DateTime
  """class: structural; cardinality: exactly_one; catalog: VERSION_OF_ALGORITHM"""
  versionOf: [Algorithm!]! @relationship(type: "VERSION_OF_ALGORITHM", direction: OUT, properties: "StructuralEdgeProperties")
  """class: asserted (asserted_edge profile); cardinality: many; catalog: DERIVED_FROM_ALGORITHM_VERSION"""
  derivedFrom: [AlgorithmVersion!]! @relationship(type: "DERIVED_FROM_ALGORITHM_VERSION", direction: OUT, properties: "AssertedEdgeProperties")
  """class: asserted (asserted_edge profile); cardinality: many; catalog: REQUIRES_INPUT_METRIC"""
  requiresInputMetrics: [Metric!]! @relationship(type: "REQUIRES_INPUT_METRIC", direction: OUT, properties: "AssertedEdgeProperties")
  """class: asserted (asserted_edge profile); cardinality: many; catalog: COMPATIBLE_WITH_ASSAY_VERSION"""
  compatibleWithAssayVersions: [AssayVersion!]! @relationship(type: "COMPATIBLE_WITH_ASSAY_VERSION", direction: OUT, properties: "AssertedEdgeProperties")
  """class: structural; cardinality: one_or_more; catalog: OUTPUTS_METRIC"""
  outputsMetrics: [Metric!]! @relationship(type: "OUTPUTS_METRIC", direction: OUT, properties: "StructuralEdgeProperties")
}

"""
One interval or limit a laboratory applies for one Metric on one AssayVersion and one population partition, with its
kind (reference interval, decision limit, guideline target) and derivation (CLSI EP28: established, transferred,
verified; adopted from manufacturer; not reported). Replaces live ReferenceRange as the authoritative record; bound to
exactly one AssayVersion (INV-302, V-305b, V-305c). A new bound, partition, derivation or assay creates a new version;
a result keeps the version printed at report time even after the lab changes its interval (V-306). Null partition
fields mean "not stated", never "all". One-sided limits ("<5.7 %") carry lowerBoundStatus NOT_APPLICABLE, never a
null that would read as unknown. Being outside an interval never indicates a condition (V-309). CQ-DX-06.
Module diagnostics. Archetype VersionedState.
"""
type ReferenceIntervalVersion implements Entity & VersionedStateArchetype
  @node(labels: ["ReferenceIntervalVersion", "VersionedState"]) {
  id: ID! @id
  uid: String!
  name: String
  description: String
  mongoResearchRunId: String
  createdAt: DateTime! @timestamp(operations: [CREATE])
  updatedAt: DateTime! @timestamp(operations: [CREATE, UPDATE])
  privacyClass: PrivacyClass
  maturity: NodeMaturity
  schemaVersion: String
  stateType: String!
  payloadHash: String!
  "Lab-stated effective start of this interval version."
  effectiveFrom: DateTime
  effectiveTo: DateTime
  lowerBound: Float
  upperBound: Float
  "REPORTED; NOT_APPLICABLE for a one-sided interval; NOT_REPORTED when the source omits it."
  lowerBoundStatus: ReportedStatus
  upperBoundStatus: ReportedStatus
  "True for >= / closed bound; null when the source does not show the comparator."
  lowerBoundInclusive: Boolean
  upperBoundInclusive: Boolean
  "UCUM unit of the bounds."
  unitCode: String
  "Interval exactly as printed (e.g. '4.8 - 5.6', '<5.7 %', 'Diabetes: >6.4')."
  intervalText: String
  intervalKind: ReferenceIntervalKind!
  derivationKind: ReferenceIntervalDerivation!
  "Sex partition as stated (e.g. FEMALE, MALE, ALL); null = not stated."
  sexPartition: String
  ageMinYears: Float
  ageMaxYears: Float
  fastingStatus: String
  pregnancyStatus: String
  "Verbatim partition wording (live stratifiersText / populationNotes)."
  partitionText: String
  """class: structural; cardinality: exactly_one (INV-302; V-305b, V-305c); catalog: FOR_ASSAY_VERSION"""
  forAssayVersion: [AssayVersion!]! @relationship(type: "FOR_ASSAY_VERSION", direction: OUT, properties: "StructuralEdgeProperties")
  """class: structural; cardinality: exactly_one; catalog: FOR_METRIC (shared name with W16 Target.forMetric, W07-SR-05)"""
  forMetric: [Metric!]! @relationship(type: "FOR_METRIC", direction: OUT, properties: "StructuralEdgeProperties")
}

# ---------------------------------------------------------------------------------------------------------------------
# Evidence assessment
# ---------------------------------------------------------------------------------------------------------------------

"""
BellLabs' judgment whether outputs of two versions (two AssayVersions, two AlgorithmVersions or two
ReferenceIntervalVersions) may share an axis, with the conversion rule and the evidence dimensions (measurand,
traceability, interference profile, reference interval, replicate noise). It is NOT a property of either version, NOT
a numeric similarity score, and NOT a statement that a change between two results is biological: a within-version
difference becomes a change only with a cited replicateNoiseBasis (forbidden [WITHIN_VERSION_SCORE_DIFFERENCE,
MEASURED_BIOLOGICAL_CHANGE]). Immutable; a re-assessment is a new node linked by SUPERSEDES. COMPARES exactly two
(V-311). No assessment means separate series. Public projection (CQ-AX-21: the private store sends only version uids).
CQ-DX-03, CQ-DX-05, CQ-AX-21. Module diagnostics. Archetype EvidenceAssessment.
"""
type ComparabilityAssessment implements Entity & EvidenceAssessmentArchetype
  @node(labels: ["ComparabilityAssessment", "EvidenceAssessment"]) {
  id: ID! @id
  uid: String!
  name: String
  description: String
  mongoResearchRunId: String
  createdAt: DateTime! @timestamp(operations: [CREATE])
  updatedAt: DateTime! @timestamp(operations: [CREATE, UPDATE])
  privacyClass: PrivacyClass
  maturity: NodeMaturity
  schemaVersion: String
  assessmentType: String!
  methodVersion: String!
  status: AssessmentStatus!
  recordedAt: DateTime!
  recordedTo: DateTime
  summary: String
  overallScore: Float
  "Deprecated (contract A4); never written by this assessment."
  confidence: Float
  verdict: ComparabilityVerdict!
  "SAME_METRIC, SAME_BIOMARKER_DIFFERENT_METRIC, DIFFERENT (text dimension)."
  measurandMatch: String
  "Conversion rule with citation, e.g. 'NGSP(%) = 0.09148 * IFCC(mmol/mol) + 2.152'; required for COMPARABLE_WITH_CONVERSION."
  unitConversionRule: String
  traceabilityMatch: String
  interferenceProfileMatch: String
  referenceIntervalMatch: String
  "Reliability source licensing a within-version difference (e.g. a test-retest study for this version); null = no license."
  replicateNoiseBasis: String
  rationale: String
  """class: structural; cardinality: exactly_two, same kind (V-311); catalog: COMPARES"""
  compares: [ComparableVersionTarget!]! @relationship(type: "COMPARES", direction: OUT, properties: "StructuralEdgeProperties")
}

# ---------------------------------------------------------------------------------------------------------------------
# Legacy projection (read-only)
# ---------------------------------------------------------------------------------------------------------------------

"""
Legacy live reference range: a captured range text attached to a Biomarker or Metric without an assay version. Kept
read-only so existing records stay readable; it is never authoritative and receives no new writes (V-305a). New
ranges are ReferenceIntervalVersions; a regenerated projection names its source in projectionOfReferenceIntervalVersionUid.
Live `sex` is read as sexPartition and `unit` as text. CQ-DX-06 (legacy reads). Module diagnostics.
Archetype InformationArtifact (a captured record, not a state of an assay).
"""
type ReferenceRange implements Entity & InformationArtifactArchetype
  @node(labels: ["ReferenceRange", "InformationArtifact"]) {
  id: ID! @id
  uid: String!
  name: String
  description: String
  mongoResearchRunId: String
  createdAt: DateTime! @timestamp(operations: [CREATE])
  updatedAt: DateTime! @timestamp(operations: [CREATE, UPDATE])
  privacyClass: PrivacyClass
  maturity: NodeMaturity
  schemaVersion: String
  artifactType: String!
  publishedAt: DateTime
  observedAt: DateTime
  contentHash: String
  lowerBound: Float @settable(onCreate: false, onUpdate: false)
  upperBound: Float @settable(onCreate: false, onUpdate: false)
  unit: String @settable(onCreate: false, onUpdate: false)
  populationNotes: String @settable(onCreate: false, onUpdate: false)
  stratifiersText: String @settable(onCreate: false, onUpdate: false)
  sex: String @settable(onCreate: false, onUpdate: false)
  ageMinYears: Float @settable(onCreate: false, onUpdate: false)
  ageMaxYears: Float @settable(onCreate: false, onUpdate: false)
  fastingStatus: String @settable(onCreate: false, onUpdate: false)
  pregnancyStatus: String @settable(onCreate: false, onUpdate: false)
  "uid of the ReferenceIntervalVersion this range was regenerated from; null for unmigrated legacy ranges."
  projectionOfReferenceIntervalVersionUid: String @settable(onCreate: false, onUpdate: false)
}
