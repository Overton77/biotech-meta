"""
The biological referent a measurement is about ("glycated hemoglobin", "lymphocyte", "NAD+"). One Biomarker, many
Metrics (HbA1c: LOINC 4548-4 MFr and 59261-8 SFr). It is NOT a measurand (Metric), NOT a test (LabTest), NOT an
assay, and NOT an endpoint role: biomarker category and surrogate status live on EndpointClassification (INV-205).
Compartment is the structural MEASURED_IN_MATRIX edge to W03's AnatomicalContext (blood NAD+ and muscle NAD+ are two
Biomarkers or two matrices, never one). Live display fields biomarkerType, specimenMatrix, commonUnits,
measurementDirectness, clinicalSignificance and agingHallmark are read-only legacy text. CQ-DX-01, CQ-MX-02.
Module diagnostics. Archetype Entity.
"""
type Biomarker implements Entity & EntityArchetype & SearchIndexable
  @node(labels: ["Biomarker", "Entity"])
  @fulltext(indexes: [{indexName: "BiomarkerSearch", fields: ["name", "description", "searchText"], queryName: "searchBiomarkers"}]) {
  id: ID! @id
  uid: String!
  name: String
  description: String
  mongoResearchRunId: String
  createdAt: DateTime! @timestamp(operations: [CREATE])
  updatedAt: DateTime! @timestamp(operations: [CREATE, UPDATE])
  privacyClass: PrivacyClass
  maturity: NodeMaturity
  schemaVersion: String
  entityType: String!
  searchText: String
  searchFields: [String!]
  embeddingModel: String
  embeddingDimensions: Int
  searchEmbedding: [Float!]
  "Kind of biological referent (catalog biomarkerKind; open vocabulary, e.g. PROTEIN_MODIFICATION, METABOLITE, CELL_TYPE)."
  biomarkerKind: String
  "Display only (molecule class as sources name it)."
  moleculeClass: String
  "Legacy display; category is an EndpointClassification (INV-205)."
  biomarkerType: String @settable(onCreate: false, onUpdate: false)
  "Legacy display; compartment is measuredInMatrix, specimen type is AssayVersion.acceptsSpecimenTypes."
  specimenMatrix: String @settable(onCreate: false, onUpdate: false)
  "Legacy display; units belong to Metric.canonicalUnitCode and reported results."
  commonUnits: [String!] @settable(onCreate: false, onUpdate: false)
  "Legacy display; measured versus inferred is DiagnosticResult.resultKind."
  measurementDirectness: String @settable(onCreate: false, onUpdate: false)
  "Legacy display; significance is an assessment (W10)."
  clinicalSignificance: String @settable(onCreate: false, onUpdate: false)
  "Legacy display; mechanism classification is W03's."
  agingHallmark: String @settable(onCreate: false, onUpdate: false)
  """class: structural; cardinality: zero_or_one; catalog: MEASURED_IN_MATRIX (meaning owned by W03; Metric.systemKind is the LOINC-side counterpart)"""
  measuredInMatrix: [AnatomicalContext!]! @relationship(type: "MEASURED_IN_MATRIX", direction: OUT)
  """class: structural (inverse view of Metric.quantifiesBiomarkers); cardinality: many; catalog: QUANTIFIES"""
  quantifiedByMetrics: [Metric!]! @relationship(type: "QUANTIFIES", direction: IN, properties: "StructuralEdgeProperties")
  """class: structural (curated reference; W03 meaning); cardinality: many; catalog: REFLECTS_MECHANISM"""
  reflectsMechanisms: [Mechanism!]! @relationship(type: "REFLECTS_MECHANISM", direction: OUT, properties: "MechanismLinkProperties")
  """class: structural (curated reference; inverse view of W03 MolecularEntity.encodesBiomarkers); cardinality: many; catalog: ENCODES"""
  encodedByGenes: [MolecularEntity!]! @relationship(type: "ENCODES", direction: IN, properties: "MechanismLinkProperties")
  """class: structural (curated reference, legacy IN_PATHWAY); cardinality: many; read-only until W03 rules (W07-SR-07)"""
  inPathways: [Pathway!]! @relationship(type: "IN_PATHWAY", direction: OUT, properties: "MechanismLinkProperties") @settable(onCreate: false, onUpdate: false)
  """class: structural (curated reference, legacy EXPRESSED_IN_CONTEXT); cardinality: many; read-only until W03 rules (W07-SR-07)"""
  expressedInContexts: [AnatomicalContext!]! @relationship(type: "EXPRESSED_IN_CONTEXT", direction: OUT, properties: "MechanismLinkProperties") @settable(onCreate: false, onUpdate: false)
  """class: structural (curated reference, legacy EXPRESSED_IN to Organ); cardinality: many; read-only legacy (W07-SR-07)"""
  expressedInOrgans: [Organ!]! @relationship(type: "EXPRESSED_IN", direction: OUT, properties: "MechanismLinkProperties") @settable(onCreate: false, onUpdate: false)
  """class: derived (one-to-one projection of an INDICATES assertion; never derived from a result outside an interval); cardinality: many; legacy INDICATES"""
  indicatesConditions: [Condition!]! @relationship(type: "INDICATES", direction: OUT, properties: "AssociationProjectionProperties") @settable(onCreate: false, onUpdate: false)
  """class: derived (legacy projection of ReferenceIntervalVersion; V-305a); cardinality: many; catalog: HAS_REFERENCE_RANGE"""
  hasReferenceRanges: [ReferenceRange!]! @relationship(type: "HAS_REFERENCE_RANGE", direction: OUT, properties: "DerivedEdgeProperties") @settable(onCreate: false, onUpdate: false)
  """class: derived (support shortcut via a SourceLocator; W20); cardinality: many; replaces live SUPPORTED_BY -> Chunk"""
  supportedBy: [Chunk!]! @relationship(type: "SUPPORTED_BY_CHUNK", direction: OUT, properties: "DerivedSupportProperties") @settable(onCreate: false, onUpdate: false)
}

"""
The measurand or feature definition: what is measured, as a terminology concept (LOINC when one exists) or a BellLabs
definition with definition text. A LOINC code identifies this level only, never an assay, a lab or a method actually
used (forbidden [SHARES_LOINC_CODE, SAME_ASSAY_VERSION]; LOINC 4548-4 has Method part NULL). The LOINC part model is
materialized: propertyKind (MFr, SFr ...), systemKind (Bld, Ser/Plas ...), scaleKind (Qn, Ord ...). Two metrics for one
analyte under two standardization protocols (4548-4 NGSP %, 59261-8 IFCC mmol/mol) are two Metrics; cross-metric
comparison needs a ComparabilityAssessment. A similar test name never establishes a shared Metric (forbidden
[SIMILAR_TEST_NAME, SAME_METRIC]). Identity: loincCode when present (unique, `^[0-9]{1,7}-[0-9]$`, V-310a/b), else uid
with definitionText. CQ-DX-01, CQ-DX-03, CQ-DX-07. Module diagnostics. Archetype Entity.
"""
type Metric implements Entity & EntityArchetype & SearchIndexable
  @node(labels: ["Metric", "Entity"])
  @fulltext(indexes: [{indexName: "MetricSearch", fields: ["name", "description", "searchText"], queryName: "searchMetrics"}]) {
  id: ID! @id
  uid: String!
  name: String
  description: String
  mongoResearchRunId: String
  createdAt: DateTime! @timestamp(operations: [CREATE])
  updatedAt: DateTime! @timestamp(operations: [CREATE, UPDATE])
  privacyClass: PrivacyClass
  maturity: NodeMaturity
  schemaVersion: String
  entityType: String!
  searchText: String
  searchFields: [String!]
  embeddingModel: String
  embeddingDimensions: Int
  searchEmbedding: [Float!]
  "MEASURAND, ALGORITHM_OUTPUT, MODEL_FEATURE, CALCULATED_QUANTITY (open vocabulary; live metricType)."
  metricKind: String
  "Materialized LOINC key; normalized `^[0-9]{1,7}-[0-9]$`; unique across Metrics; release on the Identifier record."
  loincCode: String
  "LOINC Property part as published (MFr, SFr, MCnc ...); null when no LOINC concept."
  propertyKind: String
  "LOINC System part as published (Bld, Ser/Plas ...); compartment counterpart of Biomarker.measuredInMatrix."
  systemKind: String
  "LOINC Scale part as published (Qn, Ord, Nom ...)."
  scaleKind: String
  "Canonical UCUM unit code (merges live canonicalUnit and ucumUnit). Null with unitStatus NOT_REPORTED is never filled by assumption."
  canonicalUnitCode: String
  "Whether the defining source states a unit. Required for new writes (service-enforced); nullable for unmigrated legacy reads."
  unitStatus: ReportedStatus
  "Verbatim definition for non-LOINC metrics and model features."
  definitionText: String
  "Legacy display; an executable formula is an AlgorithmVersion (CALCULATED_QUANTITY) with REQUIRES_INPUT_METRIC."
  formulaExpression: String @settable(onCreate: false, onUpdate: false)
  "Legacy display (see formulaExpression)."
  formulaVariables: String @settable(onCreate: false, onUpdate: false)
  "Legacy display; media links move to W22 (media module)."
  mediaUrl: String @settable(onCreate: false, onUpdate: false)
  "Legacy display; media links move to W22."
  mediaType: String @settable(onCreate: false, onUpdate: false)
  """class: structural (definitional: the LOINC component names the referent); cardinality: one_or_more; catalog: QUANTIFIES"""
  quantifiesBiomarkers: [Biomarker!]! @relationship(type: "QUANTIFIES", direction: OUT, properties: "StructuralEdgeProperties")
  """class: asserted (W00 HAS_IDENTIFIER; LOINC Identifier with release); cardinality: many"""
  identifiers: [Identifier!]! @relationship(type: "HAS_IDENTIFIER", direction: OUT, properties: "IdentifierLinkProperties")
  """class: structural (curated reference; W03 meaning); cardinality: many; catalog: REFLECTS_MECHANISM"""
  reflectsMechanisms: [Mechanism!]! @relationship(type: "REFLECTS_MECHANISM", direction: OUT, properties: "MechanismLinkProperties")
  """class: derived (legacy projection of ReferenceIntervalVersion FOR_METRIC; V-305a); cardinality: many; catalog: HAS_REFERENCE_RANGE"""
  hasReferenceRanges: [ReferenceRange!]! @relationship(type: "HAS_REFERENCE_RANGE", direction: OUT, properties: "DerivedEdgeProperties") @settable(onCreate: false, onUpdate: false)
  """class: structural (inverse view); cardinality: many; catalog: ASSAY_FOR_METRIC"""
  assayVersions: [AssayVersion!]! @relationship(type: "ASSAY_FOR_METRIC", direction: IN, properties: "StructuralEdgeProperties")
  """class: structural (inverse view); cardinality: many; catalog: OUTPUTS_METRIC"""
  outputOfAlgorithmVersions: [AlgorithmVersion!]! @relationship(type: "OUTPUTS_METRIC", direction: IN, properties: "StructuralEdgeProperties")
  """class: derived (support shortcut via a SourceLocator; W20); cardinality: many; replaces live SUPPORTED_BY -> Chunk"""
  supportedBy: [Chunk!]! @relationship(type: "SUPPORTED_BY_CHUNK", direction: OUT, properties: "DerivedSupportProperties") @settable(onCreate: false, onUpdate: false)
}

"""
The orderable test as a laboratory or consumer-test vendor offers it (Labcorp 001453 "Hemoglobin (Hb) A1c", Mayo
HBA1C, Quest 496). Identity: issuer + localTestCode; the local name is never identity (two "HbA1c" tests are linked
only by a ResolutionHypothesis, and SAME_TEST_AS is a projection of an accepted one, V-307). It is NOT the assay: how
the test was run over time is PERFORMED_WITH_ASSAY_VERSION (asserted, bitemporal), because one LabTest changes
analyzer, kit or software. The live LabTest.usesMethods, requiresSpecimens and usesPlatforms edges move to the
AssayVersion payload (migration-map.yaml). CQ-DX-01, CQ-DX-03. Module diagnostics. Archetype Entity.
"""
type LabTest implements Entity & EntityArchetype & SearchIndexable
  @node(labels: ["LabTest", "Entity"])
  @fulltext(indexes: [{indexName: "LabTestSearch", fields: ["name", "description", "searchText"], queryName: "searchLabTests"}]) {
  id: ID! @id
  uid: String!
  name: String
  description: String
  mongoResearchRunId: String
  createdAt: DateTime! @timestamp(operations: [CREATE])
  updatedAt: DateTime! @timestamp(operations: [CREATE, UPDATE])
  privacyClass: PrivacyClass
  maturity: NodeMaturity
  schemaVersion: String
  entityType: String!
  searchText: String
  searchFields: [String!]
  embeddingModel: String
  embeddingDimensions: Int
  searchEmbedding: [Float!]
  "Issuer's own test code (Labcorp '001453', Mayo 'HBA1C', Quest '496')."
  localTestCode: String
  "uid of the issuing Organization (lab or vendor offering the test); part of identity with localTestCode."
  issuerUid: String
  "Display only (free text for search)."
  testType: String
  """class: asserted (asserted_edge profile); cardinality: one_or_more; catalog: MEASURES_METRIC"""
