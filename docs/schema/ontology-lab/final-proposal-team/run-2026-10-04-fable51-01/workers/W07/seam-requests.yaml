# W07 seam requests (run-2026-10-04-fable51-01). Fable copies these to 03-conflict-ledger.md and assigns resolvers.
- id: W07-SR-01
  targetOwner: W00
  request: "Add @declareRelationship to contract B1's allowed field directives (interface fields only)."
  cq: [CQ-DX-02, CQ-DX-03, CQ-DX-06]
  failingCase: "DiagnosticResult interface fields producedByAssayVersion/computedByAlgorithmVersion/interpretedWithReferenceIntervalVersion; without the directive the interface exposes no relationship traversal and implementers are not forced to declare the edges. Verified in @neo4j/graphql 7.6.3 (args nestedOperations, aggregate; implementer without @relationship fails the build)."
  proposedRuling: "Allow @declareRelationship on interface fields; no arguments in fragments."
- id: W07-SR-02
  targetOwner: W16
  request: "Observation implements Entity & InformationArtifactArchetype & DiagnosticResult with @node(labels: [\"Observation\", \"DiagnosticResult\", \"InformationArtifact\"]) and the three @relationship fields named exactly producedByAssayVersion (PRODUCED_BY_ASSAY_VERSION), computedByAlgorithmVersion (COMPUTED_BY_ALGORITHM_VERSION), interpretedWithReferenceIntervalVersion (INTERPRETED_WITH_REFERENCE_INTERVAL_VERSION), OUT, properties StructuralEdgeProperties; plus comparedTo (COMPARED_TO, DerivedEdgeProperties, read-only). FROM_LAB_TEST is not a comparability path."
  cq: [CQ-DX-02, CQ-DX-03, CQ-DX-08]
  failingCase: "fixtures/w07-04: V-302..V-316 match :DiagnosticResult; without the label every check returns zero rows vacuously. Build probe: missing @relationship on an implementer fails."
  proposedRuling: "Accept as stated (CL-008 implementation detail)."
- id: W07-SR-03
  targetOwner: W00
  request: "Register enum ResultQualifier (catalog private_context.resultQualifier values) as a W07-owned shared enum used by DiagnosticResult.valueStatus; consider adding NOT_REPORTED for source-attributed public results."
  cq: [CQ-DX-02, CQ-DX-08]
  failingCase: "A public Observation reporting 'below detection' or 'invalid specimen' cannot be stored with ReportedStatus (0.2.0 fixture used valueStatus 'REPORTED')."
  proposedRuling: "Register ResultQualifier with the five catalog values under W07; NOT_REPORTED as a ledger value request."
- id: W07-SR-04
  targetOwner: W16
  request: "Confirm Observation.measuresMetrics (MEASURES_METRIC) uses StructuralEdgeProperties (payload of the result), not MeasurementEdgeProperties (asserted). Optionally add measuresMetric to the DiagnosticResult contract."
  cq: [CQ-DX-01, CQ-DX-02]
  failingCase: "MeasurementEdgeProperties has non-null assertionUid; a result's own metric is structural and has no authorizing assertion."
  proposedRuling: "Structural on Observation; contract edge deferred until W16 agrees."
- id: W07-SR-05
  targetOwner: W16
  request: "FOR_METRIC is one structural relationship type owned by W07 (catalog: ReferenceIntervalVersion -> Metric); W16's Target.forMetric reuses the same type and meaning ('is defined for metric'), with StructuralEdgeProperties instead of RoleMetadata."
  cq: [CQ-DX-06, CQ-PR-03]
  failingCase: "Registry lists FOR_METRIC under W07 and W16; two meanings or two property shapes for one type violate 'one relationship type, one meaning'."
  proposedRuling: "One type, W07 owner, domain ReferenceIntervalVersion|Target, structural."
- id: W07-SR-06
  targetOwner: W00
  request: "Ledger value request: ReferenceIntervalDerivation.ADOPTED_FROM_GUIDELINE."
  cq: [CQ-DX-06]
  failingCase: "Quest 496 prints '<5.7 %' and states 'Interpretative ranges are based on ADA guidelines'; Mayo and Labcorp print ADA limits in the reference-values field. Today these must be NOT_REPORTED, which loses a stated basis."
  proposedRuling: "Add the value; keep EP28 kinds unchanged."
