  targetOwner: W03
  request: "Rule the class and property type of Biomarker IN_PATHWAY, EXPRESSED_IN (to Organ), EXPRESSED_IN_CONTEXT and INDICATES (to Condition). W07 wrote IN_PATHWAY/EXPRESSED_IN*/ENCODES/REFLECTS_MECHANISM with MechanismLinkProperties (read-only where legacy) and INDICATES as derived with AssociationProjectionProperties."
  cq: [CQ-MX-02, CQ-ST-03]
  failingCase: "W03's fragment covers ENCODES and REFLECTS_MECHANISM but not IN_PATHWAY, EXPRESSED_IN, EXPRESSED_IN_CONTEXT or INDICATES; the inverse fields on Pathway/Organ/AnatomicalContext/Condition must use the same property type."
  proposedRuling: "W03 confirms or supplies the property type; W07 updates Biomarker fields to match."
- id: W07-SR-08
  targetOwner: W08
  request: "Confirm RUNS_ON_PLATFORM (MeasurementMethod -> TechnologyPlatform) is structural with StructuralEdgeProperties, and that MEASURES_METRIC on Device/Sensor uses W07's MeasurementEdgeProperties."
  cq: [CQ-DX-01, CQ-DX-09]
