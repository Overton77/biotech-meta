"""
A laboratory's batch certificate: an artifact that names the tested lot, the issuing laboratory or organization, and
per test the method, the acceptance criterion and a result (value or pass/fail), with a report number or date and a
conclusion (WHO TRS 957 Annex 1 19.1). Classification rule (proposed closure of OPEN-QUESTIONS P2 quality 1,
V-W12-01): the node is a CertificateOfAnalysis only if it has an issuer (COA_ISSUED_BY), certifies a lot directly or
through executions, every certified execution has USED_METHOD and at least one MeasuredResult or PassFailInterpretation
against an APPLIES_CRITERION / EVALUATED_AGAINST criterion, and certificateNumber or reportDate is present. The title
"Certificate of Analysis" alone is not sufficient; a signature is recorded (signatureEvidence) but its absence in a
text capture does not demote the artifact. One node per report revision; a revised report (revision 01) is a new node
on the revised snapshot (kernel SourceRevisionEvent), the old one is never edited. It is NOT a certification of the
product (CertificationListing) and NOT evidence of independence: the issuer may be an affiliate of the brand.
CQ-QA-C01, CQ-AX-19, CQ-PF-03, minimal pair 18. Catalog module quality. Archetype InformationArtifact.
"""
