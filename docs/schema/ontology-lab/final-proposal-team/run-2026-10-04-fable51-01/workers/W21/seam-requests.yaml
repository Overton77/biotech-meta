# W21 seam requests (run-2026-10-04-fable51-01). Fable copies these into 03-conflict-ledger.md and assigns resolvers.
- id: "W21-SR-01"
  targetOwner: "W00"
  request: "Register uid type token `platform` for Platform in conventions.uidTypeTokens."
  cq: "CQ-CL-01, CQ-CL-C01"
  failingCase: "fx01 creates hu:platform:youtube / megaphone / apple-podcasts; INV-106 requires a registered token per primary label; Channel, Series, Episode, EpisodeSegment already have tokens, Platform does not."
  proposedRuling: "Add `Platform: platform`."
- id: "W21-SR-02"
  targetOwner: "Fable (enum admission)"
  request: "Admit controlled vocabularies as enums or keep them as documented strings - PlatformType, ChannelType, SeriesType, EpisodeType, EpisodeSegmentType (values in 04-model-cards.md)."
  cq: "CQ-CL-08, CQ-CL-C01, CQ-CL-C02"
  failingCase: "Live types store these as free String; a typo (\"SPONSORREAD\") silently escapes V-W21-02 and CQ-CL-08 filters."
  proposedRuling: "Admit EpisodeSegmentType and EpisodeType as W21-owned enums now (CQ-CL-08 depends on them); keep the other three as strings until a CQ filters on them."
- id: "W21-SR-03"
  targetOwner: "Fable (registry) / W00 (relationship class catalog)"
  request: "Register structural relationship DELIMITED_BY (EpisodeSegment -> SourceLocator, at most one per rendition)."
  cq: "CQ-CL-08, CQ-CL-C01"
  failingCase: "fx01 - the YouTube sponsor chapter (210 s) and the feed sponsor chapter (225 s) need snapshot-bound boundaries; live OrderingMetadata.startTime strings carry no rendition."
  proposedRuling: "Accept as W21-owned structural relationship; validator V-W21-05."
- id: "W21-SR-04"
  targetOwner: "Fable (registry)"
  request: "Register structural relationship IN_RENDITION (EpisodeSegment -> Source, zero_or_one)."
  cq: "CQ-CL-08, CQ-CL-C01"
  failingCase: "fx01 - without IN_RENDITION the AG1/LMNT/Waking Up sponsor segment observed on the feed-presented audio is claimed for the YouTube rendition as well; a segment with no captured locator still needs its rendition."
  proposedRuling: "Accept; absence means a work-level segment present in every rendition."
- id: "W21-SR-05"
  targetOwner: "Fable (registry); W19 informed"
  request: "Register structural relationship DISTRIBUTES_RENDITION (Channel -> Source; each rendition zero_or_one channel)."
  cq: "CQ-CL-01, CQ-CL-C01"
  failingCase: "fx01 - the YouTube channel and the Megaphone feed carry different sponsor sets for one work; platform derived from canonicalUri host is unreliable (Apple directory record presents the Megaphone feed)."
  proposedRuling: "Accept; live Episode.onPlatforms retired in its favour."
- id: "W21-SR-06"
