  failingCase: "fx07 - a correct derived RECOMMENDS edge returns 1 row from verbatim V-423 (it reads rec.assertionUid, which D-011 forbids on derived edges). Proposed text is V-W21-06 in fixtures/w21-validation.cypher (0 rows on fx07; 1 row on fx04 N04-a)."
