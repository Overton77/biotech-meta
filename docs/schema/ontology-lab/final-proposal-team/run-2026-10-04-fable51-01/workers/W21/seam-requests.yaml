  cq: "CQ-CL-06, CQ-AX-05"
  failingCase: "An author's sentence present in both the HTML and the PDF rendition of one article becomes two occurrences (two Document containers) and is counted twice as independent support."
  proposedRuling: "Accept; V-411 already accepts locators in renditions of the container, so no validator change."
- id: "W21-SR-07"
  targetOwner: "W00 (validation suite) with W01"
  request: "Amend V-423 for the derived RECOMMENDS projection (CL-016, D-011) - accept derivationRule + exactly one derivedFromAssertionUids whose assertion has speechAct RECOMMENDS, is asserted by the edge start node, and has the edge end node as subject or object; keep assertionUid only as a migration fallback. W01 writes Person.recommends as `recommends: [RecommendableTarget!]! @relationship(type: \"RECOMMENDS\", direction: OUT, properties: \"DerivedEdgeProperties\")`."
