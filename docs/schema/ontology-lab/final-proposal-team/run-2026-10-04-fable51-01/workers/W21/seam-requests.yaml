  targetOwner: "Fable (registry)"
  request: "WITHDRAWN after reading W00's packet: INSTANCE_OF uses W00 DerivedEdgeProperties with derivationRule always set and the accepted ResolutionHypothesis uid in derivedFromAssessmentUids (W00 D-W00-18). Remaining request: amend V-417 to also accept a derivedFromAssessmentUids entry naming a ResolutionHypothesis (today it reads i.hypothesisUid, which no final property type carries)."
