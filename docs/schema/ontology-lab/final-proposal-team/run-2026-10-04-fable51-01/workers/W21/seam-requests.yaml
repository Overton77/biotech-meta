- id: "W21-SR-08"
  targetOwner: "W01, W20, W18"
  request: "Write the domain-side SPONSORS_CONTENT fields - Organization.sponsorsContent and ConsumerBrand.sponsorsContent as `[SponsorableTarget!]! @relationship(type: \"SPONSORS_CONTENT\", direction: OUT, properties: \"AssertedEdgeProperties\")` (W18 union SponsorableTarget = Episode | Series | Channel | Document | Conference); Document and Conference may add inverse fields."
