  includesEpisodes: [Episode!]! @relationship(type: "HAS_EPISODE", direction: OUT, properties: "StructuralEdgeProperties")
  """class: asserted (FINANCIAL_INTEREST member; asserted_edge); cardinality: many; catalog: SPONSORS_CONTENT"""
  sponsoringOrganizations: [Organization!]! @relationship(type: "SPONSORS_CONTENT", direction: IN, properties: "AssertedEdgeProperties")
  """class: asserted (FINANCIAL_INTEREST member; asserted_edge); cardinality: many; catalog: SPONSORS_CONTENT"""
  sponsoringBrands: [ConsumerBrand!]! @relationship(type: "SPONSORS_CONTENT", direction: IN, properties: "AssertedEdgeProperties")
}

# -----------------------------------------------------------------------------------------------------
# Works and their parts: Episode, EpisodeSegment
# -----------------------------------------------------------------------------------------------------

"""
A published audio or video work: a podcast episode, a video, or a recorded talk/lecture/panel (episodeType
CONFERENCE_TALK, LECTURE, WEBINAR, PANEL). It is the work-level Entity (D-005); every page, video file, audio feed
item, directory record or transcript document that renders it is a Source linked RENDITION_OF it. Media times,
sponsor reads and transcript texts belong to renditions, never to the Episode itself (dynamic ad insertion). A
re-edited release (for example an "Essentials" cut) is a different Episode, not a rendition. A slide deck shown
in a talk is a Document container in its own right, never a rendition of the talk (decision W21-D06). Serves
CQ-CL-01, CQ-CL-05 (publication time as the statement date), CQ-CL-08, CQ-PV-02, CQ-AX-18.
Module claims_and_documents; archetype Entity; uid token `episode`.
"""
type Episode implements Entity & EntityArchetype & SearchIndexable
  @node(labels: ["Episode", "Entity"])
  @fulltext(indexes: [{indexName: "EpisodeSearch", fields: ["name", "title", "summaryText"], queryName: "searchEpisodes"}]) {
  id: ID! @id
  uid: String!
  name: String
  description: String
  mongoResearchRunId: String
  createdAt: DateTime! @timestamp(operations: [CREATE])
  updatedAt: DateTime! @timestamp(operations: [CREATE, UPDATE])
  privacyClass: PrivacyClass
  maturity: NodeMaturity
  schemaVersion: String
  entityType: String!
  searchText: String
  searchFields: [String!]
  embeddingModel: String
  embeddingDimensions: Int
  """Controlled string: FULL, TRAILER, BONUS, EXCERPT, RE_EDIT, CONFERENCE_TALK, LECTURE, WEBINAR, PANEL (RSS itunes:episodeType full|trailer|bonus maps to the first three)."""
  episodeType: String
  """Title as published by the series publisher (presentation, never identity)."""
  title: String
  """Publisher-assigned number in the primary series feed; not an identity key (numbering is reused across feeds)."""
  episodeNumber: Int
  seasonNumber: Int
  """First publication instant of the work as stated by the publisher feed or directory (observed). Used as the PUBLICATION_PROXY valid-time anchor of in-container statements."""
  publishedAt: DateTime
  publishedAtPrecision: TimePrecision
  """Nominal duration stated by the publisher; rendition durations differ under dynamic ad insertion and are not stored here."""
  durationSeconds: Int
  summaryText: String
  """Derived retrieval vector (INV-107); @vector is added only by Fable at merge, without provider."""
  searchEmbedding: [Float!]
  """class: structural; cardinality: many; catalog: RENDITION_OF (provenance, W00) -- page, video, audio feed item, directory record or transcript document"""
  renditions: [Source!]! @relationship(type: "RENDITION_OF", direction: IN)
  """class: structural; cardinality: many; catalog: HAS_SEGMENT (orderIndex on the edge)"""
  segments: [EpisodeSegment!]! @relationship(type: "HAS_SEGMENT", direction: OUT, properties: "StructuralEdgeProperties")
  """class: structural; cardinality: many; catalog: HAS_EPISODE"""
  channels: [Channel!]! @relationship(type: "HAS_EPISODE", direction: IN, properties: "StructuralEdgeProperties")
  """class: structural; cardinality: many; catalog: HAS_EPISODE"""
  series: [Series!]! @relationship(type: "HAS_EPISODE", direction: IN, properties: "StructuralEdgeProperties")
  """class: asserted (AppearanceProperties = asserted_edge + roleType); cardinality: many; catalog: APPEARS_IN (live field name kept)"""
  personsInEpisode: [Person!]! @relationship(type: "APPEARS_IN", direction: IN, properties: "AppearanceProperties")
  """class: asserted (AppearanceProperties); cardinality: many; catalog: APPEARS_IN (handle-only participants)"""
  pseudonymousParticipants: [PseudonymousActor!]! @relationship(type: "APPEARS_IN", direction: IN, properties: "AppearanceProperties")
  """class: asserted (FINANCIAL_INTEREST member; asserted_edge); cardinality: many; catalog: SPONSORS_CONTENT"""
  sponsoringOrganizations: [Organization!]! @relationship(type: "SPONSORS_CONTENT", direction: IN, properties: "AssertedEdgeProperties")
  """class: asserted (FINANCIAL_INTEREST member; asserted_edge); cardinality: many; catalog: SPONSORS_CONTENT"""
  sponsoringBrands: [ConsumerBrand!]! @relationship(type: "SPONSORS_CONTENT", direction: IN, properties: "AssertedEdgeProperties")
  """class: structural; cardinality: many (each ClaimOccurrence has exactly one container); catalog: OCCURS_IN"""
  claimOccurrences: [ClaimOccurrence!]! @relationship(type: "OCCURS_IN", direction: IN)
  """class: derived (legacy retrieval projection, read-only; name collision with catalog MENTIONS SourceLocator->Mention is seam W21-SR-10); cardinality: many; catalog: none (live Episode.mentions)"""
  mentions: [EpisodeMentionableTarget!]! @relationship(type: "MENTIONS", direction: OUT) @settable(onCreate: false, onUpdate: false)
}

"""
A delimited part of an Episode as published or as identified by BellLabs: a sponsor read, an editorial chapter, an
introduction, prepared remarks, a Q&A block or a dynamically inserted ad break. It is an InformationArtifact (a
record about the work's structure), not an Occurrence and not a time range: timing lives on SourceLocators bound
to one rendition (DELIMITED_BY), and a rendition-specific segment (a dynamic ad, a platform-specific sponsor read)
names that rendition (IN_RENDITION). A segment without IN_RENDITION is claimed to exist in every rendition.
segmentType SPONSOR_READ answers CQ-CL-08; it never makes a statement an endorsement. Serves CQ-CL-08, CQ-PV-02.
Module claims_and_documents; archetype InformationArtifact; uid token `episode-segment`.
"""
type EpisodeSegment implements Entity & InformationArtifactArchetype @node(labels: ["EpisodeSegment", "InformationArtifact"]) {
  id: ID! @id
  uid: String!
  name: String
  description: String
  mongoResearchRunId: String
  createdAt: DateTime! @timestamp(operations: [CREATE])
  updatedAt: DateTime! @timestamp(operations: [CREATE, UPDATE])
  privacyClass: PrivacyClass
  maturity: NodeMaturity
  schemaVersion: String
  artifactType: String!
  publishedAt: DateTime
  observedAt: DateTime
  contentHash: String
  """Controlled string (enum candidate W21-SR-02): SPONSOR_READ, DYNAMIC_AD, EDITORIAL, CHAPTER, INTRODUCTION, PREPARED_REMARKS, Q_AND_A, DISCLAIMER, OTHER."""
  segmentType: String
  """Chapter or section title exactly as the publisher printed it, for example "ROKA, InsideTracker, Magic Spoon"."""
  chapterTitleVerbatim: String
  """How the segment boundaries were obtained: PUBLISHER_CHAPTER, RENDITION_TRANSCRIPT_CUE, MANUAL, NOT_DELIMITED."""
  delimitationBasis: String
  """class: structural; cardinality: exactly_one; catalog: HAS_SEGMENT"""
  episode: [Episode!]! @relationship(type: "HAS_SEGMENT", direction: IN, properties: "StructuralEdgeProperties")
  """class: structural; cardinality: zero_or_one; catalog: IN_RENDITION (NEW, W21-SR-04) -- the rendition Source this segment exists in; absent = work-level segment"""
  inRendition: [Source!]! @relationship(type: "IN_RENDITION", direction: OUT)
  """class: structural; cardinality: many (at most one per rendition); catalog: DELIMITED_BY (NEW, W21-SR-03) -- MEDIA_TIME or TEXT_QUOTE locators that bound the segment on a rendition snapshot"""
  delimitedBy: [SourceLocator!]! @relationship(type: "DELIMITED_BY", direction: OUT)
  """class: structural; cardinality: many; catalog: OCCURS_IN_SEGMENT (shared name with W20 Chunk edge, same meaning: lies within)"""
  claimOccurrences: [ClaimOccurrence!]! @relationship(type: "OCCURS_IN_SEGMENT", direction: IN)
}

# -----------------------------------------------------------------------------------------------------
# Proposition identity and source-attributed assertions
# -----------------------------------------------------------------------------------------------------

"""
The identity of a proposition that many assertions can instantiate ("NMN raises NAD+", "Sinclair takes about 1 g
of NMN per day"). It is an Entity with no source, no asserter, no truth value and no evidence strength (D-006,
V-418): evidence strength is a ClaimEvidenceAssessment; corroboration is several Assertions INSTANCE_OF one Claim.
claimType says what the proposition is about (a different axis from Assertion.assertionBasis); claimPolarity is
the direction inside the proposition ("lowers" versus "raises"), while affirmation versus denial is
Assertion.polarity. Serves CQ-CL-06, CQ-AX-05, CQ-EV-03. Module claims_and_documents; archetype Entity; uid token
`claim`.
"""
type Claim implements Entity & EntityArchetype & SearchIndexable
  @node(labels: ["Claim", "Entity"])
  @fulltext(indexes: [{indexName: "ClaimSearch", fields: ["name", "description", "searchText"], queryName: "searchClaims"}]) {
  id: ID! @id
  uid: String!
  name: String
  description: String
  mongoResearchRunId: String
  createdAt: DateTime! @timestamp(operations: [CREATE])
  updatedAt: DateTime! @timestamp(operations: [CREATE, UPDATE])
  privacyClass: PrivacyClass
  maturity: NodeMaturity
  schemaVersion: String
  entityType: String!
  searchText: String
  searchFields: [String!]
  embeddingModel: String
  embeddingDimensions: Int
  """Normalized proposition text written by BellLabs; never a quotation (quotations live on SourceLocator.exact)."""
  claimText: String
  claimType: ClaimType
  """Direction inside the proposition (live AssociationPolarity; owner seam W21-SR-11)."""
  claimPolarity: AssociationPolarity
  isQuantitative: Boolean
  isCausal: Boolean
  isMechanistic: Boolean
  """Derived retrieval vector (INV-107); @vector added only by Fable at merge."""
  searchEmbedding: [Float!]
  """class: derived (ruleOnly; InstanceOfProperties: derivationRule or hypothesisUid); cardinality: many; catalog: INSTANCE_OF (live field name kept)"""
  occurrences: [ClaimOccurrence!]! @relationship(type: "INSTANCE_OF", direction: IN, properties: "InstanceOfProperties")
  """class: derived (ruleOnly); cardinality: many; catalog: INSTANCE_OF"""
  relationshipAssertions: [RelationshipAssertion!]! @relationship(type: "INSTANCE_OF", direction: IN, properties: "InstanceOfProperties")
  """class: structural; cardinality: many (each assessment targets exactly one Claim); catalog: ASSESSES_CLAIM_EVIDENCE"""
  evidenceAssessments: [ClaimEvidenceAssessment!]! @relationship(type: "ASSESSES_CLAIM_EVIDENCE", direction: IN)
}

"""
A source-attributed assertion made by exactly one asserter in exactly one container (Episode, Document or
Publication) at a located span: "the guest said X in episode 52". Labels ["ClaimOccurrence","Assertion"]
(D-006); it carries the full Assertion contract (one subject, one object or one typed literal, controlled
predicate, status = capture fidelity, assertionBasis, speechAct, reportedSpeechAct, bitemporal fields). It is not
the proposition (Claim), not a retelling of someone else's statement (a retelling is its own ClaimOccurrence
linked RETELLS, with ATTRIBUTES_TO the credited party), and not a truth verdict. Two speakers in one caption cue
are two ClaimOccurrences. A practice report (speechAct REPORTS_PRACTICE) never projects RECOMMENDS. Serves
CQ-CL-01..06, CQ-CL-08, CQ-PV-01, CQ-PV-02, CQ-PV-05, CQ-AX-05, CQ-RC-05. Module claims_and_documents; archetype
Assertion; uid token `claim-occurrence`. Live ExperienceReport is folded in (assertionBasis PERSONAL_EXPERIENCE).
"""
type ClaimOccurrence implements Entity & AssertionArchetype @node(labels: ["ClaimOccurrence", "Assertion"]) {
  id: ID! @id
  uid: String!
  name: String
  description: String
  mongoResearchRunId: String
  createdAt: DateTime! @timestamp(operations: [CREATE])
  updatedAt: DateTime! @timestamp(operations: [CREATE, UPDATE])
  privacyClass: PrivacyClass
  maturity: NodeMaturity
  schemaVersion: String
  predicate: String!
  status: AssertionStatus!
  recordedAt: DateTime!
  recordedTo: DateTime
  contentHash: String
  polarity: Polarity
  basisKind: BasisKind
  predicateClass: PredicateClass
  assertionBasis: AssertionBasis
  speechAct: SpeechAct
  reportedSpeechAct: SpeechAct
  valueString: String
  valueNumber: Float
  valueBoolean: Boolean
  unitCode: String
  quantityBasis: QuantityBasis
  validFrom: DateTime
  validTo: DateTime
  validFromPrecision: TimePrecision
  validToPrecision: TimePrecision
  validFromBasis: ValidTimeBasis
  validToBasis: ValidTimeBasis
  jurisdiction: String
  derivationRule: String
  extractionMethod: String
  extractionConfidence: Float
  """Deprecated (KCR-4.4): new writes link WAS_GENERATED_BY an Activity."""
  agentRunUid: String
  """Deprecated (INV-407): never written for new records."""
  confidence: Float
  """Display copy of the primary locator's exact text; the locator is authoritative (live field kept)."""
  utteranceText: String
  """Role title or code exactly as spoken or printed (kernel optional; for on-air role disclosures)."""
  roleTitleVerbatim: String
  """Tense in which a role or practice was stated: PAST, PRESENT, FUTURE (kernel optional)."""
  statedTense: String
  """Denormalized segment kind (kernel optional), for example SPONSOR_READ; must agree with OCCURS_IN_SEGMENT (V-W21-02)."""
  segmentKind: String
  """class: structural; cardinality: exactly_one; catalog: HAS_SUBJECT (W00)"""
  subject: [AssertionSubjectTarget!]! @relationship(type: "HAS_SUBJECT", direction: OUT)
  """class: structural; cardinality: zero_or_one (xor typed literal); catalog: HAS_OBJECT (W00)"""
  object: [AssertionSubjectTarget!]! @relationship(type: "HAS_OBJECT", direction: OUT)
  """class: structural; cardinality: exactly_one (KCR-4.3, V-410); catalog: ASSERTED_BY (W00; range narrowed for occurrences: no Agent)"""
  assertedBy: [ClaimSpeakerTarget!]! @relationship(type: "ASSERTED_BY", direction: OUT)
  """class: structural; cardinality: exactly_one (V-410, V-411); catalog: OCCURS_IN"""
  occursIn: [OccurrenceContainerTarget!]! @relationship(type: "OCCURS_IN", direction: OUT)
  """class: structural; cardinality: many; catalog: OCCURS_IN_SEGMENT"""
  inSegments: [EpisodeSegment!]! @relationship(type: "OCCURS_IN_SEGMENT", direction: OUT)
  """class: structural; cardinality: one_or_more when ACCEPTED (V-401), all in renditions of the container (V-411); catalog: SUPPORTED_BY (W00)"""
  supportedBy: [SourceLocator!]! @relationship(type: "SUPPORTED_BY", direction: OUT)
  """class: derived (must name locatorUid, V-407); cardinality: many; catalog: SUPPORTED_BY_CHUNK (W20 property type)"""
  supportedByChunks: [Chunk!]! @relationship(type: "SUPPORTED_BY_CHUNK", direction: OUT, properties: "DerivedSupportProperties")
  """class: structural; cardinality: one_or_more for new writes; catalog: WAS_GENERATED_BY (W00)"""
  generatedBy: [Activity!]! @relationship(type: "WAS_GENERATED_BY", direction: OUT)
  """class: derived (ruleOnly: derivationRule or hypothesisUid, V-417); cardinality: zero_or_one; catalog: INSTANCE_OF"""
  instanceOf: [Claim!]! @relationship(type: "INSTANCE_OF", direction: OUT, properties: "InstanceOfProperties")
  """class: structural; cardinality: many; same container (V-416); catalog: QUALIFIED_BY"""
  qualifiedBy: [ClaimOccurrence!]! @relationship(type: "QUALIFIED_BY", direction: OUT, properties: "QualificationProperties")
  """class: structural; cardinality: many; catalog: QUALIFIED_BY (inverse)"""
  qualifies: [ClaimOccurrence!]! @relationship(type: "QUALIFIED_BY", direction: IN, properties: "QualificationProperties")
  """class: structural; cardinality: many, acyclic, no shared span (V-412, V-413); catalog: RETELLS"""
  retells: [Assertion!]! @relationship(type: "RETELLS", direction: OUT, properties: "RetellingProperties")
  """class: structural; cardinality: many; catalog: RETELLS (inverse)"""
  retoldBy: [ClaimOccurrence!]! @relationship(type: "RETELLS", direction: IN, properties: "RetellingProperties")
  """class: structural; cardinality: zero_or_one; never the asserter of this occurrence; catalog: ATTRIBUTES_TO"""
  attributesTo: [ClaimSpeakerTarget!]! @relationship(type: "ATTRIBUTES_TO", direction: OUT)
  """class: structural; cardinality: zero_or_one; same label; catalog: SUPERSEDES (W00)"""
  supersedes: [ClaimOccurrence!]! @relationship(type: "SUPERSEDES", direction: OUT, properties: "SupersessionProperties")
  """class: structural; cardinality: zero_or_one; catalog: SUPERSEDES (inverse)"""
  supersededBy: [ClaimOccurrence!]! @relationship(type: "SUPERSEDES", direction: IN, properties: "SupersessionProperties")
}

"""
A structured relational assertion read from a non-utterance span (a registry field, a table cell, a figure, a
label panel): exactly one subject, one object or one typed literal, a controlled predicate, at most one asserter,
SUPPORTED_BY a locator. Labels ["RelationshipAssertion","Assertion"] (D-006). It is not a ClaimOccurrence (no
speaker, no container requirement) and it is never a second record of an utterance already captured as a
ClaimOccurrence (V-419). Multi-subject live instances split one per proposition (V-420); cross-claim syntheses
move to ClaimEvidenceAssessment. Serves CQ-EV-02, CQ-CL-06. Module claims_and_documents; archetype Assertion;
uid token `assertion`.
"""
type RelationshipAssertion implements Entity & AssertionArchetype @node(labels: ["RelationshipAssertion", "Assertion"]) {
  id: ID! @id
  uid: String!
  name: String
  description: String
  mongoResearchRunId: String
  createdAt: DateTime! @timestamp(operations: [CREATE])
  updatedAt: DateTime! @timestamp(operations: [CREATE, UPDATE])
  privacyClass: PrivacyClass
  maturity: NodeMaturity
  schemaVersion: String
  predicate: String!
  status: AssertionStatus!
  recordedAt: DateTime!
  recordedTo: DateTime
  contentHash: String
  polarity: Polarity
  basisKind: BasisKind
  predicateClass: PredicateClass
  assertionBasis: AssertionBasis
  speechAct: SpeechAct
  reportedSpeechAct: SpeechAct
  valueString: String
  valueNumber: Float
  valueBoolean: Boolean
