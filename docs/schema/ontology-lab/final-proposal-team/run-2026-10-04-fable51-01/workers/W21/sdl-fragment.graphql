# -----------------------------------------------------------------------------------------------------
# Enum and unions owned by W21
# -----------------------------------------------------------------------------------------------------

"""What a proposition is about (live values, unchanged). A different axis from AssertionBasis (how the asserter supports it) and SpeechAct (what the utterance does)."""
enum ClaimType {
  MECHANISTIC_CLAIM
  CAUSAL_CLAIM
  ASSOCIATION_CLAIM
  EFFICACY_CLAIM
  SAFETY_CLAIM
  DOSING_CLAIM
  BIOMARKER_CLAIM
  DIAGNOSTIC_CLAIM
  PROGNOSTIC_CLAIM
  PREDICTIVE_CLAIM
  REGULATORY_CLAIM
  COMMERCIAL_CLAIM
  LEGAL_CLAIM
  HISTORICAL_CLAIM
  COMPARATIVE_CLAIM
  PREVALENCE_CLAIM
  INCIDENCE_CLAIM
  METHOD_CLAIM
  UNKNOWN
}

"""Asserter range of a ClaimOccurrence and range of ATTRIBUTES_TO (live ClaimSpeaker plus Organization for slide decks, press statements and show notes; no Agent: a model output is never source content)."""
union ClaimSpeakerTarget = Person | Organization | PseudonymousActor | AnonymousActor

"""OCCURS_IN range: the work (Episode, Publication) whose renditions supply locators, or a Document that is its own work (web page, newsletter issue, slide deck). Publication added with a failing case (W21-D05, W21-SR-06)."""
union OccurrenceContainerTarget = Episode | Document | Publication

"""Legacy read-only range of Episode.mentions (live EpisodeMentionable with Material mapped to IngredientMaterial under D-008)."""
union EpisodeMentionableTarget = Event | TechnologyPlatform | ToolOrInstrument | ManufacturingProcess | ManufacturingStep | IngredientMaterial | Treatment | Procedure | SafetySignal

