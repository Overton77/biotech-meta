# -----------------------------------------------------------------------------------------------------
# Distribution identities: Platform, Channel, Series
# -----------------------------------------------------------------------------------------------------

"""
A distribution or directory service on which channels publish renditions of works (YouTube, a podcast hosting
service such as Megaphone, the Apple Podcasts directory, Substack). It is an Entity: a persistent identity, not a
URL and not a company (the operating company is an Organization). A Platform is not a publisher of content and
asserts nothing; hosting a channel is never selling, sponsoring or endorsing. Serves CQ-CL-01 (which rendition, on
which platform) and CQ-CL-08 (platform-level dynamic ad insertion). Module claims_and_documents; archetype Entity.
uid token `platform` is REQUESTED (seam W21-SR-01); it is not yet in conventions.uidTypeTokens.
"""
type Platform implements Entity & EntityArchetype @node(labels: ["Platform", "Entity"]) {
  id: ID! @id
  uid: String!
  name: String
  description: String
  mongoResearchRunId: String
  createdAt: DateTime! @timestamp(operations: [CREATE])
  updatedAt: DateTime! @timestamp(operations: [CREATE, UPDATE])
  privacyClass: PrivacyClass
  maturity: NodeMaturity
  schemaVersion: String
  entityType: String!
  """Controlled string (enum candidate W21-SR-02): VIDEO_HOST, AUDIO_FEED_HOST, PODCAST_DIRECTORY, NEWSLETTER_HOST, WEBCAST_HOST, OTHER. Observed; immutable per identity."""
  platformType: String
  """Display home page; never identity (contract A2)."""
  url: String
  """class: structural; cardinality: many (each Channel has exactly one hosting Platform); catalog: HOSTS_CHANNEL (live, kept)"""
  hostsChannels: [Channel!]! @relationship(type: "HOSTS_CHANNEL", direction: OUT, properties: "StructuralEdgeProperties")
  """class: structural; cardinality: many; catalog: ON_PLATFORM (kept only for PseudonymousActor -> Platform: the handle exists on this platform; Episode -> Platform is retired)"""
  pseudonymousAccounts: [PseudonymousActor!]! @relationship(type: "ON_PLATFORM", direction: IN, properties: "StructuralEdgeProperties")
}

"""
A publisher-operated distribution account on exactly one Platform (a YouTube channel, a podcast RSS feed, a
newsletter publication). It is an Entity. It is not the show (that is Series), not the operating company (that is
an Organization linked by the asserted OPERATES_CHANNEL), and not a rendition (renditions are Sources it
distributes). Serves CQ-CL-01, CQ-CL-05 (sponsorship and operator ties of the channel), CQ-CL-08 (which channel's
rendition carried which ads). Module claims_and_documents; archetype Entity; uid token `channel`.
"""
type Channel implements Entity & EntityArchetype @node(labels: ["Channel", "Entity"]) {
  id: ID! @id
  uid: String!
  name: String
  description: String
  mongoResearchRunId: String
  createdAt: DateTime! @timestamp(operations: [CREATE])
  updatedAt: DateTime! @timestamp(operations: [CREATE, UPDATE])
  privacyClass: PrivacyClass
  maturity: NodeMaturity
  schemaVersion: String
  entityType: String!
  """Controlled string: VIDEO_CHANNEL, PODCAST_FEED, NEWSLETTER, WEBCAST_SERIES_ACCOUNT, OTHER."""
  channelType: String
  """class: structural; cardinality: exactly_one (per Channel); catalog: HOSTS_CHANNEL"""
  platform: [Platform!]! @relationship(type: "HOSTS_CHANNEL", direction: IN, properties: "StructuralEdgeProperties")
  """class: asserted (asserted_edge profile); cardinality: many; catalog: OPERATES_CHANNEL (organizations role predicate)"""
  operators: [Organization!]! @relationship(type: "OPERATES_CHANNEL", direction: IN, properties: "AssertedEdgeProperties")
  """class: asserted (AppearanceProperties: asserted_edge + roleType HOST|CO_HOST); cardinality: many; catalog: SERVES_ON_CHANNEL"""
  hosts: [Person!]! @relationship(type: "SERVES_ON_CHANNEL", direction: IN, properties: "AppearanceProperties")
  """class: structural; cardinality: many; catalog: HAS_SERIES (live, kept)"""
  hasSeries: [Series!]! @relationship(type: "HAS_SERIES", direction: OUT, properties: "StructuralEdgeProperties")
  """class: structural; cardinality: many; catalog: HAS_EPISODE"""
  hasEpisodes: [Episode!]! @relationship(type: "HAS_EPISODE", direction: OUT, properties: "StructuralEdgeProperties")
  """class: structural; cardinality: many (each rendition Source has zero_or_one distributing Channel); catalog: DISTRIBUTES_RENDITION (NEW, W21-SR-05)"""
  distributesRenditions: [Source!]! @relationship(type: "DISTRIBUTES_RENDITION", direction: OUT, properties: "StructuralEdgeProperties")
  """class: asserted (FINANCIAL_INTEREST member; asserted_edge); cardinality: many; catalog: SPONSORS_CONTENT"""
  sponsoringOrganizations: [Organization!]! @relationship(type: "SPONSORS_CONTENT", direction: IN, properties: "AssertedEdgeProperties")
  """class: asserted (FINANCIAL_INTEREST member; asserted_edge); cardinality: many; catalog: SPONSORS_CONTENT"""
  sponsoringBrands: [ConsumerBrand!]! @relationship(type: "SPONSORS_CONTENT", direction: IN, properties: "AssertedEdgeProperties")
}

"""
A named series of works that persists across platforms and channels (a podcast show, a sub-series such as
