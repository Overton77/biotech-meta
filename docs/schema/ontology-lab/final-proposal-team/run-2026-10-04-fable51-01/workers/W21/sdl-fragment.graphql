"""APPEARS_IN and SERVES_ON_CHANNEL (asserted): specializes AssertedEdgeProperties (every field) and adds roleType (W01 RoleType gaining HOST, CO_HOST, GUEST, MODERATOR, W21-SR-09) and roleTitleVerbatim."""
